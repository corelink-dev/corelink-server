# actionlint 1.7.12 predates GitHub's documented vulnerability-alerts token
# scope and flags this valid read-only permission. Keep the exception on the
# one trusted semantic job that uses it; the hosted B-254 gate tests that the
# same diagnostic still fails in every other workflow.
paths:
  .github/workflows/backlog-verify.yml:
    ignore:
      - '^unknown permission scope "vulnerability-alerts"\.'
  # This container workflow is byte-locked by the trusted #2176 gRPC deny
  # contract. Its credential guard deliberately fails if either generated
  # credential component is empty, so ShellCheck's SC2015 note is intentional.
  .github/workflows/container-build-push-prod.yml:
    ignore:
      - '^shellcheck reported issue in this script: SC2015:info:10:13: Note that A && B \|\| C is not if-then-else\. C may run when A is true$'
