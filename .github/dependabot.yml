version: 2
# ⛔ ROUTINE VERSION UPDATES ARE OFF (2026-08-03) — `open-pull-requests-limit: 0`
#    on every ecosystem below. SECURITY updates are NOT affected and keep flowing.
#
# Read this before setting any limit back above 0.
#
# 2026-10-02, org migration (repository recreated in corelink-dev): all 12
# ecosystems are still at 0, the lowest value, so this file cannot lower the PR
# load any further. Security-update PRs are not limited by this file; whether
# they open is the repository's Dependabot security-updates setting.
#
# WHY. Measured 2026-08-03: routine dep PRs burned 194 of the repo's ~300 workflow
# runs that day and helped exhaust the Actions spending limit — which reds EVERY PR
# in the repo, including unrelated ones. Cost per PR is ~30 workflow runs: #999
# touched only `Cargo.lock` + 3 `Cargo.toml` and still triggered the JS CVE scanner,
# the OKF wiki validation, the first-time-contributor welcome bot, and
# `changelog-validate` three times. 15 such PRs were open and none was mergeable:
# `dependabot-auto-merge.yml` is scoped to SECURITY patches only, so a routine bump
# can never merge itself, and nobody reviews ~15 a week. They only accumulate.
#
# WHY THIS IS SAFE NOW, AND WAS NOT BEFORE. Until 2026-08-03 Dependabot ALERTS were
# disabled on this repository (`GET /vulnerability-alerts` returned 404), so the
# security lane did not exist — `dependabot-auto-merge` had never had anything to
# merge, and these routine PRs were the ONLY dependency updates the repo received.
# Turning them off then would have left ZERO. Alerts + automated security fixes were
# both enabled that day (404 -> 204; `automated-security-fixes.enabled = true`), the
# initial scan surfaced 15 vulnerabilities, and all 15 were closed in #1004. The
# security lane is live and self-merging, so routine bumps are now genuinely optional.
#
# HOW TO DO ROUTINE BUMPS INSTEAD. Deliberately, in one batch, when someone has the
# context to review them — not on a clock that outruns review capacity.
#
# TO RE-ARM: raise the limits below AND first make routine PRs actually mergeable
# (widen `dependabot-auto-merge` to green minor/patch, or accept the review load).
# Re-arming without that just recreates the pile.
#
# The staggering notes below are preserved: they are correct and become live again
# the moment any limit goes back above 0.
#
# Dependabot weekly grouped PRs — WI-S12-004 §6.1.4 (ST-004) + R-PREP refinement.
#
# Enforces: CAP-SUPPLY-004 Dependabot weekly cadence (weekly PER ECOSYSTEM).
# Schedule: weekly, STAGGERED across the week 04:00 BRT (America/Sao_Paulo) so the
#   self-hosted runner fleet (5 macOS runners = one Mac) never absorbs every
#   ecosystem's CI in a single burst (root cause of a near-OOM on 2026-06-02 when
#   ~9 grouped dep PRs landed at once). Heaviest lanes isolated on their own day:
#     Mon — cargo (full Rust rebuild + proptest-density-gate) + github-actions
#     Tue — npm /apps/admin-ui (Next build + Lighthouse + Playwright x3)
#     Wed — npm /apps/docs + npm /crates/corelink-wasm
#     Thu — npm / (Cloudflare Worker toolchain) + pip / + pip /tools/sdks/python
#     Fri — npm /worker (04:00) + npm /apps/signup-worker (06:00)
#     Sat — npm /apps/analytics-worker
#     Sun — npm /apps/get-corelink-worker
#   Each ecosystem stays weekly (CAP-SUPPLY-004 intact). See ADR-S12-045 §Schedule.
#   Security-updates are NOT bound to the staggered day — opened immediately per
#   advisory (see per-ecosystem policy below).
# Rate limit: per-ecosystem (DoS protection — §26 security STRIDE delta).
#
# ---------------------------------------------------------------------------
# WORKSPACE OWNERSHIP MAP (pnpm-workspace.yaml has SIX members; the npm entries
# below must cover all six, with NO member owned by two entries).
#
#   pnpm-workspace.yaml member      owning entry
#   ------------------------------  ---------------------------------------
#   apps/admin-ui                   npm /apps/admin-ui          (Tue)
#   apps/docs                       npm /apps/docs              (Wed)
#   worker                          npm /worker                 (Fri 04:00)
#   apps/signup-worker              npm /apps/signup-worker     (Fri 06:00)
#   apps/analytics-worker           npm /apps/analytics-worker  (Sat)
#   apps/get-corelink-worker        npm /apps/get-corelink-worker (Sun)
#   (not a workspace member)        npm /crates/corelink-wasm   (Wed)
#
# The npm `/` entry is NOT a seventh package lane. Dependabot follows
# pnpm-workspace.yaml from the root, so an unrestricted root entry re-scans
# EVERY member — empirically proven by #802/#919, which rewrote all six member
# package.json files from a root `package.json` whose only devDependency is
# `wrangler` (#919 = one PR with 35 updates; apps/admin-ui and apps/docs were
# therefore covered TWICE). The root entry is now `allow`-restricted to the
# Cloudflare Worker toolchain and owns it workspace-wide, so wrangler /
# miniflare / @cloudflare/* stay in lockstep across all four Worker packages
# in a single small PR. The four Worker entries `ignore` those same three
# patterns so no dependency is proposed by two lanes.
#
# `allow` (not just group `patterns`) is load-bearing: group patterns only
# decide BATCHING. A dependency that matches no group is still opened as its
# OWN PR, so `patterns` alone would have converted #919's single 35-update PR
# into a stream of individual PRs — the opposite of the intent. `allow`
# restricts the update universe itself.
# ---------------------------------------------------------------------------
#
# Per-ecosystem policy:
#   - security-updates: NEVER grouped. Always opened as separate PRs so the
#     auto-merge gate can scope strictly to one advisory per merge event.
#     (Grouping advisories together would force human review of unrelated
#     CVEs in a single merge — anti-pattern for incident response.)
#   - non-security-minor-patch: batched weekly per ecosystem (manual review).
#   - non-security-major: batched weekly per ecosystem (manual review).
#
# Auto-merge eligibility (see .github/workflows/dependabot-auto-merge.yml):
#   ONLY individual security PRs with update-type == version-update:semver-patch.
#   Non-security updates of any size, and security minor/major, require manual
#   review per §7 anti-scope + §9.8 design decision.
#
# Reviewers: none set here. Each ecosystem used to request `HumanGuardrail/security`,
# a team that never existed (B-099) in an organisation this repository no longer
# belongs to; the key was dropped in the 2026-10-02 org migration. Review requests
# for dependency PRs come from .github/CODEOWNERS.
# Labels: ["dependencies", "<ecosystem>"] — consumed by dependabot-auto-merge.yml
# and dependabot-policy.yml gates.

updates:
  # ---------------------------------------------------------------------------
  # Cargo (Rust) ecosystem — workspace root.
  # ---------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      # Non-security patch + minor: batched weekly (manual review).
      non-security-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      # Crypto / auth hot-path majors — SPLIT OUT of `non-security-major`.
      #
      # Why: these majors nearly always need call-site adaptation before they
      # can merge (jsonwebtoken 10→11 needs a fresh RS256 perf baseline;
      # password-hash 0.5→0.6 renames `Salt`/`SaltString`; the rand 0.8→0.9
      # and getrandom 0.2→0.3 lines change `RngCore`/feature names). Bundled
      # with everything else, ONE held blocker froze the whole batch — #915
      # parked `base64` 0.23 and `rusqlite` 0.40 behind a jsonwebtoken 11 hold
      # they have nothing to do with. Splitting lets the innocent majors land.
      #
      # Patterns verified against Cargo.lock (all present at the versions
      # below) and the workspace manifests:
      #   jsonwebtoken 10.4.0 (4 manifests)   argon2 0.5.3 (3 manifests)
      #   password-hash 0.5.0 (3 manifests)   rand 0.8.6 (28 manifests)
      #   rand_core 0.6.4, rand_chacha 0.3.1  getrandom 0.2.17 (4 manifests)
      #   rustls 0.23.42, rustls-webpki 0.103.13, rustls-native-certs 0.8.4
      #   ring 0.17.14 (transitive-only today; listed so a future direct dep
      #   or a lockfile-level major lands in this lane, not the generic one)
      # `rand_*` covers rand_core/rand_chacha; `rustls*` covers the three
      # rustls-* crates. `rustls-pemfile` is NOT in Cargo.lock — omitted.
      #
      # MUST stay ABOVE `non-security-major`: Dependabot assigns a dependency
      # to the FIRST group it matches. `non-security-major` also carries the
      # mirrored `exclude-patterns` so the split is order-independent.
      crypto-auth-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns:
          - "jsonwebtoken"
          - "argon2"
          - "password-hash"
          - "rand"
          - "rand_*"
          - "getrandom"
          - "ring"
          - "rustls*"
      # Non-security major: batched weekly (manual review — never auto-merged).
      non-security-major:
        applies-to: version-updates
        update-types: ["major"]
        exclude-patterns:
          - "jsonwebtoken"
          - "argon2"
          - "password-hash"
          - "rand"
          - "rand_*"
          - "getrandom"
          - "ring"
          - "rustls*"
      # NOTE: NO security-updates group. Dependabot opens one PR per advisory
      # so the auto-merge gate scopes to a single CVE per merge event.
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled

  # ---------------------------------------------------------------------------
  # GitHub Actions — SHA-pin maintenance.
  # Weekly Monday to keep action SHAs fresh per HIGH_RISK lane FF-HR-005.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      actions-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: scope
    rebase-strategy: disabled

  # ---------------------------------------------------------------------------
  # npm — admin-ui (Next.js dashboard).
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/apps/admin-ui"
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "admin-ui"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — docs site (Docusaurus).
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      docs-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      docs-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "docs"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — Cloudflare Worker toolchain, workspace-wide.
  #
  # Scope: `wrangler`, `miniflare`, `@cloudflare/*` ONLY. Root package.json has
  # exactly ONE devDependency (`wrangler`); everything else this lane used to
  # emit came from pnpm workspace expansion into the six members (see the
  # WORKSPACE OWNERSHIP MAP at the top of this file). `allow` restricts the
  # update universe; the group `patterns` then batch what survives. The four
  # Worker package lanes `ignore` these same three patterns, so the Cloudflare
  # toolchain is proposed by exactly one lane and stays version-locked across
  # root + worker + the three apps/*-worker packages in a single PR.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    allow:
      - dependency-name: "wrangler"
      - dependency-name: "miniflare"
      - dependency-name: "@cloudflare/*"
    groups:
      root-tooling-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/*"
      root-tooling-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/*"
    labels:
      - "dependencies"
      - "javascript"
      - "tooling"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — worker/ (@corelink/worker — the CF Worker edge plane).
  # pnpm-workspace.yaml member. Was covered ONLY by the unrestricted root lane
  # (#802/#919 rewrote worker/package.json); now owned here.
  # Cloudflare toolchain (wrangler/miniflare/@cloudflare/*) is owned by the
  # npm `/` lane above — ignored here so no dependency has two owners.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "miniflare"
      - dependency-name: "@cloudflare/*"
    groups:
      worker-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      worker-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "worker"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — apps/signup-worker (the AUTHORITATIVE live Stripe webhook handler).
  # pnpm-workspace.yaml member; previously only reached by the root lane.
  # Own day/time slot (Fri 06:00) — 2h after worker/ so the two Friday lanes
  # never open together.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/apps/signup-worker"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "miniflare"
      - dependency-name: "@cloudflare/*"
    groups:
      signup-worker-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      signup-worker-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "worker"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — apps/analytics-worker.
  # pnpm-workspace.yaml member; previously only reached by the root lane.
  # Saturday: the Mac fleet is idle (no human merges), and this lane is tiny.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/apps/analytics-worker"
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "miniflare"
      - dependency-name: "@cloudflare/*"
    groups:
      analytics-worker-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      analytics-worker-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "worker"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — apps/get-corelink-worker (serves the public install.sh).
  # pnpm-workspace.yaml member; previously only reached by the root lane.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/apps/get-corelink-worker"
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "miniflare"
      - dependency-name: "@cloudflare/*"
    groups:
      get-corelink-worker-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      get-corelink-worker-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "worker"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # npm — corelink-wasm (NPM-published WASM client).
  # Tighter scope: wasm-bindgen toolchain only; manual review on majors
  # because WASM ABI breakage can cause silent runtime failures.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/crates/corelink-wasm"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      wasm-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      wasm-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
      - "wasm-client"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # pip — CI tooling (requirements-ci.txt).
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      pip-ci-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      pip-ci-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "python"
      - "ci-tooling"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled

  # ---------------------------------------------------------------------------
  # pip — corelink-py (Python SDK).
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/tools/sdks/python"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      py-sdk-minor-patch:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      py-sdk-major:
        applies-to: version-updates
        update-types: ["major"]
    labels:
      - "dependencies"
      - "python"
      - "sdk"
    commit-message:
      prefix: "deps"
      include: scope
    rebase-strategy: disabled
