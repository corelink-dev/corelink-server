name: Issue 2579 Cargo and CAS ownership

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-2579-cas-ownership.yml
      - crates/corelink-container/src/routes/cargo/**
      - crates/corelink-container/src/routes/cas/**
      - crates/corelink-container/src/storage/cas_write_fence.rs
      - crates/corelink-container/src/storage/r2_s3_parts/cas_*.rs
      - scripts/verify_issue_2579_cas_ownership.py
      - tests/test_issue_2579_cas_ownership.py

permissions:
  contents: read

concurrency:
  group: issue-2579-cas-ownership-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  cas-ownership:
    if: >-
      github.repository_id == vars.CORELINK_SERVER_REPO_ID &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact candidate and protected base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0

      - name: Verify owned writer census and adversarial boundaries
        run: |
          python3 -I scripts/verify_issue_2579_cas_ownership.py
          python3 -I tests/test_issue_2579_cas_ownership.py
          python3 -I tests/test_issue_2623_ownership_contract.py

      - name: Check formatting and compile writer adapters
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p corelink-server --lib

      - name: Exercise admitted-context contract and exact R2 ownership primitives
        run: |
          cargo test --locked -p corelink-server --lib storage::cas_write_fence::tests::retry_after_r2_failure_reuses_verified_durable_handle_intent -- --exact
          cargo test --locked -p corelink-server --lib storage::staging_load_test_admission::tests::loopback_store_consumes_a_verified_claim_in_the_real_d1_batch_shape -- --exact
          cargo test --locked -p corelink-server --lib storage::staging_load_test_admission::tests::present_admission_header_fails_closed_when_the_gate_is_not_configured -- --exact
          cargo test --locked -p corelink-server --lib storage::staging_load_test_ownership::tests::d1_and_r2_contracts_accept_only_bounded_canonical_inputs -- --exact
