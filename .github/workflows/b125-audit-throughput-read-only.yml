name: B-125 audit throughput read-only evidence

# Refs #1668. B-125 remains open until a fresh, reproducible production read proves the
# post-repair drain behaviour. This lane only observes D1; it never deploys,
# mutates D1, or edits the issue/campaign.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-b125-read-only" for full capture or "diagnose-b125-hourly" for one hourly diagnostic SELECT'
        required: true
        type: string
      deployment_receipt_ref:
        description: 'Exact #1648 issue-comment URL for the verified active repaired-image rollout'
        required: true
        type: string
      capture_mode:
        description: 'Use full closure evidence or one bounded hourly-query diagnostic'
        required: true
        type: choice
        default: full_capture
        options:
          - full_capture
          - diagnostic_only

permissions:
  contents: read
  issues: read

concurrency:
  group: b125-audit-throughput-read-only
  cancel-in-progress: false

jobs:
  read-only-evidence:
    name: B-125 six-hour D1 read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node for the pinned Wrangler CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run the allowlisted SELECT-only read and write a receipt
        id: read
        env:
          CONFIRM: ${{ inputs.confirm }}
          CAPTURE_MODE: ${{ inputs.capture_mode }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BILLING_D1_DATABASE_ID: ${{ secrets.CORELINK_BILLING_D1_DATABASE_ID }}
          DEPLOYMENT_RECEIPT_REF: ${{ inputs.deployment_receipt_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          receipt="artifacts/b125-audit-throughput-receipt.json"
          raw_dir="$RUNNER_TEMP/b125-d1"
          mkdir -p "$raw_dir"

          # Keep a non-empty failure receipt even when credentials or the
          # canonical database identity are unavailable.
          python3 - "$receipt" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          path = sys.argv[1]
          payload = {
              "schema_version": 1,
              "issue": 1668,
              "backlog_id": "B-125",
              "captured_at": datetime.now(timezone.utc).isoformat(),
              "window_hours": 6,
              "capture_mode": os.environ.get("CAPTURE_MODE", "invalid"),
              "queries": [],
              "valid": False,
              "failure_reasons": ["read_not_started"],
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          fail_closed() {
            reason="$1"
            python3 - "$receipt" "$reason" <<'PY'
          import json, sys
          path, reason = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              payload = json.load(stream)
          payload["valid"] = False
          reasons = payload.setdefault("failure_reasons", [])
          if reason not in reasons:
              reasons.append(reason)
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
            echo "::error::B-125 read-only lane failed closed: $reason"
            exit 1
          }

          # The repaired image became active at 19:36:16Z on 2026-09-30.
          # Six complete UTC buckets first contain only post-repair rows at
          # 02:00Z on 2026-10-01. Allow five minutes for the last bucket to
          # settle, and reject before any provider query until then.
          python3 - <<'PY' || fail_closed "post_repair_six_hour_window_not_settled"
          from datetime import datetime, timezone
          not_before = datetime(2026, 10, 1, 2, 5, tzinfo=timezone.utc)
          if datetime.now(timezone.utc) < not_before:
              raise SystemExit(1)
          PY

          case "$CAPTURE_MODE" in
            full_capture) [[ "$CONFIRM" == "run-b125-read-only" ]] || fail_closed "confirmation_mismatch" ;;
            diagnostic_only) [[ "$CONFIRM" == "diagnose-b125-hourly" ]] || fail_closed "confirmation_mismatch" ;;
            *) fail_closed "capture_mode_invalid" ;;
          esac
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail_closed "protected_main_ref_required"
          [[ -n "${CF_ACCOUNT_ID:-}" ]] || fail_closed "CF_ACCOUNT_ID_missing"
          [[ -n "${CF_API_TOKEN:-}" ]] || fail_closed "CF_API_TOKEN_missing"
          echo "::add-mask::${CF_API_TOKEN}"

          # Bind the read to the frozen #1648 production repair artifact and
          # independently read back its IAD Container application through the
          # official Cloudflare API before any D1 query. The issue comment is
          # evidence context, not a substitute for current provider state.
          repair_source_sha="46e2d1cbe7c00a303c0942e8f46751dce75e5c14"
          repair_image_digest="sha256:ecd63379d2040c6a891edaeb140fd388f26b5ffc181987c9c777060ced633e8a"
          expected_account_id="6a1fc1c626fc2628823e60b9db01f5cd"
          expected_database_id="d64742ea-e102-40b2-a844-ff02e3f94562"
          expected_config_blob_sha="5ffec8b882bcb99dcaf1df964c609e9d2c35838d"
          expected_config_sha256="568d0e6994ce1156542e350520a9750924a0f3f416e67af07c7275682e24c7a6"
          [[ "$CF_ACCOUNT_ID" == "$expected_account_id" ]] || fail_closed "cloudflare_account_target_mismatch"
          [[ "$DEPLOYMENT_RECEIPT_REF" =~ ^https://github\.com/HuGR-dev/corelink-server/issues/1648#issuecomment-[0-9]+$ ]] || fail_closed "deployment_receipt_reference_invalid"
          comment_id="${DEPLOYMENT_RECEIPT_REF##*issuecomment-}"
          comment_path="$raw_dir/deployment-comment.json"
          if ! GH_TOKEN="$GH_TOKEN" gh api "repos/HuGR-dev/corelink-server/issues/comments/$comment_id" >"$comment_path" 2>/dev/null; then
            fail_closed "deployment_receipt_comment_unavailable"
          fi
          if ! python3 - "$comment_path" "$DEPLOYMENT_RECEIPT_REF" "$repair_source_sha" "$repair_image_digest" <<'PY'
          import json, sys
          path, expected_url, expected_source, expected_digest = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as stream:
                  comment = json.load(stream)
              body = comment.get("body") if isinstance(comment, dict) else None
              valid = (
                  isinstance(comment, dict)
                  and comment.get("html_url") == expected_url
                  and isinstance(comment.get("issue_url"), str)
                  and comment["issue_url"].endswith("/issues/1648")
                  and isinstance(body, str)
                  and "ROLLOUT_COMPLETE" in body
                  and expected_source in body
                  and expected_digest in body
              )
          except (OSError, ValueError, TypeError):
              valid = False
          if not valid:
              raise SystemExit("deployment receipt comment is not a matching #1648 rollout receipt")
          PY
          then
            fail_closed "deployment_receipt_comment_mismatch"
          fi

          # Reuse the exact #1648 provider response parser. It requires the
          # pinned IAD app identity, stable healthy 16/16 state, and no active
          # rollout. Require the completed rollout target and active config to
          # use the exact immutable digest before allowing any D1 SELECT.
          runtime_summary="$raw_dir/runtime-summary.json"
          if ! python3 - "$runtime_summary" <<'PY'
          import json, os, sys
          from scripts.issue_1648_image_only import (
              API, APP_PATH, NEW_REF, ROLLOUTS_PATH, GateError,
              app_snapshot, no_active_rollout, require,
          )
          output = sys.argv[1]
          token = os.environ.get("CF_API_TOKEN", "")
          try:
              api = API(token)
              app_result = api.request("GET", APP_PATH)
              app = app_snapshot(app_result)
              require(app["healthy"] == 16 and app["active"] == 0,
                      "healthy_instance_count_not_16")
              require(app["image"] == NEW_REF, "active_repaired_image_mismatch")
              rollouts_result = api.request("GET", ROLLOUTS_PATH)
              no_active_rollout(rollouts_result, app)
              entries = (rollouts_result if isinstance(rollouts_result, list)
                         else rollouts_result.get("rollouts") if isinstance(rollouts_result, dict)
                         else None)
              require(isinstance(entries, list), "rollouts_shape")
              completed = [item for item in entries if isinstance(item, dict)
                           and item.get("status") == "completed"
                           and item.get("target_version") == app["version"]
                           and isinstance(item.get("target_configuration"), dict)
                           and item["target_configuration"].get("image") == NEW_REF]
              require(bool(completed), "completed_repaired_rollout_missing")
              summary = {
                  "account_id": "6a1fc1c626fc2628823e60b9db01f5cd",
                  "application_id": "a033572c-0803-4866-b3a3-61f4812843b1",
                  "application_version": app["version"],
                  "active_image": app["image"],
                  "healthy_instances": app["healthy"],
                  "active_instances": app["active"],
                  "failed_instances": app["failed"],
                  "completed_rollout_count": len(completed),
              }
              with open(output, "w", encoding="utf-8") as stream:
                  json.dump(summary, stream, indent=2, sort_keys=True)
                  stream.write("\n")
          except (GateError, OSError, ValueError, TypeError):
              raise SystemExit("active repaired Container state is unavailable or mismatched")
          PY
          then
            fail_closed "active_repaired_container_readback_failed"
          fi

          # The canonical production UUID is source-derived. If the optional
          # repo secret is present it must match; a mismatch can never select a
          # different database. If source derivation ever disappears, the
          # secret becomes mandatory and this lane stays red until restored.
          canonical_ids="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("apps/signup-worker/wrangler.toml").read_text(encoding="utf-8")
          ids = sorted(set(re.findall(r'^database_id\s*=\s*"([0-9a-f-]{36})"\s*$', text, re.M)))
          if len(ids) != 1:
              raise SystemExit("expected exactly one canonical signup-worker D1 UUID")
          print(ids[0])
          PY
          )" || fail_closed "canonical_database_uuid_not_derived"
          if [[ -n "${BILLING_D1_DATABASE_ID:-}" && "$BILLING_D1_DATABASE_ID" != "$canonical_ids" ]]; then
            fail_closed "database_secret_does_not_match_canonical_uuid"
          fi
          D1_DATABASE_ID="${BILLING_D1_DATABASE_ID:-$canonical_ids}"
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]] || fail_closed "database_uuid_invalid"
          [[ "$D1_DATABASE_ID" == "$expected_database_id" ]] || fail_closed "database_target_mismatch"

          expected_images=(
            "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-corelinkserver-prod:46e2d1cbe-r1"
            "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-sam-corelinkserver-prod:46e2d1cbe-r1"
            "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-lhr-corelinkserver-prod:46e2d1cbe-r1"
            "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-nrt-corelinkserver-prod:46e2d1cbe-r1"
            "registry.cloudflare.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-prod-syd-corelinkserver-prod:46e2d1cbe-r1"
          )
          for image in "${expected_images[@]}"; do
            [[ "$(grep -Fc "image = \"$image\"" wrangler.toml)" -eq 1 ]] || fail_closed "production_image_pin_mismatch"
          done
          config_sha256="$(sha256sum wrangler.toml | cut -d ' ' -f 1)"
          config_blob_sha="$(git rev-parse "$GITHUB_SHA:wrangler.toml")"
          [[ "$config_blob_sha" == "$expected_config_blob_sha" ]] || fail_closed "production_config_blob_mismatch"
          [[ "$config_sha256" == "$expected_config_sha256" ]] || fail_closed "production_config_sha256_mismatch"

          python3 - "$receipt" "$DEPLOYMENT_RECEIPT_REF" "$GITHUB_SHA" "$config_sha256" "$config_blob_sha" "$expected_account_id" "$D1_DATABASE_ID" "$repair_source_sha" "$repair_image_digest" "$runtime_summary" <<'PY'
          import json, sys
          (path, receipt_ref, capture_sha, config_sha256, config_blob_sha,
           account_id, database_id, source_sha, image_digest, runtime_summary_path) = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              receipt = json.load(stream)
          with open(runtime_summary_path, encoding="utf-8") as stream:
              runtime_summary = json.load(stream)
          receipt["deployment_pin"] = {
              "receipt_ref": receipt_ref,
              "capture_main_sha": capture_sha,
              "production_config_sha256": config_sha256,
              "production_config_blob_sha": config_blob_sha,
              "target_account_id": account_id,
              "target_database_id": database_id,
              "repair_source_sha": source_sha,
              "repair_image_digest": image_digest,
              "repair_image_tag": "46e2d1cbe-r1",
              "runtime_digest_verified_by_workflow": True,
              "runtime_verification_receipt_ref": receipt_ref,
              "runtime_verification_source": "Cloudflare Containers GET application and rollouts API",
              "runtime_verification": runtime_summary,
              "post_repair_first_complete_bucket_utc": "2026-09-30T20:00:00Z",
              "post_repair_capture_not_before_utc": "2026-10-01T02:05:00Z",
              "scope": "IAD production Container application only; other regional pins are config-verified, not runtime-verified",
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          corepack enable
          export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"

          # Every query is fixed here. The guards below reject any accidental
          # non-SELECT token, semicolon, or second statement before Wrangler.
          declare -A SQL
          SQL[population]='SELECT COUNT(*) AS total_rows, SUM(CASE WHEN emitted_at IS NOT NULL THEN 1 ELSE 0 END) AS sealed_rows, SUM(CASE WHEN emitted_at IS NULL THEN 1 ELSE 0 END) AS unsealed_rows, MAX(CASE WHEN emitted_at IS NULL THEN (strftime("%s", "now") * 1000) - enqueued_at ELSE 0 END) AS oldest_unsealed_age_ms FROM audit_outbox'
          # Keep the six output buckets, but aggregate both counters in one
          # audit_outbox scan. The former correlated subqueries rescanned the
          # 84k-row production table twelve times and failed in the D1 lane.
          SQL[hourly]="WITH hour_offsets(hour_offset) AS (VALUES (0), (1), (2), (3), (4), (5)), clock AS (SELECT CAST(strftime('%s', 'now') AS INTEGER) / 3600 * 3600 AS anchor_s), aggregate_counts AS (SELECT c.anchor_s, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 3600) * 1000 AND enqueued_at < c.anchor_s * 1000 THEN 1 END) AS arrivals_0, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 3600) * 1000 AND emitted_at < c.anchor_s * 1000 THEN 1 END) AS sealed_0, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 7200) * 1000 AND enqueued_at < (c.anchor_s - 3600) * 1000 THEN 1 END) AS arrivals_1, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 7200) * 1000 AND emitted_at < (c.anchor_s - 3600) * 1000 THEN 1 END) AS sealed_1, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 10800) * 1000 AND enqueued_at < (c.anchor_s - 7200) * 1000 THEN 1 END) AS arrivals_2, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 10800) * 1000 AND emitted_at < (c.anchor_s - 7200) * 1000 THEN 1 END) AS sealed_2, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 14400) * 1000 AND enqueued_at < (c.anchor_s - 10800) * 1000 THEN 1 END) AS arrivals_3, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 14400) * 1000 AND emitted_at < (c.anchor_s - 10800) * 1000 THEN 1 END) AS sealed_3, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 18000) * 1000 AND enqueued_at < (c.anchor_s - 14400) * 1000 THEN 1 END) AS arrivals_4, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 18000) * 1000 AND emitted_at < (c.anchor_s - 14400) * 1000 THEN 1 END) AS sealed_4, COUNT(CASE WHEN enqueued_at >= (c.anchor_s - 21600) * 1000 AND enqueued_at < (c.anchor_s - 18000) * 1000 THEN 1 END) AS arrivals_5, COUNT(CASE WHEN emitted_at >= (c.anchor_s - 21600) * 1000 AND emitted_at < (c.anchor_s - 18000) * 1000 THEN 1 END) AS sealed_5, COUNT(CASE WHEN enqueued_at < c.anchor_s * 1000 AND (emitted_at IS NULL OR emitted_at >= c.anchor_s * 1000) THEN 1 END) AS boundary_unsealed FROM audit_outbox CROSS JOIN clock c), bucket_counts AS (SELECT h.hour_offset, a.anchor_s, CASE h.hour_offset WHEN 0 THEN a.arrivals_0 WHEN 1 THEN a.arrivals_1 WHEN 2 THEN a.arrivals_2 WHEN 3 THEN a.arrivals_3 WHEN 4 THEN a.arrivals_4 WHEN 5 THEN a.arrivals_5 END AS arrivals, CASE h.hour_offset WHEN 0 THEN a.sealed_0 WHEN 1 THEN a.sealed_1 WHEN 2 THEN a.sealed_2 WHEN 3 THEN a.sealed_3 WHEN 4 THEN a.sealed_4 WHEN 5 THEN a.sealed_5 END AS sealed_rows, a.boundary_unsealed FROM hour_offsets h CROSS JOIN aggregate_counts a) SELECT strftime('%Y-%m-%dT%H:00:00Z', anchor_s - (hour_offset + 1) * 3600, 'unixepoch') AS window_start_utc, strftime('%Y-%m-%dT%H:00:00Z', anchor_s - hour_offset * 3600, 'unixepoch') AS window_end_utc, arrivals, sealed_rows, boundary_unsealed FROM bucket_counts ORDER BY hour_offset DESC"

          SQL[latency]='WITH clock AS (SELECT CAST(strftime("%s", "now") AS INTEGER) / 3600 * 3600 AS anchor_s), valid_latencies AS (SELECT emitted_at - enqueued_at AS latency_ms FROM audit_outbox CROSS JOIN clock WHERE emitted_at IS NOT NULL AND enqueued_at >= (anchor_s - 21600) * 1000 AND enqueued_at < anchor_s * 1000 AND emitted_at < anchor_s * 1000 AND emitted_at >= enqueued_at), ranked AS (SELECT latency_ms, ROW_NUMBER() OVER (ORDER BY latency_ms) AS row_number, COUNT(*) OVER () AS sample_size FROM valid_latencies) SELECT COUNT(*) AS valid_latency_rows, MIN(latency_ms) AS min_latency_ms, AVG(latency_ms) AS mean_latency_ms, MAX(latency_ms) AS max_latency_ms, AVG(CASE WHEN row_number IN (CAST((sample_size + 1) / 2 AS INTEGER), CAST((sample_size + 2) / 2 AS INTEGER)) THEN latency_ms END) AS median_latency_ms, MAX(CASE WHEN row_number = CAST((sample_size * 90 + 99) / 100 AS INTEGER) THEN latency_ms END) AS p90_latency_ms FROM ranked'
          SQL[heads]='SELECT COUNT(*) AS chain_heads, SUM(CASE WHEN head_signature IS NOT NULL AND length(trim(head_signature)) > 0 THEN 1 ELSE 0 END) AS signed_heads FROM audit_chain_head'
          SQL[partition]='WITH partitions AS (SELECT tenant_id, region, COUNT(*) AS row_count, SUM(CASE WHEN emitted_at IS NULL THEN 1 ELSE 0 END) AS unsealed_rows FROM audit_outbox GROUP BY tenant_id, region) SELECT COUNT(DISTINCT region) AS regions, COALESCE(SUM(row_count), 0) AS partition_rows, COALESCE(SUM(unsealed_rows), 0) AS partition_unsealed_rows, COUNT(*) AS partition_count FROM partitions'
          # The owner readback requires more than a healthy moving window: it
          # needs a recent burst above one configured call budget and current
          # sequence, seal, and head/tail integrity controls. Return aggregates
          # only; never retain tenant identifiers or raw audit rows.
          SQL[burst]='SELECT COUNT(*) AS populated_hours, COALESCE(MAX(arrivals), 0) AS peak_hour_arrivals, COALESCE(SUM(CASE WHEN arrivals > 512 THEN 1 ELSE 0 END), 0) AS hours_over_batch_limit FROM (SELECT enqueued_at / 3600000 AS hour_bucket, COUNT(*) AS arrivals FROM audit_outbox WHERE enqueued_at >= (strftime("%s", "now") - 604800) * 1000 GROUP BY hour_bucket)'
          SQL[integrity]='SELECT COUNT(*) AS sealed_rows, SUM(CASE WHEN sequence_number IS NULL OR prev_hash IS NULL OR chain_hash IS NULL OR canonical_jcs IS NULL OR chained_at IS NULL THEN 1 ELSE 0 END) AS malformed_seals, SUM(CASE WHEN emitted_at < enqueued_at THEN 1 ELSE 0 END) AS negative_latency_rows, (SELECT COALESCE(SUM(hash_rows - 1), 0) FROM (SELECT COUNT(*) AS hash_rows FROM audit_outbox WHERE emitted_at IS NOT NULL AND chain_hash IS NOT NULL GROUP BY tenant_id, region, chain_hash HAVING COUNT(*) > 1)) AS duplicate_chain_hash_rows FROM audit_outbox WHERE emitted_at IS NOT NULL'
          SQL[replay]='WITH sequence_groups AS (SELECT tenant_id, region, sequence_number, COUNT(*) AS sequence_rows FROM audit_outbox WHERE emitted_at IS NOT NULL AND sequence_number IS NOT NULL GROUP BY tenant_id, region, sequence_number), ordered_groups AS (SELECT tenant_id, region, sequence_number, sequence_rows, LAG(sequence_number) OVER (PARTITION BY tenant_id, region ORDER BY sequence_number) AS prior_sequence FROM sequence_groups) SELECT COALESCE(SUM(CASE WHEN sequence_rows > 1 THEN sequence_rows ELSE 0 END), 0) AS repeated_sequence_rows, COALESCE(SUM(CASE WHEN prior_sequence IS NOT NULL AND sequence_number > prior_sequence + 1 THEN 1 ELSE 0 END), 0) AS sequence_gap_rows, COALESCE(SUM(CASE WHEN sequence_rows > 1 THEN 1 ELSE 0 END), 0) AS duplicate_sequence_groups FROM ordered_groups'
          SQL[head_tail]='WITH tails AS (SELECT tenant_id, region, sequence_number, chain_hash, ROW_NUMBER() OVER (PARTITION BY tenant_id, region ORDER BY sequence_number DESC) AS tail_rank FROM audit_outbox WHERE emitted_at IS NOT NULL AND sequence_number IS NOT NULL), joined AS (SELECT h.tenant_id, h.region, h.next_sequence, h.head_hash, t.sequence_number AS tail_sequence, t.chain_hash AS tail_hash FROM audit_chain_head h LEFT JOIN tails t ON t.tenant_id = h.tenant_id AND t.region = h.region AND t.tail_rank = 1), tail_without_head AS (SELECT COUNT(*) AS row_count FROM tails t LEFT JOIN audit_chain_head h ON h.tenant_id = t.tenant_id AND h.region = t.region WHERE t.tail_rank = 1 AND h.tenant_id IS NULL) SELECT COUNT(*) AS chain_heads, SUM(CASE WHEN tail_sequence IS NULL OR next_sequence != tail_sequence + 1 OR head_hash != tail_hash THEN 1 ELSE 0 END) + (SELECT row_count FROM tail_without_head) AS head_tail_mismatches, SUM(CASE WHEN tail_sequence IS NOT NULL AND next_sequence < tail_sequence + 1 THEN 1 ELSE 0 END) AS head_behind, SUM(CASE WHEN tail_sequence IS NULL OR next_sequence > tail_sequence + 1 THEN 1 ELSE 0 END) AS head_ahead, SUM(CASE WHEN tail_sequence IS NOT NULL AND head_hash != tail_hash THEN 1 ELSE 0 END) AS head_hash_mismatches FROM joined'

          run_query() {
            id="$1"
            sql="${SQL[$id]:-}"
            [[ -n "$sql" ]] || fail_closed "query_not_allowlisted_${id}"
            [[ "$sql" =~ ^[[:space:]]*(SELECT|WITH)[[:space:]] ]] || fail_closed "query_not_select_${id}"
            [[ "$sql" != *';'* ]] || fail_closed "query_contains_statement_separator_${id}"
            [[ ! "$sql" =~ (INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE|PRAGMA|ATTACH|DETACH) ]] || fail_closed "query_contains_write_or_pragma_${id}"
            raw="$raw_dir/$id.json"
            stderr="$raw_dir/$id.stderr"
            # Once the first provider call is about to begin, the startup
            # marker is no longer truthful. Record each attempted query so a
            # failed capture distinguishes preflight failure from read failure.
            python3 scripts/b125_readonly_diagnostics.py mark-started "$receipt" "$id"
            set +e
            CI=1 pnpm --silent dlx wrangler@4.111.0 d1 execute "$D1_DATABASE_ID" --remote --command "$sql" --json >"$raw" 2>"$stderr"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              # Raw provider output stays under RUNNER_TEMP. The receipt only
              # records an allowlisted error class/code and JSON schema shape.
              python3 scripts/b125_readonly_diagnostics.py record \
                "$receipt" "$id" "$status" "$raw" "$stderr"
              fail_closed "wrangler_query_failed_${id}_${status}"
            fi
            [[ -s "$raw" ]] || fail_closed "empty_wrangler_response_${id}"
            if ! python3 - "$receipt" "$raw" "$id" "$sql" <<'PY'
          import hashlib, json, sys
          receipt_path, raw_path, query_id, sql = sys.argv[1:]
          with open(raw_path, encoding="utf-8") as stream:
              document = json.load(stream)
          if isinstance(document, list):
              blocks = document
          elif isinstance(document, dict):
              result = document.get("result")
              if isinstance(result, list):
                  blocks = result
              elif isinstance(result, dict):
                  blocks = [result]
              elif isinstance(document.get("results"), (list, dict)):
                  # Wrangler normally wraps D1 results in `result`, while
                  # direct D1 API responses put the result block at root.
                  blocks = [document]
              else:
                  blocks = []
          else:
              blocks = []
          if isinstance(blocks, dict):
              blocks = [blocks]
          if not isinstance(blocks, list) or not blocks:
              raise SystemExit(f"{query_id}: missing D1 result blocks")
          rows = []
          for block in blocks:
              if not isinstance(block, dict) or block.get("success") is False:
                  raise SystemExit(f"{query_id}: D1 result was unsuccessful")
              rows.extend(block.get("results") or [])
          if not rows:
              raise SystemExit(f"{query_id}: empty D1 result set")
          with open(receipt_path, encoding="utf-8") as stream:
              receipt = json.load(stream)
          receipt["queries"].append({
              "id": query_id,
              "sql_sha256": hashlib.sha256(sql.encode()).hexdigest(),
              "rows": rows,
          })
          with open(receipt_path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
            then
              fail_closed "invalid_d1_response_${id}"
            fi
          }

          if [[ "$CAPTURE_MODE" == "diagnostic_only" ]]; then
            python3 scripts/b125_d1_api_diagnostic.py \
              "$receipt" "$CF_ACCOUNT_ID" "$D1_DATABASE_ID" "${SQL[hourly]}"
            fail_closed "diagnostic_only_capture_not_closure_evidence"
          else
            for query_id in population partition hourly latency heads burst integrity replay head_tail; do
              run_query "$query_id"
            done
          fi

          python3 - "$receipt" <<'PY'
          import json, math, sys
          from datetime import datetime, timedelta, timezone
          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              receipt = json.load(stream)
          by_id = {query["id"]: query["rows"] for query in receipt["queries"]}
          required = ("population", "partition", "hourly", "latency", "heads", "burst", "integrity", "replay", "head_tail")
          if any(len(by_id.get(key, [])) == 0 for key in required):
              raise SystemExit("one or more required query results are empty")
          hourly = by_id["hourly"]
          if len(hourly) != 6:
              raise SystemExit(f"expected six hourly rows, got {len(hourly)}")
          population = by_id["population"][0]
          partition = by_id["partition"][0]
          latency = by_id["latency"][0]
          heads = by_id["heads"][0]
          burst = by_id["burst"][0]
          integrity = by_id["integrity"][0]
          replay = by_id["replay"][0]
          head_tail = by_id["head_tail"][0]
          failures = []
          bucket_counts = []
          boundary_values = []
          for row in hourly:
              counts = (row.get("arrivals"), row.get("sealed_rows"), row.get("boundary_unsealed"))
              if any(type(value) is not int or value < 0 for value in counts):
                  failures.append("hourly_count_null_negative_or_invalid")
                  break
              bucket_counts.append((counts[0], counts[1]))
              boundary_values.append(counts[2])
          if len(bucket_counts) == 6 and len(set(boundary_values)) != 1:
              failures.append("hourly_boundary_backlog_inconsistent")
          if len(bucket_counts) == 6 and any(arrivals == 0 or sealed_rows == 0 for arrivals, sealed_rows in bucket_counts):
              failures.append("hourly_bucket_empty_arrivals_or_seals")
          try:
              bucket_starts = [
                  datetime.strptime(row["window_start_utc"], "%Y-%m-%dT%H:00:00Z").replace(tzinfo=timezone.utc)
                  for row in hourly
              ]
              bucket_ends = [
                  datetime.strptime(row["window_end_utc"], "%Y-%m-%dT%H:00:00Z").replace(tzinfo=timezone.utc)
                  for row in hourly
              ]
              complete_hour_buckets = all(
                  end - start == timedelta(hours=1)
                  and (index == 0 or bucket_ends[index - 1] == start)
                  for index, (start, end) in enumerate(zip(bucket_starts, bucket_ends))
              )
              current_anchor = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
              if not complete_hour_buckets or bucket_ends[-1] != current_anchor:
                  failures.append("hourly_window_labels_not_six_complete_consecutive_utc_buckets")
              first_post_repair_bucket = datetime(2026, 9, 30, 20, 0, tzinfo=timezone.utc)
              if bucket_starts[0] < first_post_repair_bucket:
                  failures.append("hourly_window_includes_pre_repair_data")
          except (KeyError, TypeError, ValueError):
              failures.append("hourly_window_labels_invalid")
          if int(population.get("total_rows") or 0) <= 0:
              failures.append("population_control_empty")
          if int(partition.get("partition_count") or 0) <= 0:
              failures.append("partition_control_empty")
          if int(partition.get("partition_rows") or 0) != int(population.get("total_rows") or 0):
              failures.append("partition_population_mismatch")
          if int(partition.get("partition_unsealed_rows") or 0) != int(population.get("unsealed_rows") or 0):
              failures.append("partition_unsealed_mismatch")
          if int(heads.get("chain_heads") or 0) <= 0:
              failures.append("chain_head_control_empty")
          if int(heads.get("signed_heads") or 0) != int(heads.get("chain_heads") or 0):
              failures.append("unsigned_chain_head_detected")
          for key in ("min_latency_ms", "mean_latency_ms", "median_latency_ms", "p90_latency_ms", "max_latency_ms"):
              value = latency.get(key)
              if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value) or value < 0:
                  failures.append(f"latency_{key}_missing_negative_or_invalid")
          if type(latency.get("valid_latency_rows")) is not int or latency["valid_latency_rows"] <= 0:
              failures.append("six_hour_latency_sample_empty")
          reconstructed = []
          if len(bucket_counts) == 6 and len(set(boundary_values)) == 1:
              closing = boundary_values[0]
              for arrivals, sealed_rows in reversed(bucket_counts):
                  opening = closing - arrivals + sealed_rows
                  if opening < 0:
                      failures.append("hourly_reconstructed_backlog_negative")
                      break
                  reconstructed.append((opening, closing, opening + arrivals))
                  closing = opening
              if len(reconstructed) == 6:
                  reconstructed.reverse()
                  for row, (opening, closing, demand) in zip(hourly, reconstructed):
                      row["opening_unsealed"] = opening
                      row["closing_unsealed"] = closing
                      row["demand_rows"] = demand
                  if reconstructed[-1][1] != boundary_values[0]:
                      failures.append("hourly_boundary_backlog_reconciliation_failed")
          if sum(int(row.get("arrivals") or 0) for row in hourly) <= 0:
              failures.append("six_hour_window_has_no_arrivals")
          if sum(int(row.get("sealed_rows") or 0) for row in hourly) <= 0:
              failures.append("six_hour_window_has_no_seals")
          if int(burst.get("populated_hours") or 0) <= 0:
              failures.append("seven_day_burst_control_empty")
          if int(burst.get("peak_hour_arrivals") or 0) <= 512:
              failures.append("no_observed_burst_above_batch_limit")
          if int(integrity.get("sealed_rows") or 0) <= 0:
              failures.append("seal_integrity_control_empty")
          for key in ("malformed_seals", "negative_latency_rows", "duplicate_chain_hash_rows"):
              if int(integrity.get(key) or 0) != 0:
                  failures.append(f"seal_integrity_{key}")
          for key in ("repeated_sequence_rows", "sequence_gap_rows", "duplicate_sequence_groups"):
              if int(replay.get(key) or 0) != 0:
                  failures.append(f"replay_{key}")
          for key in ("head_tail_mismatches", "head_behind", "head_ahead", "head_hash_mismatches"):
              if int(head_tail.get(key) or 0) != 0:
                  failures.append(f"head_tail_{key}")
          control_failures = list(failures)
          qualified = [index for index, (_, _, demand) in enumerate(reconstructed) if demand >= 3141]
          if not control_failures:
              if not qualified:
                  failures.append("throughput_capacity_inconclusive_no_qualified_hour")
              for index in qualified:
                  if bucket_counts[index][1] < 3141:
                      failures.append(f"throughput_below_3141_bucket_{index}")
              if reconstructed[-1][1] > reconstructed[0][0]:
                  failures.append("six_hour_backlog_growth")
              p90 = latency.get("p90_latency_ms")
              oldest = population.get("oldest_unsealed_age_ms")
              if isinstance(p90, bool) or not isinstance(p90, (int, float)) or not math.isfinite(p90) or p90 > 4_200_000:
                  failures.append("p90_seal_latency_above_70_minutes_or_invalid")
              if type(oldest) is not int or oldest < 0 or oldest > 4_200_000:
                  failures.append("oldest_unsealed_above_70_minutes_or_invalid")
          threshold_status = (
              "INVALID" if control_failures else
              "FAIL" if any(reason != "throughput_capacity_inconclusive_no_qualified_hour" for reason in failures) else
              "INCONCLUSIVE" if not qualified else "PASS"
          )
          receipt["captured_at"] = datetime.now(timezone.utc).isoformat()
          receipt["window"] = {
              "hours": 6,
              "start_utc": hourly[0].get("window_start_utc"),
              "end_utc": hourly[-1].get("window_end_utc"),
              "basis": "six complete consecutive UTC hour buckets ending at the SQLite current-hour boundary",
          }
          receipt["measurements"] = {
              "hourly": hourly,
              "population": population,
              "partition_control": partition,
              "latency": latency,
              "chain_heads": heads,
              "burst_seven_days": burst,
              "seal_integrity": integrity,
              "replay_sequence_control": replay,
              "head_tail_control": head_tail,
          }
          receipt["owner_threshold"] = {
              "decision_ref": "https://github.com/HuGR-dev/corelink-server/issues/1668#issuecomment-5861728482",
              "sealed_rows_per_demand_qualified_hour_min": 3141,
              "demand_rows_per_qualified_hour_min": 3141,
              "p90_seal_latency_max_ms": 4_200_000,
              "oldest_unsealed_max_ms": 4_200_000,
              "qualified_bucket_count": len(qualified),
              "status": threshold_status,
          }
          receipt["failure_reasons"] = failures
          receipt["valid"] = not failures
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          if failures:
              raise SystemExit(";".join(failures))
          PY

