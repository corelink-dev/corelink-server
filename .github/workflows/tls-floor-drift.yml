name: B-035 single read-only TLS floor probe

# The probe is deliberately manual-only. It reads min_tls_version once and
# captures TLS handshakes for concrete source-bound ingress hostnames. It
# sends no application request and has no provider write path.
on:
  workflow_dispatch:
    inputs:
      single_read_ack:
        description: Confirm one read-only B-035 evidence run on protected main
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-floor:
    name: one authenticated zone read and ingress handshake matrix
    if: github.ref == 'refs/heads/main' && inputs.single_read_ack == true
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read zone setting and probe source-bound TLS handshakes
        id: probe
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/probe_b035_tls_handshakes.py --live --revision "$GITHUB_SHA" > "$RUNNER_TEMP/b035-tls-probe.json"

      - name: Upload redacted B-035 receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b035-tls-probe-${{ github.sha }}
          path: ${{ runner.temp }}/b035-tls-probe.json
          if-no-files-found: error

      - name: Require authenticated zone read
        if: always()
        env:
          B035_REPORT: ${{ runner.temp }}/b035-tls-probe.json
        run: python3 -c 'import json, os, pathlib, sys; p=json.loads(pathlib.Path(os.environ["B035_REPORT"]).read_text()); print("zone floor:", p["zone_floor"].get("status"), p["zone_floor"].get("value", "")); print("source validation:", p["source_validation"].get("status")); sys.exit(0 if p["zone_floor"].get("status") in {"match", "drift"} and p["source_validation"].get("status") == "all_markers_match" else 1)'
