name: issue-1724-cli-provenance

on:
  # This is the explicit #1724 pack. A PR does not trigger it: dispatch once
  # against the immutable candidate SHA after the diff and DCO are admitted.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to prove
        required: true
        type: string
      base_sha:
        description: Full 40-character protected main SHA the candidate is based on
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: validate managed CLI provenance contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == vars.CORELINK_SERVER_REPO_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Bind the pack to the requested immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if ! [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::base_sha must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Reject provenance builder, identity, issuer, and subject mutations
        run: cargo test --locked -p corelink-cli --test release_workflow_contract -- --nocapture
      - name: Install Python contract dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Verify B-112 release build and signing gates
        run: python3 scripts/verify_b112_release_root_cause.py --root .
      - name: Verify issue-2050 CLI release dry-run contract
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          CORELINK_BASE_SHA: ${{ inputs.base_sha }}
        run: python3 scripts/verify_i2050_release_dryrun_contract.py contract --base-sha "${CORELINK_BASE_SHA}"
      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version
      - name: Validate the CLI release workflow schemas
        run: >-
          "${RUNNER_TEMP}/actionlint/actionlint" -color
          .github/workflows/issue-1724-cli-provenance.yml
          .github/workflows/issue-2050-cli-release-dry-run.yml
          .github/workflows/release-cli.yml
