name: issue #2092 DSR classification contract

on:
  pull_request:
    paths:
      - '.github/workflows/issue-2092-dsr-classification.yml'
      - 'crates/corelink-container/src/main_tests.rs'
      - 'crates/corelink-container/src/main_runtime.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1/**'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1_registry.rs'
      - 'crates/corelink-container/src/routes/dsr/adapter_d1_tests.rs'
      - 'scripts/verify_b126_t1_refactor.py'

permissions:
  contents: read

concurrency:
  group: issue-2092-dsr-classification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classification:
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run B-126 line-cap and mutation gate
        run: python3 -S scripts/verify_b126_t1_refactor.py --self-test

      - name: Run DSR classification and adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          cargo test --locked -p corelink-server --lib \
            routes::dsr::adapter_d1::tests:: 2>&1 | tee "${log}"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${log}"

      - name: Run B-126 source-size regression tests
        run: cargo test --locked -p corelink-server --bin corelink-server b126_t1_
