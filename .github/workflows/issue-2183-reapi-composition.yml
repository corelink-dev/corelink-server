name: issue-2183 cache-only REAPI composition

on:
  pull_request:
    paths:
      - ".github/workflows/issue-2183-reapi-composition.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/corelink-container/build.rs"
      - "crates/corelink-container/proto/staging_transport_probe.proto"
      - "crates/corelink-container/src/grpc_staging_probe.rs"
      - "crates/corelink-container/src/lib.rs"
      - "crates/corelink-container/src/main.rs"
      - "crates/corelink-container/src/reapi_action_cache.rs"
      - "crates/corelink-container/src/reapi_bytestream.rs"
      - "crates/corelink-container/src/reapi_cas.rs"
      - "crates/corelink-container/src/reapi_composition.rs"
      - "crates/corelink-container/src/reapi_ingress.rs"
      - "scripts/verify_i2183_reapi_composition.py"
      - "examples/buck2-starter/.buckconfig"
permissions:
  contents: read

concurrency:
  group: issue-2183-reapi-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-only-composition:
    name: exact-head Rust REAPI behavior and composition adversarial contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the exact pull request head without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert the exact revision under review
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install the workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Install the pinned Protobuf compiler required by corelink-reapi
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
      - name: Check composition and adversarial source mutations
        run: python3 -S scripts/verify_i2183_reapi_composition.py --self-test --json
      - name: Compile and run the authenticated REAPI service behavior cases
        run: cargo test --locked -p corelink-server --lib reapi_ -- --nocapture
      - name: Run the protected staging h2c transport diagnostic contract
        run: cargo test --locked -p corelink-server --lib grpc_staging_probe -- --nocapture
