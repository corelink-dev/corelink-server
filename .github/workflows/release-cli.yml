name: release-cli

# CoreLink CLI release pipeline (Stream 2.8).
#
# Triggers on an explicit owner dispatch for an existing cli-v* tag. It builds
# the closed Linux + Windows inventory and creates a release in the separate
# HuGR-Labs/corelink-cli repository.
#
# Binary names match the install script contract:
#   URL="${RELEASE_ORIGIN}/corelink-${OS}-${ARCH}"
#   (apps/get-corelink-worker/src/install.ts)
#
# Closed platform inventory:
#   corelink-linux-x86_64       x86_64-unknown-linux-gnu
#   corelink-linux-aarch64      aarch64-unknown-linux-gnu
#   corelink-windows-x86_64.exe x86_64-pc-windows-gnu
#
# Required GH Secret (set MANUALLY by operator, used only by `release`):
#   CORELINK_CLI_RELEASE_TOKEN  PAT with `repo` scope on
#                               HuGR-Labs/corelink-cli. Build jobs never receive
#                               this credential.
#
# GitHub-managed provenance is created by the release-slsa3 reusable workflow
# after every platform signer has replaced its staged bytes. Publication is
# blocked unless its Sigstore/Rekor bundle verifies against the final inventory.

on:
  # Releases are an explicit owner operation.  A tag alone must never start a
  # publication chain while the public repository is being migrated to hosted
  # Actions.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing cli-vMAJOR.MINOR.PATCH tag bound to the exact source commit"
        required: true
        type: string
      release_mode:
        description: "Draft-only by default; signed-public requires every production signature gate"
        required: true
        type: choice
        default: draft-only
        options:
          - draft-only
          - signed-public

# Workflow-level least-privilege.
# The cross-repo release write is handled by CORELINK_CLI_RELEASE_TOKEN.
permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every hosted VM is ephemeral. Keep incremental output disabled so the
  # manifest is derived only from the target-local release artifact.
  CARGO_INCREMENTAL: "0"

jobs:
  # -------------------------------------------------------------------
  # build — Linux + Windows cargo-zigbuild matrix
  # -------------------------------------------------------------------
  build:
    name: build (${{ matrix.target.name }})
    if: github.repository_id == '1232040291' && github.ref == format('refs/tags/{0}', inputs.release_tag)
    # Each target has its own ephemeral GitHub-hosted VM.
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    env:
      TARGET_TRIPLE: ${{ matrix.target.triple }}
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_SIGNER_NAME: ${{ matrix.target.signer_name }}
      TARGET_EXT: ${{ matrix.target.ext }}
    strategy:
      fail-fast: false
      # One runner per target; no host-local state is shared between legs.
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            name: corelink-linux-x86_64
            signer_name: corelink-linux-x86_64
            ext: ""
            runner: ubuntu-24.04
          - triple: aarch64-unknown-linux-gnu
            name: corelink-linux-aarch64
            signer_name: corelink-linux-arm64
            ext: ""
            runner: ubuntu-24.04
          - triple: x86_64-pc-windows-gnu
            name: corelink-windows-x86_64
            signer_name: corelink-windows-x86_64
            ext: ".exe"
            runner: windows-2022

    steps:
      - name: Enable Git long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      # Do NOT provision a Rust toolchain. Per its own action.yml,
      # `dtolnay/rust-toolchain` runs `rustup toolchain install` + `rustup default`
      # against the SHARED `~/.rustup` (one `$HOME` per host). That (a) can make
      # `rustc` unexecutable mid-build for every other job — it took the host down
      # for a day on 2026-06-15 — and (b) `rustup default` rewrites the MACHINE-GLOBAL
      # default, silently moving every concurrent job off the ADR-0015 reproducibility
      # pin. Full reasoning: scripts/ci-use-host-toolchain.sh header.
      - name: Validate matrix target values before shell use
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_TRIPLE}:${TARGET_NAME}:${TARGET_SIGNER_NAME}:${TARGET_EXT}" in
            x86_64-unknown-linux-gnu:corelink-linux-x86_64:corelink-linux-x86_64:|aarch64-unknown-linux-gnu:corelink-linux-aarch64:corelink-linux-arm64:|x86_64-pc-windows-gnu:corelink-windows-x86_64:corelink-windows-x86_64:.exe) ;;
            *) echo "::error::untrusted matrix target metadata" >&2; exit 1 ;;
          esac

      - name: Install and assert the workspace-pinned Rust target
        shell: bash
        run: |
          set -euo pipefail
          # The pinned toolchain is lazily installed by the rustc shim. Invoke
          # the repository assertion before asking rustup to add a target.
          bash scripts/ci-assert-pinned-toolchain.sh
          rustup target add "${TARGET_TRIPLE}"
          bash scripts/ci-assert-pinned-toolchain.sh "${TARGET_TRIPLE}"

      # Isolate Cargo registry and target artifacts in this job/attempt/target
      # namespace so no matrix leg (or unrelated workflow) can prune or
      # rewrite another leg's inputs while rustc is using them. RUNNER_TEMP is
      # a runtime environment variable, so configure it through GITHUB_ENV
      # rather than an invalid runner-context expression in jobs.env.
      - name: Isolate per-job Cargo state
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME="${RUNNER_TEMP}/corelink-cargo/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/corelink-target/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          mkdir -p "${CARGO_HOME}" "${CARGO_TARGET_DIR}"
          echo "CARGO_HOME=${CARGO_HOME}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}" >> "$GITHUB_ENV"

      # zig cross-toolchain: provides libc headers + linker for Linux + Windows.
      # Do not treat an arbitrary Homebrew Zig as good enough: cargo-zigbuild's
      # generated wrappers are coupled to Zig's CLI. The failed release chain
      # had no recorded tool versions, so an incompatible host upgrade was
      # indistinguishable from a source failure. This pin is checked, not
      # assumed, before every cross build.
      - name: Install pinned Zig (Linux + Windows)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Verify pinned Zig (Linux + Windows)
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ZIG_VERSION=0.16.0
          command -v zig
          ACTUAL_ZIG_VERSION="$(zig version)"
          if [ "$ACTUAL_ZIG_VERSION" != "$EXPECTED_ZIG_VERSION" ]; then
            echo "::error::release-cli needs Zig ${EXPECTED_ZIG_VERSION}, got ${ACTUAL_ZIG_VERSION}. Install the pinned Zig on the builder before dispatching cli-v*." >&2
            exit 1
          fi
          zig version

      # Prebuilt binary, NOT `cargo install`. The old form compiled cargo-zigbuild
      # from source into the SHARED `~/.cargo` that all 5 self-hosted runners use
      # at once — the documented `os error 2` race. The "install once and reuse"
      # guard did NOT make that safe: it only narrowed the window to the first
      # build after a version bump, and the whole matrix hits that window at the
      # same moment. Same reasoning as mutation-pr.yml / lockfile-diff.yml.
      # install-action is a no-op when the pinned version is already on the host.
      - name: Install cargo-zigbuild (prebuilt, Linux + Windows only)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-zigbuild@0.19.8

      # cargo-zigbuild places linker wrappers in its cache. That cache was
      # previously shared through $HOME; a non-executable restored wrapper led
      # to exit 126 and, worse, one matrix leg could reuse another's partial
      # wrapper. A per-job cache makes wrapper creation atomic from this job's
      # point of view and removes the chmod-after-the-fact race.
      - name: Verify cargo-zigbuild and isolate its wrapper cache
        shell: bash
        run: |
          set -euo pipefail
          # The pinned install-action input selects the version above. Probe
          # the executable through its supported CLI surface; it has no
          # --version option.
          command -v cargo-zigbuild
          cargo-zigbuild --help >/dev/null
          ZIGBUILD_CACHE="${RUNNER_TEMP}/cargo-zigbuild/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          mkdir -p "$ZIGBUILD_CACHE"
          echo "CARGO_ZIGBUILD_CACHE_DIR=${ZIGBUILD_CACHE}" >> "$GITHUB_ENV"

      # Reproducible build: SOURCE_DATE_EPOCH from git commit timestamp.
      - name: Set SOURCE_DATE_EPOCH
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      # Cargo fetches missing sources as part of the locked build. Do not
      # manually delete/re-fetch registry packages here: the old repair mutated
      # `$HOME/.cargo/registry/src` shared by concurrent jobs and could recreate
      # the B-112 rustc ENOENT race. CARGO_HOME above is
      # hermetic, and each target's CARGO_TARGET_DIR is hermetic as well.

      # Strip absolute dev-host paths from the binary (CTRL-PATH-HYGIENE).
      # Without this, `strings` on the binary exposes
      # `/Users/<runner-user>/.cargo/registry/...` and similar — username
      # leak with no functional value. Map all known prefixes to short
      # placeholders so debug strings carry semantics but not paths.
      - name: Set RUSTFLAGS path-remap
        shell: bash
        run: |
          REMAP=""
          REMAP="$REMAP --remap-path-prefix=${CARGO_HOME}/registry=cargo-registry"
          REMAP="$REMAP --remap-path-prefix=${CARGO_HOME}/git=cargo-git"
          REMAP="$REMAP --remap-path-prefix=$HOME/.rustup=rustup"
          REMAP="$REMAP --remap-path-prefix=$GITHUB_WORKSPACE=corelink"
          echo "RUSTFLAGS=$REMAP" >> "$GITHUB_ENV"

      - name: Build (cargo zigbuild) — Linux + Windows
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        shell: bash
        run: |
          cargo zigbuild \
            -p corelink-cli \
            --release \
            --locked \
            --target "${TARGET_TRIPLE}"

      # Binary stripping is handled by [profile.release] strip = true
      # in the workspace Cargo.toml — no explicit strip step needed.
      #
      # Keep the raw binary for the public installer AND publish the archive
      # consumed by sign-linux/sign-windows. Previously only the
      # former existed, so every downstream signer asked the release root for a
      # .tar.gz/.zip that did not exist.
      - name: Set up pinned Python for deterministic Windows packaging
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare Linux installer + signer artifacts and SHA-256 checksums
        if: matrix.target.triple != 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          set -euo pipefail
          SRC="${CARGO_TARGET_DIR}/${TARGET_TRIPLE}/release/corelink"
          SRC="${SRC}${TARGET_EXT}"
          ASSET="${TARGET_NAME}${TARGET_EXT}"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          PACKAGE_DIR="${RUNNER_TEMP}/corelink-package-${TARGET_NAME}"
          mkdir -p "$PACKAGE_DIR"
          cp "$SRC" "$PACKAGE_DIR/corelink${TARGET_EXT}"
          ARCHIVE="${TARGET_SIGNER_NAME}.tar.gz"
          tar -czf "out/${ARCHIVE}" -C "$PACKAGE_DIR" "corelink${TARGET_EXT}"
          for FILE in "$ASSET" "$ARCHIVE"; do
            (cd out && shasum -a 256 "$FILE" > "${FILE}.sha256")
            (cd out && shasum -a 256 -c "${FILE}.sha256")
          done
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Prepare deterministic Windows installer + signer artifacts
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:CARGO_TARGET_DIR "${env:TARGET_TRIPLE}\release\corelink.exe"
          $archive = Join-Path $PWD "out\${env:TARGET_SIGNER_NAME}.zip"
          $assetName = "${env:TARGET_NAME}.exe"
          $asset = Join-Path $PWD "out\$assetName"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "missing Windows build output: $source" }
          New-Item -ItemType Directory -Path (Join-Path $PWD 'out') -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $asset -Force
          $env:CORELINK_SOURCE = $source
          $env:CORELINK_ARCHIVE = $archive
          $pythonCode = 'import hashlib, os; from pathlib import Path; from zipfile import ZIP_STORED, ZipFile, ZipInfo; source=Path(os.environ["CORELINK_SOURCE"]); archive=Path(os.environ["CORELINK_ARCHIVE"]); payload=source.read_bytes(); info=ZipInfo("corelink.exe", (1980, 1, 1, 0, 0, 0)); info.create_system=0; info.external_attr=0; info.compress_type=ZIP_STORED; output=ZipFile(archive, "w", compression=ZIP_STORED); output.writestr(info, payload); output.close(); check=ZipFile(archive); assert check.namelist()==["corelink.exe"], f"unexpected members {check.namelist()!r}"; archived=check.read("corelink.exe"); check.close(); assert hashlib.sha256(archived).digest()==hashlib.sha256(payload).digest(), "Windows archive payload differs from compiled executable"'
          python -c $pythonCode
          if ($LASTEXITCODE -ne 0) { throw 'deterministic Windows ZIP packaging failed' }
          foreach ($file in @($asset, $archive)) {
            $sidecar = "$file.sha256"
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath $sidecar -Value "$actual  $([IO.Path]::GetFileName($file))" -NoNewline -Encoding ascii
            $expected = (Get-Content -LiteralPath $sidecar).Split(' ')[0]
            if ($actual -ne $expected) { throw "SHA-256 sidecar mismatch: $file" }
          }
          "ASSET=$assetName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.target.name }}
          path: out/
          retention-days: 1

  # -------------------------------------------------------------------
  # release — collect artifacts and create the public CLI release
  #
  # ⚠️ STALE COMMENT CORRECTED 2026-08-02. The block here claimed the release
  # had been "switched to publishing in this repo's Releases" and that the
  # separate corelink-cli repo "can be archived / repurposed". The release
  # history says otherwise — all three on 2026-05-29:
  #     20:09  corelink-server  cli-v0.1.0   (the switch)
  #     21:35  corelink-cli     v0.1.0
  #     22:04  corelink-cli     v0.1.1   <- newest, 11 assets incl. windows
  # i.e. publishing moved BACK to the separate repo and the comment was never
  # updated. The installer downloads from corelink-cli, so the latest CLI a
  # customer can install is v0.1.1 — not the cli-v0.1.0 in this repo.
  #
  # REPOINTED 2026-08-31 (WP-E): the five `HumanGuardrail/corelink-cli` strings in
  # this file — including the two `gh release create` / `gh release upload`
  # `--repo` flags below — named a repo that returns 404. `gh api
  # repos/HumanGuardrail/corelink-cli` → `404 Not Found`, while the control
  # `gh api repos/HuGR-Labs/corelink-cli` resolves. So the `release` job could
  # not have succeeded even with a fully green build matrix, and the comment
  # immediately below had said the canonical home was HuGR-Labs since 2026-08-02
  # while the code two dozen lines down was never updated to match.
  #
  # Historical migration note: the original release lane published server-built
  # CLI artifacts to a separate repository. Keep the release target below bound
  # to HuGR-Labs/corelink-cli; it is independent of the server transfer.
  #
  # Canonical home is now HuGR-Labs/corelink-cli (transferred 2026-08-02 off the
  # personal gmhelmold account; the get-corelink-worker RELEASE_ORIGIN is pinned
  # to it). Anyone changing where releases are published MUST repin that var and
  # redeploy the worker, or the installer keeps fetching the old location.
  # -------------------------------------------------------------------
  release:
    name: create release (HuGR-Labs/corelink-cli)
    needs: [build, release-readiness]
    if: github.repository_id == '1232040291' && github.ref == format('refs/tags/{0}', inputs.release_tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      validated_tag: ${{ steps.validate-release-tag.outputs.tag }}
      staging_manifest_sha256: ${{ steps.staging-manifest.outputs.sha256 }}
      source_sha: ${{ steps.release-identity.outputs.source_sha }}
      release_mode: ${{ steps.release-identity.outputs.release_mode }}
      release_id: ${{ steps.create-release.outputs.release_id }}
    # The source-repo GITHUB_TOKEN cannot publish cross-repo. The only write
    # credential is injected in the two release steps below as the external,
    # manually provisioned CORELINK_CLI_RELEASE_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout manifest verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag before shell use
        id: validate-release-tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "${INPUT_TAG}" in
            cli-v*) ;;
            *)
              echo "::error::expected a cli-v* release tag, got: ${INPUT_TAG}" >&2
              exit 1
              ;;
          esac
          [[ "${INPUT_TAG}" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          printf 'tag=%s\n' "${INPUT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Resolve typed release identity
        id: release-identity
        env:
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          git show-ref --verify --quiet "refs/tags/${TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "${TAG}")"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          case "${RELEASE_MODE}" in
            draft-only|signed-public) ;;
            *) echo "::error::unsupported release mode" >&2; exit 1 ;;
          esac
          echo "release_mode=${RELEASE_MODE}" >> "${GITHUB_OUTPUT}"

      - name: Bind package version to the exact release tag
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("tools/cli/Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)"\s*$', text)
          if not match:
              raise SystemExit("CLI package version is not an explicit canonical value")
          print(match.group(1))
          PY
          )"
          test "${TAG}" = "cli-v${PACKAGE_VERSION}"

      - name: Install checksum-pinned GitHub CLI 2.79.0
        shell: bash
        run: |
          set -euo pipefail
          GH_BIN="${RUNNER_TEMP}/corelink-pinned-gh/gh"
          python3 scripts/install_pinned_gh.py --output "${GH_BIN}"
          echo "${RUNNER_TEMP}/corelink-pinned-gh" >> "${GITHUB_PATH}"

      - name: Verify pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_pinned_gh.py --binary "${RUNNER_TEMP}/corelink-pinned-gh/gh"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Verify artifact inventory and individual checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "=== dist/ contents ==="
          find dist/ -maxdepth 1 -type f | sort
          # 6 payload files + 6 checksum sidecars.
          EXPECTED=12
          ACTUAL=$(find dist/ -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: expected ${EXPECTED} files, got ${ACTUAL}" >&2
            exit 1
          fi
          for CHECKSUM in dist/*.sha256; do
            (cd dist && shasum -a 256 -c "$(basename "$CHECKSUM")")
          done

      - name: Build combined checksums.txt
        env:
          CHECKSUM_DIRECTORY: dist
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cli_release_draft_manifest.py write-checksums \
            --directory "${CHECKSUM_DIRECTORY}"
          echo "=== checksums.txt ==="
          cat "${CHECKSUM_DIRECTORY}/checksums.txt"

      - name: Bind staged artifacts to the immutable source manifest
        id: staging-manifest
        env:
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
          SOURCE_SHA: ${{ steps.release-identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/cli_release_manifest.py create \
            --directory dist --output dist/staging-manifest.json \
            --tag "${TAG}" --source-sha "${SOURCE_SHA}"
          shasum -a 256 dist/staging-manifest.json | awk '{print $1}' > /tmp/staging-manifest.sha256
          echo "sha256=$(cat /tmp/staging-manifest.sha256)" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
        run: |
          # Static section (single-quoted heredoc: no variable expansion).
          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Install

          ```sh
          curl -fsSL https://corelink-get.humangr.com | sh -s -- --token=<PAT>
          ```

          ## Platforms

          | Binary | OS | Arch |
          |--------|-----|------|
          | `corelink-linux-x86_64`      | Linux   | x86_64  |
          | `corelink-linux-aarch64`     | Linux   | aarch64 |
          | `corelink-windows-x86_64.exe`| Windows | x86_64  |

          ## Checksums

          See `checksums.txt` for SHA-256 digests of all artifacts.

          ## Source
          NOTES_EOF
          echo "Built from \`${GITHUB_REPOSITORY}\` tag \`${TAG}\`." \
            >> /tmp/release-notes.md
          if [ "${{ inputs.release_mode }}" = "draft-only" ]; then
            cat >> /tmp/release-notes.md <<'DRAFT_NOTES'

          ## Signing status

          Linux artifacts have detached GPG signatures. The Windows artifact is unsigned and deferred; no Authenticode or RFC 3161 timestamp is claimed. This draft is not a public release. No Apple artifact or support claim is included.
          DRAFT_NOTES
          fi

      - name: Assert external cross-repository release credential
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CORELINK_CLI_RELEASE_TOKEN is required only to publish to HuGR-Labs/corelink-cli; it is intentionally unavailable to build jobs." >&2
            exit 1
          fi
          gh api --method GET repos/HuGR-Labs/corelink-cli >/dev/null

      - name: Create GitHub Release in HuGR-Labs/corelink-cli
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="${RUNNER_TEMP}/corelink-cli-existing-release.json"
          RELEASE_STATE="$(python3 scripts/cli_release_api.py \
            --repo HuGR-Labs/corelink-cli --tag "${TAG}" \
            --expected-state draft --allow-absent --format state)"
          case "${RELEASE_STATE}" in
            draft)
              python3 scripts/cli_release_api.py \
                --repo HuGR-Labs/corelink-cli --tag "${TAG}" \
                --expected-state draft > "${RELEASE_JSON}"
              python3 - "${RELEASE_JSON}" "${TAG}" "${{ inputs.release_mode }}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if release.get("tag_name") != sys.argv[2] or release.get("draft") is not True:
              raise SystemExit("existing release is not the exact retryable draft")
          if release.get("published_at") is not None:
              raise SystemExit("existing release was already published; refusing staged overwrite")
          mode = sys.argv[3]
          if mode not in {"draft-only", "signed-public"}:
              raise SystemExit("unknown release mode")
          if mode == "draft-only" and release.get("assets"):
              raise SystemExit("draft-only mode refuses to overwrite or resume a non-empty draft")
          PY
              echo "Exact empty draft exists; no existing asset will be overwritten."
              ;;
            absent)
              gh release create "${TAG}" --repo HuGR-Labs/corelink-cli \
                --title "CoreLink CLI ${TAG#cli-}" \
                --notes-file /tmp/release-notes.md --draft
              ;;
            *)
              echo "::error::cannot classify existing release state" >&2
              exit 1
              ;;
          esac
          RELEASE_ID="$(python3 scripts/cli_release_api.py \
            --repo HuGR-Labs/corelink-cli --tag "${TAG}" \
            --expected-state draft --format id)"
          [[ "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]
          printf 'release_id=%s\n' "${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Upload binaries + checksums to release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
        run: |
          if [ "${{ inputs.release_mode }}" = "draft-only" ]; then
            gh release upload "${TAG}" dist/* --repo HuGR-Labs/corelink-cli
          else
            gh release upload "${TAG}" dist/* --repo HuGR-Labs/corelink-cli --clobber
          fi

      - name: Read back published artifacts and verify release-root digests
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ steps.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED="${RUNNER_TEMP}/corelink-release-readback"
          mkdir -p "$PUBLISHED"
          gh release download "${TAG}" \
            --repo HuGR-Labs/corelink-cli \
            --dir "$PUBLISHED" \
            --pattern 'corelink-*' \
            --pattern 'checksums.txt' \
            --pattern 'staging-manifest.json' \
            --clobber
          ACTUAL=$(find "$PUBLISHED" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne 14 ]; then
            echo "::error::staging release must expose 12 platform artifacts, checksums.txt, and staging-manifest.json; got ${ACTUAL}." >&2
            find "$PUBLISHED" -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi
          (cd "$PUBLISHED" && shasum -a 256 -c checksums.txt)
          python3 scripts/cli_release_manifest.py verify \
            --directory "$PUBLISHED" --manifest "$PUBLISHED/staging-manifest.json" \
            --tag "${TAG}" --source-sha "${{ steps.release-identity.outputs.source_sha }}"

  # The release root owns the full serial writer chain. Calling each signer as a
  # reusable workflow preserves the exact tag as an explicit typed input and
  # lets GitHub's `needs` semantics stop the next writer on a true failure;
  # unlike a workflow_run hop, it never rebinds identity to the default branch.
  sign-linux:
    needs: release
    uses: ./.github/workflows/sign-linux.yml
    with:
      tag: ${{ needs.release.outputs.validated_tag }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      staging_manifest_sha256: ${{ needs.release.outputs.staging_manifest_sha256 }}
    secrets:
      CORELINK_CLI_RELEASE_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_KEY_PASS: ${{ secrets.GPG_PRIVATE_KEY_PASS }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}

  release-readiness:
    name: decide release-mode preflight
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      release_mode: ${{ steps.decision.outputs.release_mode }}
    steps:
      - name: Checkout credentialless signing readiness verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate signed-public Linux and Windows preflight packet
        id: packet
        if: inputs.release_mode == 'signed-public'
        shell: bash
        run: |
          set -euo pipefail
          PACKET_READY="$(python3 scripts/verify_i1664_signing_readiness.py --emit-initial-release-preflight-ready)"
          case "${PACKET_READY}" in
            true|false) printf 'packet_ready=%s\n' "${PACKET_READY}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::signing readiness verifier returned an invalid state" >&2; exit 1 ;;
          esac
      - id: decision
        env:
          GPG_PACKET_READY: ${{ steps.packet.outputs.packet_ready }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASS: ${{ secrets.GPG_PRIVATE_KEY_PASS }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
          GPG_PUBLIC_KEY: docs/internal/gpg-release-pubkey.asc
        run: |
          set -euo pipefail
          case "${RELEASE_MODE}" in draft-only|signed-public) ;; *) exit 1 ;; esac
          if [ -z "${GPG_PRIVATE_KEY}" ] || [ -z "${GPG_PRIVATE_KEY_PASS}" ] || [ -z "${GPG_KEY_ID}" ] || [ -z "${GPG_KEY_FINGERPRINT}" ]; then
            echo "::error::release GPG readiness is incomplete; artifact signing is blocked." >&2
            exit 1
          fi
          PUBLIC_KEY_FINGERPRINT="$(gpg --batch --with-colons --show-keys "${GPG_PUBLIC_KEY}" | awk -F: '$1 == "fpr" { print $10; exit }')"
          EXPECTED_FINGERPRINT=795253CEBD6D54C862CFC4A3EC0AD89A75EC6756
          test "${PUBLIC_KEY_FINGERPRINT}" = "${EXPECTED_FINGERPRINT}"
          test "$(printf '%s' "${GPG_KEY_FINGERPRINT}" | tr '[:lower:]' '[:upper:]')" = "${EXPECTED_FINGERPRINT}"
          if [ "${RELEASE_MODE}" = "signed-public" ] && [ "${GPG_PACKET_READY}" != "true" ]; then
            echo "::error::signed-public mode requires the Linux + Windows identity/access preflight packet." >&2
            exit 1
          fi
          printf 'release_mode=%s\n' "${RELEASE_MODE}" >> "${GITHUB_OUTPUT}"

      - name: Require Windows Authenticode credentials for signed-public mode
        if: inputs.release_mode == 'signed-public'
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
          WINDOWS_FINGERPRINT: ${{ secrets.WINDOWS_CODE_SIGNING_FINGERPRINT }}
          WINDOWS_SUBJECT: ${{ secrets.WINDOWS_CODE_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT}" ] || [ -z "${WINDOWS_PASSWORD}" ] || [ -z "${WINDOWS_FINGERPRINT}" ] || [ -z "${WINDOWS_SUBJECT}" ]; then
            echo "::error::Windows Authenticode prerequisites are incomplete; signed-public mode is blocked." >&2
            exit 1
          fi

  sign-windows:
    if: inputs.release_mode == 'signed-public'
    needs: [sign-linux, release]
    uses: ./.github/workflows/sign-windows.yml
    with:
      tag: ${{ needs.release.outputs.validated_tag }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      staging_manifest_sha256: ${{ needs.release.outputs.staging_manifest_sha256 }}
    secrets:
      CORELINK_CLI_RELEASE_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
      WINDOWS_CODE_SIGNING_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
      WINDOWS_CODE_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
      WINDOWS_CODE_SIGNING_FINGERPRINT: ${{ secrets.WINDOWS_CODE_SIGNING_FINGERPRINT }}
      WINDOWS_CODE_SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODE_SIGNING_SUBJECT }}

  final-manifest:
    name: bind final inventory for selected release mode
    if: >-
      always() && needs.release.result == 'success' &&
      needs.sign-linux.result == 'success' &&
      needs.release-readiness.result == 'success' &&
      ((inputs.release_mode == 'draft-only' && needs.sign-windows.result == 'skipped') ||
       (inputs.release_mode == 'signed-public' && needs.sign-windows.result == 'success'))
    # Successful signer jobs are post-run verification receipts for this exact
    # tag and inventory. The packet gates preflight before release staging.
    needs: [sign-linux, sign-windows, release-readiness, release]
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.manifest.outputs.sha256 }}
      release_mode: ${{ inputs.release_mode }}
    steps:
      - name: Checkout manifest tool
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned GitHub CLI 2.79.0
        shell: bash
        run: |
          set -euo pipefail
          GH_BIN="${RUNNER_TEMP}/corelink-pinned-gh/gh"
          python3 scripts/install_pinned_gh.py --output "${GH_BIN}"
          echo "${RUNNER_TEMP}/corelink-pinned-gh" >> "${GITHUB_PATH}"

      - name: Verify pinned GitHub CLI
        shell: bash
        run: python3 scripts/verify_pinned_gh.py --binary "${RUNNER_TEMP}/corelink-pinned-gh/gh"
      - name: Bind final signed inventory
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ needs.release.outputs.validated_tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          STAGING_MANIFEST_SHA256: ${{ needs.release.outputs.staging_manifest_sha256 }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          RELEASE_API="${RUNNER_TEMP}/corelink-final-manifest-release.json"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${RELEASE_API}"
          mkdir final-assets
          STAGING_ASSET_COUNT="$(python3 - "${RELEASE_API}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(asset.get("name") == "staging-manifest.json" for asset in release.get("assets", [])))
          PY
          )"
          RELEASE_MODE="${{ inputs.release_mode }}"
          case "${RELEASE_MODE}" in
            draft-only)
              if [ "${STAGING_ASSET_COUNT}" != "1" ]; then
                echo "::error::draft-only mode requires exactly one staging manifest and refuses retry/replacement." >&2
                exit 1
              fi
              gh release download "${TAG}" --repo HuGR-Labs/corelink-cli --dir final-assets \
                --pattern 'corelink-*' --pattern checksums.txt --pattern staging-manifest.json
              test "$(shasum -a 256 final-assets/staging-manifest.json | awk '{print $1}')" = "${STAGING_MANIFEST_SHA256}"
              python3 scripts/cli_release_draft_manifest.py create --directory final-assets \
                --output final-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}" \
                --staging-manifest final-assets/staging-manifest.json
              rm -f final-assets/staging-manifest.json
              DRAFT_MANIFEST_SHA256="$(shasum -a 256 final-assets/release-manifest.json | awk '{print $1}')"
              python3 scripts/cli_release_draft_manifest.py verify-manifest \
                --directory final-assets --manifest final-assets/release-manifest.json \
                --public-key docs/internal/gpg-release-pubkey.asc --tag "${TAG}" \
                --source-sha "${SOURCE_SHA}" --manifest-sha256 "${DRAFT_MANIFEST_SHA256}"
              echo "${DRAFT_MANIFEST_SHA256}" > manifest.sha256
              gh release upload "${TAG}" --repo HuGR-Labs/corelink-cli final-assets/release-manifest.json
              ;;
            signed-public)
              case "${STAGING_ASSET_COUNT}" in
                0)
                  gh release download "${TAG}" --repo HuGR-Labs/corelink-cli --dir final-assets \
                    --pattern 'corelink-*' --pattern checksums.txt --pattern release-manifest.json
                  test -f final-assets/release-manifest.json
                  python3 - "final-assets/release-manifest.json" "${STAGING_MANIFEST_SHA256}" "${TAG}" "${SOURCE_SHA}" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if (manifest.get("version") != 2
                  or manifest.get("staging_manifest_sha256") != sys.argv[2]
                  or manifest.get("tag") != sys.argv[3]
                  or manifest.get("source_sha") != sys.argv[4]):
              raise SystemExit("retry manifest is not bound to the staging manifest")
          PY
                  python3 scripts/cli_release_manifest.py verify --directory final-assets \
                    --manifest final-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}"
                  shasum -a 256 final-assets/release-manifest.json | awk '{print $1}' > manifest.sha256
                  ;;
                1)
                  gh release download "${TAG}" --repo HuGR-Labs/corelink-cli --dir final-assets \
                    --pattern 'corelink-*' --pattern checksums.txt --pattern staging-manifest.json
                  test "$(shasum -a 256 final-assets/staging-manifest.json | awk '{print $1}')" = "${STAGING_MANIFEST_SHA256}"
                  python3 scripts/cli_release_manifest.py create --directory final-assets \
                    --output final-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}" \
                    --staging-manifest final-assets/staging-manifest.json
                  rm -f final-assets/staging-manifest.json
                  python3 scripts/cli_release_manifest.py verify --directory final-assets \
                    --manifest final-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}"
                  shasum -a 256 final-assets/release-manifest.json | awk '{print $1}' > manifest.sha256
                  gh release upload "${TAG}" --repo HuGR-Labs/corelink-cli --clobber final-assets/release-manifest.json
                  ;;
                *)
                  echo "::error::authenticated release inventory contains ${STAGING_ASSET_COUNT} staging manifests" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::unknown release mode; refusing to finalize inventory" >&2
              exit 1
              ;;
          esac
          echo "sha256=$(cat manifest.sha256)" >> "${GITHUB_OUTPUT}"

          # The delete is deliberately driven by the authenticated asset ID,
          # not a best-effort local filename.  A zero count is an idempotent
          # retry success; every API error and every duplicate remains fatal.
          RELEASE_API="${RUNNER_TEMP}/corelink-final-manifest-release-after-upload.json"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${RELEASE_API}"
          STAGING_ASSET_COUNT="$(python3 - "${RELEASE_API}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(asset.get("name") == "staging-manifest.json" for asset in release.get("assets", [])))
          PY
          )"
          case "${STAGING_ASSET_COUNT}" in
            0) ;;
            1)
              STAGING_ASSET_ID="$(python3 - "${RELEASE_API}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          ids = [asset["id"] for asset in release.get("assets", []) if asset.get("name") == "staging-manifest.json"]
          if len(ids) != 1:
              raise SystemExit("staging asset inventory changed unexpectedly")
          print(ids[0])
          PY
            )"
            gh api --method DELETE "repos/HuGR-Labs/corelink-cli/releases/assets/${STAGING_ASSET_ID}"
              ;;
            *)
              echo "::error::authenticated release inventory contains ${STAGING_ASSET_COUNT} staging manifests" >&2
              exit 1
              ;;
          esac
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${RELEASE_API}"
          STAGING_ASSET_COUNT="$(python3 - "${RELEASE_API}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(asset.get("name") == "staging-manifest.json" for asset in release["assets"]))
          PY
          )"
          test "${STAGING_ASSET_COUNT}" = "0"

  release-slsa3:
    needs: [final-manifest, release-readiness, release]
    # Called workflows cannot elevate the caller's token permissions. Grant
    # OIDC only to this provenance call; all other release jobs retain the
    # workflow-level contents:read default.
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-slsa3.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      manifest_sha256: ${{ needs.final-manifest.outputs.sha256 }}
      release_mode: ${{ needs.final-manifest.outputs.release_mode }}
      release_id: ${{ needs.release.outputs.release_id }}
    secrets:
      CORELINK_CLI_RELEASE_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}

  publish-release:
    name: publish verified signed release
    needs: [release-slsa3, release-readiness, final-manifest, release, sign-windows]
    if: >-
      always() && inputs.release_mode == 'signed-public' &&
      needs.release.outputs.release_mode == 'signed-public' &&
      needs.release-readiness.result == 'success' && needs.sign-windows.result == 'success' &&
      needs.final-manifest.result == 'success' && needs.release-slsa3.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release inventory verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned GitHub CLI 2.79.0
        shell: bash
        run: |
          set -euo pipefail
          GH_BIN="${RUNNER_TEMP}/corelink-pinned-gh/gh"
          python3 scripts/install_pinned_gh.py --output "${GH_BIN}"
          echo "${RUNNER_TEMP}/corelink-pinned-gh" >> "${GITHUB_PATH}"

      - name: Verify pinned GitHub CLI
        shell: bash
        run: python3 scripts/verify_pinned_gh.py --binary "${RUNNER_TEMP}/corelink-pinned-gh/gh"
      - name: Verify complete authenticated inventory before publication
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ needs.release.outputs.validated_tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          FINAL_MANIFEST_SHA256: ${{ needs.final-manifest.outputs.sha256 }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          API_JSON="${RUNNER_TEMP}/corelink-publish-release.json"
          PUBLISHED="${RUNNER_TEMP}/corelink-publish-assets"
          mkdir -p "${PUBLISHED}"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${API_JSON}"
          gh release download "${TAG}" --repo HuGR-Labs/corelink-cli --dir "${PUBLISHED}" --clobber
          python3 scripts/verify_cli_release_inventory.py \
            --api-json "${API_JSON}" --directory "${PUBLISHED}" \
            --manifest "${PUBLISHED}/release-manifest.json" \
            --provenance "${PUBLISHED}/provenance.intoto.jsonl" \
            --bundle "${PUBLISHED}/provenance.intoto.jsonl.bundle" \
            --tag "${TAG}" --source-sha "${SOURCE_SHA}" \
            --manifest-sha256 "${FINAL_MANIFEST_SHA256}"
      - name: Publish only the verified signed release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ needs.release.outputs.validated_tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          FINAL_MANIFEST_SHA256: ${{ needs.final-manifest.outputs.sha256 }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Re-fetch the complete authenticated inventory and every asset in
          # this same shell, immediately before the irreversible draft=false
          # transition. The earlier verification prepares the files; this
          # second API read + byte download closes the late-reintroduction and
          # replacement window between workflow steps.
          API_JSON="${RUNNER_TEMP}/corelink-publish-release-final.json"
          FINAL_ASSETS="${RUNNER_TEMP}/corelink-publish-assets-final"
          rm -rf "${FINAL_ASSETS}"
          mkdir -p "${FINAL_ASSETS}"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${API_JSON}"
          gh release download "${TAG}" --repo HuGR-Labs/corelink-cli \
            --dir "${FINAL_ASSETS}" --clobber
          python3 scripts/verify_cli_release_inventory.py \
            --api-json "${API_JSON}" \
            --directory "${FINAL_ASSETS}" \
            --manifest "${FINAL_ASSETS}/release-manifest.json" \
            --provenance "${FINAL_ASSETS}/provenance.intoto.jsonl" \
            --bundle "${FINAL_ASSETS}/provenance.intoto.jsonl.bundle" \
            --tag "${TAG}" --source-sha "${SOURCE_SHA}" \
            --manifest-sha256 "${FINAL_MANIFEST_SHA256}"
          python3 - "${FINAL_ASSETS}/release-manifest.json" <<'PY' | while IFS= read -r name; do
          import json
          import sys
          for artifact in json.load(open(sys.argv[1], encoding="utf-8"))["artifacts"]:
              print(artifact["name"])
          PY
          gh attestation verify "${FINAL_ASSETS}/${name}" \
              --bundle "${FINAL_ASSETS}/provenance.intoto.jsonl.bundle" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-slsa3.yml" \
              --source-ref "refs/tags/${TAG}" --source-digest "${SOURCE_SHA}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          done
          gh api --method PATCH "repos/HuGR-Labs/corelink-cli/releases/${RELEASE_ID}" \
            --field draft=false > "${API_JSON}"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state published > "${API_JSON}"

  verify-draft-release:
    name: verify exact draft bytes and unsigned Windows state
    needs: [release-slsa3, release-readiness, final-manifest, release]
    if: >-
      always() && inputs.release_mode == 'draft-only' &&
      needs.release.outputs.release_mode == 'draft-only' &&
      needs.release-readiness.result == 'success' &&
      needs.final-manifest.result == 'success' && needs.release-slsa3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact release source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.validated_tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned GitHub CLI 2.79.0
        shell: bash
        run: |
          set -euo pipefail
          GH_BIN="${RUNNER_TEMP}/corelink-pinned-gh/gh"
          python3 scripts/install_pinned_gh.py --output "${GH_BIN}"
          echo "${RUNNER_TEMP}/corelink-pinned-gh" >> "${GITHUB_PATH}"

      - name: Verify pinned GitHub CLI
        shell: bash
        run: python3 scripts/verify_pinned_gh.py --binary "${RUNNER_TEMP}/corelink-pinned-gh/gh"
      - name: Download exact draft candidate and verify signatures, manifest, and provenance
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ needs.release.outputs.validated_tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          MANIFEST_SHA256: ${{ needs.final-manifest.outputs.sha256 }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          API_JSON="${RUNNER_TEMP}/corelink-draft-release.json"
          ASSETS="${RUNNER_TEMP}/corelink-draft-assets"
          mkdir -p "${ASSETS}"
          python3 scripts/cli_release_api.py --repo HuGR-Labs/corelink-cli \
            --tag "${TAG}" --release-id "${RELEASE_ID}" --expected-state draft > "${API_JSON}"
          gh release download "${TAG}" --repo HuGR-Labs/corelink-cli --dir "${ASSETS}"
          python3 scripts/verify_cli_release_draft.py \
            --api-json "${API_JSON}" --directory "${ASSETS}" \
            --manifest "${ASSETS}/release-manifest.json" \
            --provenance "${ASSETS}/provenance.intoto.jsonl" \
            --bundle "${ASSETS}/provenance.intoto.jsonl.bundle" \
            --public-key docs/internal/gpg-release-pubkey.asc \
            --tag "${TAG}" --source-sha "${SOURCE_SHA}" \
            --manifest-sha256 "${MANIFEST_SHA256}"
          python3 - "${ASSETS}/release-manifest.json" <<'PY' | while IFS= read -r name; do
          import json, sys
          for entry in json.load(open(sys.argv[1], encoding="utf-8"))["artifacts"]:
              print(entry["name"])
          PY
            gh attestation verify "${ASSETS}/${name}" \
              --bundle "${ASSETS}/provenance.intoto.jsonl.bundle" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-slsa3.yml" \
              --source-ref "refs/tags/${TAG}" --source-digest "${SOURCE_SHA}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          done
