name: i2587 GPG audit credentialless contract

on:
  pull_request:
    paths:
      - '.github/workflows/i1664-gpg-release-identity-audit.yml'
      - '.github/workflows/i2587-gpg-audit-ci.yml'
      - 'scripts/run_i2587_gpg_audit.py'
      - 'scripts/verify_i2587_gpg_audit.py'
      - 'tests/test_i2587_gpg_audit.py'
      - 'tests/fixtures/i2571-release-pubkey.asc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/i1664-gpg-release-identity-audit.yml'
      - '.github/workflows/i2587-gpg-audit-ci.yml'
      - 'scripts/run_i2587_gpg_audit.py'
      - 'scripts/verify_i2587_gpg_audit.py'
      - 'tests/test_i2587_gpg_audit.py'
      - 'tests/fixtures/i2571-release-pubkey.asc'

permissions:
  contents: read

jobs:
  contract:
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind the hosted run to the exact candidate head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - name: Run synthetic GPG identity, access, receipt, and adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/verify_i2587_gpg_audit.py --self-test
          python3 -S -m unittest -q tests/test_i2587_gpg_audit.py
