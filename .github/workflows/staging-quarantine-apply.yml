name: staging quarantine apply (#1700)

# This is the only provider-write path for the quarantined staging phase. It
# deploys isolated Workers and binds staging-only secret names, but never
# creates DNS records or publishes Worker routes. Health and route publication
# remain separately reviewed operations.
on:
  pull_request:
    paths:
      - '.github/workflows/staging-quarantine-apply.yml'
      - 'infra/staging/topology.json'
      - 'scripts/render_staging_wrangler.py'
      - 'scripts/staging_bootstrap_provider.py'
      - 'tests/test_render_staging_wrangler.py'
      - 'tests/test_staging_bootstrap_provider.py'
      - 'tests/test_staging_quarantine_apply_contract.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose the protected #1700 operation'
        required: true
        type: choice
        options:
          - scope-probe
          - quarantine-apply
          - update-existing-secrets
      expected_sha:
        description: 'Exact protected main commit SHA to operate on'
        required: true
        type: string
      confirm:
        description: 'Type the mode-specific confirmation phrase'
        required: true
        type: string
      enable_b216_dsr_alert:
        description: 'Explicitly bind the approved B-216 staging alert endpoint and bearer to corelink-signup-staging'
        required: false
        default: false
        type: boolean
      b216_authority_run_id:
        description: 'Successful fixed-receiver readback run ID; required only for B-216 alert opt-in'
        required: false
        type: string
      b216_authority_receipt_sha256:
        description: 'SHA-256 of the redacted receiver readback artifact receipt'
        required: false
        type: string
      b216_owner_ack_ref:
        description: 'Issue #1678 comment URL recording the owner-approved reachable response path'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: issue-1700-staging-custom-domain
  cancel-in-progress: false

jobs:
  contract:
    name: credentialless quarantine-apply contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify quarantine-only workflow contract
        run: |
          set -euo pipefail
          python3 scripts/verify_staging_target.py
          python3 scripts/verify_staging_topology_contract.py --expect ready
          python3 -S -m unittest -v \
            tests/test_render_staging_wrangler.py \
            tests/test_staging_bootstrap_provider.py \
            tests/test_staging_quarantine_apply_contract.py

  scope-probe:
    name: protected staging token-scope probe
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'scope-probe' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    needs: contract
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      CF_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Confirm exact protected scope probe
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'scope-probe-staging-1700'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Checkout the exact protected dispatch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read token capabilities without creating a token
        run: |
          set -euo pipefail
          test -n "$CF_BOOTSTRAP_ADMIN_TOKEN"
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["CF_BOOTSTRAP_ADMIN_TOKEN"]

          def request(path: str, method: str = "GET", body: bytes | None = None) -> tuple[int, object]:
              request = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None

          groups_status, groups_payload = request("user/tokens/permission_groups")
          # Deliberately malformed JSON cannot create a token. A 400 response
          # is recorded as the provider's accepted write-endpoint probe; 401
          # and 403 remain an explicit denial.
          write_status, _ = request("user/tokens", "POST", b"{")
          groups = groups_payload.get("result", []) if isinstance(groups_payload, dict) else []
          wanted = {"Workers Scripts Edit", "Workers KV Storage Edit", "Workers R2 Storage Edit", "D1 Edit", "Queues Edit", "Workers Routes Read", "Zone Read", "Account API Tokens Edit"}
          selected = sorted(
              (
                  {"id": item.get("id"), "name": item.get("name")}
                  for item in groups
                  if isinstance(item, dict) and item.get("name") in wanted
              ),
              key=lambda item: str(item["name"]),
          )
          print(json.dumps({
              "cf_permission_groups_readable": groups_status == 200,
              "cf_api_tokens_write_endpoint_authorized": write_status == 400,
              "cf_permission_groups": selected,
              "github_environment_write_probe": "next-mode-required",
          }, sort_keys=True))
          if groups_status != 200 or write_status != 400:
              raise SystemExit("scope probe denied; no token was created")
          PY
          unset CF_BOOTSTRAP_ADMIN_TOKEN

  quarantine-apply:
    name: protected staging quarantine apply
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'quarantine-apply' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    needs: contract
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_API_TOKEN }}
      STAGING_CF_API_TOKEN: ${{ secrets.STAGING_CF_API_TOKEN }}
      STAGING_CF_ACCOUNT_ID: ${{ secrets.STAGING_CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      STAGING_R2_S3_ENDPOINT: ${{ secrets.STAGING_R2_S3_ENDPOINT }}
      CLERK_ISSUER_URL: ${{ secrets.STAGING_CLERK_ISSUER_URL }}
      CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.STAGING_CLERK_WEBHOOK_SECRET }}
      ERASURE_SALT_KEY: ${{ secrets.STAGING_ERASURE_SALT_KEY }}
      DSR_DLQ_REDRIVE_AUTH_KEY: ${{ secrets.STAGING_DSR_DLQ_REDRIVE_AUTH_KEY }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Confirm the quarantined operation
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'quarantine-apply-staging-1700'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Checkout the protected dispatch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recheck exact protected checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify the staging boundary and required input names
        run: |
          set -euo pipefail
          python3 scripts/verify_staging_target.py
          python3 scripts/verify_staging_topology_contract.py --expect ready
          test "$(jq -r '.deployment_state' infra/staging/topology.json)" = unprovisioned
          required=(
            STAGING_CF_API_TOKEN STAGING_CF_ACCOUNT_ID
            CF_ZONE_ID STAGING_R2_S3_ENDPOINT CLERK_ISSUER_URL CLERK_SECRET_KEY
            CLERK_WEBHOOK_SECRET ERASURE_SALT_KEY DSR_DLQ_REDRIVE_AUTH_KEY
            R2_S3_ACCESS_KEY_ID R2_S3_SECRET_ACCESS_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            printf '::error::Missing required staging input names: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install locked Wrangler dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Confirm provider ownership and empty canonical routes
        run: |
          set -euo pipefail
          python3 scripts/staging_bootstrap_provider.py --phase preflight

      - name: Render the three isolated no-route Worker configs
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/staging-config"
          for worker in root signup synthetic; do
            python3 scripts/render_staging_wrangler.py \
              --phase bootstrap --worker "$worker" \
              --output "$RUNNER_TEMP/staging-config/$worker.toml"
            python3 - "$RUNNER_TEMP/staging-config/$worker.toml" <<'PY'
          import sys, tomllib
          config = tomllib.load(open(sys.argv[1], "rb"))
          if not config.get("name", "").endswith("-staging"):
              raise SystemExit("quarantine config is not staging scoped")
          if config.get("workers_dev") is not False:
              raise SystemExit("quarantine config must disable workers.dev")
          if any(key in config for key in ("routes", "route", "custom_domain")):
              raise SystemExit("quarantine config must have no public routes")
          PY
          done

      - name: Deploy all three Workers into quarantine
        run: |
          set -euo pipefail
          bash scripts/verify-signup-worker-dsr-redrive-schema.sh \
            --config "$RUNNER_TEMP/staging-config/signup.toml"
          for worker in synthetic root signup; do
            pnpm exec wrangler deploy --config "$RUNNER_TEMP/staging-config/$worker.toml"
          done

      - name: Confirm deployed Workers remain route free
        run: |
          set -euo pipefail
          python3 scripts/staging_bootstrap_provider.py --phase quarantine

      - name: Bind and read back only staging Worker secret names
        run: |
          set -euo pipefail
          umask 077
          material="$RUNNER_TEMP/staging-generated"
          mkdir -m 700 "$material"
          trap 'find "$material" -type f -exec shred -u -- {} + 2>/dev/null || true' EXIT
          for name in CORELINK_INTERNAL_AUTH_KEY CORELINK_ERASE_AUTH_KEY CORELINK_ADMIN_AUTH_KEY PAT_SIGNING_KEY; do
            openssl rand -hex 32 > "$material/$name"
          done
          bind_env_secret() {
            local config="$1" name="$2" variable="$3"
            printf '%s' "${!variable}" | pnpm exec wrangler secret put "$name" \
              --config "$config" >/dev/null
          }
          bind_generated_secret() {
            local config="$1" name="$2"
            pnpm exec wrangler secret put "$name" --config "$config" < "$material/$name" >/dev/null
          }
          root="$RUNNER_TEMP/staging-config/root.toml"
          signup="$RUNNER_TEMP/staging-config/signup.toml"
          receiver="$RUNNER_TEMP/staging-config/synthetic.toml"
          for name in CORELINK_INTERNAL_AUTH_KEY CORELINK_ADMIN_AUTH_KEY CORELINK_ERASE_AUTH_KEY PAT_SIGNING_KEY; do
            bind_generated_secret "$root" "$name"
          done
          bind_generated_secret "$signup" CORELINK_INTERNAL_AUTH_KEY
          bind_generated_secret "$signup" CORELINK_ERASE_AUTH_KEY
          bind_env_secret "$root" CLOUDFLARE_ACCOUNT_ID STAGING_CF_ACCOUNT_ID
          for item in \
            "$root:CLERK_ISSUER_URL:CLERK_ISSUER_URL" \
            "$root:CLERK_SECRET_KEY:CLERK_SECRET_KEY" \
            "$root:R2_S3_ACCESS_KEY_ID:R2_S3_ACCESS_KEY_ID" \
            "$root:R2_S3_SECRET_ACCESS_KEY:R2_S3_SECRET_ACCESS_KEY" \
            "$signup:CLERK_SECRET_KEY:CLERK_SECRET_KEY" \
            "$signup:CLERK_WEBHOOK_SECRET:CLERK_WEBHOOK_SECRET" \
            "$signup:ERASURE_SALT_KEY:ERASURE_SALT_KEY" \
            "$signup:DSR_DLQ_REDRIVE_AUTH_KEY:DSR_DLQ_REDRIVE_AUTH_KEY"; do
            IFS=: read -r config name variable <<< "$item"
            bind_env_secret "$config" "$name" "$variable"
          done
          verify_names() {
            local config="$1" expected="$2" worker_names="$RUNNER_TEMP/secret-names.json"
            pnpm exec wrangler secret list --config "$config" > "$worker_names"
            jq -r '.[].name' "$worker_names" | sort -u > "$RUNNER_TEMP/actual-secret-names.txt"
            printf '%s\n' "$expected" | sort -u > "$RUNNER_TEMP/expected-secret-names.txt"
            diff -u "$RUNNER_TEMP/expected-secret-names.txt" "$RUNNER_TEMP/actual-secret-names.txt"
          }
          verify_names "$root" $'CLERK_ISSUER_URL\nCLERK_SECRET_KEY\nCLOUDFLARE_ACCOUNT_ID\nCORELINK_ADMIN_AUTH_KEY\nCORELINK_ERASE_AUTH_KEY\nCORELINK_INTERNAL_AUTH_KEY\nPAT_SIGNING_KEY\nR2_S3_ACCESS_KEY_ID\nR2_S3_SECRET_ACCESS_KEY'
          verify_names "$signup" $'CLERK_SECRET_KEY\nCLERK_WEBHOOK_SECRET\nCORELINK_ERASE_AUTH_KEY\nCORELINK_INTERNAL_AUTH_KEY\nDSR_DLQ_REDRIVE_AUTH_KEY\nERASURE_SALT_KEY'
          verify_names "$receiver" ''

      - name: Capture redacted quarantined-provider readback
        run: |
          set -euo pipefail
          python3 scripts/staging_bootstrap_provider.py --phase quarantine \
            | tee "$RUNNER_TEMP/staging-quarantine-receipt.json"

      - name: Upload redacted quarantine receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-quarantine-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-quarantine-receipt.json
          retention-days: 30
          if-no-files-found: warn

  update-existing-secrets:
    name: protected staging existing Worker secret update
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'update-existing-secrets' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    environment: staging
    timeout-minutes: 45
    env:
      STAGING_CF_WORKER_API_TOKEN: ${{ secrets.STAGING_CF_WORKER_API_TOKEN }}
      STAGING_CF_ROUTE_READ_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
      STAGING_CF_ACCOUNT_ID: ${{ secrets.STAGING_CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      STAGING_R2_S3_ENDPOINT: ${{ secrets.STAGING_R2_S3_ENDPOINT }}
      STAGING_CLERK_ISSUER_URL: ${{ secrets.STAGING_CLERK_ISSUER_URL }}
      STAGING_CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
      STAGING_CLERK_WEBHOOK_SECRET: ${{ secrets.STAGING_CLERK_WEBHOOK_SECRET }}
      STAGING_ERASURE_SALT_KEY: ${{ secrets.STAGING_ERASURE_SALT_KEY }}
      STAGING_DSR_DLQ_REDRIVE_AUTH_KEY: ${{ secrets.STAGING_DSR_DLQ_REDRIVE_AUTH_KEY }}
      STAGING_R2_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_S3_ACCESS_KEY_ID }}
      STAGING_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_S3_SECRET_ACCESS_KEY }}
      ENABLE_B216_DSR_ALERT: ${{ inputs.enable_b216_dsr_alert }}
    steps:
      - name: Confirm exact protected existing-secret update
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          B216_AUTHORITY_RUN_ID: ${{ inputs.b216_authority_run_id }}
          B216_AUTHORITY_RECEIPT_SHA256: ${{ inputs.b216_authority_receipt_sha256 }}
          B216_OWNER_ACK_REF: ${{ inputs.b216_owner_ack_ref }}
          STAGING_DSR_DLQ_ALERT_ENDPOINT: ${{ inputs.enable_b216_dsr_alert == true && secrets.STAGING_DSR_DLQ_ALERT_ENDPOINT || '' }}
          STAGING_DSR_DLQ_ALERT_AUTH_TOKEN: ${{ inputs.enable_b216_dsr_alert == true && secrets.STAGING_DSR_DLQ_ALERT_AUTH_TOKEN || '' }}
          STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST: ${{ vars.STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_B216_DSR_ALERT" = 'true' ]; then
            test "$CONFIRM" = 'update-existing-secrets-staging-1700-b216-alert'
            test -n "$STAGING_DSR_DLQ_ALERT_ENDPOINT"
            test -n "$STAGING_DSR_DLQ_ALERT_AUTH_TOKEN"
            [[ "$B216_AUTHORITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$B216_AUTHORITY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$B216_OWNER_ACK_REF" =~ ^https://github\.com/HuGR-dev/corelink-server/issues/1678#issuecomment-[1-9][0-9]*$ ]]
            test -n "$STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST"
          else
            test "$CONFIRM" = 'update-existing-secrets-staging-1700'
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test -n "$STAGING_CF_WORKER_API_TOKEN"
          test -n "$STAGING_CF_ROUTE_READ_TOKEN"
          test -n "$STAGING_CF_ACCOUNT_ID"
          test -n "$CF_ZONE_ID"
          test -n "$STAGING_R2_S3_ENDPOINT"
          test "$STAGING_CF_WORKER_API_TOKEN" != "$STAGING_CF_ROUTE_READ_TOKEN"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact protected target and inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_staging_target.py
          python3 scripts/verify_staging_topology_contract.py --expect ready
          test "$(jq -r '.deployment_state' infra/staging/topology.json)" = unprovisioned

      - name: Verify exact successful fixed-receiver readback run
        if: ${{ inputs.enable_b216_dsr_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_RUN_ID: ${{ inputs.b216_authority_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/HuGR-dev/corelink-server/actions/runs/$AUTHORITY_RUN_ID" \
            > "$RUNNER_TEMP/b216-authority-run.json"
          python3 - "$RUNNER_TEMP/b216-authority-run.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              row.get("event") != "workflow_dispatch"
              or row.get("head_branch") != "main"
              or row.get("head_sha") != os.environ["GITHUB_SHA"]
              or row.get("status") != "completed"
              or row.get("conclusion") != "success"
              or ".github/workflows/b216-receiver-deploy-nonprod.yml@refs/heads/main" not in row.get("path", "")
          ):
              raise SystemExit("B-216 authority run is not the exact successful main readback workflow")
          PY

      - name: Download exact B-216 receiver readback receipt
        if: ${{ inputs.enable_b216_dsr_alert }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b216-receiver-readback-${{ inputs.b216_authority_run_id }}
          path: ${{ runner.temp }}/b216-authority
          repository: ${{ github.repository }}
          run-id: ${{ inputs.b216_authority_run_id }}
          github-token: ${{ github.token }}

      - name: Verify owner acknowledgement for exact endpoint authority
        if: ${{ inputs.enable_b216_dsr_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_ACK_REF: ${{ inputs.b216_owner_ack_ref }}
          RECEIPT_SHA256: ${{ inputs.b216_authority_receipt_sha256 }}
          RECEIVER_HOST: ${{ vars.STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST }}
        run: |
          set -euo pipefail
          comment_id="${OWNER_ACK_REF##*issuecomment-}"
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/HuGR-dev/corelink-server/issues/comments/$comment_id" \
            > "$RUNNER_TEMP/b216-owner-ack.json"
          python3 - "$RUNNER_TEMP/b216-owner-ack.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          body = row.get("body", "")
          required = (
              "B-216 staging response-path acknowledgement",
              f"Source SHA: {os.environ['GITHUB_SHA']}",
              "Receiver account: 51284495e71acdb5a7677e7383ab026b",
              "Receiver worker: corelink-dsr-b216-alert-receiver-20260927",
              f"Readback receipt SHA-256: {os.environ['RECEIPT_SHA256']}",
              f"Authorized endpoint host: {os.environ['RECEIVER_HOST']}",
              "Acknowledged response path:",
          )
          if row.get("issue_url") != "https://api.github.com/repos/HuGR-dev/corelink-server/issues/1678":
              raise SystemExit("B-216 owner acknowledgement is not on issue #1678")
          if row.get("html_url") != os.environ["OWNER_ACK_REF"]:
              raise SystemExit("B-216 owner acknowledgement URL does not match")
          if row.get("author_association") != "OWNER":
              raise SystemExit("B-216 endpoint authority acknowledgement must come from a repository owner")
          if not isinstance(body, str) or any(line not in body for line in required):
              raise SystemExit("B-216 owner acknowledgement does not bind the exact receiver path")
          response_path = body.split("Acknowledged response path:", 1)[1].strip()
          if not response_path:
              raise SystemExit("B-216 owner acknowledgement response path is empty")
          PY

      - name: Install locked Wrangler dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Render exact no-route configs for the existing Workers
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/staging-config"
          for worker in root signup synthetic; do
            python3 scripts/render_staging_wrangler.py \
              --phase bootstrap --worker "$worker" \
              --output "$RUNNER_TEMP/staging-config/$worker.toml"
          done

      - name: Add only missing secrets with exact version rollback guards
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          B216_AUTHORITY_RECEIPT_SHA256: ${{ inputs.b216_authority_receipt_sha256 }}
          B216_OWNER_ACK_REF: ${{ inputs.b216_owner_ack_ref }}
          STAGING_DSR_DLQ_ALERT_ENDPOINT: ${{ inputs.enable_b216_dsr_alert == true && secrets.STAGING_DSR_DLQ_ALERT_ENDPOINT || '' }}
          STAGING_DSR_DLQ_ALERT_AUTH_TOKEN: ${{ inputs.enable_b216_dsr_alert == true && secrets.STAGING_DSR_DLQ_ALERT_AUTH_TOKEN || '' }}
          STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST: ${{ vars.STAGING_DSR_DLQ_ALERT_ENDPOINT_HOST }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ENABLE_B216_DSR_ALERT" = 'true' ]; then
            test "$CONFIRM" = 'update-existing-secrets-staging-1700-b216-alert'
            args+=(--enable-b216-dsr-alert)
            args+=(--b216-authority-receipt "$RUNNER_TEMP/b216-authority/b216-receiver-readback-receipt.json")
            args+=(--b216-authority-sha256 "$B216_AUTHORITY_RECEIPT_SHA256")
            args+=(--b216-owner-ack-ref "$B216_OWNER_ACK_REF")
          else
            test "$CONFIRM" = 'update-existing-secrets-staging-1700'
          fi
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          python3 scripts/staging_bootstrap_provider.py \
            --phase update-existing-apply \
            --config-dir "$RUNNER_TEMP/staging-config" \
            --receipt "$RUNNER_TEMP/staging-existing-secrets-receipt.json" \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            "${args[@]}"

      - name: Upload redacted existing-secret update receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-existing-secrets-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-existing-secrets-receipt.json
          retention-days: 30
          if-no-files-found: warn
