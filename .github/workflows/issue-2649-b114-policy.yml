name: issue-2649 B-114 receipt policy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
  pull_request:
    paths:
      - docs/campaigns/remediation/B-114-corelink-runners-receipt.md
      - scripts/backlog_verify.py
      - scripts/check_b114_cross_repo.py
      - scripts/backlog_ledger_successor.py
      - tests/test_backlog_ledger_successor.py
      - .github/workflows/issue-2649-b114-policy.yml

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && github.repository == 'HuGR-dev/corelink-server' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - run: python3 scripts/check_b114_cross_repo.py --self-test
      - run: python3 scripts/check_b114_cross_repo.py --receipt
      - if: github.event_name == 'workflow_dispatch' && github.repository == 'HuGR-dev/corelink-server' && github.ref == 'refs/heads/main'
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
          .venv/bin/python3 -m pytest -q tests/test_backlog_ledger_successor.py -k v0010
