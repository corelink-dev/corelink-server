name: docs — CF Worker deploy

# Deploys apps/docs (Docusaurus 3) as a Cloudflare Worker with Static Assets,
# mounted at the CANONICAL product path `humangr.com/corelink/docs` (NOT a
# subdomain), on every push to main touching the apps/docs subtree, plus manual
# workflow_dispatch.
#
# Why a Worker (not Pages): Cloudflare Pages binds to a HOST, so it cannot serve
# on a path prefix of an existing zone. The docs must live under the product
# path (`/corelink/docs`) to match the #804 canonical migration, so they are
# served by a Worker with a Static-Assets binding whose zone route is DECLARED
# IN-REPO (apps/docs/wrangler.toml) — versioned and PR-reviewed, unlike the old
# dashboard-managed route. `/corelink/docs/*` is more specific than the admin-ui
# app's `/corelink/*`, so Cloudflare matches it first and the app is untouched.
#
# Build parity: mirrors the `build` job of docs-ci.yml EXACTLY (same pnpm
# version, node version, install command, and `pnpm build`) so the artifact we
# deploy is byte-for-byte what CI gates. Docusaurus emits the static site to
# apps/docs/build; `wrangler deploy` uploads it via the ASSETS binding.
#
# Required GH Secrets (same pair as admin-ui-deploy.yml):
#   CF_API_TOKEN   — Cloudflare API token. MUST include "Workers Scripts: Edit"
#                    AND "Workers Routes: Edit" (to bind the zone route).
#   CF_ACCOUNT_ID  — Cloudflare account ID (HumanGuardrail / gmhelmold).
#
# All actions are SHA-pinned per the action-sha-audit gate (S-12 supply-chain).

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false # don't cancel an in-flight deploy; queue instead

env:
  PNPM_VERSION: "10.32.1"
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: build + deploy to CF Pages
    # Production deploy: only the server repository (privileged literal ID,
    # rendered by scripts/sync_workflow_repository_guards.py --write), only
    # protected main, and only behind the production environment's reviewers.
    if: github.repository_id == '0' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    # Use GitHub-hosted Ubuntu for this wrangler-only deploy (no docker).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        # Local composite (offline-first) — mirrors docs-ci.yml.
        uses: ./.github/actions/setup-pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm`; this workflow does not use setup-node's pnpm cache.

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Same build command docs-ci.yml gates. Emits the static site to
      # apps/docs/build.
      - name: Build
        run: pnpm build

      # wrangler 4.95.0 requires Node >= 22; the build above deliberately runs on
      # Node 20 for byte-for-byte parity with the docs-ci `build` gate. Re-pin the
      # Node runtime to 22 for the deploy phase only — the built static site in
      # apps/docs/build is runtime-agnostic, so switching Node after the build
      # does not change what ships.
      - name: Set up Node.js 22 (wrangler runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # wrangler is not a dependency of apps/docs, so install it globally.
      # Pinned exact to match admin-ui-deploy.yml / cf-deploy-prod.yml (v3
      # cannot parse [[env.*.containers]] arrays; v4 is the supported line).
      - name: Install wrangler
        working-directory: .
        run: npm install -g wrangler@4.95.0

      # Publish the Worker + Static Assets and bind the zone route. Uses
      # apps/docs/wrangler.toml (assets = ./build, route = humangr.com/corelink/docs*).
      - name: Deploy Worker (Static Assets)
        working-directory: apps/docs
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Print deployment URL
        if: success()
        run: |
          echo "Deployed Worker: corelink-docs"
          echo "Production URL: https://humangr.com/corelink/docs"
          echo "Commit: ${{ github.sha }}"
