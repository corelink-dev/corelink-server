name: issue 2374 hosted policy proof

# Run original write-bearing automation only against a local deny-all GitHub
# boundary. The sole real workload is the read-only coverage receipt below.
on:
  pull_request:
    paths:
      - ".github/workflows/bot-pr-has-checks.yml"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
      - ".github/workflows/dependabot-policy-trust-boundary.yml"
      - ".github/workflows/dependabot-policy.yml"
      - ".github/workflows/lockfile-diff.yml"
      - ".github/workflows/permission-matrix.yml"
      - ".github/workflows/pr-labels.yml"
      - ".github/workflows/stale.yml"
      - ".github/workflows/welcome-first-pr.yml"
      - ".github/workflows/issue-2374-hosted-policy-proof.yml"
      - "scripts/coverage.sh"
      - "scripts/test_coverage_summary_command.py"
      - "scripts/test_dependabot_policy_trust_boundary.sh"
      - "scripts/verify_issue_2374_hosted_proof.py"

permissions:
  contents: read

concurrency:
  group: issue-2374-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration-contract:
    name: exact inventory, immutable baseline, and denied write paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned labeler action source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: actions/labeler
          ref: b8dd2d9be0f68b860e7dae5dae7d772984eacd6d
          path: _proof_actions/labeler
          persist-credentials: false

      - name: Checkout pinned stale action source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: actions/stale
          ref: 1e223db275d687790206a7acac4d1a11bd6fe629
          path: _proof_actions/stale
          persist-credentials: false

      - name: Checkout pinned sticky comment action source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: marocchino/sticky-pull-request-comment
          ref: 5770ad5eb8f42dd2c4f34da00c94c5381e49af88
          path: _proof_actions/sticky
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain for original local checks
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned workspace toolchain
        with:
          toolchain: 1.91.1

      - name: Install workflow-pinned cargo-deny
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny@0.19.8

      - name: Install pinned YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint

      - name: Lint the migrated workflows and proof workflow
        run: >-
          "${RUNNER_TEMP}/actionlint/actionlint" -color -config-file .actionlint.yaml
          .github/workflows/bot-pr-has-checks.yml
          .github/workflows/coverage.yml
          .github/workflows/dependabot-auto-merge.yml
          .github/workflows/dependabot-policy-trust-boundary.yml
          .github/workflows/dependabot-policy.yml
          .github/workflows/lockfile-diff.yml
          .github/workflows/permission-matrix.yml
          .github/workflows/pr-labels.yml
          .github/workflows/stale.yml
          .github/workflows/welcome-first-pr.yml
          .github/workflows/issue-2374-hosted-policy-proof.yml

      - name: Run coverage command regression
        run: python3 scripts/test_coverage_summary_command.py

      - name: Execute original write paths against local GitHub mocks
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -S scripts/verify_issue_2374_hosted_proof.py
          --root . --baseline-root _baseline --actions-root _proof_actions
          --expected-head "$EXPECTED_SHA"

  coverage-receipt:
    name: hosted coverage workload and same-run artifact receipt
    needs: migration-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain (stable + llvm-tools-preview)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.6.16

      - name: Run unchanged coverage entrypoint
        run: bash scripts/coverage.sh

      - name: Validate same-run coverage outputs
        run: |
          set -euo pipefail
          test -s target/coverage/SUMMARY.txt
          test -s target/coverage/html/index.html
          echo "Coverage completed for candidate $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum target/coverage/SUMMARY.txt target/coverage/html/index.html >> "$GITHUB_STEP_SUMMARY"

      - name: Retain same-run report receipt
        id: coverage-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-2374-coverage-${{ github.event.pull_request.number }}
          path: |
            target/coverage/SUMMARY.txt
            target/coverage/html/index.html
          retention-days: 90
          if-no-files-found: error

      - name: Verify the uploaded coverage receipt
        env:
          COVERAGE_ARTIFACT_ID: ${{ steps.coverage-artifact.outputs.artifact-id }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          COVERAGE_ARTIFACT_DIGEST: ${{ steps.coverage-artifact.outputs.artifact-digest }}
        run: python3 -S scripts/verify_issue_2374_hosted_proof.py --root . --verify-coverage-receipt
