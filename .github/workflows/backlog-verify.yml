# BACKLOG validation is a BASE-owned data gate. The PR checkout is opaque input:
# no candidate action, verifier, shell fragment, or token-bearing command runs
# on the persistent runner. Push/schedule semantics run only from the immutable
# main checkout; the PR lane remains structural/data-only.
name: backlog-verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["**"]
  push:
    branches: [main]
    paths: ["**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "ci-backlog-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate data (immutable event SHA) # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout # reason: candidate is data-only; BASE checker runs separately; ADR-0101
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: _candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout BASE control tree (immutable event SHA) # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout # reason: immutable BASE control tree; ADR-0101
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _base
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate as data with BASE checker
        working-directory: _base
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/_candidate
          TRUSTED_ROOT: ${{ github.workspace }}/_base
        run: python3 scripts/backlog_verify.py --candidate-file "$CANDIDATE_ROOT/BACKLOG.md" --trusted-file "$TRUSTED_ROOT/BACKLOG.md" --candidate-root "$CANDIDATE_ROOT" --trusted-root "$TRUSTED_ROOT"
      - name: Prove BASE checker mutation teeth
        working-directory: _base
        run: python3 -m unittest -q tests/test_backlog_verify_trust_boundary.py
      - name: Install CI Python dependencies for B-314 tests
        working-directory: _base
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
          .venv/bin/python3 -m pytest --version
          echo "$GITHUB_WORKSPACE/_base/.venv/bin" >> "$GITHUB_PATH"
      - name: Prove BASE B-314 owner-gate mutation teeth
        working-directory: _base
        run: |
          python3 -S scripts/verify_b314_gdpr_sigstore.py --self-test
          python3 -m pytest -q tests/test_verify_b314_gdpr_sigstore.py
  trusted_semantic:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - name: Checkout trusted main (immutable event SHA)
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: _base
          fetch-depth: 0
          persist-credentials: false
      - name: Execute trusted main semantic checks
        working-directory: _base
        run: python3 scripts/backlog_verify.py --trusted-semantic --exclude-auth-checks
      - name: Execute authenticated Dependabot semantic checks
        working-directory: _base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog_verify.py --trusted-semantic --auth-only
      - name: Execute B-046 Object-Lock contract and mutation checks
        working-directory: _base
        run: |
          python3 scripts/verify_b046_object_lock_probe.py
          python3 -m unittest -q tests/test_verify_b046_object_lock_probe.py
          test -f crates/corelink-container/src/routes/dsr/adapter_r2_cas_legalhold.rs
          test -f migrations/d1/0102_cas_retention.sql
