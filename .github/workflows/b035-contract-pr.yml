name: B-035 TLS contract PR guard

# The repository-level B-035 workflow is manually disabled in this repository.
# This PR guard keeps the truthful TLS inventory and mutation contract hosted
# and credential-free; it never calls a provider or changes provider state.
on:
  pull_request:
    paths:
      - "legal/dpa/v1.0.0.en-US.md"
      - "legal/dpa/v1.0.0.pt-BR.md"
      - "legal/dpa/v1.0.0.es-419.md"
      - "legal/dpa/STANDARD-CONTRACTUAL-CLAUSES-EU.md"
      - "legal/dpa/SUB-PROCESSOR-COMMITMENTS.md"
      - "legal/privacy-notice/v1.0.0/en-US.md"
      - "legal/privacy-notice/v1.0.0/pt-BR.md"
      - "legal/privacy-notice/v1.0.0/es-MX.md"
      - "scripts/verify_b035_tls_surfaces.py"
      - "scripts/probe_b035_tls_handshakes.py"
      - "tests/test_verify_b035_tls_surfaces.py"
      - "reports/b035/**"
      - ".github/workflows/b035-contract-pr.yml"

permissions:
  contents: read

jobs:
  b035-contract:
    name: static and mutation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fail-closed mutation behavior
        run: python3 scripts/verify_b035_tls_surfaces.py --self-test
      - name: Run focused B-035 contract tests
        run: python3 -m unittest -v tests/test_verify_b035_tls_surfaces.py
      - name: Emit redacted static evidence
        run: python3 scripts/verify_b035_tls_surfaces.py --json
      - name: Validate read-only TLS probe source inventory
        run: python3 scripts/probe_b035_tls_handshakes.py --inventory-only
