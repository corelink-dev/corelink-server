name: issue #1666 hosted mutants evidence contract

on:
  pull_request:
    paths:
      - ".github/workflows/issue-1863-mutants-hosted.yml"
      - ".github/workflows/issue-1666-mutants-evidence-contract.yml"
      - "scripts/verify_i1666_mutants_evidence.py"
      - "scripts/verify_i2457_mutants_shards.py"
      - "tests/test_verify_i1666_mutants_evidence.py"
      - "tests/test_i2457_mutants_shards.py"
      - ".github/workflows/endurance-2h-nightly.yml"
      - "scripts/verify_b113_lane_population.py"
      - "tests/load/k6/scenarios/endurance-24h.js"
      - "scripts/verify_i1687_endurance_lane.py"
      - "scripts/test_i1687_endurance_lane.py"
      - "scripts/validate_load_teardown_receipt.py"
      - "specs/_audits/2026-09-22-i1687-endurance-lane.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: verify hosted B-113 and issue 1687 lane evidence
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated contract dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2
      - name: Verify hosted mutants evidence contract
        run: python3 scripts/verify_i1666_mutants_evidence.py
      - name: Run focused adversarial checks
        run: |
          set -euo pipefail
          python3 tests/test_verify_i1666_mutants_evidence.py
          python3 -m unittest -q tests/test_i2457_mutants_shards.py
      - name: Verify endurance hosted guards and run-scoped attribution
        run: |
          python3 scripts/verify_i1687_endurance_lane.py
          python3 -m pytest -q scripts/test_i1687_endurance_lane.py
