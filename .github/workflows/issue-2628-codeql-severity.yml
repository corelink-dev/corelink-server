name: issue-2628 CodeQL severity contract

on:
  pull_request:
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/workflows/issue-2628-codeql-severity.yml"
      - "scripts/codeql_severity_gate.py"
      - "tests/test_codeql_severity_gate.py"
      - "changelog.d/2631-codeql-severity-gate.md"
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact branch commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  severity-contract:
    name: Synthetic SARIF severity contract
    if: >-
      github.repository_id == vars.CORELINK_SERVER_REPO_ID &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.expected_head == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind verification to the exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Run only the synthetic SARIF and workflow contract tests
        run: python3 -m unittest -q tests/test_codeql_severity_gate.py
