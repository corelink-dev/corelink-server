name: audit-chain-daily-verify (Wave 18)

# Daily-verify cron + 7-day rolling window verifier (WI-S09-008 Wave 17
# 7-day matrix + Wave 18 paginated CF API v4 R2-list lift).
#
# Trigger:   cron 02:00 UTC daily (low-traffic window per WI-S09-004 §6.1.5)
#            + manual workflow_dispatch for ad-hoc verify after incidents.
#
# Behaviour: For each day in the last `window_days` (default 7 — today,
#            yesterday, ..., today-6) the workflow:
#
#              1. Lists every R2 chunk key under
#                 `audit/<YYYY>/<MM>/<DD>/` via Cloudflare API v4
#                 `GET /accounts/{account_id}/r2/buckets/{bucket}/objects?prefix=...`
#                 paginated (per_page=1000) with `result_info.cursor` walk
#                 (cap 100 pages = 100k keys; fanout-guard).
#              2. Downloads every chunk via the per-object CF API v4
#                 `GET /accounts/{account_id}/r2/buckets/{bucket}/objects/{key}`
#                 to `./.audit-verify-staging/<date>/chunks/<r2-key>`.
#              3. Invokes `cargo run -p corelink-audit-chain --bin verifier`
#                 with EVERY chunk path for that day, plus the running
#                 cross-day chain-head checkpoint from the prior day.
#              4. Grep-detects the canonical
#                 `AUDIT_CHAIN_BREAK_DETECTED` marker.
#              5. On hit, prints the SEV-0 marker
#                 `AUDIT_CHAIN_7DAY_BREAK_DETECTED::<date>::<chunk-key>`
#                 AND dispatches PagerDuty Events API v2 trigger with
#                 `dedup_key=audit-chain-break-<date>-<chunk>` (per-day
#                 dedup — multiple breaks across the 7-day window surface
#                 as N distinct PD pages, one per affected day).
#              6. Continues to the next day in the matrix on a per-day
#                 break (each day's verify is independent; one bad day
#                 does NOT short-circuit the remaining 6 days).
#
# Fail-CLOSED contract (per-day, surface at job end):
#   - any non-2xx from list or per-object GET
#   - any JSON parse failure on a list page
#   - any `success != true` payload from the CF API
#   - any pagination cursor-empty handling error
#   - any verifier non-zero exit
# Per-day fail-CLOSED -> per-day PD page -> continue matrix.
# Job ends with non-zero exit IFF any day surfaced a break (so the
# workflow run itself signals "investigate the day-level errors").
#
# Enforces:  INV-OBS-AUDIT-CHAIN-INTEGRITY (HIGH), INV-AUDIT-APPEND-ONLY
#            (CRITICAL — the verifier surface is the only audit-time
#            tamper detector), INV-TENANT-ISOLATION (CRITICAL —
#            per-tenant chain partitioning re-asserted on every day).
#
# Implements: WI-S09-008 §6 daily-verify cron acceptance criterion
#             (Wave 17 7-day matrix closure + Wave 18 paginated CF API
#             v4 R2-list lift inside each matrix day);
#             specs/_audits/sealed/2026-05-15-audit-chain-retention.md §2.2.
#
# Secrets consumed (rows in docs/internal/secrets-checklist.md):
#   - CF_ACCOUNT_ID            (#49) — CF account id
#   - CF_API_TOKEN             (#50, audit-read variant) — `Workers R2
#                                       Storage:Read` on
#                                       `corelink-audit-weur` ONLY
#   - AUDIT_R2_BUCKET          (#118 var, optional override) — defaults
#                                       to `corelink-audit-weur`
#   - AUDIT_CHAIN_LINK_KEYS_JSON (#245) — write-only link-key keyring for
#                                      post-cutover keyed archive verification
#   - AUDIT_CHAIN_CHECKPOINT_KEY_ID (#262 var) — active checkpoint MAC key id
#   - CF_AUDIT_CHECKPOINT_WRITE_TOKEN (#263) — write-only token scoped to the
#                                      immutable audit-checkpoint prefix
#   - AUDIT_WITNESS_{ID,PUBLIC_KEYS_JSON} (#255-256) — independent verifier roots
#   - CF_AUDIT_RECEIPT_READ_TOKEN (#264) + D1_DATABASE_ID — read-only transport
#                                      for historically signed witness receipts
#   - PAGERDUTY_ROUTING_KEY    (#11) — SEV-0 page on per-day chain break
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6 tooling-pin
# policy. Version bump requires ADR + Security review.

on:
  schedule:
    # 02:00 UTC daily (low-traffic window).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the normal verifier or build a credentialless, main-only offline verifier artifact"
        type: choice
        options: [full, build_only]
        required: true
        default: full
      expected_sha:
        description: "Required for build_only; must equal the protected main commit SHA"
        type: string
        required: false
        default: ""
      window_days:
        description: "Verify window in days (default 7)"
        required: false
        default: "7"

# Read-only permissions per HIGH_RISK lane (no contents:write — the cron
# only reports). No id-token:write — production R2 access uses
# CF_API_TOKEN secret, not OIDC (the CF API v4 Bearer is the canonical
# server-side path; OIDC-against-R2 lifts to a follow-on if we ever
# move to ephemeral creds).
permissions:
  contents: read

concurrency:
  group: audit-chain-daily-verify
  cancel-in-progress: false

env:
  # Default window when triggered by cron (no workflow_dispatch input
  # available); workflow_dispatch overrides via the `window_days` input.
  DEFAULT_WINDOW_DAYS: "7"
  # Bucket default — overridable via the `AUDIT_R2_BUCKET` repo/env var
  # (secrets-checklist row #118). The cron is fail-safe on rename:
  # absent var falls through to the literal below.
  #
  # This MUST stay equal to `DEFAULT_AUDIT_BUCKET` in
  # `crates/corelink-container/src/routes/audit_archive.rs`, which is where the
  # chunks are actually written. It used to read `corelink-audit-archive` — a
  # bucket that never existed — so the verifier looked for an archive at an
  # address the (never-wired) producer would not have used either.
  # `corelink-audit-weur` is the configured address. A read-only Wrangler
  # check on 2026-09-13 observed native Bucket Lock rule
  # `corelink-audit-7y-retention`: enabled, all prefixes, after 2557 days
  # (220924800s). This is removable bucket configuration, NOT S3 Object Lock
  # Compliance/WORM; recheck live metadata before claiming current retention.
  AUDIT_R2_BUCKET_DEFAULT: "corelink-audit-weur"

jobs:
  # Job 1: smoke-test the verifier binary on empty input + a synthetic
  # 1-chunk fixture. This is the SEAL-gate path that runs on every cron
  # tick regardless of secret availability.
  smoke-verify:
    name: smoke-verify
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'build_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned workspace Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
          components: rust-src,rustfmt,clippy
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          shared-key: audit-chain-daily-verify

      - name: Build verifier binary
        run: cargo build -p corelink-audit-chain --bin verifier --release

      - name: Smoke-test verifier on empty input (no chunks)
        # The verifier MUST be a no-op on zero input (cron-safe).
        run: |
          set -euo pipefail
          cargo run -p corelink-audit-chain --bin verifier --release -- 2>&1 | tee verifier-out.log
          grep -q "AUDIT_CHAIN_VERIFY_OK" verifier-out.log

      - name: Assert verifier exit code is 0 (no chain break detected)
        run: |
          set -euo pipefail
          if grep -q "AUDIT_CHAIN_BREAK_DETECTED" verifier-out.log; then
            echo "::error::SEV-0 AUDIT CHAIN BREAK DETECTED — page Security Lead immediately"
            exit 1
          fi
          echo "Audit chain smoke verify: clean."

      - name: Upload verifier log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-out-${{ github.run_id }}
          path: verifier-out.log
          retention-days: 30

  # The bounded artifact path is a separate statically hosted job so the
  # existing smoke-verify remains pinned to Ubuntu (and shared-HOME
  # toolchain guards never classify a dynamic runner expression as
  # self-hosted-capable). It receives no production secrets or environment.
  build-only-verifier:
    name: build-only-verifier
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build_only'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate closed build-only dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "build_only requires refs/heads/main" >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "expected_sha must be the exact dispatched main SHA" >&2; exit 1; }

      - name: Install pinned workspace Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Assert native macOS arm64 Rust target
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || { echo "build_only requires native macOS arm64" >&2; exit 1; }
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'

      - name: Build verifier binary
        run: cargo build -p corelink-audit-chain --bin verifier --release

      - name: Smoke-test verifier on empty input
        run: |
          set -euo pipefail
          cargo run -p corelink-audit-chain --bin verifier --release -- 2>&1 | tee verifier-out.log
          grep -q "AUDIT_CHAIN_VERIFY_OK" verifier-out.log
          ! grep -q "AUDIT_CHAIN_BREAK_DETECTED" verifier-out.log

      - name: Create build-only provenance
        run: |
          set -euo pipefail
          mkdir -p verifier-artifact
          cp target/release/verifier verifier-artifact/verifier
          chmod 500 verifier-artifact/verifier
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          source = root / "crates/corelink-audit-chain/src/bin/verifier.rs"
          lock = root / "Cargo.lock"
          binary = root / "verifier-artifact/verifier"
          crate_sources = sorted(
              path for path in (root / "crates/corelink-audit-chain").rglob("*")
              if path.is_file() and (path.suffix == ".rs" or path.name in {"Cargo.toml", "build.rs"})
          )
          source_tree = hashlib.sha256()
          for path in crate_sources:
              source_tree.update(path.relative_to(root).as_posix().encode() + b"\0")
              source_tree.update(path.read_bytes())
          provenance = {
              "schema": "corelink.audit.verifier-build.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "source_blob": subprocess.check_output(["git", "rev-parse", "HEAD:crates/corelink-audit-chain/src/bin/verifier.rs"], text=True).strip(),
              "source_sha256": sha(source),
              "crate_source_tree_sha256": source_tree.hexdigest(),
              "cargo_lock_sha256": sha(lock),
              "binary_sha256": sha(binary),
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "rust_host": subprocess.check_output(["rustc", "-vV"], text=True).split("host: ", 1)[1].splitlines()[0],
              "build_command": "cargo build -p corelink-audit-chain --bin verifier --release",
          }
          (root / "verifier-artifact/provenance.json").write_text(json.dumps(provenance, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload native arm64 verifier artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-${{ github.sha }}-${{ github.run_id }}-macos-arm64
          path: verifier-artifact/
          if-no-files-found: error
          retention-days: 7

  # Job 2 (Wave 17 7-day matrix + Wave 18 paginated CF API v4 R2 list
  # lift): 7-day rolling window walk. Iterates today, today-1, ...,
  # today-(N-1) and verifies each day's R2 chunks. The production path
  # lists keys under `audit/<YYYY>/<MM>/<DD>/` via the paginated
  # Cloudflare API v4 `r2/buckets/{bucket}/objects` endpoint (requires
  # CF_API_TOKEN + CF_ACCOUNT_ID secrets + the `AUDIT_R2_BUCKET` env
  # name); the public CI path is a fixture-only smoke harness so the
  # workflow stays green on PR runs without secrets.
  seven-day-verify:
    name: seven-day-verify
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'build_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: smoke-verify
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned workspace Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
          components: rust-src,rustfmt,clippy
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          shared-key: audit-chain-daily-verify

      - name: Build verifier binary
        run: cargo build -p corelink-audit-chain --bin verifier --release

      - name: Compute 7-day window date set
        id: window
        env:
          WINDOW_DAYS_INPUT: ${{ github.event.inputs.window_days || env.DEFAULT_WINDOW_DAYS }}
        run: |
          set -euo pipefail
          WINDOW_DAYS="$WINDOW_DAYS_INPUT"
          if ! [[ "$WINDOW_DAYS" =~ ^[0-9]+$ ]] || [ "$WINDOW_DAYS" -lt 1 ] || [ "$WINDOW_DAYS" -gt 30 ]; then
            echo "::error::window_days must be an integer in [1,30]; got '$WINDOW_DAYS'"
            exit 1
          fi
          echo "Window: $WINDOW_DAYS day(s)"
          # Portable UTC date math: GNU `date -d "$i days ago"` is not
          # available on the BSD `date` shipped on the macOS self-hosted
          # fleet (BSD uses `-v-Nd`). Compute the window in system python3
          # (>=3.14 on every runner) so the math is identical on GNU/BSD.
          # Emit oldest-to-newest: authenticated checkpoints are a serial
          # continuation even though chunk downloads remain bounded per day.
          DATES=$(WINDOW_DAYS="$WINDOW_DAYS" python3 -c '
          import os, datetime
          n = int(os.environ["WINDOW_DAYS"])
          today = datetime.datetime.now(datetime.timezone.utc).date()
          print(" ".join((today - datetime.timedelta(days=i)).isoformat() for i in reversed(range(n))))
          ')
          # Preserve the old accumulator's leading-space convention
          # (harmless — unquoted `for D in $DATES` word-splits it away)
          # so the emitted `dates=` output is byte-identical in shape.
          DATES=" ${DATES}"
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "Daily-verify window dates: $DATES"

      - name: Seven-day audit chunk walk (paginated CF API v4 R2 list per matrix day)
        id: walk
        env:
          R2_BUCKET: ${{ vars.AUDIT_R2_BUCKET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AUDIT_CHAIN_LINK_KEYS_JSON: ${{ secrets.AUDIT_CHAIN_LINK_KEYS_JSON }}
          AUDIT_CHAIN_CHECKPOINT_KEY_ID: ${{ vars.AUDIT_CHAIN_CHECKPOINT_KEY_ID }}
          CF_AUDIT_CHECKPOINT_WRITE_TOKEN: ${{ secrets.CF_AUDIT_CHECKPOINT_WRITE_TOKEN }}
          AUDIT_WITNESS_ID: ${{ vars.AUDIT_WITNESS_ID }}
          AUDIT_WITNESS_URL: ${{ vars.AUDIT_WITNESS_URL }}
          AUDIT_WITNESS_APPEND_TOKEN: ${{ secrets.AUDIT_WITNESS_APPEND_TOKEN }}
          AUDIT_WITNESS_PUBLIC_KEYS_JSON: ${{ vars.AUDIT_WITNESS_PUBLIC_KEYS_JSON }}
          CF_AUDIT_RECEIPT_READ_TOKEN: ${{ secrets.CF_AUDIT_RECEIPT_READ_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATES: ${{ steps.window.outputs.dates }}
        # Wave 18 cutover: paginated CF API v4 R2 list INSIDE each
        # matrix day. Per-day contract:
        #   - List `audit/<YYYY>/<MM>/<DD>/` via paginated GET
        #     (per_page=1000, cursor-walked, cap 100 pages = 100k keys).
        #   - Per-object GET each key to `chunks/<r2-key>` under the
        #     day's staging dir.
        #   - Run the verifier on the day's chunks; grep for
        #     `AUDIT_CHAIN_BREAK_DETECTED`.
        #   - On per-day break: emit the SEV-0 marker
        #     `AUDIT_CHAIN_7DAY_BREAK_DETECTED::<date>::<chunk-key>`,
        #     dispatch PagerDuty Events API v2 (dedup per-day +
        #     per-chunk), and CONTINUE the matrix (each day independent).
        #   - On per-day list/GET failure (auth, 5xx, JSON parse, cursor
        #     handling): mark the day as BROKEN, dispatch a SEV-0 PD
        #     page with the failure category, and CONTINUE the matrix.
        # Job exits non-zero IFF any day broke.
        run: |
          set -euo pipefail
          : "${PAGERDUTY_ROUTING_KEY:?PAGERDUTY_ROUTING_KEY not set — cannot page on per-day chain break (fail-CLOSED)}"
          echo "::add-mask::${CF_API_TOKEN:-}"
          echo "::add-mask::${AUDIT_CHAIN_LINK_KEYS_JSON:-}"
          echo "::add-mask::${CF_AUDIT_CHECKPOINT_WRITE_TOKEN:-}"
          echo "::add-mask::${CF_AUDIT_RECEIPT_READ_TOKEN:-}"
          echo "::add-mask::${AUDIT_WITNESS_APPEND_TOKEN:-}"
          echo "::add-mask::${PAGERDUTY_ROUTING_KEY}"

          # Keep raw key material outside the uploaded staging tree and wipe it
          # even when a malformed keyring aborts the verifier invocation.
          KEYRING_PATH=""
          WITNESS_EVIDENCE_ROOT=""
          WITNESS_KEYS_PATH=""
          WITNESS_HEAD_KEYS_PATH=""
          WITNESS_RECEIPTS_DIR=""
          WITNESS_EPOCH_LEDGER_DIR=""
          trap 'rm -f "${KEYRING_PATH:-}" "${WITNESS_KEYS_PATH:-}" "${WITNESS_HEAD_KEYS_PATH:-}"; if [[ -n "${WITNESS_EVIDENCE_ROOT:-}" ]]; then rm -rf -- "${WITNESS_EVIDENCE_ROOT}"; fi' EXIT
          VERIFIER_ARGS=()
          if [[ -n "${AUDIT_CHAIN_LINK_KEYS_JSON:-}" ]]; then
            KEYRING_PATH="${RUNNER_TEMP}/audit-chain-keyring-${GITHUB_RUN_ID}.json"
            printf '%s' "${AUDIT_CHAIN_LINK_KEYS_JSON}" > "${KEYRING_PATH}"
            chmod 600 "${KEYRING_PATH}"
            VERIFIER_ARGS=(--chain-keyring "${KEYRING_PATH}")
          fi

          BUCKET="${R2_BUCKET:-${AUDIT_R2_BUCKET_DEFAULT}}"
          mkdir -p ./.audit-verify-staging
          BREAK_FOUND=0
          BREAK_MARKERS=""
          PREVIOUS_LOCAL_CHECKPOINT=""
          BOOTSTRAP_ARGS=()
          NEEDS_WITNESS_BOOTSTRAP=0

          # Emit a PD SEV-0 page for a single day's chain break / list
          # failure. Continues the outer loop on completion (the matrix
          # MUST survive a single-day failure per Wave-18 contract).
          page_pd_sev0() {
            local verify_date="$1"
            local chunk_key="$2"
            local failure_kind="$3"   # chain_break | list_failure | get_failure | json_parse
            local marker="AUDIT_CHAIN_BREAK_DETECTED::${verify_date}::${chunk_key}"
            echo "::error::SEV-0 ${marker} kind=${failure_kind}"
            VERIFY_DATE="${verify_date}" \
            CHUNK_KEY="${chunk_key}" \
            FAILURE_KIND="${failure_kind}" \
            MARKER="${marker}" \
            RUN_URL="${RUN_URL}" \
            PAGERDUTY_ROUTING_KEY="${PAGERDUTY_ROUTING_KEY}" \
            python3 > pd-payload.json <<'PY'
          import json, os, sys
          event = {
              "routing_key": os.environ["PAGERDUTY_ROUTING_KEY"],
              "event_action": "trigger",
              "dedup_key": "audit-chain-break-" + os.environ["VERIFY_DATE"] + "-" + os.environ["CHUNK_KEY"],
              "payload": {
                  "summary": "SEV-0 " + os.environ["VERIFY_DATE"] + ": audit chain break (" + os.environ["FAILURE_KIND"] + ") chunk=" + os.environ["CHUNK_KEY"],
                  "source": "audit-chain-daily-verify cron (GHA) — 7-day matrix",
                  "severity": "critical",
                  "component": "corelink-audit-chain",
                  "group": "audit",
                  "class": "integrity-break",
                  "custom_details": {
                      "marker": os.environ.get("MARKER", ""),
                      "verify_date": os.environ["VERIFY_DATE"],
                      "chunk_key": os.environ["CHUNK_KEY"],
                      "failure_kind": os.environ["FAILURE_KIND"],
                      "run_url": os.environ["RUN_URL"],
                      "runbook": "specs/_runbooks/RB-AUDIT-CHAIN-VERIFY.md",
                  },
              },
              "links": [
                  {"href": os.environ["RUN_URL"], "text": "GHA run"},
              ],
          }
          sys.stdout.write(json.dumps(event))
          PY
            local http_code
            http_code=$(curl --silent --show-error \
              -o "pd-resp-${verify_date}.json" -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data @pd-payload.json \
              "https://events.pagerduty.com/v2/enqueue" || echo "000")
            if [[ "${http_code}" != "202" ]]; then
              echo "::error::PagerDuty enqueue for ${verify_date} returned HTTP ${http_code} — manual page Security Lead immediately"
              cat "pd-resp-${verify_date}.json" || true
            else
              echo "PagerDuty SEV-0 dispatched for ${verify_date} (kind=${failure_kind}, chunk=${chunk_key})"
            fi
          }

          # ── Preflight: does the archive bucket exist at all? ─────────────────────
          # Added 2026-08-23. This job had been paging SEV-0 — SEVEN times per run, every
          # day since at least 2026-07-17 — because the bucket it lists does not exist and
          # never has: the archive PRODUCER is real code but is feature-gated off and lives
          # in a crate the deployed Worker never imports. Every one of those pages was
          # accepted by PagerDuty (HTTP 202 confirmed), so this was not theoretical noise.
          #
          # "The archive was never provisioned" is a BUILD FAILURE, not an integrity
          # incident. A chain that breaks wakes someone at 3am; a chain that was never
          # built is a bug report. Conflating them buries the first under weeks of the
          # second — which is exactly what happened here.
          #
          # No verification signal is lost by not paging: if the bucket is absent, nothing
          # could have been verified anyway. The job still exits non-zero and says why, so
          # the failure stays loud — it simply stops ringing a phone about it.
          if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ] && [ -n "${BUCKET:-}" ]; then
            bucket_probe="./.audit-verify-staging/bucket-probe.json"
            bucket_code=$(curl --silent --show-error \
              -o "${bucket_probe}" -w "%{http_code}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}" || echo "000")
            if [[ "${bucket_code}" == "404" ]]; then
              echo "::error::AUDIT_ARCHIVE_NOT_PROVISIONED — R2 bucket '${BUCKET}' does not exist."
              echo "::error::This is a configuration/wiring gap, NOT a chain break. Deliberately NOT paging."
              echo "::error::The archive producer (crates/corelink-audit-chain/src/archive_producer.rs) is"
              echo "::error::gated behind the cf-billing-real feature, which no build or deploy path passes,"
              echo "::error::and its only caller lives in a crate the deployed Worker never imports."
              echo "::error::Live tamper-evidence today is D1-only (BLAKE3 chain + Ed25519 head)."
              echo "::error::Fix the wiring or retarget this verifier — see BACKLOG.md B-015."
              exit 1
            fi
            if [[ "${bucket_code}" != "200" ]]; then
              # Anything else — auth, 5xx, network — is genuinely inconclusive. Fail closed
              # and let the per-day paging path below do its job, since we cannot tell an
              # outage from a break from here.
              echo "::warning::bucket probe returned HTTP ${bucket_code} — continuing to the per-day path (fail-CLOSED)"
            fi
          fi

          for D in $DATES; do
            YYYY=$(echo "$D" | cut -d- -f1)
            MM=$(echo "$D" | cut -d- -f2)
            DD=$(echo "$D" | cut -d- -f3)
            PREFIX="audit/${YYYY}/${MM}/${DD}/"
            echo "--- day=$D prefix=$PREFIX bucket=$BUCKET"

            DAY_DIR="./.audit-verify-staging/${D}"
            CHUNKS_DIR="${DAY_DIR}/chunks"
            mkdir -p "${CHUNKS_DIR}"
            : > "${DAY_DIR}/chunk-keys.txt"
            : > "${DAY_DIR}/chunk-paths.txt"
            CHECKPOINT_IN="${DAY_DIR}/previous-checkpoint.ndjson"
            CHECKPOINT_OUT="${DAY_DIR}/checkpoint.ndjson"
            CHECKPOINT_ARGS=()
            NEEDS_WITNESS_BOOTSTRAP=0

            # An exact, immutable previous-day checkpoint authenticates the
            # first row when a rolling window begins after E0. Absence is only
            # legal when the verifier can bootstrap from validated E0 genesis.
            if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ] && [ -n "${BUCKET:-}" ]; then
              : "${AUDIT_CHAIN_CHECKPOINT_KEY_ID:?AUDIT_CHAIN_CHECKPOINT_KEY_ID not set — cannot authenticate daily continuity}"
              : "${CF_AUDIT_CHECKPOINT_WRITE_TOKEN:?CF_AUDIT_CHECKPOINT_WRITE_TOKEN not set — cannot publish immutable checkpoint}"
              PREV_D=$(VERIFY_DAY="$D" python3 -c 'import datetime,os; print((datetime.date.fromisoformat(os.environ["VERIFY_DAY"])-datetime.timedelta(days=1)).isoformat())')
              PREV_KEY="audit-checkpoints/${PREV_D//-//}/partitions.ndjson"
              prev_code=$(curl --silent --show-error -o "${CHECKPOINT_IN}" -w "%{http_code}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${PREV_KEY}" || echo "000")
              if [[ "${prev_code}" == "404" ]]; then
                rm -f "${CHECKPOINT_IN}"
                NEEDS_WITNESS_BOOTSTRAP=1
              elif [[ "${prev_code}" != "200" ]]; then
                BREAK_FOUND=1
                page_pd_sev0 "${D}" "${PREV_KEY}" "checkpoint_get_failure"
                BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${PREV_KEY}\n"
                continue
              fi
              if [[ -n "${PREVIOUS_LOCAL_CHECKPOINT}" ]]; then
                if [[ -f "${CHECKPOINT_IN}" ]] && ! cmp -s "${PREVIOUS_LOCAL_CHECKPOINT}" "${CHECKPOINT_IN}"; then
                  BREAK_FOUND=1
                  page_pd_sev0 "${D}" "${PREV_KEY}" "checkpoint_stale_or_forked"
                  BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${PREV_KEY}\n"
                  continue
                fi
                cp "${PREVIOUS_LOCAL_CHECKPOINT}" "${CHECKPOINT_IN}"
                NEEDS_WITNESS_BOOTSTRAP=0
              fi
              CHECKPOINT_ARGS=(--verify-day "${D}" --checkpoint-key-id "${AUDIT_CHAIN_CHECKPOINT_KEY_ID}" --checkpoint-out "${CHECKPOINT_OUT}")
              if [[ -f "${CHECKPOINT_IN}" ]]; then
                CHECKPOINT_ARGS+=(--checkpoint-in "${CHECKPOINT_IN}")
              fi
            fi

            # ---------------- LIST (production / public-CI fork) ----------------
            if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ] && [ -n "${BUCKET:-}" ]; then
              echo "Production path: listing R2 bucket=$BUCKET prefix=$PREFIX (paginated CF API v4)"
              cursor=""
              page=0
              list_failed=0
              while :; do
                page=$((page + 1))
                if [[ -n "${cursor}" ]]; then
                  url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?prefix=${PREFIX}&per_page=1000&cursor=${cursor}"
                else
                  url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?prefix=${PREFIX}&per_page=1000"
                fi
                page_file="${DAY_DIR}/page-${page}.json"
                http_code=$(curl --silent --show-error \
                  -o "${page_file}" -w "%{http_code}" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  -H "Accept: application/json" \
                  "${url}" || echo "000")
                if [[ "${http_code}" != "200" ]]; then
                  echo "::error::day=${D} R2 list page=${page} HTTP ${http_code} (bucket=${BUCKET} prefix=${PREFIX}) — fail-CLOSED for this day"
                  echo "--- response body (page=${page}) ---"
                  cat "${page_file}" || true
                  echo "--- end ---"
                  list_failed=1
                  break
                fi
                ok=$(PAGE_JSON="${page_file}" python3 -c 'import json,os; d=json.load(open(os.environ["PAGE_JSON"])); print("1" if d.get("success") is True else "0")' 2>/dev/null || echo "PARSE_ERR")
                if [[ "${ok}" == "PARSE_ERR" ]]; then
                  echo "::error::day=${D} R2 list page=${page}: JSON parse failure — fail-CLOSED for this day"
                  list_failed=2
                  break
                fi
                if [[ "${ok}" != "1" ]]; then
                  echo "::error::day=${D} R2 list page=${page}: success != true — fail-CLOSED for this day"
                  PAGE_JSON="${page_file}" python3 -c 'import json,os; d=json.load(open(os.environ["PAGE_JSON"])); print("errors=", d.get("errors"))' || true
                  list_failed=1
                  break
                fi
                PAGE_JSON="${page_file}" python3 -c 'import json,os; d=json.load(open(os.environ["PAGE_JSON"])); [print(o["key"]) for o in (d.get("result") or []) if o.get("key")]' >> "${DAY_DIR}/chunk-keys.txt"
                cursor=$(PAGE_JSON="${page_file}" python3 -c 'import json,os; d=json.load(open(os.environ["PAGE_JSON"])); ri=d.get("result_info") or {}; print(ri.get("cursor") or "")')
                if [[ -z "${cursor}" ]]; then
                  break
                fi
                if (( page > 100 )); then
                  echo "::error::day=${D} R2 list pagination exceeded 100 pages (100k keys) — fail-CLOSED for this day (unexpected fanout)"
                  list_failed=1
                  break
                fi
              done

              if [[ "${list_failed}" != "0" ]]; then
                BREAK_FOUND=1
                kind="list_failure"
                if [[ "${list_failed}" == "2" ]]; then kind="json_parse"; fi
                page_pd_sev0 "${D}" "list-${PREFIX}" "${kind}"
                BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::list-${PREFIX}\n"
                continue
              fi

              n_keys=$(wc -l < "${DAY_DIR}/chunk-keys.txt" | tr -d ' ')
              echo "  day=${D}: listed ${n_keys} chunk key(s)"

              # -------------- GET each chunk (fail-CLOSED per day) --------------
              get_failed=""
              while IFS= read -r key; do
                [[ -z "${key}" ]] && continue
                local_path="${CHUNKS_DIR}/${key}"
                mkdir -p "$(dirname "${local_path}")"
                obj_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${key}"
                http_code=$(curl --silent --show-error \
                  -o "${local_path}" -w "%{http_code}" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  "${obj_url}" || echo "000")
                if [[ "${http_code}" != "200" ]]; then
                  echo "::error::day=${D} R2 GET key='${key}' HTTP ${http_code} — fail-CLOSED for this day"
                  get_failed="${key}"
                  break
                fi
                echo "${local_path}" >> "${DAY_DIR}/chunk-paths.txt"
              done < "${DAY_DIR}/chunk-keys.txt"

              if [[ -n "${get_failed}" ]]; then
                BREAK_FOUND=1
                page_pd_sev0 "${D}" "${get_failed}" "get_failure"
                BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${get_failed}\n"
                continue
              fi
            else
              echo "Public CI lane (no CF_API_TOKEN / CF_ACCOUNT_ID / bucket): emitting empty day directory."
            fi

            # If the immutable prior checkpoint is absent, D1 is used only as
            # an untrusted transport for historical independent-witness
            # receipts. The verifier revalidates every byte and selects exactly
            # one receipt whose signed head immediately precedes the first row.
            if [[ "${NEEDS_WITNESS_BOOTSTRAP}" == "1" ]] && [[ -s "${DAY_DIR}/chunk-paths.txt" ]]; then
              : "${AUDIT_WITNESS_ID:?witness identity unavailable for checkpoint bootstrap}"
              : "${AUDIT_WITNESS_URL:?witness URL unavailable for checkpoint bootstrap}"
              : "${AUDIT_WITNESS_APPEND_TOKEN:?witness append token unavailable for checkpoint bootstrap}"
              : "${AUDIT_WITNESS_PUBLIC_KEYS_JSON:?witness public keys unavailable for checkpoint bootstrap}"
              : "${CF_AUDIT_RECEIPT_READ_TOKEN:?read-only witness receipt token unavailable}"
              : "${D1_DATABASE_ID:?D1 database id unavailable for receipt bootstrap}"
              if [[ -z "${WITNESS_EVIDENCE_ROOT}" ]]; then
                WITNESS_EVIDENCE_ROOT=$(mktemp -d "${RUNNER_TEMP}/audit-witness-evidence-${GITHUB_RUN_ID}.XXXXXX")
                chmod 700 "${WITNESS_EVIDENCE_ROOT}"
                WITNESS_KEYS_PATH="${WITNESS_EVIDENCE_ROOT}/receipt-keys.json"
                WITNESS_HEAD_KEYS_PATH="${WITNESS_EVIDENCE_ROOT}/head-keys.json"
                WITNESS_RECEIPTS_DIR="${WITNESS_EVIDENCE_ROOT}/receipts"
                WITNESS_EPOCH_LEDGER_DIR="${WITNESS_EVIDENCE_ROOT}/epoch-ledger"
                mkdir -p "${WITNESS_RECEIPTS_DIR}" "${WITNESS_EPOCH_LEDGER_DIR}"
                chmod 700 "${WITNESS_RECEIPTS_DIR}" "${WITNESS_EPOCH_LEDGER_DIR}"
              fi
              printf '%s' "${AUDIT_WITNESS_PUBLIC_KEYS_JSON}" > "${WITNESS_KEYS_PATH}"
              chmod 600 "${WITNESS_KEYS_PATH}"
              registry_query="${DAY_DIR}/signing-registry-query.json"
              python3 - <<'PY' > "${registry_query}"
          import json
          print(json.dumps({"sql": "SELECT signing_key_id,public_key_b64 FROM audit_chain_signing_key_registry ORDER BY signing_key_id", "params": []}, separators=(",", ":")))
          PY
              registry_response="${DAY_DIR}/signing-registry-response.json"
              registry_code=$(curl --silent --show-error -o "${registry_response}" -w "%{http_code}" \
                -X POST -H "Authorization: Bearer ${CF_AUDIT_RECEIPT_READ_TOKEN}" \
                -H "Content-Type: application/json" --data-binary @"${registry_query}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" || echo "000")
              if [[ "${registry_code}" != "200" ]]; then
                echo "::error::read-only signing-key registry query failed HTTP ${registry_code}"
                exit 1
              fi
              RESPONSE="${registry_response}" OUT="${WITNESS_HEAD_KEYS_PATH}" python3 - <<'PY'
          import base64, json, os
          payload = json.load(open(os.environ["RESPONSE"], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("signing-key registry query success != true")
          rows = (payload.get("result") or [{}])[0].get("results") or []
          if not rows:
              raise SystemExit("signing-key registry is empty")
          keys = {}
          for row in rows:
              key_id = int(row["signing_key_id"])
              encoded = row["public_key_b64"]
              if key_id <= 0 or key_id in keys:
                  raise SystemExit("signing-key registry has duplicate/invalid id")
              raw = base64.b64decode(encoded, validate=True)
              if len(raw) != 32 or base64.b64encode(raw).decode() != encoded:
                  raise SystemExit("signing-key registry public key is not canonical")
              keys[str(key_id)] = encoded
          with open(os.environ["OUT"], "w", encoding="utf-8") as out:
              json.dump(keys, out, sort_keys=True, separators=(",", ":"))
          os.chmod(os.environ["OUT"], 0o600)
          PY
              while read -r tenant region _first_sequence; do
                query="${DAY_DIR}/receipt-query-${tenant}-${region}.json"
                TENANT="$tenant" REGION="$region" python3 -c '
                import json,os
                sql="SELECT lower(hex(witness_jcs)) witness_jcs_hex,lower(hex(receipt_jcs)) receipt_jcs_hex,receipt_signature_b64,witness_key_id,witness_record_hash,witness_sequence,tenant_id,region FROM audit_chain_witness_receipt WHERE tenant_id=?1 AND region=?2 ORDER BY witness_sequence"
                print(json.dumps({"sql":sql,"params":[os.environ["TENANT"],os.environ["REGION"]]},separators=(",",":")))
                ' > "${query}"
                response="${DAY_DIR}/receipt-response-${tenant}-${region}.json"
                receipt_code=$(curl --silent --show-error -o "${response}" -w "%{http_code}" \
                  -X POST -H "Authorization: Bearer ${CF_AUDIT_RECEIPT_READ_TOKEN}" \
                  -H "Content-Type: application/json" --data-binary @"${query}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" || echo "000")
                if [[ "${receipt_code}" != "200" ]]; then
                  echo "::error::read-only historical witness receipt query failed HTTP ${receipt_code}"
                  exit 1
                fi
                RESPONSE="$response" OUT_DIR="${WITNESS_RECEIPTS_DIR}" python3 -c '
                import base64,hashlib,json,os
                payload=json.load(open(os.environ["RESPONSE"])); assert payload.get("success") is True
                rows=(payload.get("result") or [{}])[0].get("results") or []
                for row in rows:
                    receipt_hex=row.pop("receipt_jcs_hex")
                    witness_hex=row.pop("witness_jcs_hex")
                    stored={"receipt_jcs_b64":base64.b64encode(bytes.fromhex(receipt_hex)).decode(),"witness_jcs_b64":base64.b64encode(bytes.fromhex(witness_hex)).decode(),**row}
                    ident=hashlib.sha256((stored["tenant_id"]+"\0"+stored["region"]).encode()).hexdigest()[:32]
                    path=os.path.join(os.environ["OUT_DIR"],"{}-{}.json".format(ident,stored["witness_sequence"]))
                    with open(path,"w") as out: json.dump(stored,out,sort_keys=True,separators=(",",":"))
                    os.chmod(path,0o600)
                '
                ledger_query="${DAY_DIR}/ledger-query-${tenant}-${region}.json"
                TENANT="$tenant" REGION="$region" python3 -c '
                import json,os
                sql="SELECT tenant_id,region,epoch_id,ledger_sequence,lower(hex(entry_jcs)) entry_jcs_hex,signature_b64,ledger_hash,signing_key_id FROM audit_chain_epoch_ledger WHERE tenant_id=?1 AND region=?2 ORDER BY ledger_sequence"
                print(json.dumps({"sql":sql,"params":[os.environ["TENANT"],os.environ["REGION"]]},separators=(",",":")))
                ' > "${ledger_query}"
                ledger_response="${DAY_DIR}/ledger-response-${tenant}-${region}.json"
                ledger_code=$(curl --silent --show-error -o "${ledger_response}" -w "%{http_code}" \
                  -X POST -H "Authorization: Bearer ${CF_AUDIT_RECEIPT_READ_TOKEN}" \
                  -H "Content-Type: application/json" --data-binary @"${ledger_query}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" || echo "000")
                if [[ "${ledger_code}" != "200" ]]; then
                  echo "::error::read-only epoch-ledger query failed HTTP ${ledger_code}"
                  exit 1
                fi
                RESPONSE="${ledger_response}" OUT_DIR="${WITNESS_EPOCH_LEDGER_DIR}" python3 - <<'PY'
          import base64, hashlib, json, os
          payload = json.load(open(os.environ["RESPONSE"], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("epoch-ledger query success != true")
          rows = (payload.get("result") or [{}])[0].get("results") or []
          for row in rows:
              entry = bytes.fromhex(row["entry_jcs_hex"])
              parsed = json.loads(entry)
              tenant, region = row["tenant_id"], row["region"]
              ident = hashlib.sha256((tenant + "\0" + region).encode()).hexdigest()[:32]
              stored = {
                  "entry_jcs_b64": base64.b64encode(entry).decode(),
                  "entry_signature_b64": row["signature_b64"],
                  "tenant_id": tenant,
                  "region": region,
                  "epoch_id": int(row["epoch_id"]),
                  "ledger_sequence": int(row["ledger_sequence"]),
                  "epoch_ledger_hash": row["ledger_hash"],
                  "link_key_id": parsed.get("link_key_id"),
                  "signing_key_id": int(row["signing_key_id"]),
              }
              path = os.path.join(os.environ["OUT_DIR"], "{}-{}.json".format(ident, row["ledger_sequence"]))
              with open(path, "w", encoding="utf-8") as out:
                  json.dump(stored, out, sort_keys=True, separators=(",", ":"))
              os.chmod(path, 0o600)
          if not rows:
              raise SystemExit("epoch-ledger evidence is empty")
          PY
              done < <(CHUNK_PATHS="${DAY_DIR}/chunk-paths.txt" python3 -c '
              import json,os
              parts={}
              for path in open(os.environ["CHUNK_PATHS"]):
                  with open(path.strip()) as rows:
                      for line in rows:
                          if line.strip():
                              row=json.loads(line); key=(row["tenant_id"],row["region"]); parts[key]=min(parts.get(key,row["sequence_number"]),row["sequence_number"])
              for (tenant,region),first in sorted(parts.items()): print(tenant,region,first)
              ')
              BOOTSTRAP_ARGS=(--witness-id "${AUDIT_WITNESS_ID}" --witness-public-keys "${WITNESS_KEYS_PATH}" --witness-receipts-dir "${WITNESS_RECEIPTS_DIR}" --witness-url "${AUDIT_WITNESS_URL}" --witness-head-public-keys "${WITNESS_HEAD_KEYS_PATH}" --witness-epoch-ledger-dir "${WITNESS_EPOCH_LEDGER_DIR}")
            fi

            # ---------------- VERIFY (per-day, on argv) ----------------
            DAY_LOG="${DAY_DIR}/verify.log"
            mapfile -t CHUNKS < <(find "${CHUNKS_DIR}" -type f \( -name '*.ndjson' -o -name '*.ndjson.epoch-*.*' \) | sort)
            set +e
            if [ "${#CHUNKS[@]}" -eq 0 ]; then
              echo "  day=${D}: no chunks; cron no-op"
              cargo run -p corelink-audit-chain --bin verifier --release -- "${VERIFIER_ARGS[@]}" "${CHECKPOINT_ARGS[@]}" "${BOOTSTRAP_ARGS[@]}" 2>&1 | tee "${DAY_LOG}"
              VERIFIER_RC=${PIPESTATUS[0]}
            else
              echo "  day=${D}: verifying ${#CHUNKS[@]} chunk(s)"
              # Per-day verifier MUST NOT fail the script — we want to
              # continue the matrix to surface ALL bad days as distinct
              # PD pages. Capture exit + grep for the marker below.
              cargo run -p corelink-audit-chain --bin verifier --release -- "${VERIFIER_ARGS[@]}" "${CHECKPOINT_ARGS[@]}" "${BOOTSTRAP_ARGS[@]}" "${CHUNKS[@]}" 2>&1 | tee "${DAY_LOG}"
              VERIFIER_RC=${PIPESTATUS[0]}
            fi
            set -e

            # ---------------- DETECT + PAGE (per day) ----------------
            if [[ "${VERIFIER_RC}" -ne 0 ]] || grep -q "AUDIT_CHAIN_BREAK_DETECTED" "${DAY_LOG}"; then
              BREAK_FOUND=1
              # Pull the offending chunk key from the verifier diagnostic.
              CHUNK=$(grep -m1 -oE 'chunks/audit/[0-9/]+/[0-9]+\.ndjson' "${DAY_LOG}" || true)
              if [[ -z "${CHUNK}" ]]; then
                # Fall back to the verifier's tenant=<id> structured line.
                CHUNK=$(grep "AUDIT_CHAIN_BREAK_DETECTED" "${DAY_LOG}" | head -1 | sed -E 's/.*tenant=([^:]+):.*/\1/' || echo "unknown")
              else
                CHUNK="${CHUNK#"${CHUNKS_DIR}"/}"
              fi
              MARKER_7D="AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${CHUNK}"
              BREAK_MARKERS="${BREAK_MARKERS}${MARKER_7D}\n"
              echo "::error::${MARKER_7D}"
              page_pd_sev0 "${D}" "${CHUNK}" "chain_break"
              # Continue matrix — do NOT exit here.
            elif [[ -s "${CHECKPOINT_OUT}" ]]; then
              CHECKPOINT_KEY="audit-checkpoints/${D//-//}/partitions.ndjson"
              publish_code=$(curl --silent --show-error -o "${DAY_DIR}/checkpoint-put-response.json" -w "%{http_code}" \
                -X PUT -H "Authorization: Bearer ${CF_AUDIT_CHECKPOINT_WRITE_TOKEN}" \
                -H "Content-Type: application/x-ndjson" -H "If-None-Match: *" \
                --data-binary @"${CHECKPOINT_OUT}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${CHECKPOINT_KEY}" || echo "000")
              if [[ "${publish_code}" == "412" || "${publish_code}" == "409" ]]; then
                existing="${DAY_DIR}/existing-checkpoint.ndjson"
                get_code=$(curl --silent --show-error -o "${existing}" -w "%{http_code}" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${CHECKPOINT_KEY}" || echo "000")
                if [[ "${get_code}" != "200" ]] || ! cmp -s "${CHECKPOINT_OUT}" "${existing}"; then
                  BREAK_FOUND=1
                  page_pd_sev0 "${D}" "${CHECKPOINT_KEY}" "checkpoint_stale_or_forked"
                  BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${CHECKPOINT_KEY}\n"
                  continue
                fi
              elif [[ ! "${publish_code}" =~ ^2[0-9][0-9]$ ]]; then
                BREAK_FOUND=1
                page_pd_sev0 "${D}" "${CHECKPOINT_KEY}" "checkpoint_put_failure"
                BREAK_MARKERS="${BREAK_MARKERS}AUDIT_CHAIN_7DAY_BREAK_DETECTED::${D}::${CHECKPOINT_KEY}\n"
                continue
              fi
              PREVIOUS_LOCAL_CHECKPOINT="${CHECKPOINT_OUT}"
            fi
          done

          if [ "$BREAK_FOUND" -ne 0 ]; then
            echo "SEV-0 7-day chain break(s) detected across matrix:"
            printf "%b" "$BREAK_MARKERS"
            echo "::error::SEV-0 AUDIT_CHAIN_7DAY_BREAK_DETECTED — see per-day PagerDuty pages dispatched above (route PAGERDUTY_ROUTING_KEY, RB-AUDIT-CHAIN-001 §3)"
            exit 1
          fi
          echo "Seven-day audit chain verify: clean across $DATES"

      - name: Upload 7-day verifier logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-day-verifier-logs-${{ github.run_id }}
          path: |
            ./.audit-verify-staging/**/verify.log
            ./.audit-verify-staging/**/chunk-keys.txt
            ./.audit-verify-staging/**/chunk-paths.txt
            ./.audit-verify-staging/**/page-*.json
          retention-days: 30
          if-no-files-found: ignore
