name: CAS Foundation CI (WI-S01-007)

# B-110: all jobs in this workflow run on CoreLink's ephemeral Linux runner.
# The former GitHub-hosted labels were blocked by the organisation's Actions
# billing state; the corelink image is the measured 4-vCPU/12.5-GB substrate
# required by the workspace and coverage links.

concurrency:
  # Shared with coverage.yml: workspace and coverage builds must never compile
  # concurrently against the same heavy-build resource class. A literal group
  # queues dispatches across refs and non-cancelling preserves every result.
  group: "corelink-heavy-cargo-build"
  cancel-in-progress: false

# Sprint-level convergence workflow per WI-S01-007.
# Adds CI gates that the per-crate workflows (tenant-path, corelink-hash,
# corelink-worker, corelink-meta, corelink-reapi) do NOT cover and that
# enforce CTRL-FORMAL-001 + CTRL-SUPPLY-001..005:
#
#   (tlc-canonical was REMOVED 2026-08-02 — see the note under `on:`.)
#   2. workspace-build-test: workspace-wide convergence build + test (sprint
#      smoke; per-crate workflows run targeted subsets on touched crates).
#   3. cargo-deny: license + advisories + sources + bans policy via deny.toml.
#   4. sbom-cyclonedx: SBOM generation via cargo-cyclonedx (CycloneDX 1.5+)
#      + sbomqs NTIA minimum-elements validation.
#   5. cosign-sign: keyless OIDC sigstore sign of SBOM artifact + Rekor
#      bundle (offline-verifiable inclusion proof). RELEASE-ONLY: runs only
#      on `push` to `main`. Pull requests (fork OR same-repo) do NOT sign;
#      they do run every non-secret gate. Per ADR-0044 §1.3.
#   6. reproducible-build-smoke: deterministic build verification (best-effort
#      per ADR-0015; full SLSA L3 deferred to S-12).
#
# All gates are FAIL-CLOSED (HIGH_RISK lane FF-HR-005 — no warning-only).
#
# Trigger surface is workspace-wide because supply-chain gates depend on
# Cargo.lock + every crate's deps. Per-crate workflows already gate the
# per-crate Rust diff; this workflow is the sprint-level convergence point.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # on a staggered schedule + on-demand. Re-add pull_request only if
  # this must block PRs again.
  #
  # Cadence: daily -> WEEKLY Wed (CI cost diet 2026-08-01).
  # This workflow has NO `pull_request` lane of its own (removed 2026-06-02),
  # so "the PR paths: lane still covers it" is NOT the argument. The argument is
  # that every one of its four legs is ALREADY re-verified elsewhere on a
  # cadence this change does not touch — verified 2026-08-01, file by file:
  #   - `tlc-canonical` -> REMOVED 2026-08-02, see below. It ran 4 specs
  #     (tenant_isolation, cas_integrity, gc_correctness, audit_immutability)
  #     through the SAME .cfg files as `tla_check.yml`, which runs a superset.
  #   - `cargo-deny` -> `cargo-deny.yml` runs the same `cargo deny check`
  #     DAILY (cron '30 6 * * *') **and on every pull_request**.
  #   - `sbom-cyclonedx` (CycloneDX 1.5 + NTIA minimum elements) ->
  #     `sbom.yml` generates the same CycloneDX 1.5 SBOM and runs a STRICT
  #     NTIA minimum-elements gate on its own weekly cron ('17 3 * * 2'),
  #     plus on every release.
  #   - `workspace-build-test` (fmt + clippy -D warnings + workspace test) ->
  #     the per-crate PR lanes (corelink-server/-hash/-meta/-worker/-reapi/
  #     tenant-path/...) gate the touched crates on every PR; what weekly
  #     costs is the CROSS-crate convergence smoke on an unchanged tree.
  # CORRECTION 2026-08-02 — the `tlc-canonical` bullet above was wrong twice.
  # It claimed `tla_check.yml` re-verified those specs DAILY at cron
  # '0 7 * * *'. That cron is now WEEKLY ('0 7 * * 1'), which by this file's own
  # closing rule ("if any compensating lane is removed OR SLOWED, this cron must
  # go back to daily in the same PR") should have been handled when tla_check was
  # slowed, and was not. More importantly the compensation was fictional when
  # written: `tla_check` had **0 successes in 195 runs** and did not model-check
  # a single spec. Coverage was justified by pointing at a gate that had never
  # passed.
  #
  # Both halves are now resolved rather than re-documented: `tla_check` actually
  # works (44 specs verified per run) and this workflow's `tlc-canonical` job was
  # DELETED as a strict duplicate — same 4 specs, same .cfg files, no custom
  # bounds. That also removed this file's copy of TLC_SHA256_PINNED, so it is no
  # longer a pin carrier (CARRIERS in scripts/check_tlc_pin_consistency.py: 4 -> 3).
  # Formal-verification coverage is unchanged; it just happens in one place.
  #
  # So the residual exposure of weekly is: up to 7 days before a cross-crate
  # convergence break on an unchanged tree is observed. Against that: this lane
  # produced ZERO successful scheduled runs in July 2026 (19 failure /
  # 2 cancelled out of 21) at ~18 hosted min per run, so daily cadence is
  # currently paying ~460 min/month to re-observe the same red.
  # NOTE: if any of the compensating lanes above is ever removed or slowed,
  # this cron must go back to daily in the same PR. That rule was violated once
  # already (see the CORRECTION above) — a rule written in a comment does not
  # enforce itself, which is the same lesson ADR-0042 §A1 learned the hard way.
  # PARKED 2026-08-10 (cost hygiene, owner-authorized): the weekly cron is
  # commented out because this lane produced ZERO successful scheduled runs
  # (7 failure / 1 cancelled of the last 8) while costing ~460 hosted min/month
  # — it was re-observing the same red for no signal. It stays
  # `workflow_dispatch`-able. RESTORE the `schedule:` block once the underlying
  # failure is diagnosed + fixed (tracked as debt — see the parking PR). Per the
  # NOTE above, if the compensating lanes change, restore to the correct cadence
  # in the same PR that fixes the failure.
  # schedule:
  #   - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  # cosign keyless OIDC requires `id-token: write` — granted ONLY at the
  # cosign-sign job level, AND only when manually dispatched from protected
  # `main` (per ADR-0044 §1.3 release-only guard). PR jobs (fork OR same-repo)
  # never receive the OIDC token.
  id-token: none

# Serialize the heavy release/coverage cargo builds across the self-hosted
# mac fleet so two never compile against the SAME checkout `target/` dir at
# once. The group name is a SHARED LITERAL (intentionally NOT
# `${{ github.workflow }}`) so this workflow serializes AGAINST coverage.yml's
# heavy build leg too: when both land on the same `corelink-builder-N` runner
# they race `target/**/deps/*.d` and fail intermittently with "No such file or
# directory" / "rustc never executed". `cancel-in-progress: false` queues the
# second run (no lost gate result); these are nightly crons hours apart so the
# queue is effectively never >1 deep. cosign-sign is release-only (push to
# main) and gated on artifacts, so queuing never drops a release signature.
# Keep this group name in lockstep with coverage.yml.
# (Removed the `corelink-mac-heavy-cargo-build` concurrency group: it existed to
#  serialize heavy cargo builds onto the single shared self-hosted Mac's `target/`.
#  On GitHub-hosted runners each job gets a fresh VM, so the group only added
#  false serialization.)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  # 2. Workspace-level convergence build + test (sprint smoke).
  # Per-crate workflows already gate touched-crate diffs; this is the
  # cross-cutting "everything compiles + every test passes" guarantee.
  # ---------------------------------------------------------------------
  workspace-build-test:
    name: Workspace build + test (convergence)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace, debug)
        run: cargo test --workspace --all-targets

      - name: cargo doc (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  # ---------------------------------------------------------------------
  # 3. cargo-deny — license + advisories + sources + bans (deny.toml).
  # Fail-closed via deny.toml `[advisories] yanked = "deny"` + `[bans] wildcards = "deny"`.
  # ---------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny (license + advisories + sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # EmbarkStudios/cargo-deny-action is a Docker container action (Linux-only)
      # and hard-fails on the macOS self-hosted fleet. Run cargo-deny NATIVELY,
      # mirroring dependabot-policy.yml. cargo-deny@0.19.8 pinned via taiki-e.
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29
      - name: Install cargo-deny (native — taiki-e/install-action, SHA-pinned)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny@0.19.8
      # Run the full check matrix (advisories, bans, licenses, sources).
      # `--all-features` ensures wasm32 + host-server features both audited.
      - name: Run cargo-deny (license + advisories + sources + bans)
        run: cargo deny --all-features check

  # ---------------------------------------------------------------------
  # 4. SBOM CycloneDX 1.5+ generation + NTIA validation.
  # Generates per-crate SBOM via `cargo cyclonedx`; merges into a single
  # workspace SBOM; sbomqs validates NTIA minimum elements.
  # ---------------------------------------------------------------------
  sbom-cyclonedx:
    name: SBOM CycloneDX 1.5+ (NTIA validated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [workspace-build-test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-cyclonedx (pinned)
        # Exact version pin per WI-S01-007 §6.1.9 SLSA L3 alignment; bumping
        # requires PR + ADR-0044 §1 row update + diff review.
        run: cargo install cargo-cyclonedx --locked --version =0.5.9

      - name: Generate workspace SBOM (CycloneDX 1.5 JSON)
        run: |
          set -euo pipefail
          mkdir -p sbom
          # `--format json` + `--spec-version 1.5` per ADR-0014.
          # `--all` walks every workspace member; emits one bom.json per crate.
          cargo cyclonedx --format json --spec-version 1.5 --all
          # Move per-crate boms to sbom/ for upload + validation.
          find crates apps -name 'bom.json' -print0 | while IFS= read -r -d '' f; do
            crate="$(echo "$f" | awk -F/ '{print $(NF-1)}')"
            cp "$f" "sbom/${crate}.cdx.json"
          done
          echo "Generated $(find sbom -maxdepth 1 -type f | wc -l) SBOM files."
          find sbom -maxdepth 1 -type f -printf '%p %s\n' || true

      - name: Install sbomqs (NTIA validator)
        run: |
          set -euo pipefail
          # sbomqs v0.2+ pinned via release tag.
          SBOMQS_VERSION="v1.0.5"
          curl -fsSL -o /tmp/sbomqs \
            "https://github.com/interlynk-io/sbomqs/releases/download/${SBOMQS_VERSION}/sbomqs-linux-amd64"
          chmod +x /tmp/sbomqs
          /tmp/sbomqs version

      - name: NTIA minimum-elements validation (fail-closed)
        run: |
          set -euo pipefail
          # NTIA min elements: supplier, component, version, dep_relationship,
          # author, timestamp, unique_id. sbomqs reports `ntia_minimum_elements`
          # score per file; gate at score == 1.0 (all elements present).
          fail=0
          for f in sbom/*.cdx.json; do
            echo "Validating ${f} ..."
            score="$(/tmp/sbomqs score --category NTIA-minimum-elements --json "$f" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("avg_score","0"))')"
            echo "  NTIA score: ${score}"
            # Score must be 10.0 (all elements present); sbomqs reports 0..10.
            python3 -c "import sys; v=float('${score}'); sys.exit(0 if v >= 10.0 else 1)" \
              || { echo "::error::NTIA min-elements check failed for ${f} (score=${score}, expected >=10.0)"; fail=1; }
          done
          [[ "${fail}" == "0" ]] || exit 1

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-1.5
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------
  # 5. Cosign keyless OIDC signing of SBOM artifacts — RELEASE-ONLY.
  # This workflow's active trigger is dispatch-only, so cosign-sign runs only
  # when an operator manually dispatches it from protected `main`. It is not
  # falsely described as an automatic push-release lane; the dedicated
  # release workflow owns automatic release signing.
  # Sigstore outage policy (ADR-0044 §1.4 + WI §1 #4): release blocked if
  # Fulcio/Rekor down; runbook RB-FM-SIGSTORE-OUTAGE; no silent grace
  # period.
  # ---------------------------------------------------------------------
  cosign-sign:
    name: cosign keyless sign SBOM (Rekor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [sbom-cyclonedx]
    # Release-only manual dispatch from protected main. Forks and
    # unprotected refs never receive the OIDC token.
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '0' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      id-token: write   # OIDC token for Fulcio short-lived cert
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-1.5
          path: sbom/

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign (Fulcio short-lived cert + Rekor inclusion)
        env:
          COSIGN_EXPERIMENTAL: '1'   # keyless = experimental until cosign GA tracker closes
        run: |
          set -euo pipefail
          for f in sbom/*.cdx.json; do
            echo "Signing ${f} ..."
            # `--yes` skips interactive prompt; OIDC token auto-provided by
            # GitHub Actions. `--bundle` emits the offline-verifiable Rekor
            # bundle (signature + cert + log entry + inclusion proof) per
            # cosign 2.x bundle format — this is the canonical Rekor proof
            # artifact (per ADR-0044 §1.2). The separate `.sig` + `.cert`
            # files remain for compat with tooling that doesn't speak bundle.
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              --bundle "${f}.bundle" \
              "${f}"
            echo "  signed: ${f}.sig + ${f}.cert + ${f}.bundle"
          done

      - name: Verify Rekor inclusion via offline bundle (fail-closed)
        run: |
          set -euo pipefail
          for f in sbom/*.cdx.json; do
            echo "Verifying Rekor inclusion for ${f} ..."
            # `verify-blob --bundle` validates BOTH signature AND Rekor
            # inclusion proof OFFLINE from the bundle file — no live Rekor
            # roundtrip needed at verify time. The cert identity-regexp +
            # OIDC issuer bind the signature to THIS workflow run; forged
            # certificates fail verification.
            cosign verify-blob \
              --bundle "${f}.bundle" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${f}"
          done

      - name: Upload signed SBOM bundle (Rekor inclusion proof)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-1.5-signed
          path: |
            sbom/*.cdx.json
            sbom/*.cdx.json.sig
            sbom/*.cdx.json.cert
            sbom/*.cdx.json.bundle
          if-no-files-found: error
          retention-days: 365

  # ---------------------------------------------------------------------
  # 6. Reproducible build smoke (best-effort per ADR-0015).
  # Builds the host-server binary twice and diffs the stripped artifact;
  # any non-determinism (timestamps, paths, build IDs) fails the gate.
  # Full 2-runner SLSA L3 reproducible-builds verification: deferred to
  # WI-S12-006 (S-12 supply chain hardening).
  # ---------------------------------------------------------------------
  reproducible-build-smoke:
    name: Reproducible build smoke (single-runner, ADR-0015)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache (build A)
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          shared-key: repro-build-a

      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The canonical S-01 binary target is `corelink-server` (apps/server,
       # bin target per `cargo metadata`). Build it twice with deterministic
      # flags + fixed epoch and diff sha256. Failing to produce the binary
      # is a hard failure (libs-only short-circuit removed in Lote 10.x —
      # the workspace HAS shipped a real binary since WI-S01-001).
      - name: Build A (release, deterministic flags)
        env:
          # Strip absolute paths (--remap-path-prefix) + symbols. Fixed
          # SOURCE_DATE_EPOCH neutralises any embedded build timestamps.
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build -C strip=symbols"
          SOURCE_DATE_EPOCH: '1714435200'   # fixed epoch (2024-04-30)
        run: |
          set -euo pipefail
          cargo build --release -p corelink-server
          mkdir -p /tmp/build-a
          # corelink-server bin target outputs target/release/corelink-server.
          cp target/release/corelink-server /tmp/build-a/corelink-server
          find /tmp/build-a -maxdepth 1 -type f -printf '%p %s\n'

      - name: Wipe target dir
        run: cargo clean

      - name: Build B (release, same flags)
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build -C strip=symbols"
          SOURCE_DATE_EPOCH: '1714435200'
        run: |
          set -euo pipefail
          cargo build --release -p corelink-server
          mkdir -p /tmp/build-b
          cp target/release/corelink-server /tmp/build-b/corelink-server
          find /tmp/build-b -maxdepth 1 -type f -printf '%p %s\n'

      - name: Diff build A vs build B (fail-closed on mismatch)
        run: |
          set -euo pipefail
          # Build A and build B MUST both contain corelink-server; missing
          # binary in either is a hard failure (no libs-only short-circuit).
          for d in /tmp/build-a /tmp/build-b; do
            if [[ ! -f "${d}/corelink-server" ]]; then
              echo "::error::Expected ${d}/corelink-server not present"
              exit 1
            fi
          done
          sha_a="$(sha256sum /tmp/build-a/corelink-server | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/build-b/corelink-server | awk '{print $1}')"
          echo "build A: ${sha_a}"
          echo "build B: ${sha_b}"
          if [[ "${sha_a}" != "${sha_b}" ]]; then
            echo "::error::Reproducibility mismatch on corelink-server (single-runner smoke per ADR-0015). Full 2-runner SLSA L3 verification deferred to WI-S12-006."
            exit 1
          fi
          echo "OK corelink-server reproducible: ${sha_a}"
