name: Issue 1667 B-122 production timing evidence

# The pull-request job is credentialless and checks the lane contract.  The
# production job is deliberately manual and protected by the production
# environment; it is the only path that can receive the dogfood PAT.
on:
  pull_request:
    paths:
      - '.github/workflows/issue-1667-b122-production-evidence.yml'
      - 'scripts/verify_i1667_b122_production_lane.py'
      - 'scripts/verify_i1667_b122_provider_binding.py'
      - 'scripts/test_verify_i1667_b122_provider_binding.py'
      - 'scripts/verify_d03_timing_artifact.py'
      - 'scripts/deploy-container-prod.sh'
      - '.github/workflows/cf-deploy-prod.yml'
      - 'scripts/issue_1648_image_only.py'
      - 'tests/test_issue_1648_image_only.py'
      - 'docs/handoff/2026-09-05-b103-b129-attribution-owner-packet.md'
      - 'docs/handoff/2026-09-06-d03-graduation-packets.json'
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type run-b122-production-evidence after owner approval'
        required: true
        type: string
      production_base:
        description: 'Approved production base URL (HTTPS); no path/query'
        required: true
        type: string
      dogfood_tenant:
        description: 'Approved dogfood tenant identifier'
        required: true
        type: string
      serving_sha:
        description: 'Exact deployed commit serving the requests (40 hex)'
        required: true
        type: string
      region:
        description: 'Serving region/colo label recorded before sampling'
        required: true
        type: string
      worker_name:
        description: 'Cloudflare Worker script routed by the approved production origin'
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: b122-production-evidence
  cancel-in-progress: false

jobs:
  contract:
    name: B-122 credentialless lane contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install focused test runner
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==9.0.2
      - name: Run D03 timing receipt mutation coverage
        run: python3 -m pytest -q scripts/test_verify_d03_timing_artifact.py
      - name: Verify fail-closed production lane contract
        run: python3 scripts/verify_i1667_b122_production_lane.py
      - name: Verify B-063 image-only operator and negative controls on exact PR head
        run: python3 -I tests/test_issue_1648_image_only.py
      - name: Verify fail-closed provider binding contract
        run: python3 -m pytest -q scripts/test_verify_i1667_b122_provider_binding.py

  production:
    name: B-122 bounded production observation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate approved target and serving identity
        env:
          APPROVAL: ${{ inputs.approval }}
          BASE: ${{ inputs.production_base }}
          TENANT: ${{ inputs.dogfood_tenant }}
          SERVING_SHA: ${{ inputs.serving_sha }}
          REGION: ${{ inputs.region }}
          WORKER_NAME: ${{ inputs.worker_name }}
          PAT: ${{ secrets.CORELINK_DOGFOOD_PAT }}
        run: |
          set -euo pipefail
          test "${APPROVAL}" = run-b122-production-evidence
          test -n "${PAT}"
          test -n "${REGION}" && test "${#REGION}" -le 128
          [[ "${SERVING_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${WORKER_NAME}" =~ ^[a-z0-9_-]{1,63}$ ]]
          python3 - "${BASE}" "${TENANT}" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse
          base, tenant = sys.argv[1:]
          parsed = urlparse(base)
          if parsed.scheme != "https" or not parsed.netloc or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("production_base must be an HTTPS origin without path/query")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", tenant):
              raise SystemExit("dogfood_tenant contains unsupported characters")
          PY
      - name: Bind the active Worker version to the GitHub source SHA
        env:
          SERVING_SHA: ${{ inputs.serving_sha }}
          WORKER_NAME: ${{ inputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          source_sha="${SERVING_SHA,,}"
          : "${CLOUDFLARE_API_TOKEN:?CF_API_TOKEN is required for provider readback}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID is required for provider readback}"
          evidence_dir="$(mktemp -d)"
          trap 'rm -rf "${evidence_dir}"' EXIT
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "${CLOUDFLARE_API_TOKEN}" > "${evidence_dir}/curl.conf"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${evidence_dir}/curl.conf" \
            "${api}/deployments?per_page=100" > "${evidence_dir}/provider-deployments.json"
          version_id="$(jq -er '.result.deployments[0].versions[0].version_id' "${evidence_dir}/provider-deployments.json")"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${evidence_dir}/curl.conf" \
            "${api}/versions/${version_id}" > "${evidence_dir}/provider-version.json"
          gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${source_sha}&environment=production&per_page=100" \
            > "${evidence_dir}/github-deployments.json"
          github_deployment_id="$(jq -er --arg sha "${source_sha}" \
            '[.[] | select(.sha == $sha and .environment == "production")][0].id' \
            "${evidence_dir}/github-deployments.json")"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${github_deployment_id}/statuses" \
            > "${evidence_dir}/github-deployment-statuses.json"
          app_name="${WORKER_NAME}-corelinkserver-prod"
          app_list="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/applications"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${evidence_dir}/curl.conf" "${app_list}" > "${evidence_dir}/container-applications.json"
          app_id="$(jq -er --arg name "${app_name}" \
            '[.result[] | select((.configuration.image // "") | contains("/" + $name + ":"))][0].id' \
            "${evidence_dir}/container-applications.json")"
          [[ "${app_id}" =~ ^[0-9a-fA-F-]{36}$ ]]
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${evidence_dir}/curl.conf" \
            "${app_list}/${app_id}" > "${evidence_dir}/container-application.json"
          image_ref="$(jq -er '.result.configuration.image' "${evidence_dir}/container-application.json")"
          image_tag="${image_ref##*:}"
          image_prefix="${image_tag%-r1}"
          [[ "${image_prefix}" =~ ^[0-9a-f]{7,40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/commits/${image_prefix}" > "${evidence_dir}/container-image-commit.json"
          container_build_sha="$(jq -er '.sha' "${evidence_dir}/container-image-commit.json")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/container-build-push-prod.yml/runs?head_sha=${container_build_sha}&status=completed&per_page=100" \
            > "${evidence_dir}/container-build-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${container_build_sha}...${source_sha}" \
            > "${evidence_dir}/build-to-serving-compare.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/a5d56cb4516a2c11f5234eb83a738baa97a41c3d...${container_build_sha}" \
            > "${evidence_dir}/b122-to-build-compare.json"
          python3 scripts/verify_i1667_b122_provider_binding.py \
            --worker-name "${WORKER_NAME}" --worker-serving-sha "${source_sha}" \
            --deployments "${evidence_dir}/provider-deployments.json" \
            --version "${evidence_dir}/provider-version.json" \
            --github-deployments "${evidence_dir}/github-deployments.json" \
            --github-statuses "${evidence_dir}/github-deployment-statuses.json" \
            --container-application "${evidence_dir}/container-application.json" \
            --container-image-commit "${evidence_dir}/container-image-commit.json" \
            --container-build-runs "${evidence_dir}/container-build-runs.json" \
            --build-is-ancestor "${evidence_dir}/build-to-serving-compare.json" \
            --b122-is-ancestor "${evidence_dir}/b122-to-build-compare.json" \
            > artifacts/b122-provider-binding.json
      - name: Capture B-102 warm and B-107 separated 1 KiB samples
        env:
          BASE: ${{ inputs.production_base }}
          TENANT: ${{ inputs.dogfood_tenant }}
          SERVING_SHA: ${{ inputs.serving_sha }}
          REGION: ${{ inputs.region }}
          PAT: ${{ secrets.CORELINK_DOGFOOD_PAT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/b122
          : > artifacts/b122/b102-warm.txt
          : > artifacts/b122/b107-separated.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > artifacts/b122/sample-started-utc.txt
          start="$(date +%s)"
          for profile in b102-warm b107-separated; do
            output="artifacts/b122/${profile}.txt"
            for ordinal in 1 2 3; do
              test "$(( $(date +%s) - start ))" -le 60
              headers="$(mktemp)"
              trap 'rm -f "${headers}"' EXIT
              detail=()
              if [[ "${profile}" = b102-warm ]]; then
                detail=(-H 'X-Server-Timing-Wdb-Detail: on')
              fi
              set +e
              timeout 25s curl --connect-timeout 10 --max-time 20 --silent --show-error \
                --output /dev/null --dump-header "${headers}" \
                --write-out "ordinal=${ordinal} status=%{http_code} bytes=%{size_upload} wall_s=%{time_total} request_id=%header{x-request-id} cf_ray=%header{cf-ray}\n" \
                -H "Authorization: Bearer ${PAT}" \
                -H 'Content-Type: application/octet-stream' "${detail[@]}" \
                -X PUT "${BASE}/cargo/${TENANT}/${profile}-${GITHUB_RUN_ID}-${ordinal}" \
                --data-binary @<(head -c 1024 /dev/zero) >> "${output}"
              status=$?
              set -e
              test "${status}" -eq 0
              tr -d '\r' < "${headers}" | grep -i '^server-timing:' >> "${output}"
              rm -f "${headers}"
              trap - EXIT
            done
          done
          test "$(( $(date +%s) - start ))" -le 60
          test "$(wc -l < artifacts/b122/b102-warm.txt | tr -d ' ')" -eq 6
          test "$(wc -l < artifacts/b122/b107-separated.txt | tr -d ' ')" -eq 6
      - name: Confirm the same Worker version remained active during sampling
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current="$(mktemp)"
          auth_config="$(mktemp)"
          trap 'rm -f "${current}" "${auth_config}"' EXIT
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "${CLOUDFLARE_API_TOKEN:?CF_API_TOKEN is required}" > "${auth_config}"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${auth_config}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID is required}/workers/scripts/${WORKER_NAME}/deployments?per_page=100" \
            > "${current}"
          expected_deployment="$(jq -er '.provider_deployment_id' artifacts/b122-provider-binding.json)"
          expected_version="$(jq -er '.worker_version_id' artifacts/b122-provider-binding.json)"
          jq -e --arg deployment "${expected_deployment}" --arg version "${expected_version}" \
            '.success == true and .result.deployments[0].id == $deployment and
             (.result.deployments[0].versions | length == 1) and
             .result.deployments[0].versions[0].version_id == $version and
             .result.deployments[0].versions[0].percentage == 100' "${current}" > /dev/null
          app_id="$(jq -er '.container_application_id' artifacts/b122-provider-binding.json)"
          app_now="$(mktemp)"
          trap 'rm -f "${current}" "${auth_config}" "${app_now}"' EXIT
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --config "${auth_config}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/applications/${app_id}" > "${app_now}"
          jq -e --slurpfile receipt artifacts/b122-provider-binding.json \
            '.success == true and .result.id == $receipt[0].container_application_id and
             (.result.version | tostring) == $receipt[0].container_application_version and
             .result.configuration.image == $receipt[0].container_image' "${app_now}" > /dev/null
      - name: Verify and redact the timing receipt
        env:
          SERVING_SHA: ${{ inputs.serving_sha }}
          REGION: ${{ inputs.region }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_d03_timing_artifact.py --writes --require-identities artifacts/b122/b102-warm.txt > artifacts/b122/shape-check-b102.txt
          python3 scripts/verify_d03_timing_artifact.py --writes --require-identities artifacts/b122/b107-separated.txt > artifacts/b122/shape-check-b107.txt
          python3 - "${SERVING_SHA}" "${REGION}" <<'PY'
          import json
          import pathlib
          import sys
          provider_binding = json.loads(pathlib.Path("artifacts/b122-provider-binding.json").read_text(encoding="utf-8"))
          if provider_binding["worker_serving_sha"] != sys.argv[1].lower():
              raise SystemExit("provider binding does not match the requested serving SHA")
          b102 = pathlib.Path("artifacts/b122/b102-warm.txt").read_text(encoding="utf-8").splitlines()
          b107 = pathlib.Path("artifacts/b122/b107-separated.txt").read_text(encoding="utf-8").splitlines()
          sample_started_utc = pathlib.Path("artifacts/b122/sample-started-utc.txt").read_text(encoding="utf-8").strip()
          packet = {
              "issue": "B-122",
              "measurement_mode": "production_dogfood_bounded",
              "serving_sha": sys.argv[1],
              "worker_serving_sha": provider_binding["worker_serving_sha"],
              "container_build_sha": provider_binding["container_build_sha"],
              "region": sys.argv[2],
              "provider_binding": provider_binding,
              "sample_started_utc": sample_started_utc,
              "sample_count": 3,
              "profiles": {"B-102": b102, "B-107": b107},
              "shape_checks": {
                  "B-102": pathlib.Path("artifacts/b122/shape-check-b102.txt").read_text(encoding="utf-8").strip(),
                  "B-107": pathlib.Path("artifacts/b122/shape-check-b107.txt").read_text(encoding="utf-8").strip(),
              },
          }
          pathlib.Path("artifacts/b122/B122-adapter-timing.json").write_text(json.dumps(packet, sort_keys=True) + "\n", encoding="utf-8")
          PY
          sha256sum artifacts/b122/B122-adapter-timing.json | tee artifacts/b122/B122-adapter-timing.sha256
      - name: Upload redacted receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b122-production-evidence-${{ github.run_id }}
          path: |
            artifacts/b122/B122-adapter-timing.json
            artifacts/b122/B122-adapter-timing.sha256
            artifacts/b122/shape-check-*.txt
            artifacts/b122-provider-binding.json
          if-no-files-found: error
          retention-days: 30
