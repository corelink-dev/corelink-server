name: endurance-2h (operator dispatch, R-prep)

# Both jobs use isolated GitHub-hosted `ubuntu-24.04` runners. The load
# generator sends traffic only to the explicitly validated staging origin.
#
# 2026-08-25 (B-037): both jobs were pinned to `[self-hosted, Linux, X64]`, a
# label NO runner in the fleet carries, so neither could ever be scheduled — and
# a workflow that cannot be scheduled is indistinguishable, in every view that
# matters, from one that passes. The lane now avoids both the nonexistent
# self-hosted Linux label and the shared container runner.
#
# Dispatch-only. This 2-hour job consumes metered GitHub-hosted minutes, so
# unattended scheduling remains retired pending an explicit owner decision.
#
# R-prep endurance load — 2-hour variant of the 24h endurance drill.
#
# The full 24h exercise (manual; see specs/_runbooks/RB-ENDURANCE-24H-DRILL)
# is too long for CI. An operator can dispatch the 2-hour variant so that
# slow-drift symptoms (memory growth, p99 climb, log volume escalation) are
# surfaced within a single business-day window before the 24h drill.
#
# Non-blocking on PR merges — this is an operator-dispatched workflow. A
# dispatched run fails when the 7-day rolling p99 baseline drifts > 20% on any
# SLO (cas_read, cas_write, audit_query, byok_op, admin_op, webhook).
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  # No unattended schedule: this workflow is intentionally operator-dispatched
  # until an owner explicitly approves the metered staging spend.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-bounded-endurance" to dispatch the 2-hour staging lane'
        required: true
        type: string
      duration:
        description: 'The lane is fixed at exactly 2 hours'
        required: true
        type: choice
        options:
          - '2h'
        default: '2h'
      workload_profile:
        description: 'Mixed endurance or controlled run-attributable B-125 CAS demand'
        required: true
        type: choice
        options:
          - mixed
          - b125-audit-capacity
        default: mixed
      capacity_confirmation:
        description: 'Type "run-b125-audit-capacity" only for the controlled capacity profile; otherwise use "not-applicable"'
        required: true
        type: string
        default: not-applicable

permissions:
  contents: read
  id-token: none
  actions: read

concurrency:
  group: endurance-2h-operator
  cancel-in-progress: false

jobs:
  endurance-2h:
    name: k6 endurance 2h (staging)
    # Require an operator dispatch from the protected canonical branch. This
    # keeps the metered staging lane unreachable from forks and feature refs.
    if: github.repository_id == '0' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    environment: staging
    # Budget: 2h script + 5min ramp-up + 5min ramp-down + ~10min for k6
    # boot / artifact upload / baseline compare = 140 minutes ceiling.
    timeout-minutes: 145
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: confirm bounded dispatch
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: test "${CONFIRM}" = "run-bounded-endurance"

      - name: install k6
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: validate script syntax
        run: |
          set -euo pipefail
          k6 inspect \
            -e DURATION=30s \
            -e K6_STAGING_LOAD_ADMISSION_KEY=01234567890123456789012345678901 \
            -e K6_RUN_ID=123 \
            -e K6_STAGING_LOAD_SCENARIO=endurance-2h \
            -e K6_TARGET_DEPLOYMENT_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e K6_TARGET_HOST=https://staging.corelink.humangr.com \
            tests/load/k6/scenarios/endurance-24h.js
          k6 inspect \
            -e DURATION=2h \
            -e K6_ENDURANCE_CONFIRM=yes \
            -e K6_STAGING_LOAD_ADMISSION_KEY=01234567890123456789012345678901 \
            -e K6_RUN_ID=123 \
            -e K6_STAGING_LOAD_SCENARIO=endurance-2h \
            -e K6_B125_AUDIT_CAPACITY_PROFILE=1 \
            -e K6_TARGET_DEPLOYMENT_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e K6_TARGET_HOST=https://staging.corelink.humangr.com \
            tests/load/k6/scenarios/endurance-24h.js

      - name: pre-flight target host check
        id: target_host
        env:
          K6_TARGET_HOST: ${{ secrets.K6_TARGET_HOST }}
          K6_TARGET_IDENTITY_RECEIPT: ${{ secrets.K6_TARGET_IDENTITY_RECEIPT }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          DURATION: ${{ github.event.inputs.duration || '2h' }}
          WORKLOAD_PROFILE: ${{ github.event.inputs.workload_profile || 'mixed' }}
          CAPACITY_CONFIRMATION: ${{ github.event.inputs.capacity_confirmation || 'not-applicable' }}
        run: |
          set -euo pipefail
          if [[ -z "${K6_TARGET_HOST:-}" ]]; then
            echo "::error::K6_TARGET_HOST secret missing in staging environment"
            exit 1
          fi
          CANONICAL_TARGET='https://staging.corelink.humangr.com'
          TARGET_HOST="${K6_TARGET_HOST%/}"
          if [[ "$TARGET_HOST" != "$CANONICAL_TARGET" ]]; then
            echo "::error::K6_TARGET_HOST must equal $CANONICAL_TARGET (optional trailing slash only)"
            exit 1
          fi
          test "${DURATION}" = '2h' || {
            echo "::error::DURATION must be exactly 2h"; exit 1;
          }
          if [[ "${WORKLOAD_PROFILE}" == 'b125-audit-capacity' ]]; then
            test "${CAPACITY_CONFIRMATION}" = 'run-b125-audit-capacity' || {
              echo "::error::B-125 capacity profile requires its exact second confirmation"; exit 1;
            }
          elif [[ "${WORKLOAD_PROFILE}" == 'mixed' ]]; then
            test "${CAPACITY_CONFIRMATION}" = 'not-applicable' || {
              echo "::error::mixed profile requires not-applicable capacity confirmation"; exit 1;
            }
          else
            echo "::error::workload profile is not allowlisted"; exit 1;
          fi
          test -n "${K6_STAGING_LOAD_ADMISSION_KEY:-}" || {
            echo "::error::CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY is required"; exit 1;
          }
          python3 scripts/validate_load_target_receipt.py \
            --target "$TARGET_HOST" \
            --output "${RUNNER_TEMP}/target-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
          if [[ "${DURATION}" == "2h" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::endurance is dispatch-only"
            exit 1
          fi
          echo "target_host=$TARGET_HOST" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET_HOST duration=${DURATION}"

      - name: prepare results dir
        id: prepare_results
        env:
          DURATION: ${{ github.event.inputs.duration || '2h' }}
          VUS: '50'
          WORKLOAD_PROFILE: ${{ github.event.inputs.workload_profile || 'mixed' }}
        run: |
          set -euo pipefail
          mkdir -p tests/load/results/endurance-2h
          DATE_TAG=$(date -u +%Y-%m-%d)
          echo "RESULTS_DATE=${DATE_TAG}" >> "$GITHUB_ENV"
          cat > tests/load/results/endurance-2h/lane-identity.json <<EOF
          {
            "schema": "corelink.endurance-lane-receipt.v1",
            "contract_version": 1,
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "runner_name": "${RUNNER_NAME}",
            "runner_os": "${RUNNER_OS}",
            "runner_arch": "${RUNNER_ARCH}",
            "target": "https://staging.corelink.humangr.com",
            "duration": "${DURATION:-2h}",
            "vus": ${VUS},
            "workload_profile": "${WORKLOAD_PROFILE}",
            "phase": "prepared"
          }
          EOF
          printf '%s\n' "prepared" > tests/load/results/endurance-2h/checkpoint-prepared
          cp "${RUNNER_TEMP}/target-receipt.json" tests/load/results/endurance-2h/target-receipt.json

      - name: run k6 endurance 2h
        env:
          K6_TARGET_HOST:             ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          K6_RUN_ID:                  ${{ github.run_id }}
          K6_STAGING_LOAD_SCENARIO:   endurance-2h
          K6_B125_AUDIT_CAPACITY_PROFILE: ${{ github.event.inputs.workload_profile == 'b125-audit-capacity' && '1' || '0' }}
          K6_TARGET_DEPLOYMENT_SHA:   ${{ steps.target_host.outputs.deployment_sha }}
          K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
          DURATION:                   ${{ github.event.inputs.duration || '2h' }}
          VUS:                        '50'
          K6_ENDURANCE_CONFIRM:       'yes'
        run: |
          set -euo pipefail
          RESULTS_DIR=tests/load/results/endurance-2h
          HEARTBEAT_FILE="${RESULTS_DIR}/heartbeat.json"
          heartbeat() {
            while :; do
              NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              printf '{"schema":"corelink.endurance-heartbeat.v1","run_id":"%s","sha":"%s","phase":"running","at":"%s"}\n' \
                "$GITHUB_RUN_ID" "$GITHUB_SHA" "$NOW" > "${HEARTBEAT_FILE}.tmp"
              mv "${HEARTBEAT_FILE}.tmp" "$HEARTBEAT_FILE"
              sleep 30
            done
          }
          heartbeat &
          HEARTBEAT_PID=$!
          cleanup_heartbeat() {
            kill "${HEARTBEAT_PID}" 2>/dev/null || true
            wait "${HEARTBEAT_PID}" 2>/dev/null || true
          }
          trap cleanup_heartbeat EXIT
          printf '%s\n' "running" > "$RESULTS_DIR/checkpoint-running"
          # `--out json` for the local artifact + experimental prom-rw if
          # the Prometheus remote-write endpoint is configured. The
          # prom-rw output is optional — k6 ignores it if the env var is
          # empty (we test via a guard).
          OUTPUTS=( "--out" "json=tests/load/results/endurance-2h/endurance-2h-results-${DATE_TAG}.json" )
          if [[ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]]; then
            OUTPUTS+=( "--out" "experimental-prometheus-rw" )
          fi
          timeout --signal=TERM --kill-after=60s 130m k6 run \
            "${OUTPUTS[@]}" \
            --summary-export "tests/load/results/endurance-2h/endurance-2h-summary-${DATE_TAG}.json" \
            tests/load/k6/scenarios/endurance-24h.js
          printf '%s\n' "completed" > "$RESULTS_DIR/checkpoint-completed"

      - name: seal synthetic staging state
        id: seal
        if: always() && steps.target_host.outcome == 'success'
        env:
          K6_TARGET_HOST: ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          TARGET_DEPLOYMENT_SHA: ${{ steps.target_host.outputs.deployment_sha }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          CREDENTIAL="$(python3 scripts/staging_load_lifecycle_auth.py --version v1 --key "$K6_STAGING_LOAD_ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --scenario endurance-2h --deployment-sha "$TARGET_DEPLOYMENT_SHA")"
          HTTP_STATUS=$(timeout 30s curl --silent --show-error --max-redirs 0 --request POST --header "x-corelink-staging-load-admission: ${CREDENTIAL}" "${K6_TARGET_HOST}/_internal/staging/load-tests/endurance-2h/seal" --output "${RUNNER_TEMP}/seal-receipt.json" --write-out '%{http_code}')
          test "$HTTP_STATUS" = 200
          python3 scripts/staging_load_lifecycle_auth.py --validate-seal --receipt "${RUNNER_TEMP}/seal-receipt.json" --run-id "$GITHUB_RUN_ID" --scenario endurance-2h --deployment-sha "$TARGET_DEPLOYMENT_SHA"
          cp "${RUNNER_TEMP}/seal-receipt.json" "tests/load/results/endurance-2h/seal-receipt-${GITHUB_RUN_ID}.json"

      - name: teardown synthetic staging state
        id: teardown
        if: always() && steps.target_host.outcome == 'success'
        env:
          K6_TARGET_HOST: ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          TARGET_DEPLOYMENT_SHA: ${{ steps.target_host.outputs.deployment_sha }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -n "${K6_STAGING_LOAD_ADMISSION_KEY:-}" || {
            echo "::error::admission key is required; refusing unmanaged synthetic state"
            exit 1
          }
          CREDENTIAL="$(python3 scripts/staging_load_lifecycle_auth.py --version v1 --key "$K6_STAGING_LOAD_ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --scenario endurance-2h --deployment-sha "$TARGET_DEPLOYMENT_SHA")"
          HTTP_STATUS=$(timeout 30s curl --silent --show-error --max-redirs 0 \
            --request POST \
            --header "x-corelink-staging-load-admission: ${CREDENTIAL}" \
            "${K6_TARGET_HOST}/_internal/staging/load-tests/endurance-2h/teardown" \
            --output "${RUNNER_TEMP}/teardown-receipt.json" \
            --write-out '%{http_code}')
          test "${HTTP_STATUS}" = '200' || {
            echo "::error::teardown must return HTTP 200 with the exact receipt"
            exit 1
          }
          python3 scripts/validate_load_teardown_receipt.py \
            --receipt "${RUNNER_TEMP}/teardown-receipt.json" \
            --run-id "${GITHUB_RUN_ID}" \
            --scenario endurance-2h \
            --deployment-sha "${TARGET_DEPLOYMENT_SHA}" \
            --output "tests/load/results/endurance-2h/teardown-receipt-${GITHUB_RUN_ID}.json"
          mkdir -p tests/load/results/endurance-2h
          echo "deletion_proven=true" >> "$GITHUB_OUTPUT"

      - name: write receipt and teardown checkpoint
        if: always()
        env:
          TARGET_HOST: ${{ steps.target_host.outputs.target_host }}
          DURATION: ${{ github.event.inputs.duration || '2h' }}
          VUS: '50'
          WORKLOAD_PROFILE: ${{ github.event.inputs.workload_profile || 'mixed' }}
          TEARDOWN_STATUS: ${{ steps.teardown.outcome || 'not-run' }}
          TEARDOWN_DELETION_PROVEN: ${{ steps.teardown.outputs.deletion_proven || 'false' }}
        run: |
          set -euo pipefail
          RESULTS_DIR=tests/load/results/endurance-2h
          RECEIPT="$RESULTS_DIR/endurance-lane-receipt-${GITHUB_RUN_ID}.json"
          STATUS="${{ job.status }}"
          SHA_LINES=""
          while IFS= read -r artifact; do
            [[ -z "$artifact" ]] && continue
            SHA_LINES+="$(sha256sum "$artifact")"$'\n'
          done < <(find "$RESULTS_DIR" -maxdepth 1 -type f \( -name 'endurance-2h-summary-*.json' -o -name 'endurance-2h-results-*.json' -o -name 'teardown-receipt-*.json' \) -print)
          printf '%s\n' "$TEARDOWN_STATUS" > "$RESULTS_DIR/checkpoint-teardown"
          export RECEIPT STATUS TARGET_HOST DURATION SHA_LINES TEARDOWN_STATUS WORKLOAD_PROFILE
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          hashes = {}
          for line in os.environ.get("SHA_LINES", "").splitlines():
              digest, _, path = line.partition("  ")
              if digest and path:
                  hashes[path] = digest
          receipt_dir = os.path.dirname(os.environ["RECEIPT"])
          receipt = {
              "schema": "corelink.endurance-lane-receipt.v1",
              "contract_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": os.environ["GITHUB_JOB"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "runner_name": os.environ["RUNNER_NAME"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "target": os.environ.get("TARGET_HOST", ""),
              "duration": os.environ["DURATION"],
              "vus": int(os.environ["VUS"]),
              "workload_profile": os.environ["WORKLOAD_PROFILE"],
              "status": os.environ["STATUS"],
              "teardown_status": os.environ["TEARDOWN_STATUS"],
              "teardown_deletion_proven": os.environ["TEARDOWN_DELETION_PROVEN"] == "true",
              "artifact_sha256": hashes,
              "checkpoints": sorted(name for name in os.listdir(receipt_dir) if name.startswith("checkpoint-")),
              "teardown_at": datetime.now(timezone.utc).isoformat(),
          }
          if receipt["target"] != "https://staging.corelink.humangr.com":
              raise SystemExit("receipt target is not canonical")
          with open(os.environ["RECEIPT"], "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-2h-results-${{ env.RESULTS_DATE }}
          path: tests/load/results/endurance-2h/
          retention-days: 30
          if-no-files-found: error

  baseline-drift-check:
    name: 7-day rolling p99 drift (≤ +20% per SLO)
    # Keep the evidence comparator on the same protected canonical dispatch.
    if: always() && github.repository_id == '0' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.workload_profile == 'mixed'
    runs-on: ubuntu-24.04
    needs: endurance-2h
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: download current run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: endurance-2h-results-*
          path: tests/load/results/endurance-2h-download
          merge-multiple: true

      - name: list past 7 runs from workflow history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch a bounded candidate population. The workflow-level result can
          # be red solely because an earlier baseline was unavailable, so the
          # artifact validator below — not the aggregate workflow conclusion —
          # decides whether each prior endurance measurement is usable.
          mkdir -p tests/load/results/endurance-2h-baseline
          timeout 30s gh run list \
            --workflow=endurance-2h-nightly.yml \
            --branch=main \
            --status=completed \
            --json databaseId,createdAt \
            --limit 7 \
            > tests/load/results/endurance-2h-baseline/runs.json
          cat tests/load/results/endurance-2h-baseline/runs.json
          echo "history_path=tests/load/results/endurance-2h-baseline/runs.json" >> "$GITHUB_OUTPUT"

      - name: build and compare the complete rolling seven-run p99 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/rolling-7d-p99.py \
            --history tests/load/results/endurance-2h-baseline/runs.json \
            --current-dir tests/load/results/endurance-2h-download \
            --downloads-dir tests/load/results/endurance-2h-baseline/history \
            --output tests/load/results/endurance-2h-baseline/rolling-7d-p99.json \
            --repo "${GITHUB_REPOSITORY}" \
            --current-run-id "${GITHUB_RUN_ID}"

      - name: upload rolling baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-rolling-7d-p99-${{ github.run_id }}
          path: tests/load/results/endurance-2h-baseline/
          retention-days: 30
          if-no-files-found: error
