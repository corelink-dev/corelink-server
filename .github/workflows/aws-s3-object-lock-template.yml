name: AWS S3 Object-Lock archive template

on:
  pull_request:
    paths:
      - "infra/terraform/modules/audit-object-lock-aws/**"
      - "crates/corelink-audit-chain/**"
      - "crates/corelink-container/src/routes/dsr/adapter_r2_cas_legalhold.rs"
      - "migrations/d1/0102_cas_retention.sql"
      - "migrations/d1/0144_cas_retention_compliance_metadata.sql"
      - "tests/test_s3_object_lock_migration.py"
      - "Cargo.lock"
      - "docs/operator/aws-s3-object-lock-archive-provisioning.md"
      - ".github/workflows/aws-s3-object-lock-template.yml"
      - ".github/workflows/aws-s3-object-lock-live-proof.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aws-s3-object-lock-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: inactive Object-Lock template validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Check format and validate inactive module
        working-directory: infra/terraform/modules/audit-object-lock-aws
        run: |
          set -euo pipefail
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Check Object-Lock and writer-role invariants
        run: |
          set -euo pipefail
          module=infra/terraform/modules/audit-object-lock-aws/main.tf
          grep -F 'object_lock_enabled = true' "$module"
          grep -F 'mode = "COMPLIANCE"' "$module"
          grep -F 'aws_s3_bucket_object_lock_configuration' "$module"
          grep -F 'aws_iam_role' "$module"
          actions=$(grep -oE '"s3:[A-Z][A-Za-z]+"' "$module" \
            | tr -d '"' \
            | sort)
          expected=$(printf '%s\n' \
            's3:GetBucketObjectLockConfiguration' \
            's3:GetBucketLocation' \
            's3:GetObjectLegalHold' \
            's3:GetObjectRetention' \
            's3:PutObject' \
            's3:PutObjectRetention' \
            's3:PutObjectLegalHold' | sort)
          test "$actions" = "$expected"
          grep -F 'variable = "s3:object-lock-mode"' "$module"
          grep -F 'variable = "s3:object-lock-remaining-retention-days"' "$module"
          grep -F 'values   = ["COMPLIANCE"]' "$module"
          grep -F 'variable = "s3:object-lock-legal-hold"' "$module"
          grep -F 'values   = ["ON"]' "$module"

          docs=docs/operator/aws-s3-object-lock-archive-provisioning.md
          if grep -nE '(^|[^[:digit:]])[[:digit:]]{12}([^[:digit:]]|$)' "$docs"; then
            echo "AWS account identifiers must be redacted from operator docs" >&2
            exit 1
          fi

          proof=.github/workflows/aws-s3-object-lock-live-proof.yml
          grep -F 'workflow_dispatch:' "$proof"
          grep -F "github.ref == 'refs/heads/main'" "$proof"
          grep -F 'id-token: write' "$proof"
          grep -F 'environment: s3-object-lock-live-proof' "$proof"
          grep -E 'ref:.*github[.]sha' "$proof"
          grep -F "options: [probe, reconcile, cleanup]" "$proof"
          grep -F 'OBJECT_LOCK_PROBE_AUDIT_RECONCILE_ROLE_ARN' "$proof"
          grep -F 'OBJECT_LOCK_PROBE_WORKLOAD_WRITER_ROLE_ARN' "$proof"
          grep -F 'OBJECT_LOCK_PROBE_CLEANUP_ROLE_ARN' "$proof"
          grep -F 'inline-session-policy:' "$proof"
          grep -F 'ReleaseOnlyAuthorizedHoldToOff' "$proof"
          grep -F 'unset-current-credentials: true' "$proof"
          grep -F 'Verify exact workload-writer role and put session' "$proof"
          grep -F 'Verify exact probe role and delete session' "$proof"
          grep -F 's3:PutObjectRetention s3:PutObjectLegalHold' "$proof"
          grep -F 'ContextKeyValues=COMPLIANCE,ContextKeyType=string' "$proof"
          grep -F 'ContextKeyValues=ON,ContextKeyType=string' "$proof"
          grep -F -- '--put-principal-session-arn' "$proof"
          grep -F -- '--delete-principal-session-arn' "$proof"
          grep -F 'cloudtrail validate-logs' "$proof"
          grep -F 'scripts/reconcile_b046_object_lock_trail.py' "$proof"
          grep -F "steps.create.outputs.bucket_created == 'true'" "$proof"
          if grep -nE 'EVENT_DATA_STORE|start-query|get-query-results|lookup-events' "$proof"; then
            echo "The digest-backed proof must not query CloudTrail Lake or LookupEvents" >&2
            exit 1
          fi
          if grep -nE 'aws_access_key_id|aws_secret_access_key' "$proof"; then
            echo "The protected probe workflow must not use static AWS credentials" >&2
            exit 1
          fi

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      adapter_changed: ${{ steps.diff.outputs.adapter_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -qE '^(infra/terraform/modules/audit-object-lock-aws/|crates/corelink-audit-chain/|crates/corelink-container/src/routes/dsr/adapter_r2_cas_legalhold\.rs$|migrations/d1/|Cargo\.lock$|tests/test_s3_object_lock_migration\.py$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo 'adapter_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'adapter_changed=false' >> "$GITHUB_OUTPUT"
          fi

  adapter-conformance:
    name: immutable archive adapter conformance
    needs: [scope]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.scope.outputs.adapter_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Assert the workspace-pinned toolchain
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Run the portable Object-Lock contract suite
        run: cargo test -p corelink-audit-chain --lib object_lock_archive --locked

      - name: Check AWS adapter delete-probe fail-closed cases
        run: cargo test -p corelink-audit-chain --features aws-s3-object-lock --lib aws_s3_object_lock --locked

      - name: Prove delete denial rejects unbound IAM authorization evidence
        run: cargo test -p corelink-audit-chain --features aws-s3-object-lock --lib --locked delete_probe_permission_evidence_must_bind_exact_identity_and_version

      - name: Check CAS Compliance migration and Governance isolation
        run: python3 tests/test_s3_object_lock_migration.py

      - name: Compile the optional native AWS S3 adapter
        run: cargo check -p corelink-audit-chain --features aws-s3-object-lock --locked
