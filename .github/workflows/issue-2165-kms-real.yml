            else
              unset B083_ISSUE2165_GRANT_IDS B083_ISSUE2165_GRANT_ID
            fi
          fi
          python3 scripts/issue_2165_kms_custodian.py --manifest "$manifest" --stage cleanup --evidence-dir "$RUNNER_TEMP/evidence/key-cleanup"
      - name: Hand off only the authenticated key rollback receipt
        id: cleanup-handoff
        if: always() && inputs.phase == 'lifecycle' && steps.cleanup.outputs.cancel_expected == 'true'
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/evidence/key-cleanup/custodian-cleanup-rollback-receipt.json"
          if [ -f "$receipt" ]; then
            python3 - "$receipt" "$RUNNER_TEMP/b083-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          payload = json.loads(source.read_text())
