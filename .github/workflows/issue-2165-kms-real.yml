      B083_AWS_APP_EXECUTION_ROLE_ARN: ${{ vars.B083_AWS_APP_EXECUTION_ROLE_ARN }}
      B083_AWS_CUSTODIAN_ROLE_ARN: ${{ vars.B083_AWS_CUSTODIAN_ROLE_ARN }}
      B083_AWS_OPERATOR_TASK_DEFINITION_ARN: ${{ vars.B083_AWS_OPERATOR_TASK_DEFINITION_ARN }}
      B083_AWS_OPERATOR_ROLE_ARN: ${{ vars.B083_AWS_OPERATOR_ROLE_ARN }}
      B083_AWS_OPERATOR_EXECUTION_ROLE_ARN: ${{ vars.B083_AWS_OPERATOR_EXECUTION_ROLE_ARN }}
