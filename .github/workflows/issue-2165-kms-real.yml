      - name: Fail with exact reconciliation request if grant handoff is missing
        if: always() && inputs.phase == 'lifecycle' && needs.runtime-controller.outputs.runtime_run_id == github.run_id && needs.kms-custodian.outputs.grant_id == '' && needs.kms-custodian.outputs.custody_run_id != github.run_id
        run: |
          echo 'Exact grant ID output is missing; do not revoke any other grant. Root custodian must reconcile the run and CMK read-only.' >&2
          exit 2
      - name: Reject standalone key cleanup without authenticated same-run state
        if: always() && inputs.phase == 'cleanup' && (needs.runtime-controller.outputs.app_task_arn == '' || needs.runtime-controller.outputs.operator_task_arn == '' || needs.runtime-controller.outputs.runtime_run_id != github.run_id)
        run: |
          echo 'Standalone key cleanup has no authenticated same-run lifecycle state; no grant was changed.' >&2
          exit 2

