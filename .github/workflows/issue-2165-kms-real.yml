          if hashlib.sha256(canonical).hexdigest() != payload.get("receipt_sha256"):
              raise SystemExit("cleanup rollback receipt digest does not match its action summary")
          if actions[0].get("readback") != "Disabled" or actions[1].get("readback") != "Enabled":
              raise SystemExit("cleanup rollback receipt does not confirm Disabled then Enabled")
          key = manifest["aws"]["cmk_arn"]
          if any(item.get("key_arn") != key for item in actions):
              raise SystemExit("cleanup rollback receipt key does not match protected manifest")
          redacted = {"schema": payload["schema"], "stage": payload["stage"], "run_id": payload["run_id"], "observed_at_utc": payload["observed_at_utc"], "receipt_sha256": payload["receipt_sha256"], "actions": [{"operation": item["operation"], "readback": item["readback"]} for item in actions]}
          output = pathlib.Path(sys.argv[3])
          with output.open("a") as stream:
              stream.write("rollback_receipt_json=" + json.dumps(redacted, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          else
            echo 'rollback_receipt_json=' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove private custodian cleanup evidence
        if: always()
