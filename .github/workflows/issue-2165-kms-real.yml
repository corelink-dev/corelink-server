          manifest="$RUNNER_TEMP/b083-manifest.json"
          aws secretsmanager get-secret-value --secret-id "$B083_TARGET_MANIFEST_SECRET_ARN" --query SecretString --output text > "$manifest"
          chmod 600 "$manifest"
          key_state="$(aws kms describe-key --key-id "$B083_KMS_KEY_ARN" --query 'KeyMetadata.KeyState' --output text)"
