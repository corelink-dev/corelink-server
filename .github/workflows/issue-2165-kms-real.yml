              raise SystemExit("cleanup rollback receipt must contain exactly CancelKeyDeletion and EnableKey")
          canonical = json.dumps({"stage": payload["stage"], "run_id": payload["run_id"], "actions": actions}, sort_keys=True, separators=(",", ":")).encode()
