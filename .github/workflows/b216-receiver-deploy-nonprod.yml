name: B-216 receiver nonprod provision and deploy

on:
  workflow_dispatch:
    inputs:
      readback_only:
        description: Read-only inventory of the fixed B-216 Worker target
        required: false
        default: false
        type: boolean
      deploy_once:
        description: Deploy the exact fixed receiver on workers.dev after provision
        required: false
        default: false
        type: boolean
      exercise_once:
        description: Send one synthetic receiver-only alert, verify D1, then disable workers.dev
        required: false
        default: false
        type: boolean
      disable_workers_dev:
        description: Disable workers.dev for exact fixed receiver and verify readback
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: b216-receiver-nonprod
  cancel-in-progress: false

jobs:
  validate_dispatch_mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exactly one explicit operation mode
        shell: bash
        env:
          READBACK_ONLY: ${{ inputs.readback_only }}
          DEPLOY_ONCE: ${{ inputs.deploy_once }}
          EXERCISE_ONCE: ${{ inputs.exercise_once }}
          DISABLE_WORKERS_DEV: ${{ inputs.disable_workers_dev }}
        run: |
          set -euo pipefail
          modes=0
          for mode in "$READBACK_ONLY" "$DEPLOY_ONCE" "$EXERCISE_ONCE" "$DISABLE_WORKERS_DEV"; do
            if [[ "$mode" == true ]]; then modes=$((modes + 1)); fi
          done
          if [[ "$modes" != 1 ]]; then
            echo "B-216 route stopped: exactly_one_dispatch_mode_required"
            exit 1
          fi

  receiver:
    if: ${{ github.repository == 'HuGR-dev/corelink-server' && github.ref == 'refs/heads/main' && (inputs.readback_only || inputs.deploy_once || inputs.exercise_once || inputs.disable_workers_dev) }}
    needs: validate_dispatch_mode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Owner decision 2026-10-01: the receiver runs on the main Cloudflare account,
    # shared with production, under the staging bounds. It uses the protected
    # `staging` environment, which needs one independent approval from either
    # named reviewer; it is not a two-approval quorum.
    environment:
      name: staging
    steps:
      - name: Check out the exact dispatched main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical repository, main ref, exact SHA, fixed target, and frozen source
        shell: bash
        env:
          EXPECTED_REPOSITORY: HuGR-dev/corelink-server
          EXPECTED_REF: refs/heads/main
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ACCOUNT: 6a1fc1c626fc2628823e60b9db01f5cd
          EXPECTED_WORKER: corelink-dsr-b216-alert-receiver-6a
          EXPECTED_DATABASE: corelink-dsr-b216-alert-receipts-6a
          EXPECTED_MIGRATION_SHA256: 7b9819d1f155645d84b1037e8376063e46ff117dd4d57553b66e22c2d2822bb2
          STAGING_CF_ACCOUNT_ID: ${{ secrets.STAGING_CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # The staging token's account must be the pinned account; never print it.
          if [[ "$STAGING_CF_ACCOUNT_ID" != "$EXPECTED_ACCOUNT" ]]; then
            echo "B-216 route stopped: staging_account_mismatch"
            exit 1
          fi
          config=apps/dsr-alert-receiver/wrangler.toml
          migration=apps/dsr-alert-receiver/migrations/0001_alert_receipts.sql
          grep -Fqx "account_id = \"$EXPECTED_ACCOUNT\"" "$config"
          grep -Fqx "name = \"$EXPECTED_WORKER\"" "$config"
          grep -Fqx 'binding = "ALERT_RECEIPTS_DB"' "$config"
          grep -Fqx "database_name = \"$EXPECTED_DATABASE\"" "$config"
          grep -Fqx 'database_id = "00000000-0000-0000-0000-000000000000"' "$config"
          test "$(find apps/dsr-alert-receiver/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 1
          test "$(sha256sum "$migration" | cut -d ' ' -f 1)" = "$EXPECTED_MIGRATION_SHA256"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.0.0
        if: ${{ inputs.deploy_once }}
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frozen receiver dependencies without lifecycle scripts
        if: ${{ inputs.deploy_once }}
        run: pnpm --dir apps/dsr-alert-receiver install --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Read fixed Worker inventory without mutation
        if: ${{ inputs.readback_only }}
        shell: bash
        env:
          B216_CF_RECEIVER_WRITE_TOKEN: ${{ secrets.STAGING_CF_WORKER_API_TOKEN }}
        run: node apps/dsr-alert-receiver/scripts/run-readback-route.mjs

      - name: Deploy exact receiver target and verify redacted readback
        if: ${{ inputs.deploy_once }}
        shell: bash
        env:
          B216_CF_RECEIVER_WRITE_TOKEN: ${{ secrets.STAGING_CF_WORKER_API_TOKEN }}
          B216_DSR_ALERT_RECEIVER_TOKEN: ${{ secrets.STAGING_DSR_DLQ_ALERT_AUTH_TOKEN }}
        run: node apps/dsr-alert-receiver/scripts/run-deploy-route.mjs

      - name: Preserve redacted route receipt
        if: ${{ always() && inputs.deploy_once }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b216-receiver-route-${{ github.run_id }}
          path: ${{ runner.temp }}/b216-receiver-route-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve redacted read-only inventory
        if: ${{ always() && inputs.readback_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b216-receiver-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/b216-receiver-readback-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Exercise one synthetic receiver-only alert and disable workers.dev
        if: ${{ inputs.exercise_once }}
        shell: bash
        env:
          B216_CF_RECEIVER_WRITE_TOKEN: ${{ secrets.STAGING_CF_WORKER_API_TOKEN }}
          B216_DSR_ALERT_RECEIVER_TOKEN: ${{ secrets.STAGING_DSR_DLQ_ALERT_AUTH_TOKEN }}
        run: node apps/dsr-alert-receiver/scripts/run-synthetic-exercise.mjs

      - name: Disable workers.dev for exact fixed receiver
        if: ${{ inputs.disable_workers_dev }}
        shell: bash
        env:
          B216_CF_RECEIVER_WRITE_TOKEN: ${{ secrets.STAGING_CF_WORKER_API_TOKEN }}
        run: node apps/dsr-alert-receiver/scripts/run-disable-workers-dev.mjs

      - name: Preserve synthetic exercise receipt
        if: ${{ always() && inputs.exercise_once }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b216-receiver-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b216-receiver-synthetic-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve workers.dev disable receipt
        if: ${{ always() && inputs.disable_workers_dev }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b216-receiver-disable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b216-receiver-disable-receipt.json
          if-no-files-found: ignore
          retention-days: 30
