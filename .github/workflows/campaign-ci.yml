            2>&1 | tee -a artifacts/campaign-ci/i2194-audit.log

      - name: Bundle 2 B-156 published claims check
        if: ${{ inputs.suite == 'i2194' }}
        shell: bash
        run: |
          set -euo pipefail
          .venv-i2194/bin/python scripts/verify_b156_pentest_claims.py \
            2>&1 | tee artifacts/campaign-ci/i2194-b156.log
          .venv-i2194/bin/python scripts/published_claims_census.py \
            2>&1 | tee -a artifacts/campaign-ci/i2194-b156.log
          .venv-i2194/bin/python -m pytest \
            tests/test_b156_pentest_claims.py tests/test_published_claims_census.py -q \
            2>&1 | tee -a artifacts/campaign-ci/i2194-b156.log

      - name: Bundle 2 B249 sunset check
        if: ${{ inputs.suite == 'i2194' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_b249_dt_webhook_sunset.py --self-test \
            2>&1 | tee artifacts/campaign-ci/i2194-b249.log
          python3 -m unittest -v tests/test_verify_b249_dt_webhook_sunset.py \
            2>&1 | tee -a artifacts/campaign-ci/i2194-b249.log

      - name: Bundle 2 canonical consistency check
        if: ${{ inputs.suite == 'i2194' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/campaign-ci/i2194-canonical
          python3 scripts/validate_canonical_consistency.py \
            --out artifacts/campaign-ci/i2194-canonical/report.json \
            | tee artifacts/campaign-ci/i2194-canonical/report.txt

      - name: Verify Bundle 2 workflow contract and adversarial mutations
        if: ${{ inputs.suite == 'i2194' }}
        shell: bash
        run: .venv-i2194/bin/python scripts/verify_ci_bundle_2.py

      - name: Run the focused BASE backlog ID mutation suite
        if: ${{ inputs.suite == 'i2417' }}
        shell: bash
        run: python3 -m pytest -q tests/test_backlog_verify_trust_boundary.py

      - name: Verify DSR classification drift and adversarial cases
        if: ${{ inputs.suite == 'i2421' }}
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/campaign-ci/i2421-dsr-classification.log
          cargo fmt --all --check 2>&1 | tee "$log"
          for test_name in \
            routes::dsr::adapter_d1::tests::every_registered_tenant_keyed_table_is_classified_exactly_once \
            routes::dsr::adapter_d1::tests::every_migrated_tenant_keyed_table_is_classified \
            routes::dsr::adapter_d1::tests::every_registry_table_is_actually_created_by_a_migration \
            routes::dsr::adapter_d1::tests::classification_gate_rejects_unknown_table_fail_closed \
            routes::dsr::adapter_d1::tests::dsr_redrive_envelope_is_retained_for_bounded_accountability \
            routes::dsr::adapter_d1::tests::rebuild_next_artifact_is_excluded_while_live_tables_remain_visible; do
            cargo test --locked -p corelink-server --lib "$test_name" -- --exact --nocapture 2>&1 | tee -a "$log"
            grep -F "test ${test_name} ... ok" "$log"
          done

      - name: Upload compact campaign logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: campaign-ci-${{ inputs.suite }}-logs
          path: artifacts/campaign-ci/
          if-no-files-found: ignore
          retention-days: 7
