name: B-029 load gate focused contract

on:
  pull_request:
    paths:
      - ".github/workflows/b029-load-gate.yml"
      - ".github/workflows/load-test-nightly.yml"
      - "scripts/load-test-baseline-check.py"
      - "scripts/sanitize_k6_summary.py"
      - "scripts/validate_load_target_receipt.py"
      - "scripts/verify_b029_load_gate.py"
      - "tests/test_b029_load_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install focused test runner
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/b029-venv"
          "$RUNNER_TEMP/b029-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --quiet \
            "pytest>=9.0.0,<10.0.0"
          echo "$RUNNER_TEMP/b029-venv/bin" >> "$GITHUB_PATH"
      - name: Run focused B-029 contract tests
        run: python3 -m pytest -q tests/test_b029_load_gate.py
