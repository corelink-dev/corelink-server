name: Release — GitHub-managed SLSA provenance (WI-S12-001)

concurrency:
  group: "ci-release-github-managed-provenance-wi-s12-001"

# The upstream slsa-framework reusable generator cannot satisfy this repository's
# SHA-only policy: its own workflow invokes mutable semantic tags and its released
# builder path requires one. GitHub's first-party attestation action is pinned to
# one commit here and produces an in-toto SLSA v1 DSSE bundle, a short-lived
# GitHub OIDC/Sigstore certificate, a Rekor record, and a GitHub-hosted record.

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      release_mode:
        required: true
        type: string
    secrets:
      CORELINK_CLI_RELEASE_TOKEN:
        required: true

permissions: {}

jobs:
  attest-final-inventory:
    name: Attest exact final release inventory
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the manifest verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify the final release inventory
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          case "${TAG}" in cli-v*) ;; *) exit 1 ;; esac
          test "${GITHUB_REF}" = "refs/tags/${TAG}"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          case "${RELEASE_MODE}" in draft-only|signed-public) ;; *) echo "::error::unknown release mode" >&2; exit 1 ;; esac
          RELEASE_API="${RUNNER_TEMP}/corelink-slsa-release.json"
          gh api "repos/HuGR-Labs/corelink-cli/releases/tags/${TAG}" > "${RELEASE_API}"
          python3 - "${RELEASE_API}" "${TAG}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if (release.get("tag_name") != sys.argv[2] or release.get("draft") is not True
                  or release.get("published_at") is not None):
              raise SystemExit("SLSA may only consume the exact unpublished draft candidate")
          if any(asset.get("name") == "staging-manifest.json" for asset in release.get("assets", [])):
              raise SystemExit("private staging manifest remains attached before SLSA")
          PY
          mkdir release-assets
          gh release download "${TAG}" --repo HuGR-Labs/corelink-cli \
            --dir release-assets --pattern 'corelink-*'
          gh release download "${TAG}" --repo HuGR-Labs/corelink-cli \
            --dir release-assets --pattern checksums.txt --pattern release-manifest.json
          test "$(shasum -a 256 release-assets/release-manifest.json | awk '{print $1}')" = "${MANIFEST_SHA256}"
          if [ "${RELEASE_MODE}" = "draft-only" ]; then
            python3 scripts/cli_release_draft_manifest.py verify-manifest \
              --directory release-assets --manifest release-assets/release-manifest.json \
              --public-key docs/internal/gpg-release-pubkey.asc --tag "${TAG}" \
              --source-sha "${SOURCE_SHA}" --manifest-sha256 "${MANIFEST_SHA256}"
          else
            python3 scripts/cli_release_manifest.py verify --directory release-assets \
              --manifest release-assets/release-manifest.json --tag "${TAG}" --source-sha "${SOURCE_SHA}"
          fi

      - name: Derive exact manifest subjects
        id: subjects
        run: |
          set -euo pipefail
          python3 - release-assets/release-manifest.json > provenance-subjects.sha256 <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          entries = manifest.get("artifacts")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("release manifest has no subjects")
          for entry in sorted(entries, key=lambda item: item["name"]):
              name, digest = entry.get("name"), entry.get("sha256")
              if (not isinstance(name, str) or not name or "/" in name
                      or not isinstance(digest, str) or len(digest) != 64):
                  raise SystemExit("invalid release-manifest subject")
              print(f"{digest.lower()}  {name}")
          PY
          test "$(wc -l < provenance-subjects.sha256 | tr -d ' ')" -gt 0
          {
            echo 'subject-list<<EOF'
            cat provenance-subjects.sha256
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub-managed SLSA v1 provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: provenance-subjects.sha256

      - name: Materialize the signed statement and bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 - "${BUNDLE_PATH}" <<'PY'
          import base64
          import json
          import shutil
          import sys

          bundle_path = sys.argv[1]
          bundle = json.load(open(bundle_path, encoding="utf-8"))
          try:
              payload = base64.b64decode(bundle["dsseEnvelope"]["payload"], validate=True)
              statement = json.loads(payload)
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit(f"GitHub attestation bundle has no valid DSSE statement: {error}")
          if statement.get("predicateType") != "https://slsa.dev/provenance/v1":
              raise SystemExit("GitHub attestation is not SLSA v1 provenance")
          open("provenance.intoto.jsonl", "wb").write(payload + b"\n")
          shutil.copyfile(bundle_path, "provenance.intoto.jsonl.bundle")
          PY

      - name: Upload provenance to the draft release
        env:
          GH_TOKEN: ${{ secrets.CORELINK_CLI_RELEASE_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" --repo HuGR-Labs/corelink-cli --clobber \
            provenance.intoto.jsonl provenance.intoto.jsonl.bundle

      - name: Verify official identity, issuer, and every exact subject
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUBJECT_LIST: ${{ steps.subjects.outputs.subject-list }}
        run: |
          set -euo pipefail
          RELEASE_API="${RUNNER_TEMP}/corelink-attested-release.json"
          gh api "repos/HuGR-Labs/corelink-cli/releases/tags/${TAG}" > "${RELEASE_API}"
          STAGING_ASSET_COUNT="$(python3 - "${RELEASE_API}" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(asset.get("name") == "staging-manifest.json" for asset in release.get("assets", [])))
          PY
          )"
          test "${STAGING_ASSET_COUNT}" = "0"
          while IFS='  ' read -r digest name; do
            test -n "${digest}" && test -n "${name}"
            gh attestation verify "release-assets/${name}" \
              --bundle provenance.intoto.jsonl.bundle --repo "${REPO}" \
              --signer-workflow "${REPO}/.github/workflows/release-slsa3.yml" \
              --source-ref "refs/tags/${TAG}" --source-digest "${SOURCE_SHA}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          done <<< "${SUBJECT_LIST}"
