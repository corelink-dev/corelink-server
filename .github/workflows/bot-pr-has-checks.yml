# An automation PR with NO checks must never be mistaken for one that PASSED.
#
# TOKEN RULE (GitHub's current documented behaviour):
#   GITHUB_TOKEN-triggered events are normally suppressed, but pull_request
#   opened/synchronize/reopened events created by that token can create
#   approval-required workflow runs. A write-authorized human may approve them.
#   Dependabot PRs can also trigger Actions; neither actor type alone proves
#   that a check is absent or that a run was suppressed.
#   The five active Actions workflows here open pull requests automatically —
#   subprocessors-sync, okf-autoreconcile, compliance-weekly,
#   api-reference-sync and release-notes. (The historical
#   pre-cutover-weekly-cron workflow was retired.) Earlier Actions-token PRs
#   may have approval-pending runs, missing checks, failed startup, or failed
#   jobs. These are distinct from one another; a run with zero jobs does not
#   prove token suppression. A PR with no checks must not be treated as passed.
#
#   Candidate selection is actor-independent: these workflows use stable head
#   branch markers, so a PR remains covered even when its author is typed as a
#   User, an App, or a renamed machine account.
#
# THE DURABLE FIX is a repository-scoped GitHub App wired into every active
#   creator. Each job mints an installation token that expires in one hour from
#   `CORELINK_BOT_APP_ID` and `CORELINK_BOT_APP_PRIVATE_KEY`; those secrets hold
#   only the App metadata and private key, never an installation token.
#   The App does not repair Actions startup failure or absent corelink runner
#   capacity. A check is proven only by actual job-level execution evidence.
#
# THIS FILE IS A BOUNDED COMPENSATING CONTROL: it makes absence of check runs
#   and commit statuses on a known automation PR head SHA loud. Presence is
#   not success: this count-only watchdog does not inspect approval state,
#   job count, runner assignment, or conclusions.
#
# WHY A SCHEDULE: it observes automation PRs independently of whether their
#   pull_request events were approval-pending, suppressed, or failed before
#   jobs were created. A PR-event-only monitor cannot provide that independent
#   observation. This poll still needs an online corelink runner to execute.
#   The cron also EARNS its keep under this repo's own rule (CLAUDE.md: "a cron
#   earns its keep ONLY when something can change WITHOUT a commit"). A bot can
#   open a PR here on its own schedule with no commit to this repo at all — a
#   nightly drift regen, a weekly compliance sweep. The condition therefore
#   arises without a commit, and no push- or PR-triggered gate can observe it.
#   Hourly. The job is a handful of read-only API calls and finishes in
#   seconds, but every tick spawns a container on our own fabric, so the
#   cadence is a COGS decision as much as a detection one. The failure this
#   catches needs a HUMAN to complete it — an ungated automation PR is only dangerous
#   once someone merges it — and nobody merges within the hour at 03:00. Half-
#   hourly would double the spawn count to buy a detection window narrower than
#   the human latency it is racing.

name: bot-pr-has-checks

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  # Required IN ADDITION to `checks: read`: check runs and commit statuses are
  # two different gating mechanisms behind two different token scopes. A PR can
  # be gated by either, so counting only check runs would undercount and this
  # gate would report a false red on a PR that is in fact gated by statuses.
  statuses: read

concurrency:
  group: bot-pr-has-checks
  cancel-in-progress: false

jobs:
  audit:
    name: every automation PR has at least one check
    # Self-hosted fleet — zero GitHub-hosted spend, per the standing mandate.
    runs-on: ubuntu-24.04
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID
    timeout-minutes: 10
    steps:
      - name: automation-created open PRs are actually gated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_REPOSITORY_MATCH: ${{ github.repository_id == vars.CORELINK_SERVER_REPO_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone

          REPO = os.environ.get("REPO", "")
          if os.environ.get("SERVER_REPOSITORY_MATCH") != "true" or not REPO:
              raise SystemExit("workflow context is not the CoreLink server repository")

          # A PR opened seconds ago may legitimately have no checks yet — the
          # runs are still being created. Only PRs older than this are judged.
          GRACE_MINUTES = 15

          # These markers are produced by the five active PR creators.  Do not
          # key this gate on `user.login` or `user.type`: a PAT/App identity can
          # legitimately be typed as User and may be renamed.
          AUTO_PR_HEAD_MARKERS = (
              "bot/subprocessors-sync-",
              "auto/okf-reconcile-",
              "auto/compliance-digest-",
              "bot/api-reference-sync-",
              "releases/v",
          )


          def is_auto_pr(pr):
              head = pr.get("head") or {}
              ref = head.get("ref") or ""
              return any(ref.startswith(marker) for marker in AUTO_PR_HEAD_MARKERS)


          def marker_for(pr):
              ref = ((pr.get("head") or {}).get("ref")) or ""
              for marker in AUTO_PR_HEAD_MARKERS:
                  if ref.startswith(marker):
                      return marker
              return "?"


          def gh_api(path, paginate=False):
              cmd = ["gh", "api", "-H", "Accept: application/vnd.github+json"]
              if paginate:
                  cmd.append("--paginate")
              cmd.append(path)
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise RuntimeError(
                      "gh api %s failed (rc=%d): %s"
                      % (path, proc.returncode, proc.stderr.strip()[:500])
                  )
              return proc.stdout


          def parse_concat_json(text):
              """`gh api --paginate` emits one JSON document per page, concatenated.

              Parsing only the first would silently truncate the PR list at page 1
              — an undercount that hides exactly the PR we are hunting for.
              """
              decoder = json.JSONDecoder()
              text = text.strip()
              idx = 0
              docs = []
              while idx < len(text):
                  doc, end = decoder.raw_decode(text, idx)
                  docs.append(doc)
                  idx = end
                  while idx < len(text) and text[idx] in " \t\r\n":
                      idx += 1
              return docs


          def list_open_prs():
              raw = gh_api(
                  "repos/%s/pulls?state=open&per_page=100" % REPO, paginate=True
              )
              prs = []
              for doc in parse_concat_json(raw):
                  if isinstance(doc, list):
                      prs.extend(doc)
                  else:
                      prs.append(doc)
              return prs


          def gate_counts(sha):
              """(check_runs, commit_statuses) on this SHA.

              An API failure is raised, never coerced to 0 — "we could not ask"
              and "there is nothing there" must not produce the same verdict.
              """
              checks = json.loads(
                  gh_api("repos/%s/commits/%s/check-runs?per_page=1" % (REPO, sha))
              )
              statuses = json.loads(
                  gh_api("repos/%s/commits/%s/status?per_page=1" % (REPO, sha))
              )
              return int(checks.get("total_count", 0)), int(
                  statuses.get("total_count", 0)
              )


          def emit(lines):
              text = "\n".join(lines)
              print(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(text + "\n")


          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(minutes=GRACE_MINUTES)

          try:
              open_prs = list_open_prs()
          except RuntimeError as exc:
              print("::error::could not list open PRs: %s" % exc)
              sys.exit(1)

          auto_prs = [pr for pr in open_prs if is_auto_pr(pr)]

          rows = []
          offenders = []
          errors = []

          for pr in sorted(auto_prs, key=lambda p: p["number"]):
              number = pr["number"]
              title = (pr.get("title") or "").replace("|", "\\|")
              login = ((pr.get("user") or {}).get("login")) or "?"
              marker = marker_for(pr)
              sha = ((pr.get("head") or {}).get("sha")) or ""
              created = datetime.strptime(
                  pr["created_at"], "%Y-%m-%dT%H:%M:%SZ"
              ).replace(tzinfo=timezone.utc)
              age_min = int((now - created).total_seconds() // 60)

              try:
                  checks, statuses = gate_counts(sha)
              except RuntimeError as exc:
                  errors.append("#%d: %s" % (number, exc))
                  rows.append(
                      "| #%d | %s | %s | `%s` | %d | ERROR | ERROR | could not query |"
                      % (number, title, login, marker, age_min)
                  )
                  continue

              if checks == 0 and statuses == 0:
                  if created < cutoff:
                      verdict = "**NO CHECKS**"
                      offenders.append((number, title, login, age_min))
                  else:
                      verdict = "none yet (within %d-min grace)" % GRACE_MINUTES
              else:
                  verdict = "present (not proof of success)"

              rows.append(
                  "| #%d | %s | %s | `%s` | %d | %d | %d | %s |"
                  % (number, title, login, marker, age_min, checks, statuses, verdict)
              )

          # The healthy state is printed too. A gate that only speaks when angry
          # is indistinguishable from a gate that is broken and silent.
          out = ["## automation-created open PRs in `%s`" % REPO, ""]
          if not auto_prs:
              out.append(
                  "No open automation-created PRs. (%d open PRs scanned.)" % len(open_prs)
              )
          else:
              out.append(
                  "| PR | title | author | marker | age (min) | check runs | statuses | verdict |"
              )
              out.append("| --- | --- | --- | --- | ---: | ---: | ---: | --- |")
              out.extend(rows)
              out.append("")
              out.append(
                  "%d automation PR(s) of %d open PRs scanned." % (len(auto_prs), len(open_prs))
              )

          if offenders:
              out.append("")
              out.append("### FAIL — automation PRs with zero checks AND zero statuses")
              out.append("")
              for number, title, login, age_min in offenders:
                  out.append(
                      "- **#%d** — %s (author `%s`, open %d min)"
                      % (number, title, login, age_min)
                  )
              out.append("")
              out.append(
                  "No check run or status is attached to these PR head SHAs. "
                  "Do not merge on an empty list. Inspect the PR approval banner "
                  "and Actions run records; approve pending pull_request runs "
                  "only under repository policy, and separately resolve failed "
                  "workflow startup or unavailable corelink runner capacity. "
                  "A token change or a present but zero-job run is not CI proof."
              )

          emit(out)

          for message in errors:
              print("::error::check-count query failed for %s" % message)
          for number, title, login, age_min in offenders:
              print(
                  "::error::automation PR #%d has ZERO checks and ZERO statuses after %d "
                  "minutes (author %s): %s" % (number, age_min, login, title)
              )

          if errors:
              sys.exit(1)
          sys.exit(1 if offenders else 0)
          PY
