name: issue-2044 capacity readback

# Protected owner lane.  The probe performs one GET only and emits an
# allowlisted capacity aggregates and explicit unavailable measurements; it
# never emits provider fields beyond approved aggregates, deploys, patches,
# lists, or changes quota.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-1656-read-only" to authorize one read'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-1656-capacity-refresh
  cancel-in-progress: false

jobs:
  readback:
    name: "issue #2044 bounded capacity readback"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-capacity-read
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected manual read contract
        env:
          SERVER_REPOSITORY_MATCH: ${{ github.repository_id == '0' }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$SERVER_REPOSITORY_MATCH" = true
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = run-1656-read-only
          mkdir -p artifacts

      - name: Capture one GET-only capacity receipt
        env:
          # This repository-level token remains opaque to the runner log.  The
          # protected, main-only environment and the probe's fixed single GET
          # bind its use to this bounded readback until the dedicated
          # read-only token is rotated in.
          CLOUDFLARE_CAPACITY_READ_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set +e
          python3 scripts/probe_i1656_capacity_readonly.py \
            --receipt-output artifacts/issue-2044-capacity-read-only-receipt.json \
            2>&1 | tee "$RUNNER_TEMP/issue-2044-capacity-readback.log"
          status=${PIPESTATUS[0]}
          if [[ -f artifacts/issue-2044-capacity-read-only-receipt.json ]]; then
            sha256sum artifacts/issue-2044-capacity-read-only-receipt.json > artifacts/issue-2044-capacity-read-only-receipt.sha256
          fi
          exit "$status"

      - name: Upload approved aggregates and bounded log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-2044-capacity-read-only-${{ github.run_id }}
          path: |
            artifacts/issue-2044-capacity-read-only-receipt.json
            artifacts/issue-2044-capacity-read-only-receipt.sha256
            ${{ runner.temp }}/issue-2044-capacity-readback.log
          if-no-files-found: error
          retention-days: 30
