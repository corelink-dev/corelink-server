name: issue 2776 R2 cleanup compile and local tests

on:
  pull_request:
    paths:
      - 'crates/corelink-container/src/storage/r2_s3_parts/tests_1_network.rs'
      - 'scripts/verify_real_ignored_harnesses.py'
      - '.github/workflows/issue-2776-r2-cleanup.yml'

permissions:
  contents: read

jobs:
  r2-cleanup:
    name: exact-head R2 cleanup compile and nonignored tests
    if: github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'
          shared-key: dsr-registry

      - name: Compile R2 tests without provider credentials
        run: >-
          cargo test --locked -p corelink-server --lib
          storage::r2_s3::implementation::tests:: --no-run

      - name: Run local R2 tests from changed source
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            cas_read_emits_a_nonzero_latency_sli \
            exists_batch_is_absent_without_the_async_audit_seam \
            exists_batch_denies_cross_tenant_before_dispatching_anything; do
            cargo test --locked -p corelink-server --lib \
              "storage::r2_s3::implementation::tests::${test_name}" -- --exact --nocapture
          done
