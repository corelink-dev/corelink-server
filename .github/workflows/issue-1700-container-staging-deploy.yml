name: issue-1700 protected staging container deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options:
          - deploy
          - verify_existing
          - complete_existing
          - historical_query
      expected_sha:
        required: true
        type: string
      rollout_sha:
        required: false
        type: string
      rollout_run_id:
        required: false
        type: string
      expected_deployment_id:
        required: false
        type: string
      expected_version_id:
        required: false
        type: string
      preimage_deployment_id:
        required: false
        type: string
      preimage_version_id:
        required: false
        type: string
      expected_image_digest:
        required: false
        type: string
      confirm:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-1700-staging-custom-domain
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.operation == 'deploy' &&
      inputs.confirm == 'deploy-container-staging-1700'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 100
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd
    steps:
      - name: Confirm exact protected route-free operation
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
          ROUTE_READ_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
          R2_S3_ENDPOINT: ${{ secrets.STAGING_R2_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          test "$OPERATION" = 'deploy'
          test "$CONFIRM" = 'deploy-container-staging-1700'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ROUTE_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$ROUTE_READ_TOKEN"
          test -n "$R2_S3_ENDPOINT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a full deployment and cleanup budget inside the compiled window
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { deploymentWindowAllows } from "./scripts/issue_1700_probe_window.mjs";
            if (!deploymentWindowAllows()) process.exit(1);
          '

      - name: Prove hosted Docker and Cloudflare Worker access
        run: |
          set -euo pipefail
          docker version
          docker info
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a1fc1c626fc2628823e60b9db01f5cd/workers/scripts/corelink-staging/settings" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin).get("success") is True'
      - name: Fail closed when a canonical staging route exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_route_inventory.py \
            > "$RUNNER_TEMP/staging-route-inventory-before.json"
      - name: Render and validate isolated root config
        env:
          STAGING_R2_S3_ENDPOINT: ${{ secrets.STAGING_R2_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/staging-config"
          python3 scripts/render_staging_wrangler.py --phase bootstrap --worker root --output "$RUNNER_TEMP/staging-config/root.toml"
          python3 - "$RUNNER_TEMP/staging-config/root.toml" <<'PY'
          import sys,tomllib
          from pathlib import Path
          path=Path(sys.argv[1])
          config=tomllib.loads(path.read_text())
          config['account_id']='6a1fc1c626fc2628823e60b9db01f5cd'
          path.write_text('account_id = "'+config['account_id']+'"\n'+path.read_text())
          assert config['name']=='corelink-staging'
          assert config['account_id']=='6a1fc1c626fc2628823e60b9db01f5cd'
          assert config.get('workers_dev') is False
          assert not any(x in config for x in ('routes','route','custom_domain'))
          assert config['containers'][0]['image'].endswith('Dockerfile')
          assert config['compatibility_date']=='2026-04-01'
          assert set(config['compatibility_flags'])=={'nodejs_compat','enable_request_signal','request_signal_passthrough'}
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Wrangler and capture exact active preimage
        id: preimage
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-before.json"
          python3 scripts/staging_deployment_guard.py capture \
            --deployments "$RUNNER_TEMP/staging-deployments-before.json" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-before.json"
          node scripts/issue_1700_runtime_probe.mjs capture-container-preimage \
            "$RUNNER_TEMP/staging-containers-before.json" \
            "$RUNNER_TEMP/staging-container-preimage.json"

      - name: Start owned temporary HTTP bootstrap after exact preimages
        id: http_bootstrap
        timeout-minutes: 3
        env:
          PREIMAGE_DEPLOYMENT_ID: ${{ steps.preimage.outputs.preimage_deployment_id }}
          PREIMAGE_VERSION_ID: ${{ steps.preimage.outputs.preimage_version_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          payload={'api_token':os.environ['CLOUDFLARE_API_TOKEN'],
                   'operation_id':os.environ['GITHUB_RUN_ID'], 'expected_release':os.environ['GITHUB_SHA'],
                   'preimage_deployment_id':os.environ['PREIMAGE_DEPLOYMENT_ID'],
                   'preimage_version_id':os.environ['PREIMAGE_VERSION_ID']}
          broker=os.environ['RUNNER_TEMP']+'/staging-http-broker'
          env={key:os.environ[key] for key in ('PATH','HOME','LANG') if key in os.environ}
          try:
              subprocess.run(['node','scripts/issue_1700_http_bootstrap.mjs','start',broker],
                             input=json.dumps(payload),text=True,check=True,
                             env=env)
          except subprocess.CalledProcessError:
              # ONE redacted line: phase, endpoint, HTTP status, CF error codes, message class,
              # failed validation, timeout/abort. Enums and integers only, re-validated by the reader.
              try:
                  subprocess.run(['node','scripts/issue_1700_http_bootstrap.mjs','failure',broker],timeout=30,env=env)
              except Exception:
                  print('issue-1700 bootstrap failure unavailable')
              raise SystemExit(1)
          PY

      - name: Deploy root with container rollout and no route
        id: deploy
        timeout-minutes: 30
        continue-on-error: true
        env:
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
        run: |
          set -euo pipefail
          # The admin key rides this exact candidate version (no script-level secret
          # write: Cloudflare refuses those with 10215 while the newest upload is not
          # the deployed version, which every exact-preimage rollback leaves behind).
          # The broker wrote the file owner-only; it is removed however this step ends.
          secrets_file="$RUNNER_TEMP/staging-http-broker/candidate-secrets.json"
          trap 'rm -f -- "$secrets_file"' EXIT
          test ! -L "$secrets_file"
          test -f "$secrets_file"
          pnpm exec wrangler deploy \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --strict \
            --secrets-file "$secrets_file" \
            --message "$DEPLOYMENT_MARKER" 2>&1 | tee "$RUNNER_TEMP/staging-deploy.log"

      - name: Capture the exact deployed Worker version and Container image digest
        id: deployed_image
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/issue_1700_runtime_probe.mjs capture-deploy \
            "$RUNNER_TEMP/staging-deploy.log"

      - name: Capture the exact candidate Container application state
        id: candidate_container
        timeout-minutes: 11
        if: always() && steps.deploy.outcome == 'success' && steps.deployed_image.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_CONTAINER_IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          PREIMAGE_CONTAINER_VERSION: ${{ steps.preimage.outputs.preimage_container_version }}
        run: |
          set -euo pipefail
          node scripts/issue_1700_runtime_probe.mjs wait-container-state \
            "$RUNNER_TEMP/staging-container-preimage.json" \
            "$RUNNER_TEMP/staging-containers-after-deploy.json"
          MIN_CONTAINER_APP_VERSION="$PREIMAGE_CONTAINER_VERSION" \
          node scripts/issue_1700_runtime_probe.mjs capture-container-state \
            "$RUNNER_TEMP/staging-containers-after-deploy.json" \
            candidate_ \
            "$RUNNER_TEMP/staging-container-candidate.json"

      - name: Identify only this run's exact rollout
        id: candidate
        if: always() && steps.preimage.outputs.preimage_version_id != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-after.json"
          python3 scripts/verify_issue_1700_existing_deployment.py select-candidate \
            --deployments "$RUNNER_TEMP/staging-deployments-after.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --output "$GITHUB_OUTPUT"

      - name: Read the complete candidate Worker Version
        id: candidate_version
        if: always() && steps.candidate.outputs.candidate_version_id != ''
        continue-on-error: true
        env:
          CANDIDATE_VERSION_ID: ${{ steps.candidate.outputs.candidate_version_id }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions view "$CANDIDATE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-candidate-version.json"

      - name: Verify the full marker and unchanged active candidate
        id: verify_candidate
        if: always() && steps.candidate_version.outcome == 'success' && steps.candidate_container.outcome == 'success'
        continue-on-error: true
        env:
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.candidate.outputs.candidate_deployment_id }}
          CANDIDATE_VERSION_ID: ${{ steps.candidate.outputs.candidate_version_id }}
          DEPLOYED_VERSION_ID: ${{ steps.deployed_image.outputs.deployed_version_id }}
          CANDIDATE_CONTAINER_VERSION: ${{ steps.candidate_container.outputs.candidate_container_version }}
          IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_VERSION_ID" = "$DEPLOYED_VERSION_ID"
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-verify-candidate.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-candidate \
            --deployments "$RUNNER_TEMP/staging-deployments-verify-candidate.json" \
            --version "$RUNNER_TEMP/staging-candidate-version.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$DEPLOYMENT_MARKER" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-after-deploy.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="$IMAGE_DIGEST" \
          EXPECTED_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-containers-after-deploy.json"

      - name: Require the new deployment to be attributable before validation
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.verify_candidate.outcome }}
          CONTAINER_OUTCOME: ${{ steps.candidate_container.outcome }}
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
        run: |
          set -euo pipefail
          test "$DEPLOY_OUTCOME" = success
          test "$CANDIDATE_OUTCOME" = success
          test "$CONTAINER_OUTCOME" = success
          test -n "$CANDIDATE_VERSION_ID"

      - name: Verify deployed compatibility flags and empty route inventory
        id: verify
        if: steps.deploy.outcome == 'success' && steps.verify_candidate.outcome == 'success' && steps.candidate_container.outcome == 'success'
        env:
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.verify_candidate.outputs.candidate_deployment_id }}
          DEPLOYED_VERSION_ID: ${{ steps.deployed_image.outputs.deployed_version_id }}
          CANDIDATE_CONTAINER_VERSION: ${{ steps.candidate_container.outputs.candidate_container_version }}
          IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_VERSION_ID" = "$DEPLOYED_VERSION_ID"
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-verify.json"
          pnpm exec wrangler versions view "$CANDIDATE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-current-candidate-version.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-candidate \
            --deployments "$RUNNER_TEMP/staging-deployments-verify.json" \
            --version "$RUNNER_TEMP/staging-current-candidate-version.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$DEPLOYMENT_MARKER" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-verified.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="$IMAGE_DIGEST" \
          EXPECTED_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-containers-verified.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a1fc1c626fc2628823e60b9db01f5cd/workers/scripts/corelink-staging/settings" \
            --output "$RUNNER_TEMP/staging-worker-settings.json"
          python3 scripts/staging_deployment_guard.py settings \
            --response "$RUNNER_TEMP/staging-worker-settings.json" \
            --topology infra/staging/topology.json \
            > "$RUNNER_TEMP/staging-worker-settings-readback.json"
          python3 scripts/verify_issue_1700_existing_deployment.py capture-candidate-diagnostics \
            --version "$RUNNER_TEMP/staging-current-candidate-version.json" \
            --settings "$RUNNER_TEMP/staging-worker-settings.json" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-sha "$GITHUB_SHA" \
            --marker "$DEPLOYMENT_MARKER" \
            --receipt "$RUNNER_TEMP/staging-candidate-runtime-diagnostics.json"
      - name: Verify candidate has no canonical staging route
        id: candidate_route
        if: steps.verify.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_route_inventory.py \
            > "$RUNNER_TEMP/staging-route-inventory-after.json"

      - name: Bind temporary HTTP bootstrap to the exact verified candidate
        id: http_bind
        if: steps.verify.outcome == 'success' && steps.candidate_route.outcome == 'success'
        env:
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.verify_candidate.outputs.candidate_deployment_id }}
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
          IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          payload={'operation_id':os.environ['GITHUB_RUN_ID'],
                   'candidate_deployment_id':os.environ['CANDIDATE_DEPLOYMENT_ID'],
                   'candidate_version_id':os.environ['CANDIDATE_VERSION_ID'],
                   'worker_release':os.environ['GITHUB_SHA'],'image_digest':os.environ['IMAGE_DIGEST']}
          subprocess.run(['node','scripts/issue_1700_http_bootstrap.mjs','bind_candidate',
                          os.environ['RUNNER_TEMP']+'/staging-http-broker'],
                         input=json.dumps(payload),text=True,check=True,
                         env={key:os.environ[key] for key in ('PATH','HOME','LANG') if key in os.environ})
          PY

      - name: Roll back only this run to the recorded exact preimage
        id: early_rollback
        if: failure() && steps.verify_candidate.outcome == 'success' && (steps.verify.outcome != 'success' || steps.candidate_route.outcome != 'success')
        env:
          ROUTE_READ_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
          PREIMAGE_VERSION_ID: ${{ steps.preimage.outputs.preimage_version_id }}
          PREIMAGE_DEPLOYMENT_ID: ${{ steps.preimage.outputs.preimage_deployment_id }}
          PREIMAGE_CONTAINER_IMAGE: ${{ steps.preimage.outputs.preimage_container_image }}
          CANDIDATE_CONTAINER_VERSION: ${{ steps.candidate_container.outputs.candidate_container_version }}
          CANDIDATE_CONTAINER_IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          PREIMAGE_CONTAINER_VERSION: ${{ steps.preimage.outputs.preimage_container_version }}
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.verify_candidate.outputs.candidate_deployment_id }}
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
          ROLLBACK_MARKER: issue-1700-route-free-rollback-${{ github.run_id }}-${{ github.sha }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$ROUTE_READ_TOKEN" python3 scripts/verify_issue_1700_route_inventory.py > /dev/null
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-before-rollback.json"
          pnpm exec wrangler versions view "$CANDIDATE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-before-rollback-version.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-candidate \
            --deployments "$RUNNER_TEMP/staging-deployments-before-rollback.json" \
            --version "$RUNNER_TEMP/staging-before-rollback-version.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$DEPLOYMENT_MARKER" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --rollback-marker "$ROLLBACK_MARKER" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-after-runtime-probe.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="$CANDIDATE_CONTAINER_IMAGE_DIGEST" \
          EXPECTED_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-containers-after-runtime-probe.json"
          python3 - "$RUNNER_TEMP/staging-config/root.toml" "$RUNNER_TEMP/staging-config/rollback.toml" "$PREIMAGE_CONTAINER_IMAGE" <<'PY'
          import json,re,sys,tomllib
          from pathlib import Path
          source=Path(sys.argv[1]).read_text()
          config=tomllib.loads(source)
          image=sys.argv[3]
          pattern=r'^registry\.cloudflare\.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-staging-corelinkserver@sha256:[0-9a-f]{64}$'
          assert re.fullmatch(pattern,image)
          assert config.get('name')=='corelink-staging'
          assert config.get('account_id')=='6a1fc1c626fc2628823e60b9db01f5cd'
          assert config.get('workers_dev') is False
          assert not any(x in config for x in ('routes','route','custom_domain'))
          assert len(config.get('containers',[]))==1
          current=config['containers'][0]['image']
          matches=list(re.finditer(r'(?m)^image\s*=\s*"[^"\n]*Dockerfile"$',source))
          assert len(matches)==1 and current.endswith('Dockerfile')
          replacement='image = '+json.dumps(image)
          start,end=matches[0].span()
          Path(sys.argv[2]).write_text(source[:start]+replacement+source[end:])
          restored=tomllib.loads(Path(sys.argv[2]).read_text())
          assert restored['containers'][0]['image']==image
          PY
          node scripts/issue_1700_http_bootstrap.mjs cleanup "$RUNNER_TEMP/staging-http-broker" \
            > "$RUNNER_TEMP/staging-http-bootstrap-cleanup.json"
          # Ownership and quiescence are proven: from here the exact Worker preimage restore
          # is attempted however the Container steps below end (the rollback upload inherits
          # the candidate's admin key). The step keeps its failure outcome; the Worker and
          # Container preimages are verified separately.
          worker_restore_attempted=0
          restore_worker_preimage() {
            worker_restore_attempted=1
            pnpm exec wrangler versions deploy "${PREIMAGE_VERSION_ID}@100%" \
              --config "$RUNNER_TEMP/staging-config/root.toml" \
              --name corelink-staging --yes \
              --message "$ROLLBACK_MARKER"
            python3 - <<'PY' > "$RUNNER_TEMP/staging-http-bootstrap-restore.json"
          import json,os,subprocess
          # Provider readback: the exact preimage version is active at 100% and carries no admin key.
          payload={'api_token':os.environ['CLOUDFLARE_API_TOKEN'],
                   'preimage_deployment_id':os.environ['PREIMAGE_DEPLOYMENT_ID'],
                   'preimage_version_id':os.environ['PREIMAGE_VERSION_ID']}
          subprocess.run(['node','scripts/issue_1700_http_bootstrap.mjs','verify_restored',
                          os.environ['RUNNER_TEMP']+'/staging-http-broker'],
                         input=json.dumps(payload),text=True,check=True,
                         env={key:os.environ[key] for key in ('PATH','HOME','LANG') if key in os.environ})
          PY
          }
          finish_rollback() {
            local status=$?
            trap - EXIT
            if [ "$worker_restore_attempted" = 0 ]; then restore_worker_preimage || status=1; fi
            exit "$status"
          }
          trap finish_rollback EXIT
          pnpm exec wrangler deploy \
            --config "$RUNNER_TEMP/staging-config/rollback.toml" \
            --strict --message "$ROLLBACK_MARKER"
          EXPECTED_CONTAINER_IMAGE_DIGEST="${PREIMAGE_CONTAINER_IMAGE##*@}" \
            node scripts/issue_1700_runtime_probe.mjs wait-container-state \
            "$RUNNER_TEMP/staging-container-candidate.json" \
            "$RUNNER_TEMP/staging-containers-image-restored.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="${PREIMAGE_CONTAINER_IMAGE##*@}" \
          MIN_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-containers-image-restored.json"
          restore_worker_preimage
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-after-rollback.json"
          pnpm exec wrangler versions view "$PREIMAGE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-after-rollback-version.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-after-rollback.json"
          PREIMAGE_CONTAINER_IMAGE="$PREIMAGE_CONTAINER_IMAGE" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-rollback \
            "$RUNNER_TEMP/staging-containers-image-restored.json" \
            "$RUNNER_TEMP/staging-containers-after-rollback.json"

      - name: Verify route-free early rollback
        id: verify_early_rollback
        if: always() && steps.early_rollback.outcome == 'success'
        env:
          ROLLBACK_MARKER: issue-1700-route-free-rollback-${{ github.run_id }}-${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_route_inventory.py \
            > "$RUNNER_TEMP/staging-route-inventory-after-rollback.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-rollback \
            --deployments "$RUNNER_TEMP/staging-deployments-after-rollback.json" \
            --version "$RUNNER_TEMP/staging-after-rollback-version.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --routes "$RUNNER_TEMP/staging-route-inventory-after-rollback.json" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$ROLLBACK_MARKER"
          python3 - "$RUNNER_TEMP/staging-deploy-receipt.json" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]); receipt=json.loads(path.read_text())
          assert receipt['rollback']['confirmed'] is True
          receipt.update(rollout_state='preimage_restored',runtime_evidence_scope='historical',active_runtime_claim=False)
          path.write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY

      - name: Prove native D1 binding through authenticated HTTP and staging Container
        id: runtime_probe
        timeout-minutes: 23
        if: steps.verify.outcome == 'success' && steps.candidate_route.outcome == 'success' && steps.deployed_image.outcome == 'success' && steps.http_bind.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SENTRY_RELEASE: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'if (Number(process.versions.node.split(".")[0]) !== 22) process.exit(1)'
          echo '{"outcome":"incomplete","carrier":"authenticated_http","new_runtime_proof":false,"rollback_safe":false}' > "$RUNNER_TEMP/staging-runtime-probe-progress.json"
          # The broker keeps the ephemeral key only in RAM. The operator syncs
          # its attempt ledger before the sole POST. At most three authenticated
          # status GETs can read persisted state within the original deadline.
          # Cron/Tail transport remains UNPROVEN and is not used by this carrier.
          node scripts/issue_1700_http_bootstrap.mjs probe "$RUNNER_TEMP/staging-http-broker" \
            > "$RUNNER_TEMP/staging-runtime-probe-receipt.json" \
            2> >(tee "$RUNNER_TEMP/staging-runtime-probe-diagnostic.log" >&2)
          echo '{"outcome":"complete","carrier":"authenticated_http","rollback_safe":true}' > "$RUNNER_TEMP/staging-runtime-probe-progress.json"

      - name: Reverify unchanged rollout and record complete runtime proof
        if: steps.runtime_probe.outcome == 'success'
        env:
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.verify_candidate.outputs.candidate_deployment_id }}
          IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
          WORKER_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments-after-runtime-probe.json"
          pnpm exec wrangler versions view "$CANDIDATE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-version-after-runtime-probe.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-candidate \
            --deployments "$RUNNER_TEMP/staging-deployments-after-runtime-probe.json" \
            --version "$RUNNER_TEMP/staging-version-after-runtime-probe.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$DEPLOYMENT_MARKER" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-containers-after-runtime-probe.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="$IMAGE_DIGEST" \
          EXPECTED_CONTAINER_APP_VERSION="${{ steps.candidate_container.outputs.candidate_container_version }}" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-containers-after-runtime-probe.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $WORKER_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a1fc1c626fc2628823e60b9db01f5cd/workers/scripts/corelink-staging/settings" \
            --output "$RUNNER_TEMP/staging-worker-settings-final.json"
          python3 scripts/staging_deployment_guard.py settings \
            --response "$RUNNER_TEMP/staging-worker-settings-final.json" \
            --topology infra/staging/topology.json \
            > "$RUNNER_TEMP/staging-worker-settings-readback.json"
          EXPECTED_SHA="$GITHUB_SHA" node scripts/issue_1700_http_probe.mjs validate \
            "$RUNNER_TEMP/staging-runtime-probe-receipt.json" \
            "$RUNNER_TEMP/staging-http-broker/staging-http-probe-attempt.json"

      - name: Prove route-free settings after runtime probe
        id: route_after_runtime
        if: steps.runtime_probe.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_route_inventory.py \
            > "$RUNNER_TEMP/staging-route-inventory-after-runtime-probe.json"

      - name: Record complete runtime deployment receipt
        if: steps.runtime_probe.outcome == 'success' && steps.route_after_runtime.outcome == 'success'
        id: record_runtime
        run: |
          set -euo pipefail
          python3 scripts/staging_deployment_guard.py record-success \
            --response "$RUNNER_TEMP/staging-worker-settings-final.json" \
            --topology infra/staging/topology.json \
            --routes "$RUNNER_TEMP/staging-route-inventory-after-runtime-probe.json" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"

      - name: Mark finite runtime evidence as historical before bootstrap cleanup
        if: always() && steps.verify_candidate.outcome == 'success' && steps.early_rollback.outcome == 'skipped'
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/staging-deploy-receipt.json" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]); receipt=json.loads(path.read_text())
          receipt.update(rollout_state='preimage_restore_required',runtime_evidence_scope='historical',active_runtime_claim=False)
          path.write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY

      - name: Restore both preimages after the finite runtime operation
        id: runtime_rollback
        timeout-minutes: 12
        if: always() && steps.verify_candidate.outcome == 'success' && steps.verify.outcome == 'success' && steps.early_rollback.outcome == 'skipped'
        env:
          ROUTE_READ_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
          PREIMAGE_VERSION_ID: ${{ steps.preimage.outputs.preimage_version_id }}
          PREIMAGE_DEPLOYMENT_ID: ${{ steps.preimage.outputs.preimage_deployment_id }}
          PREIMAGE_CONTAINER_IMAGE: ${{ steps.preimage.outputs.preimage_container_image }}
          PREIMAGE_CONTAINER_VERSION: ${{ steps.preimage.outputs.preimage_container_version }}
          CANDIDATE_CONTAINER_VERSION: ${{ steps.candidate_container.outputs.candidate_container_version }}
          CANDIDATE_CONTAINER_IMAGE_DIGEST: ${{ steps.deployed_image.outputs.image_digest }}
          CANDIDATE_VERSION_ID: ${{ steps.verify_candidate.outputs.candidate_version_id }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.verify_candidate.outputs.candidate_deployment_id }}
          DEPLOYMENT_MARKER: issue-1700-route-free-${{ github.run_id }}-${{ github.sha }}
          ROLLBACK_MARKER: issue-1700-route-free-rollback-${{ github.run_id }}-${{ github.sha }}
          WORKER_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          HTTP_PROBE_STEP_OUTCOME: ${{ steps.runtime_probe.outcome }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$ROUTE_READ_TOKEN" python3 scripts/verify_issue_1700_route_inventory.py > /dev/null
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-runtime-deployments-before-rollback.json"
          pnpm exec wrangler versions view "$CANDIDATE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-runtime-version-before-rollback.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-candidate \
            --deployments "$RUNNER_TEMP/staging-runtime-deployments-before-rollback.json" \
            --version "$RUNNER_TEMP/staging-runtime-version-before-rollback.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$DEPLOYMENT_MARKER" \
            --expected-deployment-id "$CANDIDATE_DEPLOYMENT_ID" \
            --expected-version-id "$CANDIDATE_VERSION_ID" \
            --rollback-marker "$ROLLBACK_MARKER" \
            --output "$GITHUB_OUTPUT" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-runtime-containers-before-rollback.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="$CANDIDATE_CONTAINER_IMAGE_DIGEST" \
          EXPECTED_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-runtime-containers-before-rollback.json"
          python3 - "$RUNNER_TEMP/staging-config/root.toml" "$RUNNER_TEMP/staging-config/rollback-runtime.toml" "$PREIMAGE_CONTAINER_IMAGE" <<'PY'
          import json,re,sys,tomllib
          from pathlib import Path
          source=Path(sys.argv[1]).read_text()
          config=tomllib.loads(source)
          image=sys.argv[3]
          pattern=r'^registry\.cloudflare\.com/6a1fc1c626fc2628823e60b9db01f5cd/corelink-staging-corelinkserver@sha256:[0-9a-f]{64}$'
          assert re.fullmatch(pattern,image)
          assert config.get('name')=='corelink-staging'
          assert config.get('account_id')=='6a1fc1c626fc2628823e60b9db01f5cd'
          assert config.get('workers_dev') is False
          assert not any(x in config for x in ('routes','route','custom_domain'))
          assert len(config.get('containers',[]))==1
          current=config['containers'][0]['image']
          matches=list(re.finditer(r'(?m)^image\s*=\s*"[^"\n]*Dockerfile"$',source))
          assert len(matches)==1 and current.endswith('Dockerfile')
          replacement='image = '+json.dumps(image)
          start,end=matches[0].span()
          Path(sys.argv[2]).write_text(source[:start]+replacement+source[end:])
          restored=tomllib.loads(Path(sys.argv[2]).read_text())
          assert restored['containers'][0]['image']==image
          PY
          python3 scripts/issue_1700_rollback_quiescence.py
          node scripts/issue_1700_http_bootstrap.mjs cleanup "$RUNNER_TEMP/staging-http-broker" \
            > "$RUNNER_TEMP/staging-http-bootstrap-cleanup.json"
          # Keep the cleaned, admission-closed broker available for the second
          # fresh never_execute status check; always-local shutdown runs below.
          # Ownership and quiescence are proven: from here the exact Worker preimage restore
          # is attempted however the Container steps below end (the rollback upload inherits
          # the candidate's admin key). The step keeps its failure outcome; the Worker and
          # Container preimages are verified separately.
          worker_restore_attempted=0
          restore_worker_preimage() {
            worker_restore_attempted=1
            pnpm exec wrangler versions deploy "${PREIMAGE_VERSION_ID}@100%" \
              --config "$RUNNER_TEMP/staging-config/root.toml" \
              --name corelink-staging --yes --message "$ROLLBACK_MARKER"
            python3 - <<'PY' > "$RUNNER_TEMP/staging-http-bootstrap-restore.json"
          import json,os,subprocess
          # Provider readback: the exact preimage version is active at 100% and carries no admin key.
          payload={'api_token':os.environ['CLOUDFLARE_API_TOKEN'],
                   'preimage_deployment_id':os.environ['PREIMAGE_DEPLOYMENT_ID'],
                   'preimage_version_id':os.environ['PREIMAGE_VERSION_ID']}
          subprocess.run(['node','scripts/issue_1700_http_bootstrap.mjs','verify_restored',
                          os.environ['RUNNER_TEMP']+'/staging-http-broker'],
                         input=json.dumps(payload),text=True,check=True,
                         env={key:os.environ[key] for key in ('PATH','HOME','LANG') if key in os.environ})
          PY
          }
          finish_rollback() {
            local status=$?
            trap - EXIT
            if [ "$worker_restore_attempted" = 0 ]; then restore_worker_preimage || status=1; fi
            exit "$status"
          }
          trap finish_rollback EXIT
          pnpm exec wrangler deploy \
            --config "$RUNNER_TEMP/staging-config/rollback-runtime.toml" \
            --strict --message "$ROLLBACK_MARKER"
          EXPECTED_CONTAINER_IMAGE_DIGEST="${PREIMAGE_CONTAINER_IMAGE##*@}" \
            node scripts/issue_1700_runtime_probe.mjs wait-container-state \
            "$RUNNER_TEMP/staging-container-candidate.json" \
            "$RUNNER_TEMP/staging-runtime-containers-image-restored.json"
          EXPECTED_CONTAINER_IMAGE_DIGEST="${PREIMAGE_CONTAINER_IMAGE##*@}" \
          MIN_CONTAINER_APP_VERSION="$CANDIDATE_CONTAINER_VERSION" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-digest \
            "$RUNNER_TEMP/staging-runtime-containers-image-restored.json"
          ROLLBACK_CONTAINER_RESTORE_ATTEMPTED=1 python3 scripts/issue_1700_rollback_quiescence.py
          restore_worker_preimage
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-runtime-deployments-after-rollback.json"
          pnpm exec wrangler versions view "$PREIMAGE_VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-runtime-version-after-rollback.json"
          node scripts/issue_1700_runtime_probe.mjs read-container-state \
            > "$RUNNER_TEMP/staging-runtime-containers-after-rollback.json"
          PREIMAGE_CONTAINER_IMAGE="$PREIMAGE_CONTAINER_IMAGE" \
            node scripts/issue_1700_runtime_probe.mjs verify-container-rollback \
            "$RUNNER_TEMP/staging-runtime-containers-image-restored.json" \
            "$RUNNER_TEMP/staging-runtime-containers-after-rollback.json"
      - name: Verify route-free runtime rollback
        id: verify_runtime_rollback
        if: always() && steps.runtime_rollback.outcome == 'success'
        env:
          ROLLBACK_MARKER: issue-1700-route-free-rollback-${{ github.run_id }}-${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_route_inventory.py \
            > "$RUNNER_TEMP/staging-runtime-routes-after-rollback.json"
          python3 scripts/verify_issue_1700_existing_deployment.py verify-rollback \
            --deployments "$RUNNER_TEMP/staging-runtime-deployments-after-rollback.json" \
            --version "$RUNNER_TEMP/staging-runtime-version-after-rollback.json" \
            --preimage "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --routes "$RUNNER_TEMP/staging-runtime-routes-after-rollback.json" \
            --receipt "$RUNNER_TEMP/staging-deploy-receipt.json" \
            --marker "$ROLLBACK_MARKER"
          python3 - "$RUNNER_TEMP/staging-deploy-receipt.json" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]); receipt=json.loads(path.read_text())
          assert receipt['rollback']['confirmed'] is True
          receipt.update(rollout_state='preimage_restored',runtime_evidence_scope='historical',active_runtime_claim=False)
          path.write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY

      - name: Clean owned bootstrap when candidate execution was never reached
        if: always() && steps.http_bootstrap.outcome != 'skipped' && steps.runtime_probe.outcome == 'skipped' && steps.early_rollback.outcome == 'skipped' && steps.runtime_rollback.outcome == 'skipped'
        run: |
          set -euo pipefail
          # Broker-positive never_execute is required. Missing broker state or
          # an unknown candidate lineage leaves cleanup and rollback blocked.
          node scripts/issue_1700_http_bootstrap.mjs cleanup "$RUNNER_TEMP/staging-http-broker" \
            > "$RUNNER_TEMP/staging-http-bootstrap-cleanup.json"

      - name: Always shut down the local broker and verify its process has exited
        id: http_broker_shutdown
        if: always() && steps.http_bootstrap.outcome != 'skipped'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # Local process custody only, including UNKNOWN and cleanup failure.
          # This receipt never claims provider cleanup or rollback permission.
          node scripts/issue_1700_http_bootstrap.mjs shutdown "$RUNNER_TEMP/staging-http-broker" \
            > "$RUNNER_TEMP/staging-http-broker-shutdown.json"

      - name: Require historical native proof and verified restoration of both preimages
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.runtime_probe.outcome }}
          RECORD_OUTCOME: ${{ steps.record_runtime.outcome }}
          RESTORE_OUTCOME: ${{ steps.runtime_rollback.outcome }}
          VERIFY_RESTORE_OUTCOME: ${{ steps.verify_runtime_rollback.outcome }}
          BROKER_SHUTDOWN_OUTCOME: ${{ steps.http_broker_shutdown.outcome }}
        run: |
          set -euo pipefail
          test "$PROBE_OUTCOME" = success
          test "$RECORD_OUTCOME" = success
          test "$RESTORE_OUTCOME" = success
          test "$VERIFY_RESTORE_OUTCOME" = success
          test "$BROKER_SHUTDOWN_OUTCOME" = success

      - name: Upload redacted route-free deployment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1700-route-free-deployment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-deploy-receipt.json
            ${{ runner.temp }}/staging-container-preimage.json
            ${{ runner.temp }}/staging-container-candidate.json
            ${{ runner.temp }}/staging-route-inventory-before.json
            ${{ runner.temp }}/staging-route-inventory-after.json
            ${{ runner.temp }}/staging-route-inventory-after-rollback.json
            ${{ runner.temp }}/staging-worker-settings-readback.json
            ${{ runner.temp }}/staging-candidate-runtime-diagnostics.json
            ${{ runner.temp }}/staging-worker-settings-final.json
            ${{ runner.temp }}/staging-route-inventory-after-runtime-probe.json
            ${{ runner.temp }}/staging-runtime-probe-receipt.json
            ${{ runner.temp }}/staging-http-broker/staging-http-probe-attempt.json
            ${{ runner.temp }}/staging-http-broker/staging-http-bootstrap.json
            ${{ runner.temp }}/staging-http-bootstrap-cleanup.json
            ${{ runner.temp }}/staging-http-bootstrap-restore.json
            ${{ runner.temp }}/staging-http-broker-status.json
            ${{ runner.temp }}/staging-http-broker-shutdown.json
            ${{ runner.temp }}/staging-http-broker/broker-process.json
            ${{ runner.temp }}/staging-rollback-quiescence.json
            ${{ runner.temp }}/staging-runtime-probe-progress.json
            ${{ runner.temp }}/staging-runtime-probe-diagnostic.log
          retention-days: 30
          if-no-files-found: warn

  verify_existing:
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.operation == 'verify_existing' &&
      inputs.confirm == 'verify-existing-staging-1700'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm exact protected read-only verification
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ROLLOUT_SHA: ${{ inputs.rollout_sha }}
          ROLLOUT_RUN_ID: ${{ inputs.rollout_run_id }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERSION_ID: ${{ inputs.expected_version_id }}
          PREIMAGE_DEPLOYMENT_ID: ${{ inputs.preimage_deployment_id }}
          PREIMAGE_VERSION_ID: ${{ inputs.preimage_version_id }}
          IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$OPERATION" = 'verify_existing'
          test "$CONFIRM" = 'verify-existing-staging-1700'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          [[ "$ROLLOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLOUT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$PREIMAGE_DEPLOYMENT_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$PREIMAGE_VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GH_TOKEN"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create minimal read-only root config
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/staging-config"
          cat > "$RUNNER_TEMP/staging-config/root.toml" <<'TOML'
          name = "corelink-staging"
          account_id = "6a1fc1c626fc2628823e60b9db01f5cd"
          compatibility_date = "2026-04-01"
          workers_dev = false
          TOML
          test -s "$RUNNER_TEMP/staging-config/root.toml"
      - name: Install pinned Wrangler and gather provider readbacks
        env:
          VERSION_ID: ${{ inputs.expected_version_id }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec wrangler deployments list \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-deployments.json"
          pnpm exec wrangler versions view "$VERSION_ID" \
            --config "$RUNNER_TEMP/staging-config/root.toml" \
            --name corelink-staging --json \
            > "$RUNNER_TEMP/staging-version.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a1fc1c626fc2628823e60b9db01f5cd/workers/scripts/corelink-staging/settings" \
            --output "$RUNNER_TEMP/staging-worker-settings.json"
      - name: Read original rollout run metadata and immutable logs
        env:
          ROLLOUT_RUN_ID: ${{ inputs.rollout_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLOUT_RUN_ID" \
            --jq '{id,event,status,head_sha}' \
            > "$RUNNER_TEMP/rollout-run.json"
          gh run view "$ROLLOUT_RUN_ID" --repo "$GITHUB_REPOSITORY" --log \
            > "$RUNNER_TEMP/rollout-run.log"
      - name: Validate existing route-free rollout without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
          CURRENT_SHA: ${{ inputs.expected_sha }}
          ROLLOUT_SHA: ${{ inputs.rollout_sha }}
          ROLLOUT_RUN_ID: ${{ inputs.rollout_run_id }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERSION_ID: ${{ inputs.expected_version_id }}
          PREIMAGE_DEPLOYMENT_ID: ${{ inputs.preimage_deployment_id }}
          PREIMAGE_VERSION_ID: ${{ inputs.preimage_version_id }}
          IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
        run: |
          set -euo pipefail
          python3 scripts/verify_issue_1700_existing_deployment.py verify-existing \
            --deployments "$RUNNER_TEMP/staging-deployments.json" \
            --version "$RUNNER_TEMP/staging-version.json" \
            --settings "$RUNNER_TEMP/staging-worker-settings.json" \
            --topology infra/staging/topology.json \
            --workflow-run "$RUNNER_TEMP/rollout-run.json" \
            --rollout-log "$RUNNER_TEMP/rollout-run.log" \
            --receipt "$RUNNER_TEMP/staging-existing-deployment-receipt.json" \
            --current-sha "$CURRENT_SHA" \
            --rollout-sha "$ROLLOUT_SHA" \
            --rollout-run-id "$ROLLOUT_RUN_ID" \
            --deployment-id "$DEPLOYMENT_ID" \
            --version-id "$VERSION_ID" \
            --preimage-deployment-id "$PREIMAGE_DEPLOYMENT_ID" \
            --preimage-version-id "$PREIMAGE_VERSION_ID" \
            --image-digest "$IMAGE_DIGEST"
      - name: Upload redacted existing-deployment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1700-existing-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-existing-deployment-receipt.json
          retention-days: 30
          if-no-files-found: warn

  complete_existing:
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.operation == 'complete_existing' &&
      inputs.confirm == 'complete-existing-staging-1700'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd
      ROUTE_READ_TOKEN: ${{ secrets.STAGING_CF_ROUTE_READ_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ROLLOUT_SHA: ${{ inputs.rollout_sha }}
      ROLLOUT_RUN_ID: ${{ inputs.rollout_run_id }}
      DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      VERSION_ID: ${{ inputs.expected_version_id }}
      PREIMAGE_DEPLOYMENT_ID: ${{ inputs.preimage_deployment_id }}
      PREIMAGE_VERSION_ID: ${{ inputs.preimage_version_id }}
      IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned readback tools
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Complete only the attributed isolated candidate without deployment
        run: python3 scripts/complete_issue_1700_existing.py
      - name: Preserve completion or residual-state receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1700-existing-completion-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-1700-completion-receipt.json
          retention-days: 30
          if-no-files-found: warn

  historical_query:
    if: >-
      github.repository == 'HuGR-dev/corelink-server' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.operation == 'historical_query' &&
      inputs.confirm == 'historical-query-staging-1700'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Query only the original runtime invocation without persistence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/issue_1700_historical_query.py
      - name: Preserve sanitized historical classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1700-historical-classification-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-1700-historical-classification.json
          retention-days: 30
          if-no-files-found: error
