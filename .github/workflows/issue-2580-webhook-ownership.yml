name: Issue 2580 webhook ownership

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-2580-webhook-ownership.yml
      - apps/signup-worker/src/webhooks/billing_checkout.ts
      - apps/signup-worker/src/webhooks/stripe.ts
      - apps/signup-worker/src/webhooks/stripe_persistence_activation.ts
      - apps/signup-worker/src/webhooks/stripe_persistence_billing.ts
      - apps/signup-worker/src/webhooks/stripe_persistence_runner.ts
      - apps/signup-worker/src/webhooks/stripe_staging_batch.ts
      - apps/signup-worker/tests/stripe.test.ts
      - apps/signup-worker/tests/stripe_handler_helpers.ts
      - crates/corelink-billing-stripe-materializer/src/audit.rs
      - crates/corelink-billing-stripe-materializer/src/handler.rs
      - crates/corelink-billing-stripe-traits/src/lib.rs
      - crates/corelink-container/src/webhook.rs
      - crates/corelink-container/src/webhook_dlq_d1.rs
      - crates/corelink-container/src/webhook_inbox_d1.rs
      - crates/corelink-stripe-real/src/webhook_dispatch.rs
      - scripts/verify_issue_2580_webhook_ownership.py

permissions:
  contents: read

concurrency:
  group: issue-2580-webhook-ownership-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  scoped-proof:
    if: >-
      github.repository_id == vars.CORELINK_SERVER_REPO_ID &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind candidate and target base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0

      - name: Check Rust formatting and container API
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p corelink-server --lib

      - name: Exercise verified-context D1 inbox writer
        timeout-minutes: 12
        run: cargo test --locked -p corelink-server --lib webhook_inbox_d1::tests::verified_admission_context_registers_the_inbox_in_its_d1_batch -- --exact

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install focused Worker dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      - name: Typecheck and exercise signed webhook ownership cases
        run: |
          pnpm --filter @corelink/signup-worker typecheck
          pnpm --dir apps/signup-worker exec vitest run tests/stripe.test.ts

      - name: Verify writer/class census and negative-control contract
        run: python3 -I scripts/verify_issue_2580_webhook_ownership.py
