name: issue-1678 B-216 DSR DLQ receipt contract

on:
  pull_request:
    paths:
      - "apps/signup-worker/src/webhooks/dsr_consumer.ts"
      - "apps/signup-worker/src/index.ts"
      - "apps/signup-worker/tests/dsr_consumer.test.ts"
      - "apps/signup-worker/wrangler.toml"
      - ".github/workflows/staging-quarantine-apply.yml"
      - "scripts/verify_staging_topology_contract.py"
      - "infra/staging/topology.json"
      - "migrations/d1/0138_dsr_dlq_delivery_receipts.sql"
      - "migrations/d1/0145_dsr_dlq_redrive_authority.sql"
      - ".github/workflows/b216-receiver-deploy-nonprod.yml"
      - "apps/dsr-alert-receiver/scripts/deploy-route.mjs"
      - "apps/dsr-alert-receiver/scripts/run-disable-workers-dev.mjs"
      - "apps/dsr-alert-receiver/scripts/run-synthetic-exercise.mjs"
      - "apps/dsr-alert-receiver/scripts/synthetic-exercise.mjs"
      - "apps/dsr-alert-receiver/tests/deploy-route.test.mjs"
      - "apps/dsr-alert-receiver/tests/readback-route.test.mjs"
      - "apps/dsr-alert-receiver/tests/synthetic-exercise.test.mjs"
      - "apps/dsr-alert-receiver/package.json"
      - "apps/dsr-alert-receiver/pnpm-lock.yaml"
      - "scripts/apply_staging_b216_dsr_schema.py"
      - "scripts/verify-signup-worker-dsr-redrive-schema.sh"
      - "tests/test_b216_dsr_schema_fence.py"
      - "docs/operator/b216-staging-dsr-receiver-runbook.md"
      - "docs/internal/b215-b230-runtime-owner-actions.md"
      - "docs/internal/b216-critical-alert-contract.md"
      - "docs/internal/secrets-checklist.md"
      - "BACKLOG.md"
      - "scripts/verify-signup-worker-secrets.sh"
      - "scripts/verify_staging_topology_contract.py"
      - "scripts/verify_b215_b223_contracts.py"
      - ".github/workflows/signup-worker-deploy.yml"
      - ".github/workflows/issue-1678-b216-dsr-dlq.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dlq-receipt-contract:
    # This intentionally stays on GitHub-hosted infrastructure: it validates
    # only the B-216 consumer contract and has no Cloudflare credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact requested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned signup-worker dependencies
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts
      - name: Exercise B-216 DSR DLQ receipt contract
        run: pnpm --dir apps/signup-worker exec vitest run tests/dsr_consumer.test.ts
      - name: Install pinned isolated receiver dependencies
        run: pnpm --dir apps/dsr-alert-receiver install --frozen-lockfile --ignore-workspace --ignore-scripts
      - name: Exercise fixed receiver deployment and synthetic receipt contract
        run: pnpm --dir apps/dsr-alert-receiver exec vitest run tests/deploy-route.test.mjs tests/readback-route.test.mjs tests/synthetic-exercise.test.mjs
      - name: Check the OAuth-only fixed-target schema operator contract
        run: |
          set -euo pipefail
          bash -n scripts/verify-signup-worker-dsr-redrive-schema.sh
          python3 -B -m unittest -v tests/test_b216_dsr_schema_fence.py
          python3 -B scripts/apply_staging_b216_dsr_schema.py --check-contract
          python3 scripts/verify_staging_topology_contract.py --expect ready
      - name: Verify the provider-neutral B-216 alert contract
        run: |
          python3 scripts/verify_b101_proposals.py --id B-216
          python3 -I scripts/verify_b215_b223_contracts.py --id B-216 --self-test
          python3 scripts/verify_staging_topology_contract.py --expect ready
      - name: Prove B-216 static mutations break redrive invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("apps/signup-worker/src/webhooks/dsr_consumer.ts").read_text()
          required = (
              "constantTimeEqual(token, expected)",
              "state='ready' AND requeue_count=0 AND expires_at_ms>?5",
              "!redrive || !await redrive.capture(eventId, body, Date.now())",
              "await store.fence(eventId, Date.now())",
              "INSERT OR IGNORE INTO dsr_dlq_redrive_audit",
          )
          assert all(marker in source for marker in required)
          PY
