# OKF auto-reconcile — the "LLM half" of the self-healing loop.
#
# WHAT IT DOES: after a merge to main that touches source code, it checks whether any
# OKF concept's cited lines drifted (the deterministic reporter `okf_reconcile.py`). If
# drift exists, it launches Codex headless to run the `okf-reconcile` skill
# — reconciling the stale concepts' citations to the current code + advancing checkpoints —
# then DETERMINISTIC steps validate the result and open a PR. The agent only EDITS docs;
# the git/PR mechanics are owned by the workflow (not the model), and a PR is opened ONLY
# if the wiki gate (validate + fixtures) is green.
#
# ── ONE-TIME HUMAN STEP ──
#   Add the repo secret OPENAI_API_KEY (Settings → Secrets → Actions). The Codex
#   Action cannot run without it. The workflow is push/main + dispatch/main only;
#   it never exposes that secret to a fork pull request.
#   The open-PR step requires the repository-scoped App secrets
#   `CORELINK_BOT_APP_ID` and `CORELINK_BOT_APP_PRIVATE_KEY` for unattended CI.
#   Each job mints a short-lived installation token; it never stores that token.
#   GITHUB_TOKEN-created PRs may produce approval-required pull_request runs,
#   not automatic execution; missing runner capacity or zero-job startup
#   failures are separate blockers. This workflow's own
#   pre-PR validation is not proof that the PR's required jobs completed.
#
# COST/SAFETY: runs after a trusted main merge or an operator dispatch on main;
# spends tokens only when drift is real (stale_count > 0); 20-min hard timeout;
# bounded by the finite worklist; never touches non-doc code (enforced by the
# denial guard, state snapshot, prompt, and post-run path guard).

name: OKF auto-reconcile

on:
  # No pull_request trigger: OPENAI_API_KEY is never available to fork code.
  # A merge to main is trusted and is the normal automatic trigger. Dispatch is
  # also accepted, but the job below is restricted to the main ref.
  push:
    branches: [main]
    paths:
      - 'docs/knowledge/**'
      - 'docs/internal/okf-wiki/**'
      - 'crates/**'
      - 'migrations/**'
      - 'specs/**'
      - 'worker/**'
      - 'apps/**'
      - 'scripts/validate_okf.py'
      - 'scripts/validate_permission_matrix.py'
      - 'scripts/okf_reconcile.py'
      - 'scripts/okf_git_batch.py'
      - 'scripts/okf_resolve_abbrev_cites.py'
      - 'scripts/okf_shift_citations.py'
      - 'scripts/okf_anchor_reverify.py'
      - 'scripts/okf_index.py'
      - 'scripts/okf_status.py'
      - 'scripts/verify_okf_autoreconcile.py'
      - 'scripts/okf-state-sha.sh'
      - 'scripts/okf-reconcile-local.sh'
      - 'scripts/okf-agent-*.sh'
      - 'tests/okf/**'
      - 'tests/test_verify_okf_autoreconcile.py'
      - 'tests/test_okf_b049.py'
      - 'tests/test_okf_resolve_abbrev_cites.py'
      - 'tests/test_okf_shift_citations.py'
      - 'tests/test_okf_anchor_reverify.py'
      - '.claude/skills/okf-reconcile/**'
      - '.github/workflows/okf*.yml'
      - '.github/workflows/okf-autoreconcile.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the agent even if the reporter sees 0 drift (debug)'
        type: boolean
        default: false

concurrency:
  group: okf-autoreconcile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  autoreconcile:
    if: github.ref == 'refs/heads/main'
    # The Codex action needs a stable, authenticated host. `corelink` is the
    # ephemeral Cloudflare fleet and has no founder login; the measured runner
    # registry labels the persistent macOS builders as this exact tuple.
    runs-on: [self-hosted, mac, corelink-builder]
    timeout-minutes: 20
    steps:
      - name: Mint repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@def152b8a737443d7af6c5722c6389146fe90c90 # v2.1.2
        with:
          app-id: ${{ secrets.CORELINK_BOT_APP_ID }}
          private-key: ${{ secrets.CORELINK_BOT_APP_PRIVATE_KEY }}
          owner: corelink-dev
          repositories: corelink-server
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout (full history — reconcile compares cited lines across SHAs)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Fetch auth is explicit even though credentials are not persisted;
          # the PR step below installs the short-lived App token for the branch push.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: B-058 contract and mutation self-test
        # The contract self-test is deliberately before the reporter: a gate
        # whose own containment teeth are dead must stop before spending tokens.
        run: |
          set -euo pipefail
          python3 scripts/verify_okf_autoreconcile.py --self-test
          python3 -m unittest tests/test_verify_okf_autoreconcile.py

      - name: Detect OKF drift (deterministic reporter — no LLM, no cost)
        id: drift
        run: |
          set -euo pipefail
          python3 scripts/okf_reconcile.py --json > .okf_worklist.json
          stale=$(python3 -c "import json,sys; print(json.load(open('.okf_worklist.json'))['stale_count'])")
          echo "stale_count=$stale" >> "$GITHUB_OUTPUT"
          echo "OKF reconcile reporter: stale_count=$stale"
          python3 scripts/okf_reconcile.py || true   # human-readable worklist into the log

      - name: Skip cleanly when nothing drifted
        if: steps.drift.outputs.stale_count == '0' && github.event.inputs.force != 'true'
        run: |
          rm -f .okf_worklist.json
          echo "No OKF drift — nothing to reconcile. Exiting clean (zero agent cost)."

      - name: Snapshot git state before Codex (fail-closed baseline)
        id: snapshot
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        run: |
          set -euo pipefail
          {
            echo HEAD; git rev-parse HEAD
            echo BRANCH; git symbolic-ref --quiet --short HEAD || true
            echo REFS; git for-each-ref --format='%(refname) %(objectname)'
            echo REMOTES; git remote -v
            echo WORKTREES; git worktree list --porcelain
          } > "$RUNNER_TEMP/okf_state_before"
          echo "state_sha=$(scripts/okf-state-sha.sh "$RUNNER_TEMP/okf_state_before")" >> "$GITHUB_OUTPUT"

      - name: Install Codex pre-execution denial guard
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/okf-agent-guard"
          mkdir -p "$guard/bin"
          cp scripts/okf-agent-git-guard.sh "$guard/bin/git"
          cp scripts/okf-agent-gh-guard.sh "$guard/bin/gh"
          chmod 755 "$guard/bin/git" "$guard/bin/gh"
          : > "$guard/mutation.log"
          chmod 600 "$guard/mutation.log"
          {
            echo "OKF_ORIGINAL_PATH=$PATH"
            echo "OKF_REAL_GIT=$(command -v git)"
            echo "OKF_GUARD_MARKER=$guard/mutation.log"
          } >> "$GITHUB_ENV"
          echo "$guard/bin" >> "$GITHUB_PATH"

      - name: Run the okf-reconcile skill (Codex headless)
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          codex-version: '0.152.1'
          model: 'gpt-5.6-luna'
          effort: 'high'
          codex-args: '["--ephemeral", "--ignore-user-config", "--sandbox", "workspace-write"]'
          prompt: |
            You are running headless in CI to reconcile the OKF architecture wiki after a code merge.
            A deterministic reporter has already identified the drifted concepts — its worklist is at
            .okf_worklist.json (fields: stale_count, worklist[] with concept + drifted cited ranges).

            TASK — follow the repo skill `.claude/skills/okf-reconcile/SKILL.md` exactly:
            1. Run `python3 scripts/okf_reconcile.py` to see the worklist; for EACH stale concept, open its
               cited code at the CURRENT HEAD and find where the cited CONTENT moved.
            2. Update that concept's `# Citations` line ranges (and any inline path:line) to the CURRENT
               correct lines. CONFIRM the claim still HOLDS at the new location — if the code CHANGED the
               behavior, UPDATE the claim to the current truth HONESTLY (never blind-bump). This is the whole
               point: keep the wiki TRUE, not just green.
            3. Advance each touched concept's `checkpoint_sha` to the current HEAD commit SHA. The gate's C5b
               anti-phantom check REQUIRES a real body edit alongside a checkpoint bump — your cite/claim edit
               satisfies it; never bump a checkpoint with no body change.
            4. Regenerate the index: `python3 scripts/okf_index.py`.

            HARD CONSTRAINTS:
            - EDIT ONLY files under docs/knowledge/** and docs/internal/okf-wiki/** and docs/knowledge/index.md.
              NEVER edit code (crates/, worker/, apps/, scripts/, migrations/) — you are documenting it, not
              changing it. If a concept can't be reconciled without a code change, leave it and note it.
            - Every `# Citations` entry must resolve to a real path:line that PERFORMS the claim; every cited
              file must be in that concept's source_files.
            - Read-only git commands and deterministic helpers are allowed. Do NOT commit, push, mutate refs/remotes/worktrees, or open a PR. The workflow does that. Just leave the reconciled files edited.
            STOP when `python3 scripts/validate_okf.py` reports 0 stale / 0 drift for the concepts you fixed.

      - name: Verify Codex did not mutate git state (fail-closed)
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        env:
          PATH: ${{ env.OKF_ORIGINAL_PATH }}
          OKF_REAL_GIT: ''
          OKF_GUARD_MARKER: ''
        run: |
          set -euo pipefail
          {
            echo HEAD; git rev-parse HEAD
            echo BRANCH; git symbolic-ref --quiet --short HEAD || true
            echo REFS; git for-each-ref --format='%(refname) %(objectname)'
            echo REMOTES; git remote -v
            echo WORKTREES; git worktree list --porcelain
          } > "$RUNNER_TEMP/okf_state_after"
          after_sha="$(scripts/okf-state-sha.sh "$RUNNER_TEMP/okf_state_after")"
          if [[ "$after_sha" != "${{ steps.snapshot.outputs.state_sha }}" ]]; then
            echo "::error::Codex mutated HEAD, refs, remotes, or worktrees — refusing to continue"
            diff -u "$RUNNER_TEMP/okf_state_before" "$RUNNER_TEMP/okf_state_after" || true
            exit 1
          fi
          if [[ -s "$RUNNER_TEMP/okf-agent-guard/mutation.log" ]]; then
            echo "::error::Codex attempted a forbidden git/PR operation — refusing to continue"
            cat "$RUNNER_TEMP/okf-agent-guard/mutation.log"
            exit 1
          fi

      - name: Restore proprietary gate environment
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        run: |
          set -euo pipefail
          test -n "${OKF_ORIGINAL_PATH:?}"
          {
            echo "PATH=$OKF_ORIGINAL_PATH"
            echo "OKF_REAL_GIT="
            echo "OKF_GUARD_MARKER="
          } >> "$GITHUB_ENV"
          echo "Codex guard removed before proprietary Verify/Validate/PR gates"

      - name: Validate the reconcile (gate — no PR unless green)
        id: validate
        if: steps.drift.outputs.stale_count != '0' || github.event.inputs.force == 'true'
        env:
          PATH: ${{ env.OKF_ORIGINAL_PATH }}
          OKF_REAL_GIT: ''
          OKF_GUARD_MARKER: ''
        run: |
          set -euo pipefail
          python3 scripts/okf_index.py
          rm -f .okf_worklist.json
          # Fail if the agent touched anything outside the doc trees. Include
          # untracked files: `git diff --name-only` alone would miss them.
          outside=()
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/knowledge/*|docs/internal/okf-wiki/*) ;;
              *) outside+=("$path") ;;
            esac
          done < <({ git diff --name-only -z HEAD; git ls-files --others --exclude-standard -z; })
          if (( ${#outside[@]} )); then
            echo "::error::agent edited files outside OKF docs — refusing to open a PR"
            printf '%s\n' "${outside[@]}"
            exit 1
          fi
          python3 scripts/validate_okf.py
          bash tests/okf/run_fixtures.sh
          if [[ -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Agent made no changes — nothing to PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the auto-reconcile PR
        if: steps.validate.outputs.changed == 'true'
        env:
          BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PATH: ${{ env.OKF_ORIGINAL_PATH }}
          OKF_REAL_GIT: ''
          OKF_GUARD_MARKER: ''
        run: |
          set -euo pipefail
          : "${BOT_APP_TOKEN:?BOT_APP_TOKEN must be configured before opening an auto-PR}"
          export GH_TOKEN="${BOT_APP_TOKEN}"
          gh auth setup-git
          BR="auto/okf-reconcile-${{ github.run_id }}"
          git config user.name  "okf-autoreconcile[bot]"
          git config user.email "okf-autoreconcile@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -q -m "docs(okf): auto-reconcile concept citations after ${{ github.sha }}" \
            -m "Deterministic reporter flagged drifted cited lines after a code merge; the okf-reconcile skill reconciled the affected concepts to current code (cites re-anchored, claims re-verified, checkpoints advanced). validate + fixtures green." \
            -m "Signed-off-by: okf-autoreconcile[bot] <okf-autoreconcile@users.noreply.github.com>" \
            -m "Co-Authored-By: Codex <noreply@openai.com>"
          git push -q origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs(okf): auto-reconcile after ${{ github.sha }}" \
            --body "Automated OKF self-healing: a code merge drifted cited lines; the \`okf-reconcile\` skill re-anchored the affected concepts to current code and re-verified the claims. **Pre-validated green** by this workflow (validate_okf + fixtures) before opening. Review the diff for claim-correctness (the gate proves freshness, not semantic correctness — that's the human check) and merge.

          🤖 okf-autoreconcile · run ${{ github.run_id }}

          Generated with Codex."
