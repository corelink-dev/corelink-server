name: BYOK Matrix — Weekly Staging (WI-S14-005)

concurrency:
  # Escopo por ref. Grupo CONSTANTE torna o grupo repo-global: duas execucoes
  # `workflow_dispatch` deste mesmo workflow em branches DIFERENTES cancelam uma
  # a outra. Foi o que matou tres dispatches em 2026-08-31.
  group: "ci-byok-matrix-weekly-staging-wi-s14-005-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# Weekly cron staging run of the 16-combination matrix test
# (4 providers × 4 ops). Fires every Monday at 06:17 UTC.
#
# All 16 cells MUST be green. Any failure triggers SEV-2 alert
# (see post-mortem hook WI-S14-005 §24).
#
# Workflow also runs proptest-extended (100k iter) and adversarial
# regression nightly tier (same as weekly cadence for BYOK providers).
#
# In staging mode (CORELINK_BYOK_*_MOCK != "1"), real provider
# credentials are used. CI (non-staging) always uses mock mode.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Cargo.lock'
      - 'crates/corelink-byok/**'
      - 'crates/corelink-container/Cargo.toml'
      - 'crates/corelink-container/src/main.rs'
      - 'crates/corelink-container/src/lib.rs'
      - 'crates/corelink-container/src/byok.rs'
      - 'crates/corelink-container/src/byok_orchestrator.rs'
      - 'crates/corelink-container/src/routes/byok_admin.rs'
      - 'crates/corelink-container/src/storage/byok_cas.rs'
      - 'crates/corelink-container/tests/byok_orchestrator.rs'
      - 'tests/test_verify_b083_byok.py'
      - 'docs/knowledge/storage/byok-envelope-encryption.md'
      - 'BACKLOG.md'
      - 'CHANGELOG.md'
  schedule:
    # Weekly: Monday 06:17 UTC (staggered from nightly crons).
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Force mock mode (true = mock; false = real staging APIs)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  byok-boundary-static:
    name: BYOK boundary verifier (static + mutation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify multiline production feature selection and mutation teeth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile").read_text()
          lines = dockerfile.splitlines()
          command = ""
          for index, line in enumerate(lines):
              if line.lstrip().startswith("cargo build") and "-p corelink-server" in line:
                  command = line
                  while command.rstrip().endswith("\\"):
                      index += 1
                      line = lines[index]
                      command = command.rstrip()[:-1] + " " + line
                  break
          assert command, "canonical corelink-server build command missing"
          # #1648: the shipped image links NO KMS provider. Its one switch is
          # the build argument, declared with an empty default.
          switch = "${CORELINK_BYOK_PROVIDER_FEATURE:+--features $CORELINK_BYOK_PROVIDER_FEATURE}"
          default = "ARG CORELINK_BYOK_PROVIDER_FEATURE="
          def ships_no_provider(text, build):
              defaults = [line.strip() for line in text.splitlines()
                          if line.strip().startswith("ARG CORELINK_BYOK_PROVIDER_FEATURE")]
              return (defaults == [default] and switch in build
                      and "--features byok-" not in build)
          assert ships_no_provider(dockerfile, command), command
          armed = dockerfile.replace(default + "\n", default + "byok-aws-real\n", 1)
          assert armed != dockerfile, "armed-default mutation did not apply"
          assert not ships_no_provider(armed, command), "armed-default mutation survived"
          literal = command.replace(switch, "--features byok-aws-real")
          assert not ships_no_provider(dockerfile, literal), "literal-feature mutation survived"
          assert "crates/corelink-container/src/main.rs" in Path(".github/workflows/byok_matrix_weekly.yml").read_text()
          assert "crates/corelink-container/src/lib.rs" in Path(".github/workflows/byok_matrix_weekly.yml").read_text()
          print("BYOK boundary verifier green; armed-default and literal-feature mutations are red")
          PY

      - name: B083 verifier mutation regression
        run: python3 tests/test_verify_b083_byok.py

  # ────────────────────────────────────────────────────────────────────
  # 1. 16-combination matrix test (4 providers × 4 ops = 16 cells).
  # Auto-fail if any cell breaks.
  # ────────────────────────────────────────────────────────────────────
  byok-matrix-16:
    name: BYOK 16-cell matrix (${{ inputs.mock_mode == 'false' && 'STAGING' || 'MOCK' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Use workspace-pinned toolchain
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: 16-combination matrix test (BYOK)
        env:
          # In staging: unset mock env vars to use real provider APIs.
          # In mock (default/CI): mock mode forced.
          CORELINK_BYOK_GCP_MOCK: ${{ inputs.mock_mode == 'false' && '' || '1' }}
          CORELINK_BYOK_AZURE_MOCK: ${{ inputs.mock_mode == 'false' && '' || '1' }}
          CORELINK_BYOK_VAULT_MOCK: ${{ inputs.mock_mode == 'false' && '' || '1' }}
          # Staging credentials (injected from repo secrets in staging mode).
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_KMS_STAGING_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_KMS_STAGING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_KMS_STAGING_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_KMS_STAGING_CLIENT_SECRET }}
          VAULT_ADDR: ${{ secrets.VAULT_STAGING_ADDR }}
        run: |
          set -euo pipefail
          cargo test \
            --package corelink-byok \
            --features _matrix-test \
            --test matrix \
            -- --nocapture 2>&1 | tee /tmp/byok_matrix_16_report.txt

      - name: Upload matrix test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byok-matrix-16-report-${{ github.run_id }}
          path: /tmp/byok_matrix_16_report.txt
          retention-days: 90

      - name: Fail on matrix break (SEV-2)
        if: failure()
        run: |
          echo "::error::BYOK 16-cell matrix FAILED — SEV-2 triggered. Check report artifact."
          echo "::error::Post-mortem required per WI-S14-005 §24 (matrix cell break > 1h)."
          exit 1

  # ────────────────────────────────────────────────────────────────────
  # 2. proptest extended (100k iter) — BYOK per-provider.
  # ────────────────────────────────────────────────────────────────────
  byok-proptest-100k:
    name: BYOK proptest 100k iter (4 props × all providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Use workspace-pinned toolchain
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: proptest 100k iter — BYOK 4 props per provider
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_MAX_LOCAL_REJECTS: '100000'
          PROPTEST_MAX_GLOBAL_REJECTS: '500000'
          CORELINK_BYOK_GCP_MOCK: '1'
          CORELINK_BYOK_AZURE_MOCK: '1'
          CORELINK_BYOK_VAULT_MOCK: '1'
        run: |
          set -euo pipefail
          cargo test --release \
            --package corelink-byok \
            --features _matrix-test \
            --test matrix_prop

  # ────────────────────────────────────────────────────────────────────
  # 3. Adversarial regression test (all 16 scenarios).
  # ────────────────────────────────────────────────────────────────────
  byok-adversarial:
    name: BYOK adversarial regression (16 scenarios)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Use workspace-pinned toolchain
        env:
          HOST_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/ci-use-host-toolchain.sh

      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"

      - name: Adversarial regression tests — BYOK per provider
        env:
          CORELINK_BYOK_GCP_MOCK: '1'
          CORELINK_BYOK_AZURE_MOCK: '1'
          CORELINK_BYOK_VAULT_MOCK: '1'
        run: |
          set -euo pipefail
          cargo test \
            --package corelink-byok \
            --features _matrix-test \
            --test matrix_adversarial \
            -- --nocapture

  # ────────────────────────────────────────────────────────────────────
  # 4. FIPS compliance status check (quarterly review reminder).
  # Fires only on the first Monday of each month as a quarterly proxy.
  # ────────────────────────────────────────────────────────────────────
  byok-fips-status-check:
    name: BYOK FIPS compliance status check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '17 6 * * 1')

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify FIPS compliance matrix doc exists
        run: |
          set -euo pipefail
          if [[ ! -f "compliance/byok-fips-matrix.md" ]]; then
            echo "::error::compliance/byok-fips-matrix.md missing — FIPS doc gate failed"
            exit 1
          fi
          echo "FIPS compliance matrix doc present: OK"
          # Verify all 4 providers are documented.
          for provider in "AWS KMS" "GCP KMS" "Azure Key Vault" "HashiCorp Vault"; do
            if ! grep -q "$provider" compliance/byok-fips-matrix.md; then
              echo "::error::Provider '$provider' missing from compliance/byok-fips-matrix.md"
              exit 1
            fi
          done
          echo "All 4 providers documented: OK"
