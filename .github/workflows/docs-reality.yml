name: Docs Reality Gate

# Makes customer-facing doc/marketing drift from code STRUCTURALLY impossible.
#
# `docs/knowledge/` (the OKF wiki) is anti-drift-gated against code, but nothing
# gated `apps/docs/` (product docs), `marketing/`, or `tools/cli/` — so claims
# drifted silently (a documented `corelink bazel-init` that never existed; a
# quickstart telling users to hash SHA-256 while the server verifies BLAKE3;
# marketing selling BYOK-4-providers-GA with the prod KMS wiring still deferred).
#
# This gate FAILS a PR when a `corelink <subcommand>` referenced in a code block
# under those roots is not in the CLI `enum Commands`, when a curated claim rule
# contradicts an OKF-deferred capability or a canonical code fact, or (best-effort)
# when a flagship onboarding recipe names an HTTP path that resolves to no wired
# route. Known in-flight drift is tracked in scripts/docs_reality_allowlist.json
# (non-fatal here, `--strict` to fail) so the gate is green today yet catches any
# NEW drift immediately.
#
# Fires on PRs that touch the surfaces a claim can drift against:
#   - the product docs / marketing corpus
#   - the CLI source (the command truth)
#   - the OKF concepts a deferred-coherence rule grounds against
#   - the route tables the endpoint check resolves against
#   - the validator + allowlist themselves
#
# Pin policy: third-party actions pinned to 40-char SHA + version comment.

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'apps/*/src/**'
      - 'marketing/**'
      - 'docs/**'
      - 'tools/**'
      - 'docs/knowledge/**'
      - 'crates/**/src/**'
      - 'worker/src/**'
      # [hostname-liveness] surfaces: a dead hostname ships from these too.
      - 'README.md'
      - '*.md'
      # CHANGELOG.md is NOT scanned (it narrates dead hosts by design), so a
      # changelog-only edit must not wake the fleet — every feat:/fix: PR has one.
      - '!CHANGELOG.md'
      - 'openapi/**'
      - 'sdks/**'
      - 'examples/**'
      - 'templates/**'
      - 'legal/**'
      - 'corelink-go/**'
      - 'scripts/validate_docs_reality.py'
      - 'scripts/docs_reality_allowlist.json'
      - 'tests/test_validate_docs_reality_hostnames.py'
      # The B-127 operator runbook depends on the offline receipt classifier;
      # validate its negative cases whenever that contract or the runbook changes.
      - 'scripts/RB-AUDIT-RESIDENCY-THIRD-STATE.md'
      - 'scripts/classify_i1669_receipt.py'
      - 'scripts/probe_i1669_readonly.py'
      - 'scripts/verify_audit_residency.py'
      - 'tests/test_i1669_receipt_classifier.py'
      - 'tests/test_verify_audit_residency.py'
      - 'BACKLOG.md'
      - 'reports/owner-actions/b170-prelaunch-reconciliation.md'
      - 'scripts/verify_b170_owner_actions.py'
      - 'tests/test_verify_b170_owner_actions.py'
      - '.github/workflows/docs-reality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/*/src/**'
      - 'marketing/**'
      - 'tools/**'
      - 'crates/**/src/**'
      - 'worker/src/**'
      - 'README.md'
      - '*.md'
      # CHANGELOG.md is NOT scanned (it narrates dead hosts by design), so a
      # changelog-only edit must not wake the fleet — every feat:/fix: PR has one.
      - '!CHANGELOG.md'
      - 'openapi/**'
      - 'sdks/**'
      - 'examples/**'
      - 'templates/**'
      - 'legal/**'
      - 'corelink-go/**'
      - 'scripts/validate_docs_reality.py'
      - 'scripts/docs_reality_allowlist.json'
      - 'scripts/RB-AUDIT-RESIDENCY-THIRD-STATE.md'
      - 'scripts/classify_i1669_receipt.py'
      - 'scripts/probe_i1669_readonly.py'
      - 'scripts/verify_audit_residency.py'
      - 'tests/test_i1669_receipt_classifier.py'
      - 'tests/test_verify_audit_residency.py'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-reality:
    name: Validate customer-facing claims against shipped reality
    # Runner: self-hosted mac fleet (CI cost diet 2026-08-01).
    # stdlib-only python3 validator; the step comment below already
    # documents it was written to be fleet-safe.
    # Hosted minutes bill with a 1-MINUTE-PER-JOB FLOOR, so this sub-minute
    # check costs a full paid minute every run; on the fleet it costs $0.
    # Verified running natively on the fleet host (macOS/BSD userland).
    # zero-hosted (WP-CI): python3 puro (baked na imagem da frota)
    runs-on: ubuntu-latest
    # Bound the job (CI cost diet 2026-08-01): a self-hosted job with no
    # timeout inherits GitHub's 360-min default, so one wedged run can hold
    # 1 of the 4 `corelink-builder` runners for 6h and stall
    # `scripts/pre-merge-gate-check.sh` (the mandatory merge gate) for every
    # other PR. This check is sub-minute.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # stdlib-only validator: needs only `python3` (ships on every runner).
      # No actions/setup-python (the self-hosted mac fleet can't provision it).
      - name: Run docs-reality validator
        id: validator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/docs-reality
          python3 scripts/validate_docs_reality.py | tee target/docs-reality/report.txt

      # The validator's own regression net. Gated here rather than left to be run
      # by hand: an ungated test suite is a suite that rots, and the floors it
      # asserts (a scan that inspected nothing is an ERROR) are the only thing
      # standing between this gate and a permanent, meaningless green.
      # pytest is NOT ambient here. This step used to rely on the mac fleet's
      # system pytest; on the `corelink` image `/usr/bin/python3` carries none,
      # so the first run of this lane after the move failed with "No module
      # named pytest" — a gate whose result depends on which machine picks up
      # the job. `python-tests.yml` already solved this and its comment names
      # THIS step as the one to port the fix to; that is what this is. No
      # `actions/setup-python`: `RUNNER_TOOL_CACHE` is unset on the fleet and it
      # dies on an unwritable path.
      - name: Install pytest (venv on system python3)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --quiet --upgrade pip
          .venv/bin/python3 -m pip install --quiet -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the hostname-liveness regression suite
        shell: bash
        run: |
          set -euo pipefail
          # Prove which interpreter is about to run, so a future PATH surprise is
          # visible in the log rather than inferred from a failure.
          command -v python3
          python3 -m pytest --version
          python3 -m pytest tests/test_validate_docs_reality_hostnames.py -q

      - name: Validate the offline #1669 receipt classifier
        shell: bash
        run: python3 -m pytest tests/test_i1669_receipt_classifier.py tests/test_verify_audit_residency.py -q

      - name: Summarize results in PR
        if: always()
        shell: bash
        run: |
          if [ -f target/docs-reality/report.txt ]; then
            {
              echo "## Docs Reality Gate"
              echo ""
              echo '```'
              tail -30 target/docs-reality/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report (30-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-reality-report
          path: target/docs-reality/
          retention-days: 30
          if-no-files-found: warn

  b170-owner-contract:
    name: B-170 prelaunch contract and negative suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit only the closed B-170 path set
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', base) or not re.fullmatch(r'[0-9a-f]{40}', head):
              raise SystemExit('invalid base/head SHA')
          raw = subprocess.run(['git','diff','--name-only','--no-renames','-z',base+'...'+head],check=True,capture_output=True).stdout
          changed = {p.decode('utf-8') for p in raw.split(b'\0') if p}
          base_text = subprocess.run(['git','show',base+':BACKLOG.md'],check=True,capture_output=True).stdout
          head_text = open('BACKLOG.md','rb').read()
          def b170_section_changed(before, after):
              marker = b'### B-170 \xe2\x80\x94 '
              def section(data):
                  start = data.find(marker)
                  if start < 0: raise SystemExit('B-170 heading missing')
                  end = data.find(b'### B-171 ', start)
                  if end < 0: raise SystemExit('B-171 boundary missing')
                  return data[start:end]
              return section(before) != section(after)
          row_changed = b170_section_changed(base_text, head_text)
          b170 = {'reports/owner-actions/b170-prelaunch-reconciliation.md','scripts/verify_b170_owner_actions.py','tests/test_verify_b170_owner_actions.py'}
          allowed = {'BACKLOG.md','.github/workflows/docs-reality.yml','.github/workflows/issue-ci-pack.yml','docs/internal/ci-issue-packs.json',*b170}
          mandatory = {'BACKLOG.md',*b170}
          if not changed.intersection(b170) and not row_changed:
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('skip=true\n')
              raise SystemExit(0)
          extra = changed - allowed
          missing = mandatory - changed
          if extra or missing:
              raise SystemExit(f'B-170 path admission failed; unexpected={sorted(extra)!r}, missing={sorted(missing)!r}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('skip=false\n')
          PY
      - name: Set up Python
        if: steps.admission.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run B-170 semantic negatives and canonical guard
        if: steps.admission.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest tests/test_verify_b170_owner_actions.py -q
          python scripts/verify_b170_owner_actions.py
