name: real ignored integration harnesses (B-068)

# This is an operator lane for real D1/R2/Stripe/Neon test infrastructure.
# It is deliberately not a PR, push, or scheduled job: repository code is
# allowed to make outbound calls only after an operator dispatches the pinned
# main ref and the protected environment approval is granted.
#
# The secret PAT-seed harness is not a profile here. It prints a PAT and seed
# SQL and therefore remains permanently outside CI; this workflow never
# receives the PAT signing key.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Real harness profile to execute"
        required: true
        type: choice
        default: d1
        options:
          - d1
          - r2
          - stripe
          - neon

permissions:
  contents: read

concurrency:
  group: real-ignored-harnesses-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  real-integration:
    name: real integration (${{ inputs.profile }})
    # Secrets are protected by this environment and are attached only to the
    # final executor step below. The contract/mutation step has no credentials.
    # D1 has an isolated Cloudflare account and its own protected credential
    # custody. Every other selectable profile retains the existing environment.
    environment: ${{ inputs.profile == 'd1' && 'real-d1-2563' || 'real-integration' }}
    runs-on: ubuntu-24.04
    if: github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.profile != 'all'
    timeout-minutes: 90
    steps:
      - name: Checkout pinned main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ref and event safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HuGR-dev/corelink-server"
          test "$GITHUB_REPOSITORY_ID" = "1232040291"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          echo "protected manual executor: repository/ref/event verified"

      - name: Verify executor contract and mutation guards
        run: python3 scripts/verify_real_ignored_harnesses.py

      - name: Execute selected real harnesses
        shell: bash
        env:
          # R2 receives the protected bearer only in this bootstrap step. The
          # bootstrap classifies it, requests one bucket-scoped trio, then
          # passes inert D1 parser fixtures to the test executor.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ inputs.profile == 'r2' && 'test' || secrets.D1_DATABASE_ID }}
          # Keep the sibling provider's credentials out of a D1-only run.
          R2_S3_ENDPOINT: ${{ (inputs.profile == 'r2' || inputs.profile == 'all') && secrets.R2_S3_ENDPOINT || '' }}
          R2_S3_ACCESS_KEY_ID: ${{ (inputs.profile == 'r2' || inputs.profile == 'all') && secrets.R2_S3_ACCESS_KEY_ID || '' }}
          # Parent R2 secret access keys never enter the workflow process.
          R2_S3_SECRET_ACCESS_KEY: ""
          # The session trio is returned in-memory for the exact R2 run.
          R2_S3_SESSION_TOKEN: ""
          R2_TEST_BUCKET: ${{ (inputs.profile == 'r2' || inputs.profile == 'all') && vars.R2_TEST_BUCKET || '' }}
          # These protected metadata bindings are populated only after a
          # separate official readback verifies parent-key identity/account.
          R2_PARENT_SCOPE_CONFIRMED_ACCESS_KEY_ID: ${{ inputs.profile == 'r2' && vars.R2_PARENT_SCOPE_CONFIRMED_ACCESS_KEY_ID || '' }}
          R2_PARENT_SCOPE_CONFIRMED_BUCKET: ${{ inputs.profile == 'r2' && vars.R2_PARENT_SCOPE_CONFIRMED_BUCKET || '' }}
          R2_PARENT_SCOPE_RECEIPT_SHA256: ${{ inputs.profile == 'r2' && vars.R2_PARENT_SCOPE_RECEIPT_SHA256 || '' }}
          # Stripe live integration uses the wallet broker's test reference;
          # CoreLink never receives a raw Stripe secret key.
          # Expose Stripe inputs only when this protected dispatch selected
          # stripe/all. The Rust cleanup marker additionally checks the exact
          # workflow/repository/ref/event context; GITHUB_RUN_ID alone is not
          # enough to mark provider objects as harness-owned.
          HUGR_WALLET_BASE: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && vars.HUGR_WALLET_BASE || '' }}
          HUGR_WALLET_TOKEN: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && secrets.HUGR_WALLET_TOKEN || '' }}
          HUGR_STRIPE_REF: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && vars.HUGR_STRIPE_REF || '' }}
          STRIPE_AUTH_MODE: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && 'wallet-broker' || '' }}
          STRIPE_PRICE_ID_STARTER: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && vars.STRIPE_PRICE_ID_STARTER || '' }}
          STRIPE_TEST_ACCOUNT_ID: ${{ (inputs.profile == 'stripe' || inputs.profile == 'all') && vars.STRIPE_TEST_ACCOUNT_ID || '' }}
          # Neon is separately selected and receives only its staging DSN.
          NEON_TEST_DSN: ${{ (inputs.profile == 'neon' || inputs.profile == 'all') && secrets.NEON_TEST_DSN || '' }}
          # Pass the untrusted input as data, never by interpolating it into
          # the shell program. The runner's allow-list validates it again.
          REAL_HARNESS_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ "$REAL_HARNESS_PROFILE" == "d1" ]]; then
            echo "::add-mask::${CF_API_TOKEN:-}"
            python3 -S scripts/probe_i2563_d1_token_scope.py
          fi
          for name in CF_API_TOKEN HUGR_WALLET_TOKEN NEON_TEST_DSN R2_S3_ACCESS_KEY_ID; do
            if [[ -n "${!name:-}" ]]; then
              echo "::add-mask::${!name}"
            fi
          done
          if [[ "$REAL_HARNESS_PROFILE" == "r2" ]]; then
            python3 -S scripts/issue_2564_r2_temp_credentials.py
          else
            bash scripts/run-real-ignored-harnesses.sh "$REAL_HARNESS_PROFILE"
          fi

      - name: Upload exact test receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-ignored-harnesses-${{ inputs.profile }}-receipt
          path: artifacts/real-ignored-harnesses/
          if-no-files-found: error
          retention-days: 30

  reject-all:
    name: reject shared D1 execution in all profile
    if: github.repository == 'HuGR-dev/corelink-server' && github.repository_id == '1232040291' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.profile == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require an individual provider profile
        run: |
          echo 'The all profile would run D1 without its isolated account boundary. Select one provider profile.' >&2
          exit 1
