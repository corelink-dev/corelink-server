name: B-125 read-only evidence contract

# Credentialless PR gate for the bounded #1668 correction. It verifies the
# aggregate and sanitized D1 API diagnostic contracts without dispatching reads.
on:
  pull_request:
    paths:
      - ".github/workflows/b125-audit-throughput-read-only.yml"
      - ".github/workflows/b125-readonly-contract.yml"
      - "scripts/b125_d1_api_diagnostic.py"
      - "scripts/b125_readonly_diagnostics.py"
      - "tests/test_b125_readonly_workflow.py"
      - "tests/fixtures/b125-d1-api-sql-error.json"
      - "tests/fixtures/b125-d1-aggregate-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b125-readonly-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-shape:
    name: B-125 hosted evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned focused test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.0.2
      - name: Verify the B-125 read-only evidence contract
        run: python -m pytest -q tests/test_b125_readonly_workflow.py
