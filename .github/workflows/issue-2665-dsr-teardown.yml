name: Issue 2665 DSR staging teardown

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-2665-dsr-teardown.yml
      - crates/corelink-container/src/routes/dsr/access.rs
      - scripts/verify_issue_2665_dsr_teardown.py
      - scripts/verify_issue_2581_dsr_audit.py
      - tests/test_issue_2581_dsr_audit.py

permissions:
  contents: read

concurrency:
  group: issue-2665-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  dsr-teardown:
    if: >-
      github.repository_id == vars.CORELINK_SERVER_REPO_ID &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact candidate and protected base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0

      - name: Verify DSR ownership and teardown contract
        run: python3 -I scripts/verify_issue_2665_dsr_teardown.py

      - name: Check formatting and compile scoped crate
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p corelink-server --lib

      - name: Run focused DSR staging teardown proofs
        run: |
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::admitted_rectification_registers_retained_audit_only -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::staging_dsr_key_accepts_only_single_safe_export_or_signature_keys -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::admitted_r2_writer_rejects_invalid_key_before_intent_or_put -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::exact_dsr_export_delete_requires_absent_head_for_both_object_kinds -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::exact_dsr_export_delete_fails_closed_on_bad_delete_head_error_or_residue -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::admitted_r2_writer_recovers_exact_prepare_and_replays_once -- --exact
          cargo test --locked -p corelink-server --lib routes::dsr::access::tests::admitted_r2_commit_failure_leaves_prepared_intent_without_locator -- --exact
