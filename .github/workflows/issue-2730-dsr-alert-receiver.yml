name: issue-2730 DSR alert receiver

on:
  pull_request:
    paths:
      - "apps/dsr-alert-receiver/**"
      - ".github/actions/setup-pnpm/action.yml"
      - ".github/workflows/issue-2730-dsr-alert-receiver.yml"
      - ".github/workflows/b216-receiver-deploy-nonprod.yml"
      - "docs/campaigns/remediation/wp150-workflow-ownership.md"
      - "docs/internal/secrets-checklist.md"

permissions:
  contents: read

jobs:
  receiver-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact requested head and DCO
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check "$BASE_SHA...HEAD"
          while IFS= read -r sha; do
            author_email="$(git show -s --format='%ae' "$sha")"
            signoff="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            test -n "$signoff" && grep -Fq "<$author_email>" <<<"$signoff"
          done < <(git rev-list "$BASE_SHA..HEAD")
      - name: Require GitHub-verified head signature
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, ref: process.env.EXPECTED_HEAD,
            });
            if (data.sha !== process.env.EXPECTED_HEAD || !data.commit.verification?.verified) {
              core.setFailed("exact PR head lacks a GitHub-verified signature");
            }
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned receiver dependencies
        run: pnpm --dir apps/dsr-alert-receiver install --frozen-lockfile --ignore-workspace --ignore-scripts
      - name: Run receiver contract and adversarial tests
        run: |
          pnpm --dir apps/dsr-alert-receiver typecheck
          pnpm --dir apps/dsr-alert-receiver test
      - name: Run credentialless Wrangler bundle dry-run
        env:
          DRY_RUN_HOME: ${{ runner.temp }}/b216-wrangler-empty-home
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$DRY_RUN_HOME"
          chmod 700 "$DRY_RUN_HOME"
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          sudo unshare --net -- setpriv \
            --reuid "$RUNNER_UID" \
            --regid "$RUNNER_GID" \
            --clear-groups -- \
            env -i \
            "PATH=$PATH" \
            "HOME=$DRY_RUN_HOME" \
            "RUNNER_TEMP=$RUNNER_TEMP" \
            "GITHUB_SHA=$EXPECTED_HEAD" \
            CI=true \
            WRANGLER_SEND_METRICS=false \
            node apps/dsr-alert-receiver/scripts/run-wrangler-dry-run.mjs
      - name: Assert privacy and path boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_i2574_grpc_diagnostic_policy.py --check-receiver-path-boundary --base-sha "$BASE_SHA"
      - name: Lint exact changed receiver workflows
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
            export PATH="$PWD:$PATH"
          fi
          actionlint -color .github/workflows/issue-2730-dsr-alert-receiver.yml .github/workflows/b216-receiver-deploy-nonprod.yml
