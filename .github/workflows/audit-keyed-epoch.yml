name: audit keyed epoch contract

on:
  pull_request:
    paths:
      - "crates/corelink-audit-chain/**"
      - "crates/corelink-container/src/routes/audit_archive.rs"
      - "crates/corelink-container/src/routes/audit_drain/**"
      - "migrations/d1/0109_audit_chain_epoch_contract.sql"
      - "migrations/d1/0110_audit_chain_epoch_row_metadata.sql"
      - "migrations/d1/0124_audit_chain_witness_receipts.sql"
      - "migrations/d1/0146_b054_admin_approval_ledger.sql"
      - "docs/internal/secrets-checklist.md"
      - ".github/workflows/audit-chain-daily-verify.yml"
      - "scripts/verify_b054_audit_chain_contract.py"
      - "scripts/test_audit_chain_epoch_schema.py"
      - "wrangler.toml"
      - "scripts/verify_owner_action_packets.py"
      - "evidence/owner-actions/B-054/keyed-audit-epoch-rollout.json"
      - "docs/handoff/2026-09-05-owner-action-packets-b008-b154.json"
      - "tests/test_owner_action_packets.py"
      - "scripts/issue_1648_historical_query.py"
      - "tests/test_issue_1648_historical_query.py"
      - ".github/workflows/audit-keyed-epoch.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run the contract pack or the approved bounded historical read"
        required: true
        type: choice
        default: contract
        options: [contract, historical_query]
      expected_sha:
        description: "Exact protected main SHA for historical_query"
        required: false
        type: string
      confirm:
        description: "Must equal historical-query-production-1648"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: audit-keyed-epoch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'contract')
    name: B-054 keyed epoch contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify B-054 fail-closed source contract
        run: python3 scripts/verify_b054_audit_chain_contract.py

      - name: Verify additive epoch schema mutations
        run: python3 scripts/test_audit_chain_epoch_schema.py

      - name: Verify typed two-person custody blocker
        run: python3 scripts/verify_owner_action_packets.py --id B-054

      - name: Exercise B-054 owner packet mutation tests
        run: >-
          python3 -m unittest
          tests.test_owner_action_packets.OwnerActionPacketTests.test_identifier_focus_skips_unrelated_owner_receipts
          tests.test_owner_action_packets.OwnerActionPacketTests.test_b054_receipt_mutations_fail_closed

      - name: Exercise the bounded #1648 historical-query contract
        run: python3 -m unittest tests.test_issue_1648_historical_query

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install the pinned Protobuf compiler required by corelink-reapi
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Exercise archive contract primitives
        run: |
          set -euo pipefail
          cargo test --locked -p corelink-server --lib admin_approval_tests -- --nocapture
          cargo test --locked -p corelink-audit-chain --lib epoch -- --nocapture
          cargo test --locked -p corelink-audit-chain --lib sealed_archive -- --nocapture
          cargo test --locked -p corelink-audit-chain --lib object_lock_archive -- --nocapture
          cargo test --locked -p corelink-audit-chain --bin verifier -- --nocapture

  historical-query-invalid-request:
    if: >-
      github.repository_id == '0' &&
      github.event_name == 'workflow_dispatch' &&
      ((inputs.operation != 'contract' && inputs.operation != 'historical_query') ||
       (inputs.operation == 'historical_query' &&
        (github.ref != 'refs/heads/main' || !github.ref_protected ||
         inputs.expected_sha != github.sha ||
         inputs.confirm != 'historical-query-production-1648')))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject an invalid historical query request
        run: |
          echo "Historical query requires protected main, exact expected SHA, and fixed confirmation." >&2
          exit 1

  historical-query:
    needs: historical-query-invalid-request
    if: >-
      always() &&
      github.repository_id == '0' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.operation == 'historical_query' &&
      inputs.expected_sha == github.sha &&
      inputs.confirm == 'historical-query-production-1648'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout the exact protected main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify exact-SHA read-only query contract
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
          echo "::add-mask::${CF_API_TOKEN}"
          python3 scripts/issue_1648_historical_query.py

      - name: Preserve fixed-counter receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1648-historical-query-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-1648-historical-query.json
          retention-days: 3
          if-no-files-found: warn
