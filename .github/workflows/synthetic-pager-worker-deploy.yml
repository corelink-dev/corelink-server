name: synthetic pager receiver — deprecated fail-closed

# Receiver staging activation is now owned exclusively by the protected
# issue-1652 B-072 operator. This legacy entrypoint remains visible so an old
# runbook does not silently disappear, but it has no Cloudflare credential,
# deployment command, or path to activate a receiver version.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Retired entrypoint; use protected issue-1652 B-072 operator"
        required: true
        default: staging
        type: choice
        options: [staging]

permissions:
  contents: read

jobs:
  retired:
    name: fail closed — use protected B-072 operator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse legacy receiver deployment
        run: |
          echo "::error::legacy receiver deployment is retired; use issue-1652 B-072 protected staging operator"
          exit 1
