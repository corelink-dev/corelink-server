name: load-test (operator dispatch, R3-prep)

# Runner: `corelink` (the Cloudflare container fabric — Ubuntu 24.04, apt
# available, a datacenter IP). Previously pinned to a self-hosted Linux/X64
# triple that NO runner on the fleet carries, so the job could never start
# (B-029).
# `corelink` is the correct home: this job is a load GENERATOR firing k6 at a
# remote staging endpoint, so a stable datacenter uplink matters and the host's
# own CPU does not — which is also why it was never suitable for the residential
# macOS builder fleet.
#
# Dispatch-only, and the reason is now the TRUE one (B-029): there is no
# staging environment to fire at. `staging.corelink.humangr.com` does not
# resolve, and the `staging` GitHub environment carries none of the secrets this
# suite reads (K6_TARGET_HOST, K6_STAGING_PAT, …). The pre-flight target-host
# check below therefore fail-closes every run until staging exists. Standing up
# a staging deployment (or retiring the staging-targeted suites) is an owner
# cost decision — see docs/internal/2026-08-24-owner-decision-brief.md. Any
# future automation requires that owner decision together with staging secrets;
# enabling it before then only manufactures a red run on missing infrastructure.
#
# R3-prep load test suite — operator-dispatched run against staging.
#
# Five k6 scenarios cover the critical paths:
#   1. signup orchestration burst
#   2. Stripe webhook idempotency replay
#   3. DSR API "annual privacy week"
#   4. CAS hot path (PUT/GET)
#   5. BYOK kill-switch stampede
#
# Does not block merges (it is dispatch-only, not a PR check), but a dispatched run
# itself DOES go red: the `baseline-regression` job fails when a scenario's
# MEDIAN `http_req_duration` regresses more than REGRESSION_THRESHOLD versus
# the stored baseline. That baseline is persisted across runs in the GitHub
# Actions cache (restore by prefix key → compare → save under a run-unique
# key), not in this run's own artifacts.
#
# Median, not p99 — same measured reason perf-regression.yml gates on the
# median: p99 jitters ~22% run-to-run on identical work on shared hosts while
# the median holds to <4%, so a 20% band on p99 is noise. p99 is still
# recorded and printed for trend review.
#
# The ONLY non-failing path is a complete current population compared against
# a complete stored baseline and within threshold. Missing, malformed, or
# partial data is a hard UNKNOWN failure — the matrix legs are
# `continue-on-error` only to isolate scenarios, never to manufacture green
# from absent measurements.
#
# Comparison logic: scripts/load-test-baseline-check.py (a file, so it is
# runnable and provable outside CI).
#
# SHA-pinned per ADR-S12-045 §6 tooling-pin policy.

on:
  # No unattended schedule: the pre-flight check fail-closes without a staging
  # target, and this workflow remains operator-dispatched pending provisioning.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-bounded-load" to dispatch the staging lane'
        required: true
        type: string
      scenarios:
        description: 'The complete comma-separated scenario population (all five required)'
        required: false
        default: 'signup,webhook,dsr,cas,byok'
      bootstrap_baseline:
        description: 'Seed a missing baseline from one complete successful full-population run; the bootstrap run remains red and is not regression proof'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  actions: read

concurrency:
  group: load-test-operator
  cancel-in-progress: false

env:
  # A scenario fails when its current median is more than 20% above the stored
  # baseline median. Consumed by scripts/load-test-baseline-check.py.
  REGRESSION_THRESHOLD: '1.20'
  # Cache-key namespace for the persisted baseline. Bump the `v<N>` suffix to
  # deliberately discard every stored baseline (e.g. after a staging resize
  # makes the old numbers meaningless).
  BASELINE_CACHE_PREFIX: load-test-k6-baseline-v2
  K6_ALL_SCENARIOS: signup,webhook,dsr,cas,byok
  # The workflow_dispatch input has an explicit all-scenarios default. Keep an
  # explicitly empty value visible so the classifier can reject it instead of
  # silently turning it into a complete population.
  K6_EXPECTED_SCENARIOS: ${{ github.event.inputs.scenarios }}

jobs:
  k6-staging:
    name: k6 load suite (staging)
    # Require an operator dispatch from the protected canonical branch. This
    # keeps staging load traffic unreachable from forks, feature refs, and any
    # future trigger accidentally added above.
    if: github.repository == 'HuGR-dev/corelink-server' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    environment: staging        # binds the staging secrets scope
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { id: signup,  script: tests/load/k6/signup-orchestration.js,  budget: 8 }
          - { id: webhook, script: tests/load/k6/stripe-webhook-burst.js,  budget: 5 }
          - { id: dsr,     script: tests/load/k6/dsr-api.js,                budget: 15 }
          - { id: cas,     script: tests/load/k6/cas-write-read.js,         budget: 10 }
          - { id: byok,    script: tests/load/k6/byok-revoke-stampede.js,   budget: 5 }
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: confirm bounded dispatch
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: test "${CONFIRM}" = "run-bounded-load"

      - name: filter scenarios
        id: filter
        env:
          REQUESTED_SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED_SCENARIOS}"
          if [[ -z "${REQUESTED}" || "${REQUESTED}" == ,* || "${REQUESTED}" == *, || "${REQUESTED}" == *,,* ]]; then
            echo "::error::scenarios must be a non-empty comma-separated population"
            exit 1
          fi
          IFS=',' read -ra SELECTED <<<"${REQUESTED}"
          test "${#SELECTED[@]}" -eq 5 || {
            echo "::error::the load gate requires all five scenarios; partial dispatches are invalid"
            exit 1
          }
          for scenario in "${SELECTED[@]}"; do
            case "${scenario}" in
              signup|webhook|dsr|cas|byok) ;;
              *) echo "::error::unsupported scenario: ${scenario}"; exit 1 ;;
            esac
          done
          CANONICAL="$(printf '%s\n' "${SELECTED[@]}" | sort | paste -sd, -)"
          test "${CANONICAL}" = "byok,cas,dsr,signup,webhook" || {
            echo "::error::scenario population is not the canonical five-scenario set"
            exit 1
          }
          if [[ ",$REQUESTED," == *",${{ matrix.scenario.id }},"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install k6
        if: steps.filter.outputs.enabled == 'true'
        # Direct install (avoids action wrapper version drift). The Grafana
        # k6 release artifacts are gpg-signed; we use the canonical apt repo.
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: validate script syntax
        if: steps.filter.outputs.enabled == 'true'
        run: k6 inspect ${{ matrix.scenario.script }}

      - name: pre-flight target host check
        if: steps.filter.outputs.enabled == 'true'
        id: target_host
        env:
          K6_TARGET_HOST: ${{ secrets.K6_TARGET_HOST }}
          K6_TARGET_IDENTITY_RECEIPT: ${{ secrets.K6_TARGET_IDENTITY_RECEIPT }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${K6_TARGET_HOST:-}" ]]; then
            echo "::error::K6_TARGET_HOST secret missing in staging environment"
            exit 1
          fi
          test -n "${K6_STAGING_LOAD_ADMISSION_KEY:-}" || {
            echo "::error::CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY is required"
            exit 1
          }
          # Normalize one explicitly permitted trailing slash, then require the
          # exact owner-approved endpoint. No dev, API-prefixed, or path variant.
          CANONICAL_TARGET='https://staging.corelink.humangr.com'
          TARGET_HOST="${K6_TARGET_HOST%/}"
          if [[ "$TARGET_HOST" != "$CANONICAL_TARGET" ]]; then
            echo "::error::K6_TARGET_HOST must equal $CANONICAL_TARGET (optional trailing slash only)"
            exit 1
          fi
          python3 scripts/validate_load_target_receipt.py \
            --target "$TARGET_HOST" \
            --output "${RUNNER_TEMP}/target-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "target_host=$TARGET_HOST" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET_HOST deployment_sha=$(sed -n 's/.*"deployment_sha": "\([0-9a-f]*\)".*/\1/p' "${RUNNER_TEMP}/target-receipt.json")"

      - name: prepare results dir
        if: steps.filter.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p tests/load/results/${{ matrix.scenario.id }}
          cp "${RUNNER_TEMP}/target-receipt.json" \
            tests/load/results/${{ matrix.scenario.id }}/target-receipt.json

      - name: run k6 scenario
        if: steps.filter.outputs.enabled == 'true'
        id: run_k6
        env:
          K6_TARGET_HOST:        ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          K6_RUN_ID:             ${{ github.run_id }}
          K6_STAGING_LOAD_SCENARIO: ${{ matrix.scenario.id }}
          K6_TARGET_DEPLOYMENT_SHA: ${{ steps.target_host.outputs.deployment_sha }}
          K6_STRIPE_WHSEC:       ${{ secrets.K6_STAGING_STRIPE_WHSEC }}
          K6_MFA_STUB_TOKEN:     ${{ secrets.K6_STAGING_MFA_STUB }}
          K6_BYOK_TEST_CMK_ID:   ${{ secrets.K6_STAGING_BYOK_CMK_ID }}
        timeout-minutes: ${{ matrix.scenario.budget }}
        # `continue-on-error` so a single scenario failure does NOT block
        # the rest of the matrix; per-script thresholds still surface as
        # non-zero exit + annotated job step in the GH UI.
        continue-on-error: true
        run: |
          set -o pipefail
          k6 run \
            --out json=tests/load/results/${{ matrix.scenario.id }}/results.json \
            --summary-export tests/load/results/${{ matrix.scenario.id }}/summary.raw.json \
            ${{ matrix.scenario.script }}

      - name: sanitize k6 summary
        if: steps.filter.outputs.enabled == 'true' && always()
        run: |
          set -euo pipefail
          python3 scripts/sanitize_k6_summary.py \
            --input "tests/load/results/${{ matrix.scenario.id }}/summary.raw.json" \
            --receipt "tests/load/results/${{ matrix.scenario.id }}/target-receipt.json" \
            --output "tests/load/results/${{ matrix.scenario.id }}/summary.json" \
            --scenario "${{ matrix.scenario.id }}"
          rm -f "tests/load/results/${{ matrix.scenario.id }}/summary.raw.json"

      - name: record scenario outcome
        if: steps.filter.outputs.enabled == 'true' && always()
        env:
          SCENARIO: ${{ matrix.scenario.id }}
          OUTCOME: ${{ steps.run_k6.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "tests/load/results/${SCENARIO}"
          printf '{"scenario":"%s","outcome":"%s"}\n' "${SCENARIO}" "${OUTCOME}" \
            > "tests/load/results/${SCENARIO}/status.json"

      - name: seal synthetic staging state
        id: seal
        if: steps.filter.outputs.enabled == 'true' && steps.target_host.outcome == 'success' && always()
        env:
          K6_TARGET_HOST: ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          SCENARIO: ${{ matrix.scenario.id }}
          TARGET_DEPLOYMENT_SHA: ${{ steps.target_host.outputs.deployment_sha }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          CREDENTIAL="$(python3 scripts/staging_load_lifecycle_auth.py --version v1 --key "$K6_STAGING_LOAD_ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --scenario "$SCENARIO" --deployment-sha "$TARGET_DEPLOYMENT_SHA")"
          HTTP_STATUS=$(timeout 30s curl --silent --show-error --max-redirs 0 --request POST --header "x-corelink-staging-load-admission: ${CREDENTIAL}" "${K6_TARGET_HOST}/_internal/staging/load-tests/${SCENARIO}/seal" --output "${RUNNER_TEMP}/seal-receipt.json" --write-out '%{http_code}')
          test "$HTTP_STATUS" = 200
          python3 scripts/staging_load_lifecycle_auth.py --validate-seal --receipt "${RUNNER_TEMP}/seal-receipt.json" --run-id "$GITHUB_RUN_ID" --scenario "$SCENARIO" --deployment-sha "$TARGET_DEPLOYMENT_SHA"
          cp "${RUNNER_TEMP}/seal-receipt.json" "tests/load/results/${SCENARIO}/seal-receipt-${GITHUB_RUN_ID}.json"

      - name: teardown synthetic staging state
        if: steps.filter.outputs.enabled == 'true' && steps.target_host.outcome == 'success' && always()
        env:
          K6_TARGET_HOST: ${{ steps.target_host.outputs.target_host }}
          K6_STAGING_LOAD_ADMISSION_KEY: ${{ secrets.CORELINK_STAGING_LOAD_TEST_ADMISSION_KEY }}
          SCENARIO: ${{ matrix.scenario.id }}
          TARGET_DEPLOYMENT_SHA: ${{ steps.target_host.outputs.deployment_sha }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -n "${K6_STAGING_LOAD_ADMISSION_KEY:-}" || {
            echo "::error::admission key is required; refusing to leave synthetic state unmanaged"
            exit 1
          }
          CREDENTIAL="$(python3 scripts/staging_load_lifecycle_auth.py --version v1 --key "$K6_STAGING_LOAD_ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --scenario "$SCENARIO" --deployment-sha "$TARGET_DEPLOYMENT_SHA")"
          HTTP_STATUS=$(timeout 30s curl --silent --show-error --max-redirs 0 \
            --request POST \
            --header "x-corelink-staging-load-admission: ${CREDENTIAL}" \
            "${K6_TARGET_HOST}/_internal/staging/load-tests/${SCENARIO}/teardown" \
            --output "${RUNNER_TEMP}/teardown-receipt.json" --write-out '%{http_code}')
          test "$HTTP_STATUS" = 200
          python3 scripts/validate_load_teardown_receipt.py --receipt "${RUNNER_TEMP}/teardown-receipt.json" --run-id "$GITHUB_RUN_ID" --scenario "$SCENARIO" --deployment-sha "$TARGET_DEPLOYMENT_SHA" --output "tests/load/results/${SCENARIO}/teardown-receipt-${GITHUB_RUN_ID}.json"

      - name: preserve workload failure after cleanup
        if: steps.filter.outputs.enabled == 'true' && always()
        env:
          OUTCOME: ${{ steps.run_k6.outcome }}
        run: test "$OUTCOME" = success

      - name: upload results
        if: steps.filter.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          name: k6-${{ matrix.scenario.id }}-${{ github.run_id }}
          path: tests/load/results/
          retention-days: 30
          if-no-files-found: error

  baseline-regression:
    name: baseline regression check (median ≤ +20% vs stored baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: k6-staging
    # Keep the post-load comparator inside the same canonical protected-main
    # boundary as the matrix. A skipped matrix must not leave an unguarded
    # baseline/cache job reachable from an arbitrary dispatch ref.
    if: always() && github.repository == 'HuGR-dev/corelink-server' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: classify scenario population
        id: population
        run: |
          set -euo pipefail
          canonicalize() {
            tr ',' '\n' <<<"$1" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' | sort | paste -sd, -
          }
          REQUESTED_INPUT="${K6_EXPECTED_SCENARIOS:-}"
          if [[ -z "${REQUESTED_INPUT}" || "${REQUESTED_INPUT}" == ,* || "${REQUESTED_INPUT}" == *, || "${REQUESTED_INPUT}" == *,,* ]]; then
            echo "::error::scenarios must be a non-empty comma-separated population"
            exit 1
          fi
          IFS=',' read -ra SELECTED <<<"${REQUESTED_INPUT}"
          test "${#SELECTED[@]}" -eq 5 || {
            echo "::error::the load gate requires all five scenarios; partial dispatches are invalid"
            exit 1
          }
          declare -A SEEN=()
          for scenario in "${SELECTED[@]}"; do
            case "${scenario}" in
              signup|webhook|dsr|cas|byok) ;;
              *) echo "::error::unsupported scenario: ${scenario}"; exit 1 ;;
            esac
            if [[ -n "${SEEN[${scenario}]:-}" ]]; then
              echo "::error::duplicate scenario: ${scenario}"
              exit 1
            fi
            SEEN["${scenario}"]=1
          done
          REQUESTED="$(canonicalize "${REQUESTED_INPUT}")"
          ALL="$(canonicalize "${K6_ALL_SCENARIOS}")"
          test "${REQUESTED}" = "${ALL}" || {
            echo "::error::scenario population is not the canonical five-scenario set"
            exit 1
          }
          echo 'full=true' >> "$GITHUB_OUTPUT"
          echo "complete five-scenario population: ${REQUESTED}"

      - name: download current run artifacts
        if: steps.population.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: k6-*-${{ github.run_id }}
          path: tests/load/results/current
          merge-multiple: true
          # If matrix legs were skipped, we still continue.
          run-id: ${{ github.run_id }}

      # Restore the PREVIOUS run's baseline. The exact key embeds this run's
      # id and therefore never hits; the restore-key prefix falls back to the
      # most recently saved baseline, which is the point.
      - name: restore stored baseline
        id: baseline-restore
        if: steps.population.outputs.full == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/load/baseline
          key: ${{ env.BASELINE_CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.BASELINE_CACHE_PREFIX }}-

      - name: report baseline provenance
        if: steps.population.outputs.full == 'true' && inputs.bootstrap_baseline != true
        run: |
          set -euo pipefail
          if [[ -f tests/load/baseline/k6-baseline.json ]]; then
            echo "restored baseline from cache key: ${{ steps.baseline-restore.outputs.cache-matched-key }}"
            cat tests/load/baseline/k6-baseline.json
          else
            echo "::error::no stored baseline found; comparison is UNKNOWN and must fail closed"
            exit 1
          fi

      - name: compare median vs stored baseline
        id: compare
        if: steps.population.outputs.full == 'true' && inputs.bootstrap_baseline != true
        env:
          EXPECTED_SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          set -euo pipefail
          python3 scripts/load-test-baseline-check.py \
            --results-dir tests/load/results/current \
            --baseline tests/load/baseline/k6-baseline.json \
            --threshold "${REGRESSION_THRESHOLD}" \
            --expected-scenarios "${EXPECTED_SCENARIOS}"

      - name: seed missing baseline from a complete successful population
        id: bootstrap
        if: steps.population.outputs.full == 'true' && inputs.bootstrap_baseline == true
        run: |
          set -euo pipefail
          python3 scripts/load-test-baseline-check.py \
            --results-dir tests/load/results/current \
            --baseline tests/load/baseline/k6-baseline.json \
            --threshold "${REGRESSION_THRESHOLD}" \
            --bootstrap

      # Only reached when the comparison passed (the step above is NOT
      # continue-on-error), so a regressing run never publishes a new
      # baseline — a regression cannot ratchet itself in by repeating.
      - name: save baseline for the next run
        if: steps.population.outputs.full == 'true' && (steps.compare.outcome == 'success' || steps.bootstrap.outcome == 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/load/baseline
          key: ${{ env.BASELINE_CACHE_PREFIX }}-${{ github.run_id }}

      - name: upload baseline artifact
        if: steps.population.outputs.full == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-baseline-${{ github.run_id }}
          path: tests/load/baseline
          retention-days: 90
          if-no-files-found: error

      - name: keep bootstrap distinct from regression proof
        if: steps.population.outputs.full == 'true' && inputs.bootstrap_baseline == true
        run: |
          echo "::error::baseline bootstrap was persisted, but this run made no prior-baseline comparison; dispatch again without bootstrap for proof" >&2
          exit 1
