name: corelink-server

# Focused hosted regression gate for the DSR registry classifications.
# The manual entry point keeps this narrow check available for the hosted-only
# acceptance gate without re-enabling the broader self-hosted crate lane.

on:
  pull_request:
    paths:
      - 'crates/corelink-container/**'
      - 'migrations/d1/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corelink-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsr-registry:
    name: DSR registry focused tests
    if: ${{ github.repository_id == vars.CORELINK_SERVER_REPO_ID }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Cache Cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'
          shared-key: dsr-registry

      - name: Run the exact DSR registry regressions
        run: |
          set -euo pipefail
          cargo test --locked -p corelink-server --lib \
            routes::dsr::adapter_d1::tests::runner_billing_tables_have_exact_dsr_dispositions \
            -- --exact --nocapture
          cargo test --locked -p corelink-server --lib \
            routes::dsr::adapter_d1::tests::runner_billing_migration_tables_remain_classified \
            -- --exact --nocapture

      - name: Run the scheduled GC credentialless command contract
        run: >-
          cargo test --locked -p corelink-server --test gc_binary_wiring
          scheduled_sweep_is_credentialless_and_cannot_arm_delete --
          --exact --nocapture
