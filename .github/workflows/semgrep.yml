name: Semgrep (R-prep static analysis)

# Semgrep CI gate — pre-pentest engagement R-prep wave companion to CodeQL.
#
# Why both Semgrep + CodeQL?
#   - CodeQL is excellent at dataflow/taint queries but has experimental
#     Rust support and slower run-time (~30 min).
#   - Semgrep gives us syntactic + lightweight semantic scanning across
#     all CoreLink languages (Rust, TS, Python, YAML/Dockerfile/Terraform)
#     in < 5 min, plus the ability to run custom CoreLink-specific rules
#     (see `semgrep.yml` at the repo root for the project-local rulepack).
#
# Triggers:
#   - pull_request: every PR.
#   - push to main: full sweep on default branch.
#   - schedule: weekly Mon 03:00 UTC (1h after CodeQL cron — staggered to
#     avoid runner contention).
#   - workflow_dispatch: manual trigger for ops re-run.
#
# Fail policy:
#   PR mode → fail-closed on any ERROR-severity finding from the bundled
#   rulesets OR any of the custom CoreLink rules in `semgrep.yml`. Lower
#   severities are surfaced as PR comments + SARIF upload but do not block.
#
# SARIF uploaded to GHA Security tab via github/codeql-action/upload-sarif
# (SAME action CodeQL uses for SARIF upload — only the upload step, not
# the init/analyze pair).
#
# SHA-pinned per HIGH_RISK lane FF-HR-005 + ADR-S12-045 §6.
#
# Cross-refs:
#   - SOC2 rollup: CC8.1 (change management — static-analysis gate evidence).
#   - ROADMAP-TO-GA.md §7 Wave R-7 (Evidence Gate).
#   - Pre-pentest cutoff 2026-06-15.
#   - Custom rule pack: `semgrep.yml` (repo root).
#   - Runbook: specs/_runbooks/RB-STATIC-ANALYSIS-TRIAGE.md.

on:
  # Moved OFF per-PR 2026-06-02 to keep PRs fast (was a heavy gate). Runs
  # nightly (staggered) + on-demand. Re-add pull_request only if
  # this must block PRs again.
  # PARKED 2026-08-10 (cost hygiene, owner-authorized): the daily cron is
  # commented out because this SAST lane produced ZERO successful runs of the
  # last 8 (0/8) while burning ~6 hosted min/day, and CodeQL (codeql.yml,
  # healthy 7/8) already provides the SAST gate — so this was a broken
  # duplicate paying for no signal. It stays workflow_dispatch-able. RESTORE the
  # schedule once the underlying failure is diagnosed + fixed (tracked as debt).
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # Required by codeql-action/upload-sarif.
  security-events: write
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep scan
    # GitHub-hosted Linux provides Python, venv support, and the filesystem
    # needed by the local Semgrep bundle. The scan is manual only, so it does
    # not add scheduled runner usage. Keep the destination explicit: the
    # retired self-hosted `corelink` label can remain queued indefinitely.
    # The job creates its own venv because setup-python is unnecessary here.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job has security-events:write for SARIF upload. Keep the
    # write-capable job on the protected canonical main ref and trusted source;
    # workflow_dispatch from forks/unprotected refs is denied before a runner
    # is assigned.
    if: github.repository_id == vars.CORELINK_SERVER_REPO_ID && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected

    steps:
      - name: Checkout
        # actions/checkout v7.0.0 — SHA-pinned (matches the verified ref).
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0

      - name: Run Semgrep (separate bundled and CoreLink packs)
        id: semgrep
        # The local runner always attempts both populations and writes the
        # policy report before returning its blocking verdict. Defer the job
        # verdict until upload truth has also been recorded and retained.
        continue-on-error: true
        shell: bash
        # Semgrep 1.164.0 installed into a throwaway venv (no Docker, no
        # setup-python). Read off the `run:` block below, which is the only
        # authority here: the host `python3` is resolved with `command -v` and
        # used for exactly ONE thing — `python3 -m venv .semgrep-venv`. After
        # `source .semgrep-venv/bin/activate`, every install goes through THAT
        # venv's own pip (`python -m pip install …`). No host `pip3` is ever
        # invoked; the only host dependency is `python3` plus the `python3-venv`
        # apt package baked into the runner image. Pinned per HIGH_RISK
        # FF-HR-005 + ADR-S12-045 §6 — bump only via ADR + Security review
        # (§14.s12.004.1).
        #
        # The bundled and custom scans are intentionally separate so their
        # SARIF counts/severities cannot be conflated. Semgrep itself does not
        # receive `--error`: scripts/verify_b139_semgrep.py is the explicit
        # policy evaluator and fails closed only for SARIF level `error` or a
        # scanner/output failure. This preserves blocking semantics without
        # turning every finding into an implicit gate.
        run: |
          set -euo pipefail
          PYBIN="$(command -v python3)"
          echo "Using interpreter: ${PYBIN} ($(${PYBIN} --version 2>&1))"
          "${PYBIN}" -m venv .semgrep-venv
          # shellcheck disable=SC1091
          source .semgrep-venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "semgrep==1.164.0"
          # The canonical B-139 runner imports PyYAML to validate the
          # workflow/rulepack contract before it emits SARIF. Semgrep's
          # package does not guarantee that dependency in this venv.
          python -m pip install --quiet "PyYAML==6.0.2"
          semgrep --version
          python scripts/run_b139_semgrep.py \
            --semgrep-bin "$(command -v semgrep)" \
            --lock semgrep-bundled-lock.json \
            --output-dir . \
            --target .
        env:
          # Consumed by `semgrep scan` for any GitHub-API interactions; granted
          # via the workflow `permissions` block above.
          SEMGREP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundled SARIF to GitHub Security tab
        # github/codeql-action/upload-sarif@v4.37.1 (same verified pin as codeql.yml
        # init/analyze; bump together via single ADR).
        #
        # SARIF upload requires GitHub Advanced Security (code scanning). The
        # upload outcome is recorded explicitly after both upload attempts;
        # a non-success is unavailable_or_unverified, never a claim that the
        # Security tab received this SARIF. `continue-on-error` keeps delivery
        # capability separate from the fail-closed Semgrep policy evaluator.
        continue-on-error: true
        id: upload_bundled
        if: always() && hashFiles('semgrep-bundled.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: semgrep-bundled.sarif
          category: semgrep-bundled

      - name: Upload custom SARIF to GitHub Security tab
        # GHAS may be unavailable. A failed upload is retained as an explicit
        # unavailable_or_unverified outcome below, never reported as success.
        continue-on-error: true
        id: upload_custom
        if: always() && hashFiles('semgrep-custom.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom

      - name: Record SARIF upload truth
        if: always()
        env:
          BUNDLED_UPLOAD_OUTCOME: ${{ steps.upload_bundled.outcome }}
          CUSTOM_UPLOAD_OUTCOME: ${{ steps.upload_custom.outcome }}
        run: |
          python3 scripts/verify_b139_semgrep.py \
            --classify-uploads \
            --report semgrep-b139-report.json \
            --bundled-upload-outcome "${BUNDLED_UPLOAD_OUTCOME}" \
            --custom-upload-outcome "${CUSTOM_UPLOAD_OUTCOME}"

      - name: Retain Semgrep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: semgrep-b139-evidence-${{ github.run_id }}
          path: |
            semgrep-bundled.sarif
            semgrep-custom.sarif
            semgrep-b139-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarise findings in step output
        if: always()
        run: |
          if [ -f semgrep-b139-report.json ]; then
            cat semgrep-b139-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No Semgrep policy report emitted — evidence gap."
          fi

      - name: Enforce final Semgrep verdict
        if: always()
        run: python3 scripts/verify_b139_semgrep.py --enforce-report --report semgrep-b139-report.json
