# rust-affected-tests — clippy -D warnings + cargo test for the packages a
# change can break, on GitHub-hosted runners.
#
# WHY THIS EXISTS: on 2026-10-01 no general Rust build/lint/test lane ran on a
# pull request. `corelink-server.yml` runs three named DSR tests,
# `workspace-lint.yml` runs only after merge, and every per-crate lane is
# `disabled_manually`. A PR could break any of the 95 workspace packages and
# merge with every enabled check green.
#
# WHERE IT RUNS: `ubuntu-24.04`, the standard hosted runner (free for this
# public repository). Never the self-hosted fleet — that is the founder's Mac,
# and the earlier self-hosted draft of this lane died there of ENOSPC.
#
# WHAT IT SELECTS: `scripts/rust_affected_packages.py` decides, from
# `cargo metadata` (never from a listing of `crates/`): the package owning each
# changed path, plus every package that depends on it (normal/build edges,
# transitively) and every package whose TESTS dev-depend on that closure.
# `Cargo.lock` is diffed entry by entry, so a dependency bump selects exactly
# the members that resolve it. The root `Cargo.toml` is diffed as parsed TOML.
# Toolchain/cargo configuration and this lane's own files select the whole
# workspace. The selector's docstring lists what it does NOT see — read it
# before trusting a green run for a change outside every package directory.
#
# WHAT IT DOES NOT RUN: doctests (they compile one binary per example and would
# dominate the budget); bench targets (clippy compiles and lints them, but
# criterion's harness rejects `--skip`, so they are not executed); feature
# combinations beyond the defaults; `PROPTEST_CASES` above 32 — full-intensity
# property runs are not this lane's job, only the iteration count changes; and
# the tests in the test job's SKIP_TESTS ledger, each with its reason. Tests in
# its KNOWN_FAILING ledger are left out of the main run and then run on their
# own, where each must still FAIL. Packages in the clippy job's CLIPPY_DEBT
# ledger are left out of the `-D warnings` run. They are linted instead by a
# ratchet: their distinct diagnostic count must equal the declared one.
#
# THE VERDICT JOB is the single check to depend on. It fails unless the
# selection succeeded AND either both clippy and test succeeded, or the
# selection was empty with a named reason for every changed path and both were
# skipped for exactly that reason. A skipped job never reads as a pass.
name: rust-affected-tests

on:
  pull_request:
    # The two `paths:` lists below must stay identical and must cover every
    # file the selector treats as workspace-wide; tests/test_rust_affected_packages.py
    # reads them between these markers and fails if either drifts.
    # rust-affected-paths:begin pull_request
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'rust-toolchain'  # path-filter-allow: legacy toolchain file; the selector treats it as workspace-wide
      - '.cargo/config'  # path-filter-allow: legacy cargo config; the selector treats it as workspace-wide
      - '**/clippy.toml'  # path-filter-allow: no clippy.toml today; a future one changes what clippy reports
      - '**/.clippy.toml'  # path-filter-allow: no .clippy.toml today; a future one changes what clippy reports
      - '.github/workflows/rust-affected-tests.yml'
      - 'scripts/rust_affected_packages.py'
      - 'tests/test_rust_affected_packages.py'
    # rust-affected-paths:end pull_request
  # Post-merge: catches what two individually-green PRs break together inside
  # the closure, and is the only event whose caches every PR can restore.
  push:
    branches: [main]
    # rust-affected-paths:begin push
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'rust-toolchain'  # path-filter-allow: mirrors the pull_request filter above
      - '.cargo/config'  # path-filter-allow: mirrors the pull_request filter above
      - '**/clippy.toml'  # path-filter-allow: mirrors the pull_request filter above
      - '**/.clippy.toml'  # path-filter-allow: mirrors the pull_request filter above
      - '.github/workflows/rust-affected-tests.yml'
      - 'scripts/rust_affected_packages.py'
      - 'tests/test_rust_affected_packages.py'
    # rust-affected-paths:end push
  # Manual run = the whole workspace, for inputs the path mapping cannot see.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-affected-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Debuginfo is most of a debug target dir; panic locations come from
  # `#[track_caller]`, not from debuginfo, so failures still name file:line.
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  select:
    name: select affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      count: ${{ steps.select.outputs.count }}
      cargo_args: ${{ steps.select.outputs.cargo_args }}
    steps:
      # For pull_request this is the merge commit; depth 2 brings its first
      # parent, the exact base the PR was merged onto.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Selector teeth (synthetic workspaces)
        run: python3 -m unittest tests/test_rust_affected_packages.py

      - name: Resolve the pinned toolchain from rust-toolchain.toml
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/select"
          mkdir -p "$work"
          cargo metadata --format-version 1 --locked > "$work/metadata.json"
          selector=(python3 scripts/rust_affected_packages.py --metadata "$work/metadata.json" --step-outputs "$GITHUB_OUTPUT")

          case "$EVENT" in
            workflow_dispatch)
              "${selector[@]}" --all "manual dispatch checks every package"
              exit 0
              ;;
            pull_request)
              parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
              if [ "$parents" -ne 3 ]; then
                echo "::error::expected the pull_request merge commit (2 parents), got $((parents - 1)) — cannot name the base"
                exit 1
              fi
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" =~ ^0{40}$ ]]; then
                "${selector[@]}" --all "push without a previous commit to diff against"
                exit 0
              fi
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$BEFORE"
              fi
              base="$BEFORE"
              ;;
            *)
              echo "::error::unexpected event '$EVENT'"
              exit 1
              ;;
          esac

          echo "diffing $base..$(git rev-parse HEAD)"
          # --no-renames: a moved file must count against BOTH packages.
          git diff --name-only --no-renames -z "$base" HEAD > "$work/changed.bin"
          if git cat-file -e "$base:Cargo.lock" 2>/dev/null; then
            git show "$base:Cargo.lock" > "$work/base.lock"
            selector+=(--base-lock "$work/base.lock")
          fi
          if git cat-file -e "$base:Cargo.toml" 2>/dev/null; then
            git show "$base:Cargo.toml" > "$work/base.toml"
            selector+=(--base-manifest "$work/base.toml")
          fi
          "${selector[@]}" --changed "$work/changed.bin"

  clippy:
    name: clippy -D warnings (affected)
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # DECLARED CLIPPY DEBT — packages whose `-D warnings` failures on main
      # are too many to fix in the lane's own PR. One entry per line:
      #   <package> <distinct diagnostic count>
      # A listed package is left out of the `-D warnings` run, so the rest of
      # the workspace stays strict. The ratchet step then lints it with every
      # lint capped at warn and counts its distinct diagnostics by rendered
      # text, the way cargo dedupes them. The count must EQUAL the entry: more means a new lint
      # failure, which is red; fewer means the entry must come down in the same
      # PR, also red. An entry that reaches zero must be deleted. Shrink-only.
      #   corelink-server
      #     Measured on ubuntu-24.04 at this lane's first whole-workspace run:
      #     unwrap/expect, indexing/slicing and signature lints in lib and
      #     lib-test code, plus targets that never compiled under clippy
      #     because the lib failed first.
      CLIPPY_DEBT: |
        corelink-server 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Resolve the pinned toolchain from rust-toolchain.toml
        run: bash scripts/ci-assert-pinned-toolchain.sh

      # corelink-reapi and corelink-server compile .proto files in build.rs.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Saved only from main: a PR-scoped cache is restorable by that PR alone
      # and would evict main's from the shared 10 GB budget.
      - name: Cache cargo registry and dependency builds
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # Swatinem/rust-cache@v2.9.1
        with:
          shared-key: rust-affected-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The scripts between the markers in this step and the next are run
      # verbatim, against a fake `cargo`, by tests/test_rust_affected_packages.py
      # (ClippyScope, ClippyDebt) in the select job.
      - name: cargo clippy --all-targets -D warnings
        env:
          CARGO_SCOPE: ${{ needs.select.outputs.cargo_args }}
          SELECTED: ${{ needs.select.outputs.count }}
        run: |
          # rust-affected-clippy-scope:begin
          set -euo pipefail
          read -ra scope <<< "$CARGO_SCOPE"
          if [ "${#scope[@]}" -eq 0 ]; then
            echo "::error::the select job reported mode != none but no cargo scope — refusing to lint nothing"
            exit 1
          fi
          debt=()
          while read -r pkg _rest; do
            if [ -n "${pkg:-}" ]; then debt+=("$pkg"); fi
          done <<< "$CLIPPY_DEBT"
          in_debt() {
            local candidate
            for candidate in ${debt[@]+"${debt[@]}"}; do
              if [ "$candidate" = "$1" ]; then return 0; fi
            done
            return 1
          }
          lint=()
          if [ "${scope[0]}" = "--workspace" ]; then
            lint=(--workspace)
            for pkg in ${debt[@]+"${debt[@]}"}; do lint+=(--exclude "$pkg"); done
          else
            for ((i = 0; i < ${#scope[@]}; i++)); do
              if [ "${scope[$i]}" = "-p" ] && ! in_debt "${scope[$((i + 1))]:-}"; then
                lint+=(-p "${scope[$((i + 1))]}")
              fi
            done
          fi
          if [ "${#lint[@]}" -eq 0 ]; then
            echo "every selected package carries declared CLIPPY_DEBT; the ratchet step lints it"
            exit 0
          fi
          df -h /
          echo "linting $SELECTED selected package(s) with -D warnings: ${lint[*]}"
          cargo clippy --locked --keep-going --all-targets "${lint[@]}" -- -D warnings
          df -h /
          # rust-affected-clippy-scope:end

      - name: Declared clippy debt does not grow (ratchet)
        # Report the ratchet even when the strict run above failed.
        if: success() || failure()
        env:
          CARGO_SCOPE: ${{ needs.select.outputs.cargo_args }}
        run: |
          # rust-affected-clippy-debt:begin
          set -euo pipefail
          read -ra scope <<< "$CARGO_SCOPE"
          fail=0
          ran=0
          while read -r pkg baseline extra; do
            if [ -z "${pkg:-}" ]; then continue; fi
            if [ -n "${extra:-}" ] || [[ ! "${baseline:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::malformed CLIPPY_DEBT entry '${pkg} ${baseline:-} ${extra:-}' — expected <package> <count >= 1>"
              fail=1
              continue
            fi
            selected=0
            for ((i = 0; i < ${#scope[@]}; i++)); do
              case "${scope[$i]}" in
                --workspace) selected=1 ;;
                -p) if [ "${scope[$((i + 1))]:-}" = "$pkg" ]; then selected=1; fi ;;
              esac
            done
            if [ "$selected" -eq 0 ]; then
              echo "clippy debt '$pkg': not selected by this change, not run"
              continue
            fi
            ran=$((ran + 1))
            id="$(cargo pkgid -p "$pkg")"
            out="$(mktemp)"
            rendered="$(mktemp)"
            rc=0
            cargo clippy --locked --keep-going --all-targets -p "$pkg" --message-format=json \
              -- -D warnings --cap-lints warn >"$out" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::clippy on '$pkg' did not build even with every lint capped at warn (cargo exit $rc) — a hard error, not lint debt"
              fail=1
              continue
            fi
            count="$(python3 -c '
          import json, sys
          seen = {}
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  if not line.startswith("{"):
                      continue
                  item = json.loads(line)
                  if item.get("reason") != "compiler-message" or item.get("package_id") != sys.argv[2]:
                      continue
                  message = item["message"]
                  primary = [span for span in message.get("spans", []) if span.get("is_primary")]
                  if message.get("level") not in ("warning", "error") or not primary:
                      continue
                  # The rendered text, as cargo itself dedupes: identical for a lib
                  # diagnostic repeated by lib-test, but distinct for two invocations
                  # of one macro, which share a primary span.
                  span = primary[0]
                  text = message.get("rendered") or "{}:{}:{}: {}".format(
                      span["file_name"], span["line_start"], span["column_start"], message["message"])
                  seen.setdefault(text, text)
          with open(sys.argv[3], "w", encoding="utf-8") as sink:
              sink.write("".join(seen.values()))
          print(len(seen))
          ' "$out" "$id" "$rendered")"
            echo "clippy debt '$pkg' ($id): $count distinct diagnostics, declared $baseline"
            if [ "$count" -gt "$baseline" ]; then
              cat "$rendered"
              echo "::error::clippy debt in '$pkg' GREW from $baseline to $count — fix the new diagnostics (listed above)"
              fail=1
            elif [ "$count" -eq 0 ]; then
              echo "::error::clippy debt in '$pkg' is now zero — delete its CLIPPY_DEBT entry so -D warnings covers it"
              fail=1
            elif [ "$count" -lt "$baseline" ]; then
              echo "::error::clippy debt in '$pkg' shrank from $baseline to $count — lower its CLIPPY_DEBT entry to $count"
              fail=1
            fi
          done <<< "$CLIPPY_DEBT"
          echo "clippy debt entries run: $ran"
          exit "$fail"
          # rust-affected-clippy-debt:end

  test:
    name: cargo test (affected)
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Most suites read PROPTEST_CASES (default 10 000; corelink-auth alone
      # took 58 min at that count when measured on 2026-08-30).
      PROPTEST_CASES: '32'
      # DECLARED EXCEPTIONS — tests that cannot pass BY DESIGN under the
      # PROPTEST_CASES above, skipped by exact name with the reason here. Each
      # name must still resolve to exactly one `fn` in the tree (checked in the
      # step below), so a renamed or deleted test fails the lane instead of
      # leaving a skip that silently covers nothing. Shrink-only.
      #   test_proptest_cases_runtime_configurable_s14
      #     corelink-privacy/tests/residency_property_region_pinning_30k.rs
      #     asserts the configured case count is >= 1000, i.e. it fails for any
      #     run that lowers PROPTEST_CASES below 1000, which this lane must.
      SKIP_TESTS: test_proptest_cases_runtime_configurable_s14
      # KNOWN FAILURES — real defects on main that this lane exposed and that
      # are not safe to fix inside the lane's own PR. One entry per line:
      #   <package> <cargo target selector> <exact libtest name>
      # The main run skips each by exact name; the step after it then runs each
      # one ALONE and requires it to FAIL. Fixing the defect turns the lane red
      # until its entry is deleted, so this ledger cannot outlive its reason.
      # Each name must also resolve to exactly one `fn` (checked below).
      # Shrink-only.
      #   tests::b126_t1_files_remain_below_the_1000_line_ceiling
      #     crates/corelink-container/src/main.rs is 1047 lines on main against
      #     B-126's 1000-line ceiling. Its sha256 is pinned by
      #     scripts/verify_i2176_grpc_deny_gate.py,
      #     scripts/verify_i2574_grpc_diagnostic_policy.py and
      #     scripts/backlog_verify.py, so splitting it belongs to the owners
      #     of those pins, not to this lane.
      KNOWN_FAILING: |
        corelink-server --bin=corelink-server tests::b126_t1_files_remain_below_the_1000_line_ceiling
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Resolve the pinned toolchain from rust-toolchain.toml
        run: bash scripts/ci-assert-pinned-toolchain.sh

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry and dependency builds
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # Swatinem/rust-cache@v2.9.1
        with:
          shared-key: rust-affected-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Declared skips still name exactly one test
        run: |
          set -euo pipefail
          read -ra skips <<< "$SKIP_TESTS"
          # A known failure is named by its libtest path; its `fn` is the last segment.
          while read -r _pkg _target known _extra; do
            if [ -n "${known:-}" ]; then skips+=("${known##*::}"); fi
          done <<< "$KNOWN_FAILING"
          for name in "${skips[@]}"; do
            matches="$(git grep -n -E "fn ${name}\(" -- '*.rs' || true)"
            hits="$(printf '%s' "$matches" | grep -c . || true)"
            if [ "$hits" -ne 1 ]; then
              echo "::error::declared skip '$name' matches $hits test fns (expected exactly 1) — fix or delete the entry"
              exit 1
            fi
            echo "skip '$name' -> $matches"
          done

      # `--tests --bins --examples`, not `--all-targets`: bench targets use
      # criterion's harness, which rejects libtest's `--skip`. clippy above still
      # compiles and lints every bench; they are not executed here.
      - name: cargo test --tests --bins --examples
        env:
          CARGO_SCOPE: ${{ needs.select.outputs.cargo_args }}
          SELECTED: ${{ needs.select.outputs.count }}
        run: |
          set -euo pipefail
          read -ra scope <<< "$CARGO_SCOPE"
          read -ra skips <<< "$SKIP_TESTS"
          if [ "${#scope[@]}" -eq 0 ]; then
            echo "::error::the select job reported mode != none but no cargo scope — refusing to test nothing"
            exit 1
          fi
          while read -r _pkg _target known _extra; do
            if [ -n "${known:-}" ]; then skips+=("$known"); fi
          done <<< "$KNOWN_FAILING"
          skip_args=(--exact)
          for name in "${skips[@]}"; do skip_args+=(--skip "$name"); done
          # Measured 2026-10-01 on ubuntu-24.04: 85G free on / before any build,
          # so no SDK removal step (it cost 2.5 min). Printed so a squeeze shows.
          df -h /
          echo "testing $SELECTED package(s): ${scope[*]} (skipping: ${skips[*]})"
          cargo test --locked --no-fail-fast --tests --bins --examples "${scope[@]}" -- "${skip_args[@]}"
          df -h /

      # Strict expected-failure check for the KNOWN_FAILING ledger. The script
      # between the markers is run verbatim, against a fake `cargo`, by
      # tests/test_rust_affected_packages.py (KnownFailures) in the select job.
      - name: Known failures still fail (strict)
        env:
          CARGO_SCOPE: ${{ needs.select.outputs.cargo_args }}
        run: |
          # rust-affected-xfail:begin
          set -euo pipefail
          read -ra scope <<< "$CARGO_SCOPE"
          fail=0
          ran=0
          while read -r pkg target name extra; do
            [ -n "${pkg:-}" ] || continue
            if [ -z "${name:-}" ] || [ -n "${extra:-}" ]; then
              echo "::error::malformed KNOWN_FAILING entry '${pkg} ${target:-} ${name:-} ${extra:-}' — expected <package> <target> <test>"
              fail=1
              continue
            fi
            selected=0
            for ((i = 0; i < ${#scope[@]}; i++)); do
              case "${scope[$i]}" in
                --workspace) selected=1 ;;
                -p) if [ "${scope[$((i + 1))]:-}" = "$pkg" ]; then selected=1; fi ;;
              esac
            done
            if [ "$selected" -eq 0 ]; then
              echo "known failure '$name': $pkg is not selected by this change, not run"
              continue
            fi
            out="$(mktemp)"
            rc=0
            cargo test --locked -p "$pkg" "$target" -- --exact --color never "$name" >"$out" 2>&1 || rc=$?
            cat "$out"
            ran=$((ran + 1))
            if [ "$rc" -ne 0 ] && grep -qxF "test $name ... FAILED" "$out"; then
              echo "known failure '$name' still fails, as its ledger entry declares"
            elif [ "$rc" -eq 0 ] && grep -qxF "test $name ... ok" "$out"; then
              echo "::error::known failure '$name' now PASSES — delete its KNOWN_FAILING entry"
              fail=1
            else
              echo "::error::known failure '$name' did not run and fail (cargo exit $rc) — the entry no longer names a failing test"
              fail=1
            fi
          done <<< "$KNOWN_FAILING"
          echo "known failures run: $ran"
          exit "$fail"
          # rust-affected-xfail:end

  verdict:
    name: rust-affected-tests
    needs: [select, clippy, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Combine the results
        env:
          SELECT: ${{ needs.select.result }}
          MODE: ${{ needs.select.outputs.mode }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "select=$SELECT mode=${MODE:-<unset>} clippy=$CLIPPY test=$TEST"
          if [ "$SELECT" != "success" ]; then
            echo "::error::package selection did not succeed ($SELECT)"
            exit 1
          fi
          case "$MODE" in
            none)
              if [ "$CLIPPY" != "skipped" ] || [ "$TEST" != "skipped" ]; then
                echo "::error::selection was empty but clippy=$CLIPPY test=$TEST"
                exit 1
              fi
              echo "No package selected; the select job's summary names the reason for every changed path."
              ;;
            packages|workspace)
              if [ "$CLIPPY" != "success" ] || [ "$TEST" != "success" ]; then
                echo "::error::clippy=$CLIPPY test=$TEST"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown selection mode '${MODE:-<unset>}'"
              exit 1
              ;;
          esac
