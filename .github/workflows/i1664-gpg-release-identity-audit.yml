name: i1664 GPG release identity audit

# Keep this workflow disabled in repository Actions settings by default. The
# #2571 owner controls the one authorized live dispatch and re-disables it
# afterward. Configure required reviewers on the release-key-audit environment.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: read and verify the existing release-key identity
    if: >-
      github.repository_id == '0' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    environment: release-key-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the protected audit implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run the protected access audit
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASS: ${{ secrets.GPG_PRIVATE_KEY_PASS }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 -S scripts/run_i2587_gpg_audit.py
