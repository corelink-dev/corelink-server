name: B-251 quota CAS provenance and read-only latency probe

# Pull requests run only credentialless static/fixture contracts. A bounded
# checker replay and timing measurement is available only after merge, from
# protected main, with one explicit dispatch confirmation.
on:
  pull_request:
    paths:
      - '.github/workflows/b251-d03-read-only-probe.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/corelink-billing/src/quota/cas/**'
      - 'crates/corelink-billing/tests/quota_cas_prop_quota_cas.rs'
      - 'crates/corelink-billing/tests/b251_identity_operation.rs'
      - 'scripts/collect_b251_provenance.py'
      - 'scripts/run_b251_latency_probe.py'
      - 'scripts/verify_b251_provenance_contract.py'
      - 'tests/test_b251_provenance_contract.py'
      - 'tests/test_run_b251_latency_probe.py'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-b251-d03-read-only" to run the bounded probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b251-d03-read-only-probe
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: Verify deterministic quota-CAS budget separation
        run: python3 scripts/verify_b251_quota_cas_budget.py
      - run: python -m pytest -q tests/test_b251_provenance_contract.py tests/test_run_b251_latency_probe.py
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Checkout the immutable D02 producer revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The commit SHA is the integrity pin; the repository is only where
          # it is fetched from. Fetch it from the repository running this
          # workflow, never from an owner name that could be re-registered.
          repository: ${{ github.repository }}
          ref: f88c6ca41868f6a02e78ba9f4357d3abf67da4be
          persist-credentials: false
          path: d02
      - name: Compare the deterministic D02 operation to this exact PR head
        run: |
          set -euo pipefail
          python3 scripts/collect_b251_provenance.py \
            --d02 "$GITHUB_WORKSPACE/d02" \
            --d03 "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/b251-pr-provenance.json"

  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'HuGR-dev/corelink-server' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    name: B-251 bounded checker replay and 1000-sample probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout protected main without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: d03

      - name: Checkout immutable D02 producer revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Same-repository fetch of the SHA-pinned producer (see the PR job).
          repository: ${{ github.repository }}
          ref: f88c6ca41868f6a02e78ba9f4357d3abf67da4be
          fetch-depth: 0
          persist-credentials: false
          path: d02

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action

      - name: Validate dispatch and derive both identities from real checker operations
        id: collect
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${CONFIRM}" = run-b251-d03-read-only
          mkdir -p artifacts/b251
          python3 d03/scripts/collect_b251_provenance.py \
            --d02 "$GITHUB_WORKSPACE/d02" \
            --d03 "$GITHUB_WORKSPACE/d03" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$GITHUB_WORKSPACE/artifacts/b251/provenance-receipt.json"

      - name: Run bounded p99 probe against generated identity records
        run: |
          set -euo pipefail
          python3 d03/scripts/run_b251_latency_probe.py --allow-run \
            --d02-identity "$GITHUB_WORKSPACE/artifacts/b251/d02-identity.json" \
            --observed-identity "$GITHUB_WORKSPACE/artifacts/b251/d03-identity.json" \
            --output "$GITHUB_WORKSPACE/artifacts/b251/latency-receipt.json"

      - name: Upload redacted receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b251-provenance-probe-${{ github.run_id }}
          path: artifacts/b251/*.json
          if-no-files-found: error
          retention-days: 30
