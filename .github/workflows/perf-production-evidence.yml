name: perf-production-evidence

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Dogfood tenant UUID (owner supplied; never a token)"
        required: true
        type: string
      worker_script:
        description: "Cloudflare production Worker script name"
        required: true
        type: string
      confirm:
        description: 'Type "collect-production-evidence" to run the bounded lane'
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: perf-production-evidence-${{ inputs.tenant_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Production credentials and attestation permissions are restricted to
    # the stable repository identity, protected main, and an explicit dispatch.
    if: github.repository_id == '0' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    steps:
      - name: Confirm intent (fail closed)
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "${CONFIRM}" = "collect-production-evidence"

      - name: Checkout without a credential helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned GitHub CLI verifier
        run: |
          set -euo pipefail
          python3 scripts/install_pinned_gh.py --output "${RUNNER_TEMP}/corelink-gh/gh"

      - name: Fetch GitHub deployment identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_CONFIG_DIR: ${{ runner.temp }}/corelink-gh-config
          HOME: ${{ runner.temp }}/corelink-gh-home
          CORELINK_GH_BIN: ${{ runner.temp }}/corelink-gh/gh
        run: |
          set -eu
          mkdir -p "${GH_CONFIG_DIR}" "${HOME}"
          chmod 700 "${GH_CONFIG_DIR}" "${HOME}"
          run_pinned_gh() {
            /usr/bin/env -i \
              "GH_TOKEN=${GH_TOKEN}" GH_HOST=github.com \
              "GH_CONFIG_DIR=${GH_CONFIG_DIR}" "HOME=${HOME}" \
              "XDG_CONFIG_HOME=${GH_CONFIG_DIR}" PATH=/usr/bin:/bin \
              GITHUB_SERVER_URL=https://github.com GH_NO_UPDATE_NOTIFIER=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              LANG=C LC_ALL=C NO_COLOR=1 "${CORELINK_GH_BIN}" "$@"
          }
          test "$(run_pinned_gh version | awk 'NR == 1 {print $3}')" = "2.79.0"
          run_pinned_gh api --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=production&per_page=100" \
            > "${RUNNER_TEMP}/github-deployments.json"

      - name: Fetch Cloudflare deployment identity (redacted output)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_SCRIPT: ${{ inputs.worker_script }}
        run: |
          set -eu
          test -n "${CF_API_TOKEN}" -a -n "${CF_ACCOUNT_ID}"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_SCRIPT}/deployments" \
            > "${RUNNER_TEMP}/cloudflare-deployments.json"
          # The response is used only to bind commit/id and is never uploaded.
          chmod 600 "${RUNNER_TEMP}/cloudflare-deployments.json"

      - name: Resolve GitHub run start timestamp
        id: github-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_CONFIG_DIR: ${{ runner.temp }}/corelink-gh-config
          HOME: ${{ runner.temp }}/corelink-gh-home
          CORELINK_GH_BIN: ${{ runner.temp }}/corelink-gh/gh
        run: |
          set -euo pipefail
          mkdir -p "${GH_CONFIG_DIR}" "${HOME}"
          chmod 700 "${GH_CONFIG_DIR}" "${HOME}"
          run_pinned_gh() {
            /usr/bin/env -i \
              "GH_TOKEN=${GH_TOKEN}" GH_HOST=github.com \
              "GH_CONFIG_DIR=${GH_CONFIG_DIR}" "HOME=${HOME}" \
              "XDG_CONFIG_HOME=${GH_CONFIG_DIR}" PATH=/usr/bin:/bin \
              GITHUB_SERVER_URL=https://github.com GH_NO_UPDATE_NOTIFIER=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              LANG=C LC_ALL=C NO_COLOR=1 "${CORELINK_GH_BIN}" "$@"
          }
          test "$(run_pinned_gh version | awk 'NR == 1 {print $3}')" = "2.79.0"
          run_started_at="$(run_pinned_gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.run_started_at')"
          test -n "${run_started_at}"
          printf 'started_at=%s\n' "${run_started_at}" >> "${GITHUB_OUTPUT}"

      - name: Build immutable run context
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_STARTED_AT: ${{ steps.github-run.outputs.started_at }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -eu
          python3 scripts/collect_b102_b108_context.py \
            --github-deployment "${RUNNER_TEMP}/github-deployments.json" \
            --provider-deployment "${RUNNER_TEMP}/cloudflare-deployments.json" \
            --output "${RUNNER_TEMP}/evidence-context.json"
          python3 - <<'PY'
          import json, os, pathlib, uuid
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence-context.json'
          d = json.loads(p.read_text())
          tenant = uuid.UUID(os.environ['TENANT_ID'])
          if tenant.version != 4:
              raise SystemExit('tenant_id must be a v4 UUID')
          d['tenant_id'] = str(tenant)
          p.write_text(json.dumps(d, sort_keys=True, indent=2) + '\n')
          PY

      - name: Collect authenticated B-102..B-107 measurements
        env:
          CORELINK_PERF_BASE: ${{ vars.CORELINK_PERF_BASE }}
          CORELINK_PERF_TENANT: ${{ inputs.tenant_id }}
          CORELINK_PERF_PAT: ${{ secrets.CORELINK_PERF_PAT }}
          CORELINK_FRESH_MINT_URL: ${{ vars.CORELINK_FRESH_MINT_URL }}
          CORELINK_FRESH_SESSION: ${{ secrets.CORELINK_FRESH_SESSION }}
          CORELINK_INTERNAL_AUTH_KEY: ${{ secrets.CORELINK_INTERNAL_AUTH_KEY }}
        run: |
          set -eu
          python3 scripts/collect_b102_b107_measurements.py --output "${RUNNER_TEMP}/b102-b107-measurements.json"

      - name: Collect B-105 identical cache off/on build lane
        env:
          CORELINK_PERF_BASE: ${{ vars.CORELINK_PERF_BASE }}
          CORELINK_PERF_TENANT: ${{ inputs.tenant_id }}
          CORELINK_PERF_PAT: ${{ secrets.CORELINK_PERF_PAT }}
        run: |
          set -eu
          python3 scripts/collect_b105_same_lane.py --isolated "${RUNNER_TEMP}/b105-lane.json"

      - name: Build exact B-106 attestation subject
        run: |
          set -euo pipefail
          python3 scripts/build_b106_attestation_subject.py \
            --context "${RUNNER_TEMP}/evidence-context.json" \
            --measurements "${RUNNER_TEMP}/b102-b107-measurements.json" \
            --output "${RUNNER_TEMP}/b106-cold-attestation.json"

      - name: Attest exact B-106 evidence subject
        id: attest-b106
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/b106-cold-attestation.json
          github-token: ${{ github.token }}

      - name: Verify B-106 attestation identity and subject
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_CONFIG_DIR: ${{ runner.temp }}/corelink-gh-config
          HOME: ${{ runner.temp }}/corelink-gh-home
          CORELINK_GH_BIN: ${{ runner.temp }}/corelink-gh/gh
          B106_SUBJECT: ${{ runner.temp }}/b106-cold-attestation.json
          B106_BUNDLE: ${{ steps.attest-b106.outputs.bundle-path }}
          B106_VERIFICATION: ${{ runner.temp }}/b106-attestation-verification.json
        run: |
          set -euo pipefail
          mkdir -p "${GH_CONFIG_DIR}" "${HOME}"
          chmod 700 "${GH_CONFIG_DIR}" "${HOME}"
          run_pinned_gh() {
            /usr/bin/env -i \
              "GH_TOKEN=${GH_TOKEN}" GH_HOST=github.com \
              "GH_CONFIG_DIR=${GH_CONFIG_DIR}" "HOME=${HOME}" \
              "XDG_CONFIG_HOME=${GH_CONFIG_DIR}" PATH=/usr/bin:/bin \
              GITHUB_SERVER_URL=https://github.com GH_NO_UPDATE_NOTIFIER=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              LANG=C LC_ALL=C NO_COLOR=1 "${CORELINK_GH_BIN}" "$@"
          }
          test "$(run_pinned_gh version | awk 'NR == 1 {print $3}')" = "2.79.0"
          test -s "${B106_BUNDLE}"
          run_pinned_gh attestation verify "${B106_SUBJECT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${B106_BUNDLE}" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/perf-production-evidence.yml@${GITHUB_REF}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --signer-digest "${GITHUB_SHA}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --format json > "${B106_VERIFICATION}"

      - name: Join canonical v2 evidence packet
        run: |
          set -eu
          python3 scripts/join_b102_b108_evidence.py \
            --context "${RUNNER_TEMP}/evidence-context.json" \
            --measurements "${RUNNER_TEMP}/b102-b107-measurements.json" \
            --b105 "${RUNNER_TEMP}/b105-lane.json" \
            --b106-attestation-subject "${RUNNER_TEMP}/b106-cold-attestation.json" \
            --b106-attestation-bundle "${{ steps.attest-b106.outputs.bundle-path }}" \
            --b106-attestation-verification "${RUNNER_TEMP}/b106-attestation-verification.json" \
            --root "${GITHUB_WORKSPACE}" \
            --output "${RUNNER_TEMP}/corelink-performance-evidence.v2.json"

      - name: Verify canonical packet (fail closed; B-102..B-107 remain open)
        env:
          CORELINK_EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          unset GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN GITHUB_TOKEN
          python3 scripts/verify_b102_b108_evidence.py \
            --packet "${RUNNER_TEMP}/corelink-performance-evidence.v2.json" \
            --expect open

      - name: Publish verifier-backed owner handoff (no credentials)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b102-b108-owner-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/corelink-performance-evidence.v2.json
          retention-days: 7
          if-no-files-found: error
