name: signup-worker — CF Worker deploy

# Deploys the signup-worker (Worker name: corelink-signup-worker — the LIVE
# Stripe webhook + Clerk signup handler, the money path) on every push to main
# that touches apps/signup-worker/**, plus manual dispatch.
#
# Before this lane, the signup-worker had NO CI deploy — it shipped only via a
# manual `wrangler deploy`, so a merged change could silently sit undeployed
# (the handler in prod lagging main). This closes that gap.
#
# Runner: GitHub-hosted Ubuntu; wrangler-only (no docker).
#
# Deploy auth: CF_API_TOKEN + CF_ACCOUNT_ID (GH Actions secrets). The worker's
# RUNTIME secrets (CLERK_WEBHOOK_SECRET, CLERK_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_SECRET_KEY, CORELINK_INTERNAL_AUTH_KEY, CORELINK_PAT_MINT_AUTH_KEY,
# CORELINK_ERASE_AUTH_KEY, ERASURE_SALT_KEY, …) are bound out-of-band via
# `wrangler secret put`. The B-216 exception is the owner-approved critical
# alert endpoint and bearer credential: this lane synchronizes both from
# identically named GitHub Actions secrets before the readback gate and deploy.
# Their values travel only via step-scoped environment variables and Wrangler
# stdin; they are never placed in argv or printed.
#
# SHA-pinned per repo hard constraint; action bumps require review.

on:
  push:
    branches: [main]
    paths:
      - 'apps/signup-worker/**'
      - 'migrations/d1/0145_dsr_dlq_redrive_authority.sql'
      - 'scripts/verify-signup-worker-secrets.sh'
      - 'scripts/verify-signup-worker-dsr-redrive-schema.sh'
      - '.github/workflows/signup-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: signup-worker-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy to CF Worker
    # Production deploy: only the server repository (privileged literal ID,
    # rendered by scripts/sync_workflow_repository_guards.py --write), only
    # protected main, and only behind the production environment's reviewers.
    if: github.repository_id == '0' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/signup-worker
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No `cache:`; this deploy lane does not use setup-node's pnpm cache.

      # B-090: this lane used to run `npm install --legacy-peer-deps` — an
      # UNPINNED install, resolving the whole tree fresh on every deploy, with
      # every transitive `postinstall` executing, on a self-hosted runner that
      # holds the Cloudflare deploy credential. This worker is the live handler
      # for Stripe billing, Clerk identity, GitHub provisioning and DSR.
      #
      # The old comment said "`npm ci` cannot run — the lockfile is gitignored".
      # True of the NPM lockfile, and it hid the thing that matters: this package
      # is ALREADY a member of the pnpm workspace (pnpm-workspace.yaml) and
      # ALREADY has a pinned, committed entry in `pnpm-lock.yaml` (importer
      # `apps/signup-worker`). There was a pinned lockfile the whole time; this
      # lane just did not use it.
      #
      # So the fix is NOT to commit a second, divergent `package-lock.json`
      # against `.gitignore:93` ("this repo uses pnpm ... never commit
      # package-lock.json"). It is to install the way every other deploy lane
      # already does — `admin-ui-deploy.yml:93`, `cf-deploy-prod.yml:307`.
      #
      # This also closes the half B-090 called undecided: what ships is now the
      # same pnpm graph `pnpm-audit.yml` scans, instead of an npm-resolved tree
      # no gate ever saw.
      #
      # `--legacy-peer-deps` is gone with the cause: it existed because a FRESH
      # npm install floated wrangler ≥4.108 whose OPTIONAL peer on
      # workers-types@^5 ERESOLVEd against this worker's pinned 4.x. Frozen
      # install, no floating, no ERESOLVE.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @corelink/signup-worker... --ignore-scripts

      # wrangler is a devDependency of signup-worker, but pin the global CLI to
      # the repo-wide exact version for parity with the other deploy lanes (v3
      # cannot parse [[env.*.containers]]; v4 is the supported line).
      - name: Install wrangler
        working-directory: .
        run: npm install -g wrangler@4.95.0

      # B-216: the DLQ consumer cannot deliver an alert without an approved
      # sink. Synchronize the owner-selected HTTPS endpoint and dedicated token
      # before the name-only readback. Values stay in step env and Wrangler stdin.
      - name: Synchronize critical alert sink configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DSR_DLQ_ALERT_ENDPOINT" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::DSR_DLQ_ALERT_ENDPOINT is absent or is not an HTTPS URL." >&2
            exit 1
          fi
          if [[ -z "$DSR_DLQ_ALERT_AUTH_TOKEN" ]]; then
            echo "::error::DSR_DLQ_ALERT_AUTH_TOKEN is absent." >&2
            exit 1
          fi
          printf '%s' "$DSR_DLQ_ALERT_ENDPOINT" | wrangler secret put DSR_DLQ_ALERT_ENDPOINT --config wrangler.toml
          printf '%s' "$DSR_DLQ_ALERT_AUTH_TOKEN" | wrangler secret put DSR_DLQ_ALERT_AUTH_TOKEN --config wrangler.toml
          unset DSR_DLQ_ALERT_ENDPOINT DSR_DLQ_ALERT_AUTH_TOKEN
        env:
          DSR_DLQ_ALERT_ENDPOINT: ${{ secrets.DSR_DLQ_ALERT_ENDPOINT }}
          DSR_DLQ_ALERT_AUTH_TOKEN: ${{ secrets.DSR_DLQ_ALERT_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # The drain route is fail-closed on its dedicated erase key. `wrangler
      # deploy` preserves secrets, so read back deployed secret names after the
      # critical-alert sync and before shipping code; values are never listed/logged.
      - name: Verify required runtime secrets
        run: bash ../../scripts/verify-signup-worker-secrets.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Verify DSR redrive schema before deploy
        run: bash ../../scripts/verify-signup-worker-dsr-redrive-schema.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # `wrangler deploy` esbuild-bundles src/index.ts and reads
      # apps/signup-worker/wrangler.toml (single default env — no [env.*] blocks —
      # name corelink-signup-worker, route corelink-signup.humangr.com/*).
      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
