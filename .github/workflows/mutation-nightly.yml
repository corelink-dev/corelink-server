name: mutation-nightly (R2 baseline + 5-crate expansion + wave-24 large-crate lane)

# B-110: the heavy matrix uses GitHub-hosted Linux. This migration changes only
# runner placement and checkout credential persistence; mutation execution is
# not part of the static #2368 proof pack.

concurrency:
  # Escopo por ref. Grupo CONSTANTE torna o grupo repo-global: duas execucoes
  # `workflow_dispatch` deste mesmo workflow em branches DIFERENTES cancelam uma
  # a outra. Foi o que matou tres dispatches em 2026-08-31.
  group: "ci-mutation-nightly-r2-baseline-5-crate-expansion-wave-24-large-crate-lane-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# Nightly cargo-mutants gate on 11 critical crates:
# - corelink-byok (envelope encryption + DEK cache)         [baseline 2026-05-14]
# - corelink-signup (atomic provisioning orchestrator)      [baseline 2026-05-14]
# - corelink-tier-selection (INV-ONBOARD-DPA-FIRST)         [baseline 2026-05-14]
# - corelink-audit-chain (BLAKE3 chain integrity)           [expansion 2026-05-15; empirically CLOSED wave-13 @ 84.24 %]
# - corelink-pat (PAT mint/verify + Argon2id)               [expansion 2026-05-15; wave-24 empirical partial-lift 2026-05-16 — see `specs/_audits/sealed/2026-05-16-pat-clerk-mutation-sweep.md`; nightly is the empirical SEAL gate per wave-14 precedent]
# - corelink-clerk (SSO JWT validation + JWKS)              [expansion 2026-05-15; wave-24 empirical partial-lift 2026-05-16 — see `specs/_audits/sealed/2026-05-16-pat-clerk-mutation-sweep.md`; nightly is the empirical SEAL gate per wave-14 precedent]
# - corelink-dual-approval (admin op gate + collusion)      [expansion 2026-05-15]
# - corelink-ratelimit (token bucket + Retry-After)         [expansion 2026-05-15]
# - corelink-r2-multipart (150 mutants; large surface)      [wave-24 2026-05-16]
# - corelink-billing (350 mutants; large surface; quota-cas absorbed)  [wave-24 2026-05-16; renamed wave-35]
# - corelink-auth (369 mutants; large surface; webauthn absorbed)      [wave-24 2026-05-16; renamed wave-35]
#
# Per `specs/_audits/sealed/2026-05-14-mutation-baseline.md` +
# `specs/_audits/sealed/2026-05-15-mutation-expansion.md` +
# `specs/_audits/sealed/2026-05-16-debt-008-wave24-mutation-sweep.md`
# baseline: kill rate ≥ 75 % per crate; build fails if kill rate
# drops > 5 % vs the recorded baseline so a PR cannot silently
# regress mutation coverage on critical security paths. The 3
# wave-24 crates are scoped to CI-nightly only (not blocking PR
# CI) per wave-24 §6 budget-decision matrix.
#
# WAVE-24 LIFT 2026-05-16 (corelink-pat + corelink-clerk):
# Local full sweep is structurally infeasible for these two crates
# (~4.5 h / crate even with --jobs 4 due to OWASP-2024 Argon2id
# parameter cycles + 10 000-iter RS256 proptests). Wave-24 ran a
# 62 % partial sweep on `corelink-pat` (74.8 % empirical, +7
# targeted tests for 5 killable misses, 19 structurally-equivalent
# misses documented) and a 5-file (24 % LOC) subset sweep on
# `corelink-clerk` (85.7 % empirical, 0 missed). This workflow is
# now the canonical empirical SEAL gate for both crates per the
# `TD-DEBT-008-WAVE-14-EMPIRICAL` precedent: the first scheduled
# nightly run after this commit IS the empirical confirmation.
#
# Reference: tenant-path nightly mutants lane (WI-S01-001 §17).

on:
  # No `schedule` trigger here. Repo rule (CLAUDE.md): a cron earns its keep
  # ONLY when something can change WITHOUT a commit (CVE feeds, prod state,
  # backups, cert/infra drift). Mutation kill-rate is a pure function of code
  # + tests — it cannot regress between commits, so a weekly clock re-runs a
  # ~6-8h, 11-crate sweep for no reason on weeks nobody touched these crates.
  # This workflow was ALSO broken (cargo-mutants CLI flag conflict, fixed in
  # this same change) and `disabled_manually`, so the cron was firing into a
  # guaranteed-red job for weeks with nobody watching. Do not re-add a cron
  # here — if you want kill-rate re-verified on a cadence, that still isn't
  # "something changed without a commit"; wire it to `pull_request` (scoped to
  # the paths of the crates in the matrix) instead, or dispatch manually.
  workflow_dispatch:
    # Manual trigger for baseline re-record after a deliberate refactor, or
    # for an on-demand kill-rate re-check.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Baseline kill-rate thresholds (recorded 2026-05-14 + 2026-05-15).
  # Build fails if observed kill rate drops below
  # (baseline - 5pp), per WI guard band.
  BYOK_BASELINE: 75
  SIGNUP_BASELINE: 75
  TIER_SELECTION_BASELINE: 75
  AUDIT_CHAIN_BASELINE: 75
  PAT_BASELINE: 75
  CLERK_BASELINE: 75
  DUAL_APPROVAL_BASELINE: 75
  RATELIMIT_BASELINE: 75
  # Wave-24 large-crate lane — no pre-recorded baseline (first
  # nightly run establishes the kill-rate; floor is 75 % flat).
  R2_MULTIPART_BASELINE: 75
  QUOTA_CAS_BASELINE: 75
  WEBAUTHN_BASELINE: 75
  REGRESSION_TOLERANCE_PP: 5

jobs:
  mutants:
    name: cargo-mutants kill-rate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 330  # under the 6h runner cap; over-budget crates fail loudly
    strategy:
      fail-fast: false
      matrix:
        crate:
          - corelink-byok
          - corelink-signup
          - corelink-tier-selection
          - corelink-audit-chain
          - corelink-pat
          - corelink-clerk
          - corelink-dual-approval
          - corelink-ratelimit
          - corelink-r2-multipart
          - corelink-billing
          - corelink-auth
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-29

      - name: Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: runner.environment == 'github-hosted'  # shared-$HOME guard (see scripts/validate_shared_home_cache_guard.py)
        with:
          workspaces: ". -> target"
          key: mutants-${{ matrix.crate }}

      - name: Install cargo-mutants (prebuilt)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants@25.0.1

      - name: Run cargo-mutants on ${{ matrix.crate }}
        run: |
          set -euo pipefail
          # cargo-mutants ALWAYS creates a subdir literally named `mutants.out`
          # *inside* the `--output` directory (src: `in_dir.join("mutants.out")`).
          # Passing `--output .` therefore writes results to `./mutants.out/`
          # (NOT `./mutants.out/mutants.out/`). The gate below reads `mutants.out/`.
          # `--in-place` and `--jobs` are mutually exclusive as of a recent
          # cargo-mutants release: `--in-place` mutates the single checked-out
          # tree directly, which is only safe with one mutant running at a
          # time, so the CLI now refuses to combine it with `--jobs`. We keep
          # `--jobs 4` (each parallel job gets its own scratch-dir copy) and
          # drop `--in-place`, because the heavy crates (corelink-pat,
          # corelink-clerk) already take ~4.5h serially and need the 4-way
          # parallelism to fit inside the 330-minute job timeout; the copy
          # overhead `--in-place` would have saved is worth far less than
          # blowing the timeout. No kill-rate impact — this only changes how
          # mutants are executed, not which mutants are generated.
          cargo mutants \
            --package ${{ matrix.crate }} \
            --no-shuffle \
            --jobs 4 \
            --output . \
            --timeout 180 \
            || true   # We compute the gate ourselves from the JSON

      - name: Compute kill rate + enforce gate
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys

          crate = "${{ matrix.crate }}"
          baseline_map = {
            "corelink-byok": int(os.environ["BYOK_BASELINE"]),
            "corelink-signup": int(os.environ["SIGNUP_BASELINE"]),
            "corelink-tier-selection": int(os.environ["TIER_SELECTION_BASELINE"]),
            "corelink-audit-chain": int(os.environ["AUDIT_CHAIN_BASELINE"]),
            "corelink-pat": int(os.environ["PAT_BASELINE"]),
            "corelink-clerk": int(os.environ["CLERK_BASELINE"]),
            "corelink-dual-approval": int(os.environ["DUAL_APPROVAL_BASELINE"]),
            "corelink-ratelimit": int(os.environ["RATELIMIT_BASELINE"]),
            "corelink-r2-multipart": int(os.environ["R2_MULTIPART_BASELINE"]),
            "corelink-billing": int(os.environ["QUOTA_CAS_BASELINE"]),
            "corelink-auth": int(os.environ["WEBAUTHN_BASELINE"]),
          }
          tolerance = int(os.environ["REGRESSION_TOLERANCE_PP"])

          # cargo-mutants writes its outcomes under `mutants.out/` (the run step
          # passes `--output .`; cargo-mutants joins the literal `mutants.out`).
          out = pathlib.Path("mutants.out")

          def count_lines(name):
              p = out / name
              return len(p.read_text().strip().splitlines()) if p.exists() else 0

          mutants_json = out / "mutants.json"
          if not mutants_json.exists():
              print(f"::error::Harness failure: {mutants_json} not found — cargo-mutants did not produce any output for {crate}.")
              sys.exit(1)
          mutants = json.loads(mutants_json.read_text())
          total = len(mutants)
          caught = count_lines("caught.txt")
          missed = count_lines("missed.txt")
          unviable = count_lines("unviable.txt")
          timeout = count_lines("timeout.txt")  # timed-out mutants are survivors, not kills
          recorded = caught + missed + unviable + timeout
          viable = total - unviable

          baseline = baseline_map[crate]
          floor = baseline - tolerance

          # Distinguish a genuine 0% kill-rate from an INCOMPLETE run. cargo-mutants
          # writes mutants.json BEFORE the baseline build + before any scenario, but
          # the caught/missed/... lists only as scenarios complete and outcomes.json
          # only on finish(). So if the baseline build/test fails (or the run is
          # killed before a single scenario finishes) we get total>0 with ZERO
          # recorded outcomes — which the old harness silently reported as a fake
          # 0.0% "regression" (the false-0.0% bug on large/slow crates). Fail LOUD
          # and DISTINCT instead of masquerading as a surviving-mutant regression.
          if total > 0 and recorded == 0:
              print(f"crate={crate} total={total} caught=0 missed=0 unviable=0 timeout=0")
              print(f"::error::Incomplete mutation run for {crate}: {total} mutants generated but ZERO outcomes recorded "
                    f"(no outcomes.json={'present' if (out / 'outcomes.json').exists() else 'MISSING'}). "
                    f"Likely the baseline build/test failed or the run was killed before any scenario completed "
                    f"(per-mutant --timeout may be too low for this crate). This is a HARNESS failure, not a kill-rate regression.")
              sys.exit(1)

          kill_rate = (caught / viable * 100) if viable > 0 else 0.0

          print(f"crate={crate} total={total} caught={caught} missed={missed} unviable={unviable} timeout={timeout}")
          print(f"kill_rate={kill_rate:.1f}% baseline={baseline}% floor={floor}%")

          if kill_rate < floor:
              print(f"::error::Kill rate regression: {kill_rate:.1f}% < floor {floor}% (baseline {baseline}% - tolerance {tolerance}pp)")
              sys.exit(1)
          print(f"::notice::Kill rate OK: {kill_rate:.1f}% ≥ floor {floor}%")
          PY

      - name: Emit per-crate JSON summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          crate = "${{ matrix.crate }}"
          out = pathlib.Path("mutants.out")

          def count_lines(name):
              p = out / name
              return len(p.read_text().strip().splitlines()) if p.exists() else 0

          summary = {
            "crate": crate,
            "kill_rate_pct": None,
            "total": 0, "caught": 0, "missed": 0, "unviable": 0, "timeout": 0, "viable": 0,
            "source": "ci-nightly",
          }
          try:
              mutants = json.loads((out / "mutants.json").read_text())
              total = len(mutants)
              caught = count_lines("caught.txt")
              missed = count_lines("missed.txt")
              unviable = count_lines("unviable.txt")
              timeout = count_lines("timeout.txt")
              recorded = caught + missed + unviable + timeout
              viable = total - unviable
              kill = (caught / viable * 100) if viable > 0 else 0.0
              summary.update(total=total, caught=caught, missed=missed,
                             unviable=unviable, timeout=timeout, viable=viable,
                             kill_rate_pct=round(kill, 2))
              # Flag incomplete runs so the aggregate never treats a harness
              # failure (total>0, zero outcomes recorded) as a real 0.0%.
              if total > 0 and recorded == 0:
                  summary["kill_rate_pct"] = None
                  summary["incomplete"] = True
          except Exception as e:
              summary["error"] = str(e)
          pathlib.Path(f"mutation-summary-{crate}.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload mutants artifact (raw)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 30

      - name: Upload per-crate JSON summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-summary-${{ matrix.crate }}
          path: mutation-summary-${{ matrix.crate }}.json
          retention-days: 90

  aggregate:
    name: Aggregate per-crate JSON → reports/mutation/latest.json
    needs: mutants
    # This job owns contents/issues write. It may only run from the protected
    # canonical main ref in the canonical repository; a fork or unprotected
    # dispatch must never receive write-capable credentials.
    if: always() && github.repository_id == vars.CORELINK_SERVER_REPO_ID && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # least-privilege: write only on the aggregator
      issues: write         # open a regression issue if any crate < 75 %
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all per-crate summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: mutation-summary-*
          merge-multiple: true

      - name: Build reports/mutation/latest.json
        id: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, datetime
          art = pathlib.Path("artifacts")
          rows = []
          for f in sorted(art.glob("mutation-summary-*.json")):
              try:
                  rows.append(json.loads(f.read_text()))
              except Exception as e:
                  rows.append({"crate": f.stem, "error": str(e)})
          latest = {
            "schema": "corelink.mutation.nightly.v1",
            "generated_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "run_url": f"{os.environ.get('GITHUB_SERVER_URL','')}/${{ github.repository }}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}",
            "commit": os.environ.get("GITHUB_SHA", ""),
            "floor_pct": 75.0,
            "crates": rows,
          }
          # Compute regression list.
          below = [r for r in rows if isinstance(r.get("kill_rate_pct"), (int, float)) and r["kill_rate_pct"] < 75.0]
          latest["below_floor"] = [{"crate": r["crate"], "kill_rate_pct": r["kill_rate_pct"]} for r in below]
          out_dir = pathlib.Path("reports/mutation")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "latest.json").write_text(json.dumps(latest, indent=2) + "\n")
          # Expose regression count to subsequent steps.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"below_count={len(below)}\n")
              fh.write(f"below_summary={','.join(b['crate']+':'+str(b['kill_rate_pct']) for b in latest['below_floor'])}\n")
          PY

      - name: Commit latest.json (signed) on delta
        if: github.event_name == 'workflow_dispatch' && github.repository_id == vars.CORELINK_SERVER_REPO_ID && github.ref == 'refs/heads/main' && github.ref_protected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/mutation/latest.json; then
            echo "No delta in reports/mutation/latest.json — skipping commit."
            exit 0
          fi
          # Use GitHub-app-style signed commit via the Contents API.
          BRANCH="${GITHUB_REF_NAME:-main}"
          FILE="reports/mutation/latest.json"
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=${BRANCH}" --jq .sha 2>/dev/null || true)
          CONTENT_B64=$(base64 -w0 < "${FILE}" 2>/dev/null || base64 < "${FILE}" | tr -d '\n')
          MSG="chore(mutation-nightly): refresh reports/mutation/latest.json (run ${GITHUB_RUN_ID})"
          if [ -n "${SHA}" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
              -f message="${MSG}" -f content="${CONTENT_B64}" -f sha="${SHA}" -f branch="${BRANCH}" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
              -f message="${MSG}" -f content="${CONTENT_B64}" -f branch="${BRANCH}" >/dev/null
          fi
          echo "Committed (signed via GitHub Contents API) ${FILE} on ${BRANCH}."

      - name: Open issue on kill-rate regression (< 75 %)
        if: steps.build.outputs.below_count != '0' && steps.build.outputs.below_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="mutation-nightly: ${{ steps.build.outputs.below_count }} crate(s) below 75 % kill-rate floor"
          BODY=$(cat <<EOF
          The nightly mutation sweep observed one or more crates below the
          75 % kill-rate floor. Investigate each survivor and add targeted
          tests per the wave-14 protocol.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Crates below floor: ${{ steps.build.outputs.below_summary }}
          - Artifact: reports/mutation/latest.json

          Closure protocol: see specs/_audits/sealed/2026-05-15-mutation-full-sweep.md §7.6.
          EOF
          )
          gh issue create \
            --title "${TITLE}" \
            --body  "${BODY}" \
            --label "debt-008,mutation-nightly,P1" >/dev/null || true

      - name: Upload aggregated latest.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-latest
          path: reports/mutation/latest.json
          retention-days: 365
