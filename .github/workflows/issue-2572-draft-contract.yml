name: Issue 2572 draft release contract

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact pull request head SHA to validate
        required: true
        type: string
      base_sha:
        description: Exact protected main SHA used for the candidate diff
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: issue-2572-draft-contract-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: draft verifier and release workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact dispatch identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"
      - name: Run deterministic draft inventory negatives
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --requirement requirements-ci.txt
          python3 -B -m unittest tests.test_cli_release_draft_contract -v
          python3 -B scripts/verify_b112_release_root_cause.py
          python3 scripts/verify_i2050_release_dryrun_contract.py contract --base-sha "${BASE_SHA}"
          cargo test --locked -p corelink-cli --test release_workflow_contract -- --nocapture
      - name: Validate release workflow syntax
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" .github/workflows/release-cli.yml \
            .github/workflows/release-slsa3.yml .github/workflows/issue-2572-draft-contract.yml
      - name: Validate DCO and tracked diff boundary
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          git show --format='%B' --no-patch "${CANDIDATE_SHA}" | grep -Fq 'Signed-off-by: '
          git diff --name-only "${BASE_SHA}...${CANDIDATE_SHA}" > "${RUNNER_TEMP}/changed-paths.txt"
          if grep -E '^\.github/workflows/(sign-linux|sign-windows)\.yml$|^scripts/(cli_release_manifest|verify_cli_release_inventory)\.py$|^tools/cli/Cargo.toml$|^apps/get-corelink-worker/(src/install\.ts|wrangler\.toml)$' "${RUNNER_TEMP}/changed-paths.txt"; then
            echo 'issue 2572 candidate crossed its frozen ownership boundary' >&2
            exit 1
          fi

  build-package:
    name: release target fixture (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            ext: ""
          - name: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            ext: ""
          - name: windows-x86_64
            triple: x86_64-pc-windows-gnu
            runner: windows-2022
            ext: .exe
    steps:
      - name: Enable Git long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact dispatch identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - name: Set up target build environment
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target.triple }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          bash scripts/ci-assert-pinned-toolchain.sh
          rustup target add "${TARGET_TRIPLE}"
          bash scripts/ci-assert-pinned-toolchain.sh "${TARGET_TRIPLE}"
          CARGO_HOME="${RUNNER_TEMP}/corelink-cargo/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/corelink-target/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          mkdir -p "${CARGO_HOME}" "${CARGO_TARGET_DIR}"
          echo "CARGO_HOME=${CARGO_HOME}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}" >> "${GITHUB_ENV}"
          REMAP="--remap-path-prefix=${CARGO_HOME}/registry=cargo-registry"
          REMAP="${REMAP} --remap-path-prefix=${CARGO_HOME}/git=cargo-git"
          REMAP="${REMAP} --remap-path-prefix=${HOME}/.rustup=rustup"
          REMAP="${REMAP} --remap-path-prefix=${GITHUB_WORKSPACE}=corelink"
          echo "RUSTFLAGS=${REMAP}" >> "${GITHUB_ENV}"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Verify Zig and install cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = 0.16.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-zigbuild@0.19.8
      - name: Verify cargo-zigbuild and isolate wrapper cache
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          command -v cargo-zigbuild
          cargo-zigbuild --help >/dev/null
          ZIGBUILD_CACHE="${RUNNER_TEMP}/cargo-zigbuild/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${TARGET_TRIPLE}"
          mkdir -p "${ZIGBUILD_CACHE}"
          echo "CARGO_ZIGBUILD_CACHE_DIR=${ZIGBUILD_CACHE}" >> "${GITHUB_ENV}"
      - name: Build and package exact target
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target.triple }}
          TARGET_NAME: ${{ matrix.target.name }}
          TARGET_EXT: ${{ matrix.target.ext }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${CANDIDATE_SHA}")"
          export SOURCE_DATE_EPOCH
          cargo zigbuild -p corelink-cli --release --locked --target "${TARGET_TRIPLE}"
          SOURCE="${CARGO_TARGET_DIR}/${TARGET_TRIPLE}/release/corelink${TARGET_EXT}"
          mkdir out
          ASSET="corelink-${TARGET_NAME}${TARGET_EXT}"
          cp "${SOURCE}" "out/${ASSET}"
          if [ "${TARGET_TRIPLE}" = x86_64-pc-windows-gnu ]; then
            (cd out && zip -q -X corelink-windows-x86_64.zip "${ASSET}")
          else
            ARCHIVE="corelink-${TARGET_NAME}.tar.gz"
            tar -czf "out/${ARCHIVE}" -C out "${ASSET}"
          fi
          (cd out && for payload in corelink-*; do
            case "${payload}" in *.sha256|checksums.txt) continue ;; esac
            shasum -a 256 "${payload}" > "${payload}.sha256"
            shasum -a 256 -c "${payload}.sha256"
          done && LC_ALL=C sort ./*.sha256 > checksums.txt)
          if [ "${TARGET_TRIPLE}" = x86_64-pc-windows-gnu ]; then
            unzip -t out/corelink-windows-x86_64.zip
            test "$(unzip -Z1 out/corelink-windows-x86_64.zip)" = corelink-windows-x86_64.exe
          else
            tar -tzf "out/${ARCHIVE}" | grep -Fx "${ASSET}"
          fi
