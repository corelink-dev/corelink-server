name: Issue 2572 draft release contract

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/release-cli.yml
      - .github/workflows/release-slsa3.yml
      - .github/workflows/issue-2572-draft-contract.yml
      - .github/workflows/sign-linux.yml
      - Cargo.lock
      - scripts/cli_release_draft_manifest.py
      - scripts/gh_2.79.0_checksums.json
      - scripts/install_pinned_gh.py
      - scripts/verify_cli_release_draft.py
      - scripts/test_pinned_gh_consumers.py
      - scripts/verify_pinned_gh.py
      - tests/test_cli_release_draft_contract.py
      - tools/cli/Cargo.toml
      - tools/cli/tests/release_workflow_contract/assertions.rs
      - tools/cli/tests/release_workflow_contract/cases.rs
      - changelog.d/2572-draft-only-cli-release.md

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: issue-2572-draft-contract-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: draft verifier and release workflow contract
    if: github.repository_id == '1232040291' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact dispatch identity
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"
      - name: Install Python contract dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Install checksum-pinned Linux gh and execute all six exact guard steps
        env:
          GH_TOKEN: ""
          GH_ENTERPRISE_TOKEN: ""
          GITHUB_ENTERPRISE_TOKEN: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/test_pinned_gh_consumers.py
      - name: Run deterministic draft inventory negatives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_cli_release_draft_contract -v
          python3 -B scripts/verify_b112_release_root_cause.py
          python3 scripts/verify_i2050_release_dryrun_contract.py contract --base-sha "${BASE_SHA}"
          cargo test --locked -p corelink-cli --test release_workflow_contract -- --nocapture
      - name: Validate release workflow syntax
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" .github/workflows/release-cli.yml \
            .github/workflows/release-slsa3.yml .github/workflows/sign-linux.yml \
            .github/workflows/issue-2572-draft-contract.yml
      - name: Validate DCO and tracked diff boundary
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show --format='%B' --no-patch "${CANDIDATE_SHA}" | grep -Fq 'Signed-off-by: '
          git diff --name-only "${BASE_SHA}...${CANDIDATE_SHA}" > "${RUNNER_TEMP}/changed-paths.txt"
          cat > "${RUNNER_TEMP}/allowed-paths.txt" <<'EOF'
          .github/workflows/issue-2572-draft-contract.yml
          .github/workflows/release-cli.yml
          .github/workflows/release-slsa3.yml
          .github/workflows/sign-linux.yml
          Cargo.lock
          scripts/test_pinned_gh_consumers.py
          scripts/verify_pinned_gh.py
          tools/cli/Cargo.toml
          tools/cli/tests/release_workflow_contract/assertions.rs
          tools/cli/tests/release_workflow_contract/cases.rs
          EOF
          LC_ALL=C sort -o "${RUNNER_TEMP}/changed-paths.txt" "${RUNNER_TEMP}/changed-paths.txt"
          LC_ALL=C sort -o "${RUNNER_TEMP}/allowed-paths.txt" "${RUNNER_TEMP}/allowed-paths.txt"
          if ! diff -u "${RUNNER_TEMP}/allowed-paths.txt" "${RUNNER_TEMP}/changed-paths.txt"; then
            echo 'issue 2572 candidate must match the exact frozen corrective source scope' >&2
            exit 1
          fi

  package-smoke-linux:
    name: Linux package smoke (${{ matrix.target.name }})
    if: github.repository_id == '1232040291' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            archive: corelink-linux-x86_64.tar.gz
          - name: linux-aarch64
            archive: corelink-linux-aarch64.tar.gz
    steps:
      - name: Create and verify a small Linux package fixture
        shell: bash
        env:
          ARCHIVE: ${{ matrix.target.archive }}
        run: |
          set -euo pipefail
          mkdir -p package out
          printf 'CoreLink draft package smoke fixture\n' > package/corelink
          tar -czf "out/${ARCHIVE}" -C package corelink
          test "$(tar -tzf "out/${ARCHIVE}")" = corelink
          (cd out && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" && sha256sum -c "${ARCHIVE}.sha256")

  package-smoke-windows:
    name: Windows deterministic package smoke
    if: github.repository_id == '1232040291' && github.event.pull_request.base.ref == 'main'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Set up pinned Python for deterministic Windows packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create fixture, package the canonical member, and verify bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $source = Join-Path $out 'corelink-windows-x86_64.exe'
          $archive = Join-Path $out 'corelink-windows-x86_64.zip'
          $secondArchive = Join-Path $env:RUNNER_TEMP 'corelink-windows-x86_64-second.zip'
          [IO.File]::WriteAllBytes($source, [Text.Encoding]::UTF8.GetBytes('CoreLink #2572 deterministic Windows package fixture'))
          $env:CORELINK_SOURCE = $source
          $env:CORELINK_ARCHIVE = $archive
          $env:CORELINK_SECOND_ARCHIVE = $secondArchive
          $pythonCode = 'import hashlib, os; from pathlib import Path; from zipfile import ZIP_STORED, ZipFile, ZipInfo; source=Path(os.environ["CORELINK_SOURCE"]); payload=source.read_bytes(); first=Path(os.environ["CORELINK_ARCHIVE"]); second=Path(os.environ["CORELINK_SECOND_ARCHIVE"]); info=ZipInfo("corelink.exe", (1980, 1, 1, 0, 0, 0)); info.create_system=0; info.external_attr=0; info.compress_type=ZIP_STORED; output=ZipFile(first, "w", compression=ZIP_STORED); output.writestr(info, payload); output.close(); info=ZipInfo("corelink.exe", (1980, 1, 1, 0, 0, 0)); info.create_system=0; info.external_attr=0; info.compress_type=ZIP_STORED; output=ZipFile(second, "w", compression=ZIP_STORED); output.writestr(info, payload); output.close(); check=ZipFile(first); assert check.namelist()==["corelink.exe"], f"unexpected members {check.namelist()!r}"; assert hashlib.sha256(check.read("corelink.exe")).digest()==hashlib.sha256(payload).digest(), "first archive payload mismatch"; check.close(); check=ZipFile(second); assert check.namelist()==["corelink.exe"], f"unexpected members {check.namelist()!r}"; assert hashlib.sha256(check.read("corelink.exe")).digest()==hashlib.sha256(payload).digest(), "second archive payload mismatch"; check.close(); assert first.read_bytes()==second.read_bytes(), "Windows package archive is not byte-deterministic"'
          python -c $pythonCode
          if ($LASTEXITCODE -ne 0) { throw 'deterministic Windows ZIP packaging failed' }
          $files = @($source, $archive)
          $lines = @()
          foreach ($file in $files) {
            $name = [IO.Path]::GetFileName($file)
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $name"
            [IO.File]::WriteAllText("$file.sha256", "$line`n", [Text.Encoding]::ASCII)
            $lines += $line
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Windows package checksum mismatch: $file"
            }
          }
          $orderedLines = @($lines | Sort-Object -CaseSensitive)
          [IO.File]::WriteAllText((Join-Path $out 'checksums.txt'), (($orderedLines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Remove-Item -LiteralPath $secondArchive -Force
