name: issue-2138 immutable ledger successor policy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate SHA approved for this read-only proof
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/issue-2148-derived-v0004-policy.yml'
      - 'scripts/backlog_ledger_successor.py'
      - 'scripts/backlog_verify.py'
      - 'tests/test_backlog_verify_trust_boundary.py'
      - 'tests/test_backlog_ledger_successor.py'
      - 'docs/campaigns/remediation/BACKLOG-WP-LEDGER.md'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0003.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0004.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0005.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0006.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0007.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0008.json'
      - 'docs/campaigns/remediation/backlog-ledger-snapshot-v0009.json' # path-filter-allow: future v0009 receipt must trigger policy verification

permissions:
  contents: read

jobs:
  policy:
    name: verify immutable v0004-v0009 successor policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind manual proof to the exact dispatched SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      # P0 intentionally establishes the C0 admission policy before the stale
      # v0009 ledger bridge is replaced.  Its bounded proof must therefore
      # exercise the preserved v0004-v0008 baseline and C0 negatives without
      # treating the known-stale v0009 authorizer as a P0 admission condition.
      - name: Prove P0 baseline and B-057 C0 admission negatives
        if: github.head_ref == 'codex/issue-2414-c0-policy' || github.ref_name == 'codex/issue-2414-c0-policy'
        run: >-
          python -m pytest -vv
          tests/test_backlog_ledger_successor.py::test_v0004_policy_derives_only_b012_retirement_from_pr_base
          tests/test_backlog_ledger_successor.py::test_v0004_policy_pins_complete_first_parent_history_from_git_objects
          tests/test_backlog_ledger_successor.py::test_v0005_policy_pins_complete_first_parent_history_from_git_objects
          tests/test_backlog_ledger_successor.py::test_v0005_bridge_rejects_an_unreceipted_or_wrong_transition
          tests/test_backlog_ledger_successor.py::test_v0005_receipt_is_required_to_bridge_post_v0004_history
          tests/test_backlog_ledger_successor.py::test_v0006_pins_source_hash_and_exact_changed_ids
          tests/test_backlog_ledger_successor.py::test_v0006_receipt_is_required_for_the_main_baseline_transition
          tests/test_backlog_ledger_successor.py::test_v0006_authorizer_rejects_wrong_immutable_main_parent
          tests/test_backlog_ledger_successor.py::test_v0007_replays_exact_b083_lifecycle_clarification
          tests/test_backlog_ledger_successor.py::test_v0008_replays_only_the_pinned_delivered_b113_and_b098_prose
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_pins_the_fresh_preimage_and_target_bytes
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_admission_is_byte_pinned_and_never_executes_candidate_code
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_admission_rejects_nearby_mutations_and_policy_mutation
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_allows_an_unchanged_inherited_symlink_without_following_it
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_rejects_added_deleted_and_mutated_symlinks
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_rejects_symlinks_at_every_pinned_target
          tests/test_backlog_verify_trust_boundary.py::BacklogVerifyTrustBoundaryTests::test_b057_c0_rejects_an_added_symlink_directory_without_traversing_it
      - name: Prove byte-pinned v0008 historical admission
        if: github.head_ref == 'codex/issue-2649-v0008-history-policy-20260926' || github.ref_name == 'codex/issue-2649-v0008-history-policy-20260926'
        run: >-
          python -m pytest -vv
          tests/test_backlog_ledger_successor.py::test_v0008_replays_only_the_pinned_delivered_b113_and_b098_prose
          tests/test_backlog_ledger_successor.py::test_successor_chain_rejects_unreceipted_post_v0008_drift
          tests/test_backlog_ledger_successor.py::test_v0008_historical_admission_is_byte_and_merge_pinned
      - name: Prove pinned v0009 B-086 historical policy
        if: github.head_ref == 'codex/issue-2649-v0009-history-policy-20260927' || github.ref_name == 'codex/issue-2649-v0009-history-policy-20260927'
        run: |
          set -euo pipefail
          timeout 8m python -m pytest -vv tests/test_backlog_ledger_successor.py::test_v0009_authorizes_only_the_pinned_b057_delta_and_keeps_v0008
          timeout 8m python -m pytest -vv tests/test_backlog_ledger_successor.py::test_v0009_rejects_nearby_unauthorized_b057_transitions[changed-history]
          timeout 8m python -m pytest -vv tests/test_backlog_ledger_successor.py::test_v0009_rejects_nearby_unauthorized_b057_transitions[changed-b086-history-section]
      - name: Prove derived policy through v0009 and mutation rejection
        if: github.head_ref != 'codex/issue-2414-c0-policy' && github.ref_name != 'codex/issue-2414-c0-policy' && github.head_ref != 'codex/issue-2649-v0008-history-policy-20260926' && github.ref_name != 'codex/issue-2649-v0008-history-policy-20260926' && github.head_ref != 'codex/issue-2649-v0009-history-policy-20260927' && github.ref_name != 'codex/issue-2649-v0009-history-policy-20260927'
        run: >-
          python -m pytest -vv
          tests/test_backlog_ledger_successor.py::test_v0004_policy_derives_only_b012_retirement_from_pr_base
          tests/test_backlog_ledger_successor.py::test_v0004_policy_pins_complete_first_parent_history_from_git_objects
          tests/test_backlog_ledger_successor.py::test_v0005_policy_pins_complete_first_parent_history_from_git_objects
          tests/test_backlog_ledger_successor.py::test_v0005_bridge_rejects_an_unreceipted_or_wrong_transition
          tests/test_backlog_ledger_successor.py::test_v0005_receipt_is_required_to_bridge_post_v0004_history
          tests/test_backlog_ledger_successor.py::test_v0006_pins_source_hash_and_exact_changed_ids
          tests/test_backlog_ledger_successor.py::test_v0006_receipt_is_required_for_the_main_baseline_transition
          tests/test_backlog_ledger_successor.py::test_v0006_authorizer_rejects_wrong_immutable_main_parent
          tests/test_backlog_ledger_successor.py::test_v0007_replays_exact_b083_lifecycle_clarification
          tests/test_backlog_ledger_successor.py::test_v0008_replays_only_the_pinned_delivered_b113_and_b098_prose
          tests/test_backlog_ledger_successor.py::test_successor_chain_rejects_unreceipted_post_v0008_drift
          tests/test_backlog_ledger_successor.py::test_v0008_historical_admission_is_byte_and_merge_pinned
          tests/test_backlog_ledger_successor.py::test_v0009_authorizes_only_the_pinned_b057_delta_and_keeps_v0008
          tests/test_backlog_ledger_successor.py::test_v0009_rejects_nearby_unauthorized_b057_transitions
          tests/test_backlog_ledger_successor.py::test_v0009_candidate_cannot_replace_the_trusted_policy
      # The trusted bad8506 state needs the v0009 data receipt before the full
      # chain can match BACKLOG.md again; policy-only proof remains bounded here.
      - name: Verify complete delivered ledger chain after the v0009 receipt
        if: hashFiles('docs/campaigns/remediation/backlog-ledger-snapshot-v0009.json') != ''
        timeout-minutes: 8
        run: python3 scripts/verify_backlog_wp_ledger.py
