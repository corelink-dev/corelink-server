name: api reference sync (regenerate MDX from openapi/corelink-v1.yaml)

# Drift gate for the auto-generated typed REST API reference under
# `apps/docs/docs/reference/api/` and their generated localized mirrors.
#
#  - On `pull_request` that touches the canonical YAML or the
#    generator, runs `scripts/gen-api-reference.py --check` and fails
#    the PR if the reference set is stale; the failure message tells
#    the author exactly which command to run.
#  - On `push` to `main` that touches the YAML or generator, regenerates
#    the reference set and (if there is a diff) opens an automated
#    follow-up PR via `gh pr create`. This keeps the docs branch
#    self-healing even if the originating PR forgot to regenerate.
#  - Manual `workflow_dispatch` is supported for ad-hoc regeneration.
#
# Charter: all actions SHA-pinned (mirror of openapi-validate.yml).

on:
  pull_request:
    paths:
      - "openapi/corelink-v1.yaml"
      - "scripts/gen-api-reference.py"
      - "apps/docs/docs/reference/api/**"
      - "apps/docs/i18n/*/docusaurus-plugin-content-docs/current/reference/api/**"
      - "scripts/api_reference_i18n_check.py"
      - ".github/workflows/api-reference-sync.yml"
  push:
    branches: [main]
    paths:
      - "openapi/corelink-v1.yaml"
      - "scripts/gen-api-reference.py"
      - "scripts/api_reference_i18n_check.py"
      - "apps/docs/docs/reference/api/**"
      - "apps/docs/i18n/*/docusaurus-plugin-content-docs/current/reference/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-reference-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: drift check (PR-side)
    if: github.event_name == 'pull_request'
    # Runner: GitHub-hosted ubuntu-24.04 for a stable actionlint contract.
    # Pure python3 + PyYAML; read-only drift check.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run generator in --check mode
        run: |
          set -euo pipefail
          python3 scripts/gen-api-reference.py --check

      - name: How to fix
        if: failure()
        run: |
          echo "::error::API reference is stale. Run locally and commit:"
          echo "::error::  python3 scripts/gen-api-reference.py"

  regenerate-and-pr:
    name: regenerate + open PR (main-side)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@def152b8a737443d7af6c5722c6389146fe90c90 # v2.1.2
        with:
          app-id: ${{ secrets.CORELINK_BOT_APP_ID }}
          private-key: ${{ secrets.CORELINK_BOT_APP_PRIVATE_KEY }}
          owner: corelink-dev
          repositories: corelink-server
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Need the app token for the auto-PR branch push, but do not persist
          # credentials into the worktree. A GITHUB_TOKEN branch push suppresses
          # push workflows; PR opened/synchronize/reopened events can yield
          # approval-required runs. The dedicated token supports unattended CI;
          # completed jobs, not check presence, prove execution.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Regenerate reference set
        run: |
          set -euo pipefail
          python3 scripts/gen-api-reference.py
          # --check also validates that every generated endpoint has a
          # corresponding file and index link in de, es-419, and pt-BR.
          python3 scripts/gen-api-reference.py --check

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet apps/docs/docs/reference/api/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "info: reference is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # `|| true`: log-only diagnostic. A diff wider than 50 files makes
            # `head` close the pipe, and under pipefail that failed the step
            # for the sole reason that there was a lot to report (B-040).
            git diff --stat apps/docs/docs/reference/api/ | head -50 || true
          fi

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "corelink-bot"
          git config user.email "bot@humangr.com"

      - name: Open auto-sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          : "${BOT_APP_TOKEN:?BOT_APP_TOKEN must be configured before opening an auto-PR}"
          export GH_TOKEN="${BOT_APP_TOKEN}"
          # Keep checkout credentialless while allowing this bot-authenticated
          # push to use the already minted, repository-scoped app token.
          gh auth setup-git
          BRANCH="bot/api-reference-sync-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"
          git add apps/docs/docs/reference/api/
          # Use a heredoc temp file for the commit message so the YAML
          # block stays a clean indented scalar.
          MSG_FILE="$(mktemp)"
          {
            echo "chore(docs): auto-regen API reference from openapi/corelink-v1.yaml"
            echo ""
            echo "Triggered by ${GITHUB_SHA} on ${GITHUB_REF}."
            echo ""
            echo "Signed-off-by: corelink-bot <bot@humangr.com>"
          } > "$MSG_FILE"
          git commit -F "$MSG_FILE"
          git push -u origin "$BRANCH"
          BODY_FILE="$(mktemp)"
          {
            echo "Auto-generated by \`.github/workflows/api-reference-sync.yml\` after a change to \`openapi/corelink-v1.yaml\` or \`scripts/gen-api-reference.py\` landed on \`main\` without an accompanying reference regeneration."
            echo ""
            echo "Run locally to regenerate:"
            echo ""
            echo '```bash'
            echo "python3 scripts/gen-api-reference.py"
            echo '```'
            echo ""
            echo "Triggered by commit \`${GITHUB_SHA}\`."
          } > "$BODY_FILE"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(docs): auto-regen API reference (drift from openapi/corelink-v1.yaml)" \
            --body-file "$BODY_FILE"
