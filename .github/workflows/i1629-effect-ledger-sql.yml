name: #1629 effect ledger SQL gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  focused-sql:
    if: ${{ github.repository_id == vars.CORELINK_SERVER_REPO_ID && github.ref_name == 'codex/i1629-effect-ledger-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the isolated canonical snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b

      - name: Assert protoc is available
        run: protoc --version

      - name: Execute the focused container SQL test
        run: |
          set -euo pipefail
          test_name='webhook_inbox_d1::tests::effect_witness_and_completion_share_one_fenced_transaction'
          cargo test --locked -p corelink-server --lib "$test_name" --exact --nocapture 2>&1 | tee /tmp/i1629-effect-ledger-test.log
          grep -F "test ${test_name} ... ok" /tmp/i1629-effect-ledger-test.log
          echo 'I1629_SQL_TEST_RESULT executed=1 passed=1'
