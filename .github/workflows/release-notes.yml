name: release-notes

# Customer-facing release notes auto-generator.
#
# Trigger: any `v*` tag push (semver tags). On `workflow_dispatch` an operator
# may regenerate for an explicit (from, to) window for editorial iteration.
#
# Flow:
#   1. Checkout full history (need previous-tag diff).
#   2. Determine PREV_TAG = `git describe --tags --abbrev=0 <tag>^` (the tag
#      immediately before the one we're cutting). Fallback: the initial
#      commit if no prior tag.
#   3. Run `scripts/generate-release-notes.py --from <prev> --to <tag>`.
#   4. Commit the generated `releases/RELEASE-*.md` to branch
#      `releases/<tag>` (orphan if not present) and open a PR for editorial
#      polish per `marketing/launch/RELEASE-NOTES-EDITORIAL-GUIDE.md`.
#   5. Create a *draft* GitHub Release whose body is the auto-generated
#      markdown so a human can polish and publish.
#
# Charter:
#   - SHA-pinned actions only (ADR-S12-045 §6 tooling-pin policy).
#   - No invention beyond `generate-release-notes.py` outputs.
#   - Draft release only — never auto-publishes (operator polish gate).
#
# Cross-refs:
#   - scripts/generate-release-notes.py
#   - releases/TEMPLATE.md
#   - marketing/launch/RELEASE-NOTES-EDITORIAL-GUIDE.md
#   - marketing/launch/LAUNCH-CHECKLIST-V2.md  (R-8 launch readiness)
#   - ROADMAP-TO-GA.md §8 (R-8 launch wave)
#   - CHANGELOG.md (authoritative)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      from_ref:
        description: "Lower bound git ref (exclusive). E.g. v1.0.0."
        required: true
        type: string
      to_ref:
        description: "Upper bound git ref (inclusive). Default HEAD."
        required: false
        default: "HEAD"
        type: string
      version:
        description: "Version label override (else derived from to_ref)."
        required: false
        type: string

permissions:
  contents: read       # all writes use the short-lived App token below

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate release notes draft
    # Hosted Ubuntu supplies Python and GitHub CLI; the existing bot-token
    # permission boundary and publication commands remain unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@def152b8a737443d7af6c5722c6389146fe90c90 # v2.1.2
        with:
          app-id: ${{ secrets.CORELINK_BOT_APP_ID }}
          private-key: ${{ secrets.CORELINK_BOT_APP_PRIVATE_KEY }}
          owner: corelink-dev
          repositories: corelink-server
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
          # GITHUB_TOKEN branch pushes suppress push workflows, while the PR
          # opened/synchronize/reopened event can yield approval-required
          # runs. Once provisioned, this token supports unattended CI; only
          # completed jobs prove the generated PR was actually checked.
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve refs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FROM_REF_INPUT: ${{ inputs.from_ref }}
          TO_REF_INPUT: ${{ inputs.to_ref }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            FROM="$FROM_REF_INPUT"
            TO="$TO_REF_INPUT"
            VERSION_FLAG=""
            git check-ref-format --allow-onelevel "refs/$FROM" || { echo "::error::invalid from_ref"; exit 1; }
            git check-ref-format --allow-onelevel "refs/$TO" || { echo "::error::invalid to_ref"; exit 1; }
            if [[ -n "$VERSION_INPUT" ]]; then
              [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version"; exit 1; }
              VERSION_FLAG="$VERSION_INPUT"
            fi
          else
            TAG="${GITHUB_REF##refs/tags/}"
            TO="$TAG"
            # Previous semver tag (immediately preceding the cut tag).
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -z "$PREV" ]]; then
              # Fallback to repo root commit.
              # `git log -1` instead of `rev-list | head -1`: git stops on its
              # own, so there is no pipe for a second root commit (grafts,
              # orphan merges) to break under pipefail (B-040).
              PREV="$(git log --max-parents=0 --format=%H -1)"
            fi
            FROM="$PREV"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid release tag"; exit 1; }
            VERSION_FLAG="${TAG#v}"
          fi
          {
            echo "from=$FROM"
            echo "to=$TO"
            echo "version_flag=$VERSION_FLAG"
          } >> "$GITHUB_OUTPUT"
          # Resolve the version literal for output-path use.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VLITERAL="$VERSION_INPUT"
            if [[ -z "$VLITERAL" ]]; then
              VLITERAL="$(git rev-parse --short "$TO")"
              VLITERAL="dev-$VLITERAL"
            fi
          else
            VLITERAL="${TAG#v}"
          fi
          echo "version=$VLITERAL" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: gen
        shell: bash
        env:
          FROM_REF: ${{ steps.refs.outputs.from }}
          TO_REF: ${{ steps.refs.outputs.to }}
          VERSION_FLAG: ${{ steps.refs.outputs.version_flag }}
          VERSION: ${{ steps.refs.outputs.version }}
        run: |
          set -euo pipefail
          args=(--from "$FROM_REF" --to "$TO_REF")
          if [[ -n "$VERSION_FLAG" ]]; then args+=(--version "$VERSION_FLAG"); fi
          python3 scripts/generate-release-notes.py "${args[@]}"
          OUTPATH="releases/RELEASE-${VERSION}.md"
          if [[ ! -f "$OUTPATH" ]]; then
            echo "error: expected $OUTPATH not produced" >&2
            exit 1
          fi
          echo "outpath=$OUTPATH" >> "$GITHUB_OUTPUT"

      - name: Upload notes as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ steps.refs.outputs.version }}
          path: ${{ steps.gen.outputs.outpath }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit notes to releases branch
        if: github.event_name == 'push'
        shell: bash
        env:
          BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NOTES_PATH: ${{ steps.gen.outputs.outpath }}
          VERSION: ${{ steps.refs.outputs.version }}
          FROM_REF: ${{ steps.refs.outputs.from }}
          TO_REF: ${{ steps.refs.outputs.to }}
        run: |
          set -euo pipefail
          : "${BOT_APP_TOKEN:?BOT_APP_TOKEN must be configured before opening an auto-PR}"
          export GH_TOKEN="${BOT_APP_TOKEN}"
          # Use a per-tag branch so editorial PRs don't collide.
          BRANCH="releases/v${VERSION}"
          git config user.name  "corelink-release-bot"
          git config user.email "release-bot@humangr.com"
          git checkout -b "$BRANCH"
          git add "$NOTES_PATH"
          git commit -m "docs(release): auto-generated notes for v${VERSION}

          Trigger:    tag push (${GITHUB_REF})
          From/To:    ${FROM_REF}..${TO_REF}
          Generator:  scripts/generate-release-notes.py
          Editorial:  marketing/launch/RELEASE-NOTES-EDITORIAL-GUIDE.md

          Signed-off-by: corelink-release-bot <release-bot@humangr.com>
          "
          # Checkout credential persistence is disabled. Supply this one push
          # with the repository-scoped App token through ephemeral Git config;
          # do not write credentials into the checkout's .git/config.
          auth="$(printf 'x-access-token:%s' "$BOT_APP_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push -u origin "$BRANCH"

      - name: Open editorial PR
        if: github.event_name == 'push'
        shell: bash
        env:
          BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.refs.outputs.version }}
        run: |
          set -euo pipefail
          : "${BOT_APP_TOKEN:?BOT_APP_TOKEN must be configured before opening an auto-PR}"
          export GH_TOKEN="${BOT_APP_TOKEN}"
          gh pr create \
            --base main \
            --head "releases/v${VERSION}" \
            --title "docs(release): editorial polish for v${VERSION}" \
            --label "release-notes,customer-visible" \
            --body "Auto-generated release notes draft for **v${VERSION}**.

          Editorial workflow: \`marketing/launch/RELEASE-NOTES-EDITORIAL-GUIDE.md\`.

          Hand-polish sections marked *needs manual* per the guide, then merge to main."

      - name: Create draft GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@f3cad8bcbf209fe591aa1823e372c5d96b7fc800 # v2.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ github.ref_name }}
          name: "CoreLink ${{ steps.refs.outputs.version }}"
          body_path: ${{ steps.gen.outputs.outpath }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
