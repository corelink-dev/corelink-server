name: issue-1650-credentialless-real-integration-pack

# This job checks the real harness selector as data. It has no protected
# environment, secrets, provider access, or workflow dispatch permission.
on:
  pull_request:
    paths:
      - ".github/workflows/issue-1650-real-integration-contract.yml"
      - ".github/workflows/campaign-ci.yml"
      - ".github/workflows/real-ignored-harnesses.yml"
      - "scripts/run-real-ignored-harnesses.sh"
      - "scripts/issue_2564_r2_temp_credentials.py"
      - "scripts/test_issue_2564_r2_temp_credentials.py"
      - "scripts/real-ignored-harness-manifest.json"
      - "scripts/verify_real_ignored_harnesses.py"
      - "scripts/probe_i2563_d1_token_scope.py"
      - "scripts/verify_i1650_real_integration_readiness.py"
      - "docs/handoff/2026-09-22-i1650-real-integration-readiness.json"
      - "crates/corelink-pat/tests/emit_e2e_seed.rs"
      - "infra/staging/topology.json"
      - "crates/corelink-container/src/routes/tier_select_store.rs"
      - "crates/corelink-container/src/storage/d1_http.rs"
      - "crates/corelink-container/src/storage.rs"
      - "crates/corelink-container/src/storage/r2_s3_parts/client_impl.rs"
      - "crates/corelink-container/src/storage/d1_audit_sink/tests_phase_attribution.rs"
      - "crates/corelink-container/src/storage/r2_s3_parts/tests_1_network.rs"
      - "crates/corelink-container/src/storage/r2_s3_parts/tests_2.rs"
      - "crates/corelink-stripe-real/tests/live_integration.rs"
      - "crates/corelink-stripe-real/src/client.rs"
      - "scripts/verify_stripe_harness_cleanup_receipt.py"
      - "tests/test_stripe_harness_cleanup_receipt.py"
      - "scripts/stripe_test_mode_evidence.py"
      - "tests/test_stripe_test_mode_evidence.py"
      - ".github/workflows/issue-1649-stripe-test-mode.yml"
      - "crates/corelink-audit-chain/tests/neon_shadow_real.rs"

permissions:
  contents: read

jobs:
  contract:
    name: validate credentialless real integration pack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request head without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact reviewed head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "credentialless pack exact head SHA: $EXPECTED_SHA"
      - name: Install workspace-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable toolchain action
        with:
          toolchain: 1.91.1
      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - name: Build and test CoreLink R2 session-token seam
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          session_log="${RUNNER_TEMP}/r2-session-token-tests.log"
          cargo test --locked --package corelink-server --lib session_token -- --nocapture 2>&1 | tee "$session_log"
          grep -F "optional_session_token_preserves_static_credential_compatibility ... ok" "$session_log"
          grep -F "r2_credentials_forward_optional_session_token ... ok" "$session_log"
          redaction_log="${RUNNER_TEMP}/r2-storage-env-redaction-test.log"
          cargo test --locked --package corelink-server --lib storage_env_debug_and_display_redact_all_credentials -- --nocapture 2>&1 | tee "$redaction_log"
          grep -F "storage_env_debug_and_display_redact_all_credentials ... ok" "$redaction_log"
      - name: Audit exact harness inventory and readiness packet
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          CF_API_TOKEN: ""
          D1_DATABASE_ID: ""
          R2_S3_ENDPOINT: ""
          R2_S3_ACCESS_KEY_ID: ""
          R2_S3_SECRET_ACCESS_KEY: ""
          R2_S3_SESSION_TOKEN: ""
          HUGR_WALLET_TOKEN: ""
          NEON_TEST_DSN: ""
        run: |
          set -euo pipefail
          python3 -S scripts/verify_real_ignored_harnesses.py
          python3 -S scripts/probe_i2563_d1_token_scope.py --self-test
          python3 -S -m unittest tests/test_stripe_harness_cleanup_receipt.py
          python3 -S -m unittest tests/test_stripe_test_mode_evidence.py
          python3 -S scripts/verify_i1650_real_integration_readiness.py
      - name: Run credentialless Stripe mock cleanup fault injection
        run: cargo test --locked -p corelink-stripe-real --features live-integration --test live_integration cleanup_fault_injection -- --nocapture
