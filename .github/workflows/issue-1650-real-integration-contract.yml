name: issue-1650-credentialless-real-integration-pack

# This job checks the real harness selector as data. It has no protected
# environment, secrets, provider access, or workflow dispatch permission.
on:
  pull_request:
    paths:
      - ".github/workflows/issue-1650-real-integration-contract.yml"
      - ".github/workflows/campaign-ci.yml"
      - ".github/workflows/real-ignored-harnesses.yml"
      - "scripts/run-real-ignored-harnesses.sh"
      - "scripts/real-ignored-harness-manifest.json"
      - "scripts/verify_real_ignored_harnesses.py"
      - "scripts/verify_i1650_real_integration_readiness.py"
      - "docs/handoff/2026-09-22-i1650-real-integration-readiness.json"
      - "crates/corelink-pat/tests/emit_e2e_seed.rs"
      - "crates/corelink-container/src/routes/tier_select_store.rs"
      - "crates/corelink-container/src/storage/d1_http.rs"
      - "crates/corelink-container/src/storage/d1_audit_sink/tests_phase_attribution.rs"
      - "crates/corelink-container/src/storage/r2_s3_parts/tests_1_network.rs"
      - "crates/corelink-container/src/storage/r2_s3_parts/tests_2.rs"
      - "crates/corelink-stripe-real/tests/live_integration.rs"
      - "crates/corelink-stripe-real/src/client.rs"
      - "scripts/verify_stripe_harness_cleanup_receipt.py"
      - "tests/test_stripe_harness_cleanup_receipt.py"
      - "scripts/stripe_test_mode_evidence.py"
      - "tests/test_stripe_test_mode_evidence.py"
      - ".github/workflows/issue-1649-stripe-test-mode.yml"
      - "crates/corelink-audit-chain/tests/neon_shadow_real.rs"

permissions:
  contents: read

jobs:
  contract:
    name: validate credentialless real integration pack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Audit exact harness inventory and readiness packet
        env:
          CLOUDFLARE_ACCOUNT_ID: ""
          CF_API_TOKEN: ""
          D1_DATABASE_ID: ""
          R2_S3_ENDPOINT: ""
          R2_S3_ACCESS_KEY_ID: ""
          R2_S3_SECRET_ACCESS_KEY: ""
          HUGR_WALLET_TOKEN: ""
          NEON_TEST_DSN: ""
        run: |
          set -euo pipefail
          python3 -S scripts/verify_real_ignored_harnesses.py
          python3 -S -m unittest tests/test_stripe_harness_cleanup_receipt.py
          python3 -S scripts/verify_i1650_real_integration_readiness.py
