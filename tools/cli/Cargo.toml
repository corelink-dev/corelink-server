[package]
name = "corelink-cli"
description = "CoreLink CLI — 7 subcommands (ls/get/put/stat/bench/doctor/version) with JSON output, auth via env var / config file, cross-OS signed builds (WI-S15-001), and telemetry opt-IN (WI-S15-005)."
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "corelink_cli"
path = "src/lib.rs"

[[bin]]
name = "corelink"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mod_module_files = "deny"
# print_stdout/print_stderr allowed at crate level in main.rs (CLI binary is intentionally user-facing).

[dependencies]
# Canonical PAT parser shared with the server (B-162).
corelink-pat = { workspace = true }
# WI-S17-003: runbook dry-run tracker (pure-logic library — no I/O, no async).
corelink-runbook-tracker = { workspace = true }
# WI-R-PREP-AUDIT-EXPORT: audit log export CLI (json-ld/csv/parquet + Merkle proofs).
corelink-audit-chain = { workspace = true }
corelink-analytics = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
toml = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
bytes = { workspace = true }
# WI-S15-005 telemetry: platform-aware config path (~/.corelink)
dirs = "6"
# SHA-256 for streaming CAS blob hashing (Stream-1 "easy to use" CLI).
sha2 = { workspace = true }
# Progress bar: shown only when stderr is a tty; suppressed in pipes.
indicatif = { version = "0.18", default-features = false, features = ["tokio"] }
# WI-S09-008 §6 wave-19 HTTP-aware `verify-ndjson --url` — needs raw
# trailer access (the `x-corelink-audit-export-aborted` trailer is the
# load-bearing wave-18 abort signal). reqwest 0.12 hides trailers behind
# a `pub(crate)` ResponseBody; we use hyper directly to read frames +
# trailers via `http_body::Body::poll_frame`.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-native-certs", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = { workspace = true }
url = "2"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = "3"
proptest = { workspace = true }
# Hermetic localhost mock HTTP server for the client/command I/O tests
# (mutation coverage of `cas_get`/`cas_head`/each `run()` + the retry loop).
# Already a workspace dev-dep (0.6) across the container crates — reused here.
# Tests NEVER hit prod; every server binds an ephemeral 127.0.0.1 port.
wiremock = "0.6"
# Wave-23 (W23-RUSTLS-INIT): explicit rustls dep with `ring` feature so
# the integration test suite can install a `CryptoProvider` exactly once
# at test-suite init. With a single provider feature (`ring`) wired
# transitively via `hyper-rustls`, the provider auto-installs today —
# but a future feature-flag change (e.g. adding `aws-lc-rs` alongside
# `ring`) would make auto-install ambiguous and panic. The explicit
# `install_default()` call at test init is the defensive guard.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
