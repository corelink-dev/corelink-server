# lychee broken-link checker config for CoreLink docs.
#
# Used by `.github/workflows/docs-ci.yml` to fail the PR on broken links
# in the generated `apps/docs/build/` static site.

# Maximum number of concurrent requests.
max_concurrency = 12

# Retry policy for transient failures.
max_retries = 2
retry_wait_time = 2

# Treat these schemes as links.
include_verbatim = true

# Skip mailto, tel, and known noisy hosts.
exclude = [
  "^mailto:",
  "^tel:",
  # Localhost variants for dev preview tooling.
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  # GitHub edit links are constructed from EDIT_BASE + path; not all
  # paths exist in the source repo yet (placeholder docs).
  "^https?://github\\.com/HuGR-dev/corelink-server/edit/.+",
  # `file://<relative-name>` with no leading slash after the scheme is a
  # shell-command placeholder inside a fenced code block (e.g.
  # `aws s3api put-bucket-policy --policy file://deny-write.json` in
  # from-docker-registry.mdx / from-s3-only.mdx), not a real link. A genuine
  # local link that survives `--root-dir` resolution is always absolute
  # (`file:///...`). include_verbatim picks up the bare scheme text inside
  # <code> blocks; this excludes that class without hiding real file:// findings.
  "^file://[^/]",
  # A GOPROXY VALUE is not a URL. The Go SDK pages print
  #   GOPROXY=https://humangr.com/corelink/docs/goproxy,https://proxy.golang.org,direct
  # and lychee's URL scanner swallows the whole comma-joined list as one link,
  # then GETs a path that ends in `,https://proxy.golang.org,direct`. No server
  # can serve that, because it was never an address.
  #
  # Why it only appeared on 2026-08-25: before #1297 the docs Worker returned
  # redirects that had lost the `/corelink/docs` mount, so this bogus path fell
  # through to the marketing homepage and answered 200. lychee was passing on
  # the WRONG PAGE. Fixing the redirect turned a fake 200 into an honest 404 and
  # the gate started reporting what had been true all along.
  #
  # Anchored on the comma so a genuine `/corelink/docs/goproxy/...` link is
  # still checked — only the env-var-value form is excluded.
  "^https://humangr\\.com/corelink/docs/goproxy,",
  # KNOWN PRE-EXISTING GAPS — tracked separately, not introduced by and out
  # of scope for the docs-search/lychee-gate/gRPC-claims PR that added this
  # comment. Un-exclude once each is closed so the gate catches regressions:
  #   - /explanation/compliance/dpa, /explanation/privacy/gdpr,
  #     /explanation/privacy/lgpd-full — `draft: true`, pending Legal
  #     sign-off (see frontmatter `pending_signoff: ["Legal"]`), so they are
  #     intentionally absent from the production build; legal pages link to
  #     them ahead of publication.
  #   - /explanation/sre/slo — referenced from `src/pages/legal/terms.tsx`
  #     but no such page/source file exists anywhere in `docs/`; a genuine
  #     dead link, flagged for separate follow-up.
  #   These hrefs are hardcoded absolute paths (not Docusaurus `<Link>`), so
  #   they never carry the `/corelink/docs` baseUrl prefix and lychee sees
  #   them post-`--root-dir`-resolution as `file://<root-dir>/explanation/...`
  #   — match that resolved form, not the raw href.
  "/explanation/(compliance/dpa|privacy/gdpr|privacy/lgpd-full|sre/slo)$",
  # The API reference prints endpoint URLs, not links. lychee GETs them, and a
  # POST-only or auth-required endpoint answering 401/404 to an anonymous GET is
  # the endpoint working, not a broken link — `/v1/health` returns 401, the API
  # root returns 404, both correctly. Several are OpenAPI templates with the
  # literal placeholder still in the path (`/v1/cas/string/string`), which no
  # amount of liveness would make fetchable. This single class accounted for
  # ~1,550 of the 2,108 "errors" that kept docs CI red.
  #
  # Coverage is NOT lost: `scripts/validate_docs_reality.py` [hostname-liveness]
  # checks every `*.humangr.com` hostname printed on a shipped surface, on every
  # PR that touches docs — a check that understands the difference between a host
  # being dead and an endpoint declining an anonymous GET. Excluding the host
  # here removes a category error, not a guard.
  "^https?://corelink-api\\.humangr\\.com",

  # DEAD PRODUCT HOSTS — owned and dated elsewhere. Every *.humangr.com one is
  # checked by `validate_docs_reality.py [hostname-liveness]` on every docs PR:
  # a mention FAILS unless a `hostname.tracked_dead` entry in
  # scripts/docs_reality_allowlist.json names that exact file and is unexpired.
  # The app/attest/billing names and the bare dotted brand name were swept off
  # the docs site (dig 2026-10-01: all NXDOMAIN, as is the branded status name);
  # trust.hugr.com resolved on 2026-08-24 but completed no TLS handshake.
  # lychee re-reporting them adds no information the sweep does not already carry,
  # and keeping docs CI red on them hides every OTHER broken link behind them.
  # These exclusions are deliberately host-anchored so a NEW dead host is still caught.
  "^https?://app\\.corelink\\.humangr\\.com",
  "^https?://attest\\.corelink\\.humangr\\.com",
  "^https?://billing\\.corelink\\.humangr\\.com",
  "^https?://status\\.corelink\\.humangr\\.com",
  "^https?://corelink\\.humangr\\.com",
  # trust.hugr.com is dead the same way but is NOT covered by the sweep: the
  # [hostname-liveness] corpus regex only matches `*.humangr.com`, so a `hugr.com`
  # host is invisible to it. Tracked as its own backlog item; excluded here so it
  # does not mask the rest.
  "^https?://trust\\.hugr\\.com",

  # CODE-BLOCK PLACEHOLDERS AND NON-LINKS. `include_verbatim = true` makes lychee
  # GET any URL-shaped text inside <code>, including config values that were never
  # links. Same category error as the corelink-api block above.
  #   - `https://collector:4318` — the OTel collector endpoint the READER supplies
  #     (forward-to-otel-collector.mdx).
  #   - `https://hugr/` — a bare-hostname placeholder.
  #   - `https://js.stripe.com` — a CSP `script-src` value printed in a shell
  #     snippet in trust/pci-dss.mdx, not a link.
  #   - `grafana.com/orgs/<your-org>/api-keys` — the LINK TEXT is the templated
  #     form; the actual href is grafana.com/profile/api-keys and resolves.
  #   - the Grafana Cloud `prometheus-prod-*` / `tempo-prod-*` push endpoints are
  #     POST-only ingest URLs; a 404 to an anonymous GET is the endpoint working.
  "^https?://collector:",
  "^https?://hugr/",
  "^https?://js\\.stripe\\.com",
  "^https?://grafana\\.com/orgs/",
  "^https?://(prometheus|tempo)-prod-[^.]*\\.grafana\\.net",

  # THIRD-PARTY BOT BLOCKING. These return 403 to any datacenter/CI client but are
  # live in a browser — verified 2026-08-24. Excluding a 403-to-robots is not the
  # same as hiding a dead link; a genuinely removed page would 404, which is still
  # caught here.
  "^https?://emilyxiong\\.medium\\.com/",
  "^https?://drata\\.com/",

  # `your-domain.com` and friends are the reader-supplied placeholder host used in
  # the competitor-comparison pages; never a real link.
  "^https?://[^/]*your-domain\\.com",
  # A URL carrying embedded userinfo (`https://user:token@host/...`) is always an
  # example credential printed in a code block — e.g. the pip index-URL form in
  # the Python how-to. lychee would send the fake PAT as basic auth.
  "^https?://[^/@]*:[^/@]*@",

  # RFC 9116 REQUIRES security.txt at the domain root and forbids serving it
  # under a path prefix, so `/.well-known/security.txt` is a deliberately
  # absolute href — not a Docusaurus `<Link>` — and it never carries the
  # `/corelink/docs` baseUrl. It is LIVE: verified 200 on 2026-08-24 at both
  # corelink-docs.humangr.com/.well-known/security.txt and
  # humangr.com/.well-known/security.txt. The file is served by the host, not
  # emitted into `apps/docs/build/`, so `--root-dir` resolves it to a path that
  # cannot exist. Same class as the hardcoded-absolute-path block above: match
  # the RESOLVED `file://` form, not the raw href.
  "/\\.well-known/security\\.txt$",
]

# User-Agent for doc hosts that require one. (lychee >=0.20 renamed the old
# `headers` array to the dedicated `user_agent` field.)
user_agent = "lychee-corelink-docs/1.0"

# Accept 2xx + 3xx.
accept = ["200..=299", "301..=308"]

# NOTE: the scan root is provided per-workflow on the CLI (`--root-dir`), not
# here — lychee >=0.20 replaced the old relative `base = "./build"` field with
# `base_url` (URLs) / `root_dir` (absolute local path), and a relative value is
# rejected at config-parse time.
