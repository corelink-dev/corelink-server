exclude = [
    "crates/tenant-path/fuzz",
    "crates/corelink-hash/fuzz",
    "crates/corelink-worker/fuzz",
    "crates/corelink-meta/fuzz",
    "crates/corelink-reapi/fuzz",
    "crates/corelink-client-verify/fuzz",
    # Fuzz expansion across BYOK envelope + tenant-path extended + audit-chain
    # Merkle/JCS + HKDF (pre-pentest hardening lane). Each fuzz crate carries
    # its own [workspace] inner toml so they are excluded from the outer
    # workspace resolver and cargo-fuzz drives them stand-alone.
    "crates/corelink-byok/fuzz",
    "crates/corelink-audit-chain/fuzz",
    # Wave 35 Phase 2 — fuzz harness moved alongside the absorbed
    # ac-core submodule into the `corelink-ac` umbrella.
    "crates/corelink-ac/fuzz",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
# Cargo's publication sentinel is not an SPDX identifier. The workspace is
# proprietary; CycloneDX represents that truth using the SPDX
# extension point below rather than emitting an invalid license expression.
license = "LicenseRef-CoreLink-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

[workspace.dependencies]
# Async trait support
async-trait = "0.1"
# Concurrent maps
dashmap = "6"
# DEBT-013 OPT-04 phase 1 — `parking_lot::Mutex` is the panic-free,
# slightly faster drop-in for `std::sync::Mutex` on hot CAS / AC /
# audit-chain in-memory stores. Audit ref:
# `specs/_audits/sealed/2026-05-15-perf-optimization-audit.md` §2 OPT-04.
parking_lot = "0.12"

# gRPC stack
# tonic-build 0.14 split the prost-based codegen into the separate
# `tonic-prost-build` crate (the plain `tonic-build` now only ships the
# transport-agnostic `CodeGenBuilder`); proto compilation moves there.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# HTTP server stack (R2-12: Stripe webhook route in apps/server)
# axum 0.7 + tower + http 1.x align with tonic 0.12 (hyper 1 underneath).
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
tower = { version = "0.5", default-features = false }
http = "1"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
# Wave-19 — `async_stream::stream!` macro used by
# `apps/server::routes::audit_export` to drive the true page-by-page
# async generator that backs the streaming response body (replaces the
# wave-18 pre-materialized `Vec<Frame<Bytes>>` plan). The crate is a
# proc-macro that expands to a hand-rolled `Stream` impl — no runtime
# overhead beyond the state-machine the generator already requires.
async-stream = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WI-S15-004 FFI wrappers
# PyO3: Python extension module (Python 3.10+ ABI3).
# R1-9: bumped 0.22 → 0.24.1 to close RUSTSEC-2025-0020 (PyString::from_object
# buffer overflow). 0.22→0.24 introduced `Py::extract_bound` and a deprecation
# of `PyBytes::new_bound` (renamed to `PyBytes::new`); see corelink-py call
# sites for migration shims.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
# wasm-bindgen: Rust → WASM JS bridge
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
serde-wasm-bindgen = "0.6"

# BYOK (S-14)
aes-gcm = { version = "0.11", features = ["aes"] }
getrandom = "0.2"
# `lru` 0.14+ ships the IterMut soundness fix (RUSTSEC-2026-0002). Bumped to
# 0.18 (latest) per R1-9 emergency dep update; CoreLink's only consumer is
# `corelink-byok::dek_cache` which uses get/put/pop/iter/new — all stable
# across the 0.12→0.18 major-version progression.
lru = "0.18"
# AWS SDK — requires Rust ≥ 1.91.1 per MSRV; workspace is pegged to 1.80 as floor.
# The actual CI toolchain (1.88+) compiles these correctly.
# `cargo check -p corelink-byok-aws --ignore-rust-version` is required until
# the workspace rust-version floor is bumped (tracked as infra debt post-S-14).
#
# R1-9: `default-features = false` + explicit `rustls-aws-lc-runtime` excludes
# the `tls-rustls` legacy feature path (hyper 0.14 + rustls 0.21 +
# rustls-webpki 0.101.7 vulnerable to RUSTSEC-2026-0098/0099/0104). The
# modern `rustls-aws-lc` runtime pulls rustls 0.23 + rustls-webpki 0.103.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso", "default-https-client"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# WP-S1 Phase 1 — R2 S3-compatible API client for the native container.
# R2 is accessed via the standard S3-compatible endpoint using static
# access-key credentials (DECISION-GATE-1 Option A). Same major-version
# pin as aws-sdk-kms to share the existing smithy/runtime infrastructure
# (aws-smithy-*, aws-runtime, aws-credential-types) already in Cargo.lock.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# RFC 8785 JCS canonical JSON for AAD / encryption_context binding
# (used by BYOK providers + audit-chain link hashing).
serde_jcs = "0.2"

# Crypto / encoding (S-01 foundation)
hmac = "0.13"
sha2 = "0.11"
blake3 = { version = "1", features = ["traits-preview"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
subtle = "2"
zeroize = { version = "1.8", features = ["derive"] }
hkdf = "0.13"
bytes = "1"
# Ed25519 (FIPS 186-5 EdDSA) — erasure attestation signing (WI-S14-007)
ed25519-dalek = { version = "3", features = ["rand_core"] }

# Internal crates
# Wave-33 Stage 0 sub-step 1: apex cross-cutting types crate.
corelink-core = { path = "crates/corelink-core" }
# Wave-33 Stage 0 sub-step 2: canonical cryptography aggregator façade.
corelink-crypto = { path = "crates/corelink-crypto" }
# Wave-33 Stage 1 Stream A sub-step A.1: canonical CAS bounded-context
# aggregator (10 absorbed crates per spec §4 + §6 Stream A).
corelink-cas = { path = "crates/corelink-cas" }
corelink-tenant-path = { path = "crates/tenant-path" }
# `version` is REQUIRED here (not just `path`): both corelink-hash and its
# consumer corelink-client-verify are `publish = true` (OSS SDK crates), and
# crates.io rejects a publishable crate that depends on a path-only dep with
# no version. cargo-deny `bans.wildcards` enforces this (allow-wildcard-paths
# does not apply to public crates). Keep in lockstep with the workspace
# [package].version (0.1.2).
corelink-hash = { path = "crates/corelink-hash", version = "0.1.2" }
corelink-worker = { path = "crates/corelink-worker" }
corelink-meta = { path = "crates/corelink-meta" }
corelink-reapi = { path = "crates/corelink-reapi" }
corelink-client-verify = { path = "crates/corelink-client-verify" }
# default-features = false here so that per-crate overrides can choose
# whether to enable `jwt-adapter` (which pulls ring, incompatible with
# wasm32-unknown-unknown without emscripten). All native crates should
# explicitly add `features = ["jwt-adapter"]` or rely on the re-export.
# `corelink-clerk-cf` omits that feature to stay wasm32-clean.
corelink-clerk = { path = "crates/corelink-clerk", default-features = false }
corelink-pat = { path = "crates/corelink-pat" }
# Wave 35 Phase 2 — `corelink-auth-schema` + `corelink-webauthn`
# physically absorbed into `corelink-auth` umbrella as inline
# submodules; workspace.dependencies entries removed.
corelink-audit = { path = "crates/corelink-audit" }
# Wave 35 Phase 2 — `corelink-ac-core` + `corelink-ac-schema`
# physically absorbed into `corelink-ac` umbrella as inline
# submodules; workspace.dependencies entries removed.
corelink-ac = { path = "crates/corelink-ac" }
corelink-r2-multipart = { path = "crates/corelink-r2-multipart" }
corelink-gc = { path = "crates/corelink-gc" }
corelink-eviction = { path = "crates/corelink-eviction" }
corelink-ratelimit = { path = "crates/corelink-ratelimit" }
corelink-rate-headers = { path = "crates/corelink-rate-headers" }
corelink-analytics = { path = "crates/corelink-analytics" }
corelink-tracing = { path = "crates/corelink-tracing" }
corelink-audit-chain = { path = "crates/corelink-audit-chain" }
corelink-slo = { path = "crates/corelink-slo" }
# W35-P2-TELEMETRY (2026-05-26) absorbed corelink-canary, corelink-logpush,
# corelink-otel-export, corelink-synthetic-pager, corelink-lighthouse-tracker
# as inline modules of corelink-telemetry.
corelink-telemetry = { path = "crates/corelink-telemetry" }
# Wave-33 Stage 1 Stream B sub-step B.1: canonical billing aggregator façade.
corelink-billing = { path = "crates/corelink-billing" }
# Wave-33 Stage 1 Stream B sub-step B.3: canonical auth aggregator façade.
corelink-auth = { path = "crates/corelink-auth" }
# Wave-33 Stage 1 Stream B sub-step B.5: canonical privacy aggregator façade.
corelink-privacy = { path = "crates/corelink-privacy" }
# Wave-33 Stage 1 Stream C sub-step C.1: canonical replication aggregator façade
# (5 absorbed crates: region + replica-worker + replication-coordinator +
# failover-router + rollout-controller).
corelink-replication = { path = "crates/corelink-replication" }
# Wave-33 Stage 1 Stream C sub-step C.2: canonical ops aggregator façade
# (LARGEST Wave-33 absorption — 28 absorbed crates).
corelink-ops = { path = "crates/corelink-ops" }
# Wave-33 Stage 1 Stream C sub-step C.3: canonical cloud-adapters aggregator
# (5 absorbed: cf-bindings + clerk-cf + stripe-real + statuspage-real +
# slack-real — binding portions).
corelink-adapters-cloud = { path = "crates/corelink-adapters-cloud" }
# Wave-33 Stage 1 Stream C sub-step C.4: canonical Vault-adapters aggregator
# (1 absorbed: corelink-byok-vault — HTTPS / mTLS binding portion).
corelink-adapters-vault = { path = "crates/corelink-adapters-vault" }
# DPA acceptance dep (still external; consumed by the `corelink-privacy::dpa::acceptance` façade).
# Wave-35 Phase 2: corelink-dpa-versioning absorbed into corelink-privacy.
corelink-dpa-acceptance = { path = "crates/corelink-dpa-acceptance" }
corelink-billing-emit = { path = "crates/corelink-billing-emit" }
corelink-billing-aggregator = { path = "crates/corelink-billing-aggregator" }
corelink-billing-stripe = { path = "crates/corelink-billing-stripe" }
corelink-billing-reconcile = { path = "crates/corelink-billing-reconcile" }
corelink-runner-overage = { path = "crates/corelink-runner-overage" }
corelink-runner-aggregate = { path = "crates/corelink-runner-aggregate" }
corelink-dsr = { path = "crates/corelink-dsr" }
# R-prep tenant offboarding state machine.
corelink-clerk-cf = { path = "crates/corelink-clerk-cf" }
# R2-10 CF Worker R2/D1/KV/DO binding adapters (wasm32 only).
corelink-cf-bindings = { path = "crates/corelink-cf-bindings" }
# Wave-35 Phase 2: privacy sub-crates absorbed into corelink-privacy.
# Only the 2 NOT in W35-P2 absorb scope keep workspace dep entries:
corelink-privacy-erasure-worker = { path = "crates/corelink-privacy-erasure-worker" }
corelink-privacy-pseudonymize = { path = "crates/corelink-privacy-pseudonymize" }
corelink-config-do = { path = "crates/corelink-config-do" }
corelink-dt-webhook = { path = "crates/corelink-dt-webhook" }
corelink-dt-cli = { path = "tools/dt-cli" }
corelink-dt-reconcile = { path = "tools/dt-reconcile" }
corelink-dual-approval = { path = "crates/corelink-dual-approval" }
corelink-rotation-adapters = { path = "crates/corelink-rotation-adapters" }
# Wave 35 Phase 2: `corelink-rollout-controller` absorbed into
# `corelink-replication::rollout_controller`; consumers reach it via the
# umbrella `corelink-replication` workspace dep.
corelink-region = { path = "crates/corelink-region" }
corelink-replica-worker = { path = "crates/corelink-replica-worker" }
corelink-failover-router = { path = "crates/corelink-failover-router" }
corelink-replication-coordinator = { path = "crates/corelink-replication-coordinator" }
# S-14 BYOK — Wave-35 Phase 2 physically absorbs the 6 former
# sub-crates (core / revocation / aws / gcp / azure / vault) into the
# canonical `corelink-byok` umbrella. Consumers reach every absorbed
# symbol through the umbrella: `corelink_byok::*` (core trait + types
# + DEK cache + envelope encryption), `corelink_byok::revocation::*`
# (always-on kill-switch detector), `corelink_byok::{aws,gcp,azure,vault}`
# (per-provider namespaces; feature-gated, MUTUALLY EXCLUSIVE at
# compile time per charter Hard Pause Trigger 2). See
# `specs/_audits/sealed/2026-05-26-w35-p2-byok-absorption.md`.
corelink-byok = { path = "crates/corelink-byok" }
corelink-erasure-attestation = { path = "crates/corelink-erasure-attestation" }
corelink-transparency-log = { path = "crates/corelink-transparency-log" }
corelink-chaos-scheduler = { path = "crates/corelink-chaos-scheduler" }
corelink-tier-selection = { path = "crates/corelink-tier-selection" }
corelink-stripe-real = { path = "crates/corelink-stripe-real" }
corelink-billing-stripe-materializer = { path = "crates/corelink-billing-stripe-materializer" }
corelink-billing-stripe-traits = { path = "crates/corelink-billing-stripe-traits" }
corelink-statuspage-real = { path = "crates/corelink-statuspage-real" }
corelink-dsr-statuspage-scheduler = { path = "crates/corelink-dsr-statuspage-scheduler" }
corelink-openapi = { path = "tools/openapi" }
# R-prep handler-crate skeletons (CAS / AC / Admin).
corelink-handler-cas = { path = "crates/corelink-handler-cas" }
corelink-handler-cas-erase = { path = "crates/corelink-handler-cas-erase" }
corelink-handler-ac = { path = "crates/corelink-handler-ac" }
corelink-handler-admin = { path = "crates/corelink-handler-admin" }
corelink-bazel-bridge = { path = "crates/corelink-bazel-bridge" }
corelink-handler-customer = { path = "crates/corelink-handler-customer" }
# Phase 0 — Turborepo remote-cache bridge (Vercel /v8/artifacts/* protocol).
# Route wiring lands in corelink-container; see
# `crates/corelink-container/src/routes/turbo_v8.rs`.
corelink-turbo-bridge = { path = "crates/corelink-turbo-bridge" }
# Wave-33 Stage 1 Stream C sub-step C.2 — workspace dep entries for the
# 7 ops-aggregator absorbed crates that previously had no shared
# workspace-level dependency line (they were each pulled in only by
# apps/server or sibling crates via relative path). The ops umbrella
# now needs to consume them via `{ workspace = true }`.
corelink-slack-real = { path = "crates/corelink-slack-real" }
corelink-enterprise-inquiry = { path = "crates/corelink-enterprise-inquiry" }
corelink-runbook-tracker = { path = "crates/corelink-runbook-tracker" }
corelink-terraform-drift-consumer = { path = "crates/corelink-terraform-drift-consumer" }
# Wave-35 Phase 2 — adapter-host umbrella crate (absorbs Wave-34
# corelink-adapter-{brew,cargo,npm,oci,pip} as inline submodules).
corelink-adapter-host = { path = "crates/corelink-adapter-host" }

# CLI tooling (WI-S15-001 / WI-S15-005)
toml = "1.1"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
corelink-cli = { path = "tools/cli" }

# Test / bench
proptest = "1.5"
tokio-test = { version = "0.4" }
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
# Build otimizado pra Cloudflare Containers + CoreLink CLI release binary.
# panic = "abort": removes unwinding machinery (saves ~5-10% binary size).
# lto = "fat": cross-crate inlining at link time (best size + perf, slow link).
# strip = true: removes debug symbols from final binary.
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
