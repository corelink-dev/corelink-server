    # (CasReadHandler, CasWriteHandler, KvBackend, PatValidator,
    # AuditEmitter). Closes follow-up #4 from
    # `specs/_audits/sealed/2026-05-26-wave-33-34-closure-followups.md §4`.
    "crates/corelink-adapter-host",
    # Black-box E2E user-journey suite — the real ship gate.
    # ZERO internal-crate deps: uses only reqwest + std::process::Command
    # + serde_json. Simulates a paying customer hitting the live API.
    # Expected RED until the P0 remediation wave lands.
    # See tests/e2e-user-journeys/README.md for full context.
    "tests/e2e-user-journeys",
    # Stream-4 Turborepo remote-cache bridge. Exposes the Vercel
    # /v8/artifacts/:hash HTTP API so Turbo monorepos use CoreLink CAS
    # as their remote cache (TURBO_API=https://corelink-api.humangr.com).
    # Opaque-hash semantics: Turbo's native hash (xxhash / sha512-prefix)
    # is stored verbatim as the object key — no hash verification at
    # CoreLink's CAS layer. Ships TurboArtifactHandler trait +
    # InMemoryTurboHandler fake + CasAdapterTurboHandler adapter +
    # telemetry (events accept-and-drop) + status endpoints + 5-variant
    # audit surface.
    "crates/corelink-turbo-bridge",
