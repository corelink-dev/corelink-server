# gitleaks config — secret-leak scanning for CoreLink.
#
# Extends the built-in ruleset (AWS / GCP / GitHub / Stripe sk_live / private
# keys / generic high-entropy) AND adds rules the default set MISSES but that
# matter to us (Stripe webhook secrets `whsec_` — the 2026-06-18 baseline caught
# a stale committed one the default ruleset did NOT flag).
#
# Allowlist philosophy: suppress the deliberate FIXTURE/SPEC/DOC-REFERENCE/TEST
# example values BY PATH/VALUE, but DELIBERATELY keep operational trees
# (docs/operator/, scripts/, crates/*/src/, apps/server/src/, worker/src/) IN
# scope — that is where a real leak would land (and did: the whsec was in
# docs/operator/). Tune from real findings; never mute an operational dir.
title = "CoreLink gitleaks config"

[extend]
useDefault = true

# ── Custom rules: high-value secret shapes the default ruleset misses ─────────
[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret (whsec_…) — the default ruleset does not flag these"
regex = '''whsec_[A-Za-z0-9]{24,}'''
keywords = ["whsec_"]

# ── REVOKED-CREDENTIAL CLOSURE — exactly one historical finding ───────────────
# This is NOT a false positive and NOT a deferral. The value this suppresses IS a
# real Stripe webhook signing secret that WAS committed. It is suppressed because
# the credential is REVOKED and can no longer authenticate anything.
#
#   What it was ...... the `whsec_…` signing secret of Stripe webhook endpoint
#                      `we_1TcaMDLh0hhAZjwol9KDCJTp`. A Stripe signing secret is
#                      scoped to exactly ONE endpoint and validates nothing else.
#   How it died ...... that endpoint was DELETED on 2026-05-29 and replaced by
#                      `we_1TcaeeLh0hhAZjwoWambOOhJ`. Deleting the endpoint
#                      revokes its signing secret — there is nothing left to
#                      rotate; rotation was never an open action, only unproven.
#   Evidence (3) ..... (1) docs/operator/stripe-checkout-e2e-2026-05-29.md
#                          §"Issue 3: STRIPE_WEBHOOK_SECRET mismatch" — records
#                          the endpoint id and its deletion+replacement.
#                      (2) docs/handoff/2026-07-03-REPLY-from-clw-coordinator-
#                          webhook-reconcile-DONE-and-no-stray-endpoint-exists.md
#                          — a LIVE Stripe API enumeration of every v1 webhook
#                          endpoint on the prod account (2026-07-03) listing
#                          exactly 3; `we_1TcaMDLh…` is NOT among them.
#                      (3) owner read the live Stripe dashboard 2026-08-03:
#                          signup-worker (7 events), "Corelink prd" → corelink-api
#                          (10), v2 thin destination "exquisite-rhythm-thin" →
#                          corelink-api (24), plus one unrelated hugr-wallet
#                          endpoint. Nothing matching `we_1TcaMDLh…`.
#
# WHY IT IS PINNED HERE AND NOT EDITED AWAY. `gitleaks detect` scans the COMMIT
# GRAPH. The literal was redacted at HEAD on 2026-06-18, but it lives in commit
# b59c4862 forever, so no edit to today's file can clear it. Without this pin the
# weekly cron (`17 5 * * 6`, first firing 2026-08-08) exits 1 on this one finding
# every week for the life of the repo — and a permanently-red gate is a gate
# nobody reads. Finding fingerprint being closed:
#   b59c4862fa7c826cad5269ec0d35874b7014cfaf:docs/operator/stripe-checkout-e2e-2026-05-29.md:stripe-webhook-secret:73
#
# HOW NARROW THIS IS. `condition = "AND"` — all three predicates must hold, so the
# suppressed set is ONE immutable (commit, file, line-context) triple that can
# never grow: (a) that one historical commit SHA, (b) that one file path, (c) a
# line that also names the dead endpoint id `we_1TcaMDLh…` (a PUBLIC Stripe
# object id, not secret material). A NEW `whsec_` lands in a NEW commit, so it
# fires — including in this very same file. Deliberately NOT done: no rule
# disable, no path-only mute, no global value allowlist, no tree exclusion, and
# the secret literal itself is NOT written here (it would add no tightness — the
# bytes of commit b59c4862 are frozen — while permanently re-disclosing a
# credential at HEAD).
[[rules.allowlists]]
description = "REVOKED (endpoint we_1TcaMDLh0hhAZjwol9KDCJTp deleted 2026-05-29) Stripe webhook signing secret, historically committed in b59c4862. Closure, not a false positive — see the comment block above."
condition = "AND"
commits = ["b59c4862fa7c826cad5269ec0d35874b7014cfaf"]
paths = ['''^docs/operator/stripe-checkout-e2e-2026-05-29\.md$''']
regexTarget = "line"
regexes = ['''we_1TcaMDLh0hhAZjwol9KDCJTp''']

# Raw-hex secret material is identified by deployed configuration shape, not by
# a finite variable-name list.  A 64-hex literal is the project's
# `openssl rand -hex 32` credential shape; renaming the assignment must not
# evade the detector.  Keep the path boundary explicit so public source
# checksums and fixtures remain outside this custom rule while default rules
# continue to scan them.
[[rules]]
id = "corelink-secret-shaped-hex"
description = "A 64-hex credential assigned to any identifier in a deployable secret surface"
regex = '''(?im)(?:\b([a-z_][a-z0-9_.-]{0,127}|[0-9]{1,128})|["'`]([^"'`\r\n]{1,128})["'`])\s*[:=]\s*(?:[|>](?:[+-]?[1-9]?|[1-9][+-]?|[+-]?)[ \t]*(?:#[^\r\n]*)?\s*|(?:\\\s*)?["`]{1,3}(?:\\\s*)?|\$'|'|\\\s*)?\s*([a-f0-9]{64})["'`]{0,3}\s*(?:[,;#}]|$)'''
secretGroup = 3
path = '''(?i)(?:^|/)(?:wrangler\.toml|wrangler\.jsonc?|.*\.env(?:\.[a-z0-9_-]+)?|.*(?:secrets?|credentials?)[^/]*\.(?:toml|ini|conf|ya?ml|sh)|\.github/workflows/.*(?:secrets?|credentials?)[^/]*\.ya?ml|reports/audits/.*\.md)$'''

# ── Upstream rules re-declared to fix a DETECTION defect ─────────────────────
# gitleaks merges an extending config into the default ruleset per rule id:
# declaring a `regex` REPLACES the default pattern for that id; declaring only
# `[[rules.allowlists]]` LEAVES the default pattern, entropy, keywords and the
# ~1.3k upstream stopwords in force and merely ADDS a predicate. Both forms are
# used below. Nothing here is keyed on a path, a commit or a file — every
# predicate is a property of the VALUE, so it holds repo-wide and forever.

[[rules]]
id = "curl-auth-user"
description = "curl basic-auth credential (-u/--user) whose value is a LITERAL, not a shell/env expansion"
# Same pattern as gitleaks 8.30.1 upstream, with ONE change: the USER half of
# `user:pass` may no longer begin with `$` nor contain `{`/`}`.
#
# WHY. `-u "${STRIPE_SECRET_KEY}:"` is a reference to a secret, not a secret —
# the bytes committed are the variable's NAME. Upstream already encodes exactly
# this principle, but only for the PASSWORD half: its own allowlist carries
#     ['"]?[^:]+['"]?:['"]?\$(?:\d|\w+|\{(?:\d|\w+)})['"]?      →  user:$VAR
# and has no mirror for `$VAR:`, so the very common Stripe/REST idiom
# `-u "${KEY}:"` (empty password, credential in the user field) fires every
# time. This completes the upstream predicate symmetrically.
#
# It cannot blind a real secret: a committed credential is by definition
# literal bytes, and literal bytes are exactly what still matches. Only a value
# that STARTS with `$` (i.e. is an indirection) is dropped — `-u "sk_live_…:"`,
# `-u "user:pass"` and `-u "AKIA…:"` all still fire (proved by the planted set).
regex = '''\bcurl\b(?:.*|.*(?:[\r\n]{1,2}.*){1,5})[ \t\n\r](?:-u|--user)(?:=|[ \t]{0,5})("(:[^"]{3,}|[^:"${}][^:"{}]{2,}:|[^:"${}][^:"{}]{2,}:[^"]{3,})"|'([^:'${}][^:'{}]{2,}:[^']{3,})'|((?:"[^"]{3,}"|'[^']{3,}'|[\w@.-]+):(?:"[^"]{3,}"|'[^']{3,}'|[\w${}@.-]+)))(?:\s|\z)'''
entropy = 2
keywords = ["curl"]
# Upstream's own allowlist for this rule, carried over verbatim so redeclaring
# the regex does not silently drop it.
[[rules.allowlists]]
regexes = [
  '''[^:]+:(?:change(?:it|me)|pass(?:word)?|pwd|test|token|\*+|x+)''',
  '''['"]?<[^>]+>['"]?:['"]?<[^>]+>|<[^:]+:[^>]+>['"]?''',
  '''[^:]+:\[[^]]+]''',
  '''['"]?[^:]+['"]?:['"]?\$(?:\d|\w+|\{(?:\d|\w+)})['"]?''',
  '''\$\([^)]+\):\$\([^)]+\)''',
  '''['"]?\$?{{[^}]+}}['"]?:['"]?\$?{{[^}]+}}['"]?''',
]

[[rules]]
id = "curl-auth-header"
description = "curl -H auth token that is a COMPLETE credential (not an elided one)"
# Same pattern as gitleaks 8.30.1 upstream, with ONE change: every token class
# `[\w=~@.+/-]{8,}` becomes `[\w=~@.+/-]{7,}[\w=~@+/-]`, i.e. the LAST character
# of the token may not be `.`.
#
# WHY. `Authorization: Bearer corelink_pat_...` is prose showing the SHAPE of a
# header; the value has been elided with an ellipsis. A token that terminates in
# `.` is by construction incomplete — no bearer token, JWT, opaque token or
# base64url value ends in a period (a JWT's dots are interior separators). The
# minimum length is unchanged at 8, and dots INSIDE a token are still accepted,
# so real three-segment JWTs and dotted opaque tokens keep firing.
regex = '''\bcurl\b(?:.*?|.*?(?:[\r\n]{1,2}.*?){1,5})[ \t\n\r](?:-H|--header)(?:=|[ \t]{0,5})(?:"(?i)(?:Authorization:[ \t]{0,5}(?:Basic[ \t]([a-z0-9+/]{8,}={0,3})|(?:Bearer|(?:Api-)?Token)[ \t]([\w=~@.+/-]{7,}[\w=~@+/-])|([\w=~@.+/-]{7,}[\w=~@+/-]))|(?:(?:X-(?:[a-z]+-)?)?(?:Api-?)?(?:Key|Token)):[ \t]{0,5}([\w=~@.+/-]{7,}[\w=~@+/-]))"|'(?i)(?:Authorization:[ \t]{0,5}(?:Basic[ \t]([a-z0-9+/]{8,}={0,3})|(?:Bearer|(?:Api-)?Token)[ \t]([\w=~@.+/-]{7,}[\w=~@+/-])|([\w=~@.+/-]{7,}[\w=~@+/-]))|(?:(?:X-(?:[a-z]+-)?)?(?:Api-?)?(?:Key|Token)):[ \t]{0,5}([\w=~@.+/-]{7,}[\w=~@+/-]))')(?:\B|\s|\z)'''
entropy = 2.75
keywords = ["curl"]

[[rules]]
id = "generic-api-key"
description = "generic high-entropy credential — upstream rule, extended with three placeholder SHAPES"
# NO `regex` key on purpose: the upstream pattern, entropy floor (3.5), keyword
# list and ~1.3k stopwords stay exactly as shipped. The blocks below only add
# value-shape predicates to the heuristic CATCH-ALL rule; every purpose-built
# rule (stripe, aws, github, whsec_, corelink-internal-auth-hex, …) is untouched.

[[rules.allowlists]]
description = "Ascending alphabet/digit walks — a placeholder shape, never a generated key. Same family as upstream's own `000000` / `aaaaaa` stopwords."
stopwords = ["01234567", "12345678", "abcdefgh", "qwertyui", "deadbeef", "cafebabe"]

[[rules.allowlists]]
description = "A value that states its own size in prose (`…-20-char-…`, `32-byte`, `256-bit`) is documentation ABOUT a key, not the key."
regexes = ['''(?i)\b\d{1,4}[-_ ]?(?:char|byte|bit)s?\b''']

[[rules.allowlists]]
description = "`*_key` identifiers that are dedup/partition keys, not credentials — extends upstream's own `(?:bucket|foreign|natural|primary|schema|sequence)[_.-]?key` list. `routing_key` is deliberately NOT here: PagerDuty routing keys ARE secrets."
regexTarget = "match"
regexes = ['''(?i)\b(?:dedup|dedupe|idempotency|partition|shard|sort)[_.-]?key\b''']

[[rules.allowlists]]
description = "B-094's generated file-content digests: only published-path JSON keys with an exact SHA-256 value in the exact manifest file."
paths = ['''^scripts/b094_published_inventory\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:README\.md|(?:apps/docs|marketing|legal)/[^"]+\.(?:md|mdx|html|htm))": "[a-f0-9]{64}",?$''']

[[rules.allowlists]]
description = "B-156's generated published-claims file digests: only a published-path JSON key with an exact SHA-256 value, and only in the exact census inventory."
# Why: a key such as `apps/docs/tests/reapi-gen.test.ts` carries the `api`
# keyword (inside `reapi`), so refreshing its digest trips this heuristic.
# `condition = "AND"` is load-bearing. gitleaks ORs an allowlist's predicates by
# default, so without it the path alone would mute EVERY generic-api-key finding
# in this file (scripts/ is an operational tree), and the line shape alone would
# mute a digest-shaped line in ANY file. Roots, root file and extensions are
# ROOTS / ROOT_FILES / EXTENSIONS of scripts/published_claims_census.py, and
# its validate() recomputes every value from the named file's bytes, so a
# pasted credential cannot stay in a line this admits. The key alphabet is the
# inventory's own; a new character fails loud here, never silent.
# Teeth: scripts/tests/gitleaks-shape-regression.sh (published-claims cells).
condition = "AND"
paths = ['''^scripts/published_claims_inventory\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:README\.md|(?:apps/docs|marketing|legal)/[A-Za-z0-9._/-]+\.(?:md|mdx|html|htm|js|jsx|ts|tsx))": "[a-f0-9]{64}",?$''']

# ── MOVED-FIXTURE CLOSURE — exactly one finding, in one unmerged PR commit ────
# Not a secret, and not a deferral. `tools/sbom-publish/src/main.rs` carries a
# made-up UUID in its unit test (`let secret_uuid = "…"`), whose job is to prove
# `ingestion_summary` never echoes a Dependency-Track project UUID. #2852
# (f425a8fb3) added it while this gate was disabled. Commit f3dea21a5 of PR
# #2870 then moved that `mod tests` block below `exit_code_for_error` to clear
# `clippy::items_after_test_module`, so its patch re-adds the line and the PR
# diff scan flags it as `generic-api-key`. The PR's later commits put the block
# back in place: the PR's cumulative diff against main no longer adds the line.
#
# The commit itself is immutable (no force-push), so without this pin the PR's
# `BASE..HEAD` scan exits 1 on it for good. Finding fingerprint being closed:
#   f3dea21a59fa7a1c4f5bcffe8618430d92d6044c:tools/sbom-publish/src/main.rs:generic-api-key:284
#
# HOW NARROW THIS IS. `condition = "AND"`: that one commit SHA, that one path,
# and a line whose whole shape is the fixture assignment. A UUID-shaped value in
# any other commit, file or line still fires. Deliberately NOT covered: the
# same line in f425a8fb3 on main. That is a separate finding for the weekly
# full-history sweep, outside this PR's scope.
[[rules.allowlists]]
description = "Fixture UUID in sbom-publish's unit test, re-added only by the moving commit f3dea21a5 of PR #2870. A closure for one immutable finding, not a value mute. See the comment block above."
condition = "AND"
commits = ["f3dea21a59fa7a1c4f5bcffe8618430d92d6044c"]
paths = ['''^tools/sbom-publish/src/main\.rs$''']
regexTarget = "line"
regexes = ['''^\s*let secret_uuid = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";$''']

[allowlist]
description = "CoreLink deliberate test/example/fixture/spec values — NOT operational secrets"
# Pure example / fixture / spec / doc-REFERENCE / test trees. These legitimately
# carry placeholder tokens by design. NOTE: operational docs (docs/operator/),
# scripts/, and all src/ trees are INTENTIONALLY absent here so a real leak there
# is still caught.
paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)conformance/.*\.json$''',
  '''(^|/)openapi/.*\.(json|ya?ml)$''',
  '''(^|/)apps/docs/''',
  '''(^|/)specs/''',
  '''(^|/)tests?/''',
  '''(^|/).*\.test\.(ts|js|rs)$''',
  '''(^|/).*_test\.rs$''',
  '''(^|/)tools/cli/tests/''',
]
# Value-based: non-secret by nature (test keys, public keys, disclosed identifiers,
# mock placeholders, the canonical jwt.io example). Live prod keys (sk_live_,
# whsec_<real>, CF tokens, Clerk sk_live) are NOT here → flagged anywhere they appear.
regexes = [
  '''sk_test_[A-Za-z0-9]+''',                                   # Stripe TEST secret keys
  '''pk_(test|live)_[A-Za-z0-9]+''',                            # publishable keys are PUBLIC by design
  '''-----BEGIN PUBLIC KEY-----''',                             # public keys are not secrets
  '''SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',            # the canonical jwt.io HS256 example sig
  '''eyJhbGciOiJIUzI1NiJ9''',                                   # {"alg":"HS256"} header of example JWTs
  '''(?i)mock(key)?''',                                         # test mock placeholders
  '''00000000-0000-4000-8000-000000000001''',                  # disclosed dev tenant UUID
  '''ee30f7ba-fc25-4d71-939e-ebe130b4c6a3''',                  # githugr showcase tenant UUID (non-secret)
]
stopwords = ["example", "placeholder", "dummy", "mock", "sample", "redacted", "your-", "changeme", "token_id"]
